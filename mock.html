<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>IIQE 卷二 一般保險 模擬考試</title>
<style>
:root{
  --desk:#E4EAEE;
  --paper:#FFFFFF;
  --paper-2:#F2F5F8;
  --ink:#13284A;
  --ink-2:#42526A;
  --ink-3:#66758A;
  --rule:#C9D3DB;
  --rule-2:#E0E6EB;
  --mark-tint:#E6ECF6;
  --ok:#17734A;
  --ok-tint:#E2F2E8;
  --bad:#B3322A;
  --bad-tint:#FAE7E5;
  --warn:#94600E;
  --warn-tint:#FAEFD9;
  --focus:#2F6FED;
  --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU","MingLiU","Source Han Serif TC",serif;
  --sans:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 0 rgba(19,40,74,.05),0 14px 32px -20px rgba(19,40,74,.45);
}
@media (prefers-color-scheme: dark){
  :root{
    --desk:#0F1722;
    --paper:#162232;
    --paper-2:#1C2B3F;
    --ink:#E6ECF4;
    --ink-2:#B3C0D0;
    --ink-3:#8796AA;
    --rule:#2E3F56;
    --rule-2:#24354B;
    --mark-tint:#233650;
    --ok:#4FC28C;
    --ok-tint:#12301F;
    --bad:#F2766B;
    --bad-tint:#3A1D1C;
    --warn:#E3AA4B;
    --warn-tint:#352812;
    --focus:#80A9FF;
    --shadow:0 1px 0 rgba(0,0,0,.35),0 14px 32px -18px rgba(0,0,0,.85);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 20px;min-height:56px}
.brand{margin-right:auto;font-family:var(--serif);font-weight:700;font-size:1.0625rem;white-space:nowrap}
.brand small{font-family:var(--sans);font-weight:400;font-size:.8125rem;color:var(--ink-3);margin-left:.6em}
.stat{font-size:.875rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:.9375rem;padding:4px 12px;border-radius:999px;background:var(--paper-2);border:1px solid var(--rule-2);white-space:nowrap}
.timer.low{color:var(--warn);background:var(--warn-tint);border-color:transparent}
.progress{height:4px;background:var(--rule-2)}
.progress>i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s ease}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);font-weight:600;font-size:.9375rem;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--paper-2)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);min-height:36px;padding:0 12px;font-size:.875rem;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}

main{max-width:1140px;margin:0 auto;padding:24px 20px 56px}

/* documents: start + result */
.doc{max-width:780px;margin:8px auto 0;background:var(--paper);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:36px 40px 30px}
.doc-title{font-family:var(--serif);font-size:2rem;line-height:1.3;font-weight:700;margin:0 0 8px}
.doc-sub{color:var(--ink-2);margin:0 0 26px;max-width:40em}
.schedule{margin:0 0 22px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.schedule>div{display:grid;grid-template-columns:7em 1fr;gap:14px;padding:11px 2px;border-bottom:1px solid var(--rule-2)}
.schedule>div:last-child{border-bottom:0}
.schedule dt{color:var(--ink-3);font-size:.875rem;padding-top:2px}
.schedule dd{margin:0}
table{border-collapse:collapse;width:100%}
.weights td,.weights th{padding:5px 8px 5px 0;text-align:left;font-size:.9375rem;border-bottom:1px solid var(--rule-2);font-weight:400}
.weights tr:last-child td{border-bottom:0}
.weights th{color:var(--ink-3);font-size:.8125rem}
.num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
.notice{margin:0 0 26px;padding:12px 16px;background:var(--warn-tint);border-left:3px solid var(--warn);border-radius:0 6px 6px 0;font-size:.9375rem;line-height:1.7}
.notice b{display:block;color:var(--warn);font-size:.875rem;margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.actions .grow{flex:1}
.hint{color:var(--ink-2);font-size:.875rem;font-variant-numeric:tabular-nums}
.fine{margin:22px 0 0;color:var(--ink-3);font-size:.8125rem;line-height:1.7}

/* exam layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:28px 34px 22px;min-width:0}
.q-head{display:flex;align-items:flex-start;gap:16px;padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--rule-2)}
.q-id{margin-right:auto;min-width:0}
.q-no{font-family:var(--serif);font-size:1.5rem;line-height:1.25;font-weight:700;margin:0}
.q-no:focus{outline:none}
.q-no:focus-visible{outline:3px solid var(--focus)}
.q-no span{font-family:var(--sans);font-size:.9375rem;font-weight:400;color:var(--ink-3);margin-left:.35em}
.q-meta{margin:4px 0 0;font-size:.8125rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 0}
.q-meta .topic{border-left:1px solid var(--rule);margin-left:10px;padding-left:10px}
.flag{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font-size:.8125rem;cursor:pointer;color:var(--ink-2)}
.flag:hover{background:var(--paper-2)}
.flag[aria-pressed="true"]{background:var(--warn-tint);border-color:var(--warn);color:var(--warn);font-weight:600}
.stem{font-family:var(--serif);font-size:1.125rem;line-height:1.85;margin:0 0 16px;max-width:44em}
.stmts{list-style:none;margin:0 0 20px;padding:10px 16px;background:var(--paper-2);border-left:3px solid var(--rule);border-radius:0 6px 6px 0;font-family:var(--serif);font-size:1.0625rem;line-height:1.75;max-width:46em}
.stmts li{display:grid;grid-template-columns:2.7em 1fr;gap:4px;padding:4px 0;align-items:baseline}
.stmts .n{font-family:var(--sans);font-size:.9375rem;color:var(--ink-3)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;margin:0;padding:12px 14px;text-align:left;font-size:1rem;line-height:1.6;background:var(--paper);border:1px solid var(--rule);border-radius:8px;cursor:pointer}
.opt:hover{background:var(--paper-2)}
.bubble{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink-3);background:var(--paper);color:var(--ink-2);font-weight:700;font-size:.875rem}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--mark-tint)}
.opt[aria-pressed="true"] .bubble{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt .tag{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--paper);white-space:nowrap}
.opt.r{cursor:default}
.opt.r:hover{background:var(--paper)}
.opt.ok,.opt.ok:hover{border-color:var(--ok);background:var(--ok-tint)}
.opt.ok .bubble{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.ok .tag{color:var(--ok)}
.opt.bad,.opt.bad:hover{border-color:var(--bad);background:var(--bad-tint)}
.opt.bad .bubble{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.bad .tag{color:var(--bad)}
.exp{margin-top:20px;padding-top:16px;border-top:1px dashed var(--rule)}
.verdict{margin:0 0 10px;font-weight:700;font-size:.9375rem}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.verdict.none{color:var(--warn)}
.exp h3{margin:0 0 4px;font-size:.875rem;font-weight:700;color:var(--ink-2)}
.exp .body{margin:0 0 14px;line-height:1.9;max-width:46em}
.ref{margin:0;display:flex;gap:12px;align-items:baseline;padding:9px 12px;background:var(--paper-2);border-radius:6px;font-size:.875rem;color:var(--ink-2)}
.ref b{flex:none;color:var(--ink);font-weight:700}
.pager{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule-2)}
.pager .grow{flex:1}
.pager .pos{font-size:.875rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sheet-btn{display:none!important}

/* answer card (OMR style) */
.omr{position:sticky;top:80px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.omr-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);color:var(--paper);font-family:var(--serif);font-weight:700}
.omr-head span{margin-left:auto;font-family:var(--sans);font-weight:400;font-size:.8125rem;opacity:.85;font-variant-numeric:tabular-nums}
.omr-close{display:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:6px;min-height:30px;padding:0 10px;font-family:var(--sans);font-size:.8125rem;cursor:pointer}
.omr-body{padding:12px 16px 14px;max-height:calc(100vh - 160px);overflow:auto}
.omr-group+.omr-group{margin-top:12px}
.omr-label{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--ink-3);margin-bottom:6px}
.omr-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cell{position:relative;aspect-ratio:1;width:100%;min-height:30px;margin:0;padding:0;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--ink-3);background:var(--paper);color:var(--ink-2);font-size:.75rem;font-variant-numeric:tabular-nums;cursor:pointer}
.cell:hover{background:var(--paper-2)}
.cell.done,.cell.done:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cell.ok,.cell.ok:hover{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.cell.bad,.cell.bad:hover{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.cell.skip{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.cell.cur{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--focus)}
.cell.flagged::after{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:2px;background:var(--warn);border:1.5px solid var(--paper);transform:rotate(45deg)}
.cell.dim{opacity:.32}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;padding-top:10px;border-top:1px solid var(--rule-2);font-size:.75rem;color:var(--ink-3)}
.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border-radius:50%;border:1.5px solid var(--ink-3)}
.legend i.done{background:var(--ink);border-color:var(--ink)}
.legend i.ok{background:var(--ok);border-color:var(--ok)}
.legend i.bad{background:var(--bad);border-color:var(--bad)}
.legend i.skip{border-style:dashed;border-color:var(--warn)}
.legend i.fl{border-radius:2px;border:0;background:var(--warn);transform:rotate(45deg) scale(.8)}

/* result */
.result-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:30px;align-items:center;padding-bottom:24px;margin-bottom:22px;border-bottom:1px solid var(--rule-2)}
.stamp{width:140px;height:140px;border-radius:50%;border:5px double currentColor;display:grid;align-content:center;justify-items:center;gap:4px;transform:rotate(-10deg);color:var(--ok);font-family:var(--serif);text-align:center}
.stamp.fail{color:var(--bad)}
.stamp .s-main{font-size:2.25rem;font-weight:900;line-height:1;letter-spacing:.06em}
.stamp.fail .s-main{font-size:1.75rem}
.stamp .s-date{font-family:var(--sans);font-size:.75rem;padding-top:4px;border-top:1px solid currentColor;font-variant-numeric:tabular-nums}
.stamp.animate{animation:stamp .55s cubic-bezier(.2,.9,.25,1) both}
@keyframes stamp{0%{opacity:0;transform:rotate(-10deg) scale(1.9)}55%{opacity:1;transform:rotate(-10deg) scale(.92)}100%{opacity:1;transform:rotate(-10deg) scale(1)}}
.res-title{margin:0;font-size:1.0625rem;font-weight:700;color:var(--ink-2)}
.res-title:focus{outline:none}
.score{margin:4px 0 0;font-family:var(--serif);font-weight:700;font-size:3.25rem;line-height:1.1;font-variant-numeric:tabular-nums}
.score small{font-size:1.375rem;font-weight:400;color:var(--ink-3);margin-left:.2em}
.score-line{margin:6px 0 0;color:var(--ink-2)}
.note{margin:10px 0 0;padding:6px 10px;display:inline-block;background:var(--warn-tint);color:var(--warn);border-radius:6px;font-size:.875rem;font-weight:600}
.breakdown{margin:0 0 24px}
.breakdown caption{text-align:left;font-weight:700;font-size:.9375rem;padding-bottom:6px}
.breakdown th,.breakdown td{padding:10px 8px;border-bottom:1px solid var(--rule-2);text-align:left;font-size:.9375rem;vertical-align:middle}
.breakdown thead th{font-size:.8125rem;color:var(--ink-3);font-weight:400;border-bottom:1px solid var(--rule)}
.breakdown tbody th{font-weight:600}
.breakdown tbody th small{display:block;font-weight:400;color:var(--ink-3);font-size:.75rem}
.breakdown .barcell{width:34%}
.bar{display:block;height:8px;border-radius:999px;background:var(--rule-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}

/* modal */
.modal-scrim{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(8,16,28,.5)}
.modal{width:100%;max-width:440px;background:var(--paper);border-radius:10px;padding:22px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal h2{margin:0 0 8px;font-family:var(--serif);font-size:1.25rem}
.modal p{margin:0;color:var(--ink-2);line-height:1.75}
.modal .actions{justify-content:flex-end;margin-top:18px}

@media (max-width:880px){
  main{padding:12px 10px calc(92px + env(safe-area-inset-bottom,0px))}
  .topbar-in{padding:8px 12px;gap:8px}
  .brand small,.stat{display:none}
  .layout{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:20px 16px 18px}
  .q-no{font-size:1.3125rem}
  .stem{font-size:1.0625rem}
  .stmts{font-size:1rem;padding:8px 12px}
  .opt{gap:12px;padding:11px 12px}
  .pager{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;background:var(--paper);border-top:1px solid var(--rule);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .pager .pos{display:none}
  .sheet-btn{display:inline-flex!important}
  .omr{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:14px 14px 0 0;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 -16px 40px rgba(0,0,0,.28);transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;padding-bottom:env(safe-area-inset-bottom,0px)}
  .omr.open{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
  .omr-close{display:inline-flex;align-items:center}
  .omr-body{max-height:none;flex:1}
  .omr-grid{grid-template-columns:repeat(8,minmax(0,1fr))}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(8,16,28,.45)}
  .doc{padding:24px 18px 22px;margin-top:0}
  .doc-title{font-size:1.5rem}
  .schedule>div{grid-template-columns:1fr;gap:2px}
  .result-top{grid-template-columns:1fr;justify-items:start;gap:18px}
  .stamp{width:118px;height:118px}
  .stamp .s-main{font-size:1.875rem}
  .stamp.fail .s-main{font-size:1.5rem}
  .score{font-size:2.75rem}
}
@media (max-width:420px){
  .omr-grid{grid-template-columns:repeat(7,minmax(0,1fr))}
  .opt{grid-template-columns:30px minmax(0,1fr)}
  .opt .tag{grid-column:2;justify-self:start}
  .bubble{width:28px;height:28px}
}
@media (prefers-reduced-motion:reduce){
  .stamp.animate{animation:none}
  .progress>i,.omr,.omr.open{transition:none}
}

/* v2: 中英對照、舊版題提示、題庫範圍設定 */
.btn[aria-pressed="true"]{background:var(--mark-tint);border-color:var(--ink-3)}
.en-line{display:block;margin-top:2px;font-family:var(--sans);font-size:.875rem;line-height:1.5;color:var(--ink-3)}
.opt.ok .en-line,.opt.bad .en-line{color:var(--ink-2)}
.stem-en{margin:-8px 0 16px;max-width:46em;font-size:.9375rem;line-height:1.65;color:var(--ink-3)}
.caution{margin:0 0 14px;padding:8px 12px;background:var(--warn-tint);border-left:3px solid var(--warn);border-radius:0 6px 6px 0;font-size:.875rem;line-height:1.75}
.schedule dd .seg{vertical-align:middle}
.scope-hint{margin-left:12px}
.weights td:first-child{white-space:nowrap}
@media (max-width:420px){.seg button{padding:0 9px;font-size:.8125rem}.scope-hint{display:block;margin:6px 0 0}}
</style>
</head>
<body>
<header class="topbar" id="top"></header>
<div class="progress" id="progress" role="progressbar" aria-label="作答進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
<main id="view"><noscript><p>此模擬試卷需要啟用 JavaScript。</p></noscript></main>
<div id="modal-root"></div>
<div class="sr-only" aria-live="polite" id="live"></div>
<script>
(function(){
'use strict';

/* ====== 題庫（2025 年 4 月總模擬題庫＋3/4/5 月每月精選＋2023 年 9 月模擬題，已去除重複）====== */
const POOL = [{"id":"B1","ch":1,"ref":"1(a)","t":1,"s":"by","q":"一般保險中，健康保險通常會歸類於：","qi":[],"qe":"In General Insurance, health insurances are usually classified as:","qei":[],"o":[{"z":"責任保險","e":"Insurances of liabilities"},{"z":"人身保險","e":"Insurances of the person"},{"z":"財產保險","e":"Insurances of property"},{"z":"經濟權益保險","e":"Insurances of pecuniary interests"}],"a":1,"x":"「人身」這個詞是指人的身體，而非「有別於組織的個人」，因此「人身保險」的標的是人的生命、肢體或健康，或醫療費用。"},{"id":"B2","ch":1,"ref":"1(a)","t":1,"s":"b5","q":"一般保險包括以下哪類保險產品？","qi":[],"qe":"General Insurance includes which of the following insurance products?","qei":[],"o":[{"z":"財產保險","e":"Insurances of property"},{"z":"責任保險","e":"Insurances of liabilities"},{"z":"人身保險(例如：個人意外保險)","e":"Insurances of the person (e.g. personal accident insurance)"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"一般保險四類保障:包括人身、財產、經濟權益及責任保險。"},{"id":"B3","ch":1,"ref":"1(a)(i)","t":1,"s":"b34","q":"醫療保障是屬於哪類保險類別？","qi":[],"qe":"Medical cover belongs to which category of insurance?","qei":[],"o":[{"z":"財產保險","e":"Insurances of property"},{"z":"人身保險","e":"Insurances of the person"},{"z":"經濟權益保險","e":"Insurances of pecuniary interests"},{"z":"責任保險","e":"Insurances of liabilities"}],"a":1,"x":"「人身」這個詞是指人的身體，而非「有別於組織的個人」，因此「人身保險」的標的是人的生命、肢體或健康，或醫療費用。"},{"id":"B4","ch":1,"ref":"1(b)","t":1,"s":"b","q":"一般保險保障範圍分兩類，其中一類是以「全險」作根據，另一種是：","qi":[],"qe":"There are two types of cover of General Insurance, one is based on all risk, the other is:","qei":[],"o":[{"z":"特定壽險作根據","e":"Based on special life insurances"},{"z":"特定危險作根據","e":"Based on special perils"},{"z":"指明危險作根據","e":"Based on specified perils"},{"z":"指明壽險作根據","e":"Based on specified life insurances"}],"a":2,"x":"一般保險中有許多險種都承保屬於或託管於被保險人（或稱受保人）的財產所遭受的損失或損害。保障類別必屬指明危險(或指明危險) 或「全險」(或「一切險」) 。"},{"id":"B5","ch":1,"ref":"1(b)(i)","t":1,"s":"b3","q":"只對火災，閃電及爆炸造成的損毀提供保障的保障形式是：","qi":[],"qe":"The type of insurance that only covers damages caused by fire, lightning and explosion is called:","qei":[],"o":[{"z":"全險","e":"All risks"},{"z":"第三者保險","e":"Third party insurance"},{"z":"除外危險","e":"Excluded perils"},{"z":"指明危險","e":"Specified perils"}],"a":3,"x":"「只對火災，閃電及爆炸造成的損毀提供保障」意思是指明某種情況底下保單將保障的範圍。"},{"id":"B6","ch":1,"ref":"1(b)","t":1,"s":"b","q":"如果一份保單說明保障包括火災、閃電及爆炸引起的損失，該類保單可稱為：","qi":[],"qe":"If a policy covers loss from fire, lightning and explosion, it can be called:","qei":[],"o":[{"z":"指明危險","e":"Specified perils"},{"z":"「全險」","e":"All risks"},{"z":"綜合","e":"Comprehensive"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"「只對火災，閃電及爆炸造成的損毀提供保障」意思是指明某種情況底下保單將保障的範圍。"},{"id":"B7","ch":1,"ref":"1(c)","t":1,"s":"b3y","q":"在大部份的一般保單當中被視為除外責任的基本風險包括：戰爭及","qi":[],"qe":"The standard exclusions of fundamental risks in most General Insurance policies are: war and","qei":[],"o":[{"z":"地震風險","e":"Earthquake risks"},{"z":"颱風風險","e":"Typhoon risks"},{"z":"核子風險","e":"Nuclear risks"},{"z":"水災風險","e":"Flooding risks"}],"a":2,"x":"基本風險基本上是這樣的：其成因並非一個個人甚至一群個人有能力控制的，發生後會對數目龐大的人造成影響，因此往往被設定為標準的保單除外責任。"},{"id":"B8","ch":1,"ref":"1(c)","t":1,"s":"b","q":"戰爭風險及核子風險是標準除外責任，以下哪項描述是正確的？","qi":[],"qe":"War risks and nuclear risks are standard exclusions, which of the following descriptions is correct?","qei":[],"o":[{"z":"是基本風險，一般是不可保的","e":"They are fundamental risks and uninsurable"},{"z":"在願意給付額外保險費後便可保","e":"They are insurable if willing to pay extra premium"},{"z":"在「全險」的保障中，是屬於可保的","e":"They are insurable under all risks protection"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"基本風險基本上是這樣的：其成因並非一個個人甚至一群個人有能力控制的，發生後會對數目龐大的人造成影響，因此往往被設定為標準的保單除外責任。"},{"id":"B9","ch":1,"ref":"1.1","t":1,"s":"b4","q":"汽車保險具不同類別，以下那項不屬慣常類別？","qi":[],"qe":"Motor insurance has different categories, which of the following is not one of them?","qei":[],"o":[{"z":"出租汽車","e":"Rental vehicle"},{"z":"私家車","e":"Private vehicle"},{"z":"電單車","e":"Motor cycle"},{"z":"商用車輪","e":"Commercial vehicle"}],"a":0,"x":"汽車保險的三個主要類別：私家車、電單車和商用車輛。"},{"id":"B10","ch":1,"ref":"1.1","t":1,"s":"by","q":"保險業中車輛分為不同類別，以下那類不是通常分類？","qi":[],"qe":"In the insurance industry vehicles are classified into different categories, which of the following is not one of them?","qei":[],"o":[{"z":"的士","e":"Taxi"},{"z":"私家車","e":"Private vehicle"},{"z":"電單車","e":"Motor cycle"},{"z":"商用車輛","e":"Commercial vehicle"}],"a":0,"x":"汽車保險的三個主要類別：私家車、電單車和商用車輛。"},{"id":"B11","ch":1,"ref":"1.1(a)","t":1,"s":"b3","q":"以下哪種汽車保險單，保障範圍包括對受保車輛造成的損失及毀壞？","qi":["「法令」","第三者責任","第三者責任，火災及盜竊","綜合"],"qe":"Which of the following motor insurance policies cover the loss and damage of the insured vehicle?","qei":["Act","Third Party Only","Third Party, Fire and Theft","Comprehensive"],"o":[{"z":"i, ii","e":""},{"z":"i, iii","e":""},{"z":"ii, iii","e":""},{"z":"iii, iv","e":""}],"a":3,"x":"第三者責任、火災及盜竊保險保障：保障範圍是純第三者責任保險保障，加上承保受保汽車遭受由火災或盜竊引起的損失或損害的財產保險。同時綜合保險保障：市面上的汽車保險保障中，這是保障範圍最廣闊的一種，包括第三者責任、火災及盜竊保險保障，而受保汽車的保險保障是「全險」的。"},{"id":"B12","ch":1,"ref":"1.1(a)","t":1,"s":"by","q":"一輛汽車高速行駛時翻側，全車損壞。但並沒有令到任何生命損傷，請問以下哪類保單可獲賠償？","qi":[],"qe":"A car travelled in high speed is overturned and totally wrecked but without causing any injury. Which of the following policy will provide cover for this?","qei":[],"o":[{"z":"汽車綜合保單","e":"Comprehensive car policy"},{"z":"第三者責任保險","e":"Third party only insurance"},{"z":"第三者責任、火險、盜竊保險","e":"Third party, fire and theft insurance"},{"z":"以上所列各項","e":"All of the above"}],"a":0,"x":"綜合保險保障：市面上的汽車保險保障中，這是保障範圍最廣闊的一種，包括第三者責任、火災及盜竊保險保障，而受保汽車的保險保障是「全險」的。全車損壞既不包括在第三者責任、火災及盜竊保險保障故屬於綜合保險保障。"},{"id":"B13","ch":1,"ref":"1.1(a)","t":1,"s":"b","q":"以下哪種汽車保險單，保障範圍最廣泛？","qi":[],"qe":"which of the following is the widest form of cover of motor insurance policy?","qei":[],"o":[{"z":"「法令」","e":"“Act” only"},{"z":"第三者責任","e":"Third Party liability"},{"z":"第三者責任，火災及盜竊","e":"Third Party liability, Fire or Theft"},{"z":"綜合","e":"Comprehensive"}],"a":3,"x":"第三者責任、火災及盜竊保險保障：保障範圍是純第三者責任保險保障，加上承保受保汽車遭受由火災或盜竊引起的損失或損害的財產保險。同時綜合保險保障：市面上的汽車保險保障中，這是保障範圍最廣闊的一種，包括第三者責任、火災及盜竊保險保障，而受保汽車的保險保障是「全險」的。"},{"id":"B14","ch":1,"ref":"1.1(a)&(b)","t":1,"s":"b4y","q":"在道路意外中，被保險人的乘客遭受損傷，其醫療費用可能包括於下列哪項汽車保險中？","qi":[],"qe":"In a road accident the passenger of the insured is injured, his medical expense can be included in which of the following motor insurances?","qei":[],"o":[{"z":"法令","e":"Act"},{"z":"第三者責任、火災、盜竊","e":"Third party, fire and theft"},{"z":"綜合","e":"Comprehensive"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"法令、第三者責任、火災、盜竊及綜合保險均承擔對司機以外的第三方提供保障。"},{"id":"B15","ch":1,"ref":"1.1(a)&(b)","t":1,"s":"by","q":"若乘客在交通意外中受傷，以下哪項保險可為被保險人的責任提供保障？","qi":[],"qe":"If a passenger is injured in a traffic accident, which of the following insurances can provide cover for the liability of the insured?","qei":[],"o":[{"z":"綜合保險","e":"Comprehensive cover"},{"z":"「法定」保險","e":"\"\"Act\"\" insurance"},{"z":"第三者責任、火災及盜竊保險","e":"Third party, fire and theft cover"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"法令、第三者責任、火災、盜竊及綜合保險均承擔對司機以外的第三方提供保障。"},{"id":"B16","ch":1,"ref":"1.1(a)&(b)","t":1,"s":"b3y","q":"我們常提及保險人承保的「第三者」保險，以下那三項是正確的？","qi":["它較強制性的「第三者」保險保障廣泛","它與強制性的「第三者」保險不同","它包括財產損毀保障","它並不包括第三者財產保障"],"qe":"We always mention \"Third Party\" insurance by insurers. Which 3 of the following are correct?","qei":["It has a wider cover than compulsory Third Party insurance","It is different from compulsory Third Party insurance","It includes cover for property damage","It does not include cover for property of third parties"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"i, iii, iv","e":""},{"z":"ii, iii, iv","e":""}],"a":0,"x":"純第三者責任保險保障：保障範圍是任何受保駕駛者（或任何乘客）對第三者造成死亡、受傷或財產損害而應負的法律責任，"},{"id":"B17","ch":1,"ref":"1.1(a)&(b)","t":1,"s":"b","q":"提供最狹窄保障範圍的汽車保險是：","qi":[],"qe":"The motor insurance provides the narrowest scope of cover is:","qei":[],"o":[{"z":"「法令」","e":"Act"},{"z":"第三者責任","e":"Third Party Only"},{"z":"綜合","e":"Comprehensive"},{"z":"第三者責任、火、綜合","e":"Third Party liability, fire, comprehensive"}],"a":0,"x":"「法令」只提供由汽車導致或引起任何人死亡或身體受傷而承擔的法律責任購買保險，僱主責任和合約上的法律責任則除外。"},{"id":"B18","ch":1,"ref":"1.1(b)","t":1,"s":"b4","q":"某汽車司機只有「法令」保險，並疏忽地令電單車司機發生意外。以下哪些可以向保險公司追討?","qi":[],"qe":"A driver, who only had an “Act” insurance, caused a motorcycle accident due to negligence. Which of the following is claimable with the insurance company?","qei":[],"o":[{"z":"自己汽車的損毀","e":"Own Viechel demages"},{"z":"電單車的損毀","e":"Motorcycle demages"},{"z":"電單車司機的受傷","e":"Motorcyclist's injuries"},{"z":"汽車司機的緊急召援醫生現場醫療費用","e":"Emergency medical service fee at the scene"}],"a":2,"x":"「法令」只提供由汽車導致或引起任何人死亡或身體受傷而承擔的法律責任購買保險，僱主責任和合約上的法律責任則除外。"},{"id":"B19","ch":1,"ref":"1.1(b)","t":1,"s":"b","q":"在汽車保險中的“第三者”，有時會引起一些混淆，一般保險公司提供的第三者保障是指：","qi":[],"qe":"In motor insurance the term \"\"Third Party\"\" may cause some confusion. Generally the cover for Third Party Only provided by insurers means:","qei":[],"o":[{"z":"“綜合”保障","e":"Comprehensive cover"},{"z":"法令保險","e":"Act insurance"},{"z":"與《汽車保險(第三者風險)條例》相同","e":"Same as \"\"Motor Vehicles Insurance (Third Party Risks) Ordinance\"\""},{"z":"與《汽車保險(第三者風險)條例》有所不同","e":"Different from \"\"Motor Vehicles Insurance (Third Party Risks) Ordinance\"\""}],"a":3,"x":"《汽車保險(第三者風險)條例》是指「法令」保險保障的範圍，只提供由汽車導致或引起任何人死亡或身體受傷而承擔的法律責任購買保險，而一般保險公司提供的第三者保障指任何受保駕駛者（或任何乘客）對第三者造成死亡、受傷或財產損害而應負的法律責任。"},{"id":"B20","ch":1,"ref":"1.1","t":1,"s":"b","q":"在強制性汽車保險中，乘客是指:","qi":[],"qe":"In compulsory motor insurance, passengers are:","qei":[],"o":[{"z":"載客車輛之下付車資的乘客","e":"Passengers who pays their fares"},{"z":"不需要是一個付車資的乘客","e":"No need to be a fare-paying passenger"},{"z":"同時可保(A)及(B)","e":"Can insure (A) and (B) at the same time"},{"z":"以上全部都不是正確答案","e":"None of the above"}],"a":1,"x":"乘客是指沒有提供任何利益給予司機而乘坐汽車的人。"},{"id":"B21","ch":1,"ref":"1.1(b)","t":1,"s":"b3y","q":"強制性第三者責任是指：","qi":[],"qe":"Compulsory third party liability means:","qei":[],"o":[{"z":"第三者財產損毀責任","e":"Liability for property damage to third parties"},{"z":"第三者的死亡或身體受傷責任","e":"Liability for death and injury to third parties"},{"z":"第三者的財產損毀責任及傷亡責任","e":"Liability for property damage, death and injury to third parties"},{"z":"十足的第三者財產損毀及傷亡責任","e":"Full liability for property damage, death and injury to third parties"}],"a":1,"x":"「第三者」一詞總是有雙重含義。條例中「第三者」風險僅指對死亡、受傷應負的法律責任。"},{"id":"B22","ch":1,"ref":"1.1(b)","t":1,"s":"b","q":"汽車保險(第三者風險)條例","qi":[],"qe":"Motor Vehicles Insurance (Third Party Risks) Ordinance","qei":[],"o":[{"z":"是本地汽車保險的起源","e":"Where the local car insurance originated"},{"z":"由於令到司機需要負責任何死傷，大大增加了汽車保險的需求","e":"has significantly increased the demand for motor insurance since the driver is responsible for any death or injury."},{"z":"是嘗試確保令那些在路面意外的不幸死傷者都有賠償","e":"It is an attempt to ensure that those unfortunate victims of road accidents are compensated."},{"z":"是香港法例唯一的強制性保險","e":"It is the only compulsory insurance under Hong Kong law"}],"a":2,"x":"《汽車保險（第三者風險）條例》:必須就因在道路（包括私家路——位於完全或主要用作進行建造工程或工業活動的範圍內的私家路則除外)上使用汽車導致或引起任何人死亡或身體受傷而承擔的法律責任購買保險，"},{"id":"B23","ch":1,"ref":"1.1(b)","t":1,"s":"by","q":"在強制性汽車傷亡責任，最低要求的保險金額為：","qi":[],"qe":"For compulsory death and injury liability, the minimum amount of cover required is:","qei":[],"o":[{"z":"一百萬","e":"1 million"},{"z":"一億","e":"100 million"},{"z":"沒有上限","e":"No limitation"},{"z":"不受限制","e":"No restriction"}],"a":1,"x":"對於第三者的死亡和受傷的法律責任，最低要求的保險金額是每次事故一億港元（實際上，這也是香港汽車保單的通常彌償限額（或責任限額）。"},{"id":"B24","ch":1,"ref":"1.1(b)","t":1,"s":"by","q":"以下哪項汽車保險保障形式，只保障法律所要求的責任？","qi":[],"qe":"Which of the following motor insurance policies covers only the minimum liability requirements as requested by law?","qei":[],"o":[{"z":"「法令」","e":"Act"},{"z":"第三者責任","e":"Third Party Only"},{"z":"綜合責任","e":"Comprehensive"},{"z":"第三者責任、火災、盜竊","e":"Third Party, fire and theft"}],"a":0,"x":"「法令」只提供由汽車導致或引起任何人死亡或身體受傷而承擔的法律責任購買保險，僱主責任和合約上的法律責任則除外。"},{"id":"B25","ch":1,"ref":"1.1(b)","t":1,"s":"b4y","q":"在強制性汽車法例的「第三者」保單，與本港汽車保險人的第三者保單：","qi":[],"qe":"The compulsory \"\"Third Party\"\" motor insurance and the Third Party policies of car insurers in Hong Kong:","qei":[],"o":[{"z":"完全相同","e":"Are the same"},{"z":"均只是「法令」保障責任","e":"Cover Act only"},{"z":"均可是「法令」與「綜合」","e":"Can be Act and Comprehensive"},{"z":"完全不相同，後者是提供財產損毀及責任保障","e":"Are different, the latter provides cover for property damage"}],"a":3,"x":"「第三者」一詞總是有雙重含義。條例中「第三者」風險僅指對死亡、受傷應負的法律責任。另一方面，「第三者」汽車保險單除了承保死亡和傷害的法律責任以外，還承保對第三者造成財產損害的法律責任。"},{"id":"B26","ch":1,"ref":"1.1(b)","t":1,"s":"b","q":"以下哪項對純「法令」保險的描述不正確？","qi":[],"qe":"Which of the following is incorrect in describing \"\"Act Only\"\" insurance?","qei":[],"o":[{"z":"提供最狹窄保障範圍的汽車保險","e":"It provides the narrowest scope of cover in motor insurance"},{"z":"只對死亡或受傷的責任作出保障","e":"It covers only for death and injury"},{"z":"是汽車保險中最便宜的一種，所以最為普遍","e":"It is the cheapest in motor insurance, therefore very popular"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"純法令保險保障已經很難在市場上找到"},{"id":"B27","ch":1,"ref":"1.1(b)","t":1,"s":"b","q":"以下哪項或哪些不屬於汽車保險中第三者保險的正確描述？","qi":[],"qe":"Which of the following is incorrect in describing Third Party Only insurance in motor insurance?","qei":[],"o":[{"z":"它祗適用對第三者做成的受傷及財產損毀","e":"It only applies to injury and property damage to third parties"},{"z":"通常情況下，最低要求保險金額是一億港元","e":"Normally the minimum amount of cover required is HK$100 million"},{"z":"它屬於強制性保險","e":"It belongs to compulsory insurance"},{"z":"它同時保障受保司機與乘客的受傷","e":"It covers injury of both insured driver and passenger"}],"a":3,"x":"《汽車保險(第三者風險)條例》是指「法令」保險保障的範圍，只提供由汽車導致或引起任何人死亡或身體受傷而承擔的法律責任購買保險，而一般保險公司提供的第三者保障指任何受保駕駛者（或任何乘客）對第三者造成死亡、受傷或財產損害而應負的法律責任，對於第三者的死亡和受傷的法律責任，最低要求的保險金額是每次事故一億港元（實際上，這也是香港汽車保單的通常彌償限額（或責任限額）。"},{"id":"B28","ch":1,"ref":"1.1(b)","t":1,"s":"b3","q":"強制性汽車保險是:","qi":[],"qe":"Compulsory motor insurance is:","qei":[],"o":[{"z":"在道路（包括私家路位於主要用作進行建造工程或工業活動的範圍內的私家路則除外)上使用汽車導致或引起任何人死亡或身體受傷而承擔的法律責任購買保險","e":"Legal liability for the death or bodily injury of any person caused or caused by the use of a motor vehicle on a road (including a private road except a private road within an area used primarily for the purpose of carrying out construction works or industrial activities)."},{"z":"在道路（包括私家路位於完全或主要用作進行建造工程或工業活動的範圍內的私家路則除外)上使用汽車導致或引起任何人死亡或身體受傷而承擔的法律責任購買保險","e":"Legal liability for the death or bodily injury of any person caused or caused by the use of a motor vehicle on a road (including a private road except a private road within an area used wholly or principally for the purpose of carrying out construction works or industrial activities)."},{"z":"在道路（包括公路位於完全或主要用作進行建造工程或工業活動的範圍內的私家路則除外)上使用汽車導致或引起任何人死亡或身體受傷而承擔的法律責任購買保險","e":"Legal liability for the death or bodily injury of any person caused or caused by the use of a motor vehicle on a road (including a private road except a private road located within an area used wholly or principally for the purpose of carrying out construction works or industrial activities)"},{"z":"在道路（包括所有用作進行建造工程或工業活動的範圍內的私家路則除外)上使用汽車導致或引起任何人死亡或身體受傷而承擔的法律責任購買保險","e":"Legal liability for the death or bodily injury of any person caused or caused by the use of a motor vehicle on a road (including a private road except a private road located within an area used wholly or principally for the purpose of carrying out construction works or industrial activities)"}],"a":1,"x":"必須就因在道路(包括私家路位於完全或主要用作進行建造工程或工業活動的範圍內的私家路則除外)上使用汽車導致或引起任何人死亡或身體受傷而承擔的法律責任購買保險，僱主責任和合約上的法律責任，此類法律責任稱為「法令責任」。"},{"id":"B29","ch":1,"ref":"1.1(c)","t":1,"s":"b45y","q":"本港汽車保險的慣例中，保險人採用的無索償折扣提供最高的折扣率予：","qi":[],"qe":"As a general practice of motor insurance in Hong Kong, insurers provide the maximum no claim discount to:","qei":[],"o":[{"z":"所有類別的車輛","e":"All categories of vehicles"},{"z":"私家車","e":"Private vehicle"},{"z":"電單車","e":"Motor cycle"},{"z":"商用車輛","e":"Commercial vehicle"}],"a":1,"x":"私家車的典型無索償折扣表是這樣的：第一年的無索償記錄可賺取無索償折扣20%，第二年為30%，依次類推，而連續五年的無索償記錄將無索償折扣累進到最高的60%。對於其他類別的汽車，折扣表相當可能從10%開始，經過連續三年的無索償記錄後提升到最高的30%。"},{"id":"B30","ch":1,"ref":"1.1(c)","t":1,"s":"by","q":"在私家車的保險中，「折扣回減機制」的意思是：","qi":[],"qe":"For insurance of private vehicles, step-back system means:","qei":[],"o":[{"z":"若索償與第三者有關，折扣將不會回減","e":"If the claim is related to third party, discount will not be reduced"},{"z":"每次索償會將所有折扣取消","e":"Each claim will destroy all discount"},{"z":"每次索償會將折扣回減30%","e":"Each claim will reduce 30% of discount"},{"z":"每次索償會將折扣回減10%","e":"Each claim will reduce 10% of discount"}],"a":2,"x":"私家車而言，無索償折扣以所謂「折扣回減機制」運作一次索償不一定會撤銷來年的折扣。舉個例子，如果在某個保單年度中所享用的折扣屬於四年的相應折扣率（即50%），而當年發生了一次索償，那麽續保時的折扣率便會被調低至20%。"},{"id":"B31","ch":1,"ref":"1.1(c)(ii)","t":1,"s":"b","q":"在某種情況下，無索償折扣採用的「折扣回減」機制，意思是不會因一次的索償而導致損失全部折扣，不過這種機制只適用於？","qi":[],"qe":"The step back system used with no claim discount means, in some case that not all of the discount is lost as a result of a single claim. This system, however, only applies to:","qei":[],"o":[{"z":"私家車保險","e":"Private car insurance"},{"z":"電單車保險","e":"Motor cycle insurance"},{"z":"商用車輛保險","e":"Commercial vehicle insurance"},{"z":"汽車行業風險保險","e":"Motor trade risks insurance"}],"a":0,"x":"私家車而言，無索償折扣以所謂「折扣回減機制」運作一次索償不一定會撤銷來年的折扣。舉個例子，如果在某個保單年度中所享用的折扣屬於四年的相應折扣率（即50%），而當年發生了一次索償，那麽續保時的折扣率便會被調低至20%。"},{"id":"B32","ch":1,"ref":"1.1(c)","t":1,"s":"b3y","q":"在汽車保險中，何時可取得無索償折扣？","qi":[],"qe":"In motor insurance, when will receive no claim discount?","qei":[],"o":[{"z":"以往無任何索償紀錄","e":"Claim-free previously"},{"z":"於來年度並無索償紀錄","e":"Claim-free in next year"},{"z":"於上一年度並無任何索償紀錄","e":"Claim-free in the previous year"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"私家車的典型無索償折扣表是這樣的：第一年的無索償記錄可賺取無索償折扣20%，第二年為30%，依次類推，而連續五年的無索償記錄將無索償折扣累進到最高的60%。對於其他類別的汽車，折扣表相當可能從10%開始，經過連續三年的無索償記錄後提升到最高的30%。"},{"id":"B33","ch":1,"ref":"1.1(c)","t":1,"s":"b4y","q":"大部份汽車保險保單均有一項慣例，就是如果被保險人在過往一年沒有作出索償，便可於來年續保時，獲取保費上的扣減。這種慣例的最正確名稱為：","qi":[],"qe":"Most motor insurance policies have a practice, that is if the insured is claim-free in the previous year, there is a discount on the renewal premium. The correct title for this practice is:","qei":[],"o":[{"z":"無索償獎金","e":"No Claim Bonus"},{"z":"無索償折扣","e":"No Claim Discount"},{"z":"無索償扣減額","e":"No Claim Reduction"},{"z":"無索償續保減免","e":"No Claim Renewal Allowance"}],"a":1,"x":"汽車保險有一個非常重要，也幾乎是最為獨特的特徵，就是如果被保險人在剛過去的保單年度中沒有任何索償，那麽保險人便會對續保年保費給予稱為無索償折扣(No Claim Discount (NCD) / ClaimFreeDiscount)的累進折扣，以鼓勵安全駕駛。"},{"id":"B34","ch":1,"ref":"1.1(c)","t":1,"s":"b","q":"以下哪項對「無索償折扣」的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing \"\"no claim discount\"\"?","qei":[],"o":[{"z":"私家車獲得的折扣是最低的","e":"The discount for private vehicles is the lowest"},{"z":"市場上很多時稱為「無索償獎金」","e":"It is often called \"\"no claim bonus\"\" in the market"},{"z":"在過去一年未曾索償而可獲得超過百份比的保費折扣","e":"If claim-free in the previous year will receive over percentage of premium discount"},{"z":"商用車輛往往比私家車的折扣為高","e":"Commercial vehicles enjoy more discount than private vehicles"}],"a":1,"x":"汽車保險有一個非常重要，也幾乎是最為獨特的特徵，就是如果被保險人在剛過去的保單年度中沒有任何索償，那麽保險人便會對續保年保費給予稱為無索償折扣(No Claim Discount (NCD) / ClaimFreeDiscount)的累進折扣，以鼓勵安全駕駛。"},{"id":"B35","ch":1,"ref":"1.1(c)","t":1,"s":"b","q":"無索償折扣的最高百分比出現於：","qi":[],"qe":"The maximum percentage of discount for no claim discount appears in:","qei":[],"o":[{"z":"私家車保險","e":"Insurance of private vehicle"},{"z":"電單車保險","e":"Insurance of motor cycle"},{"z":"的士保險","e":"Taxi insurance"},{"z":"商用車輛保險","e":"Insurance of commercial vehicle"}],"a":0,"x":"私家車的典型無索償折扣表是這樣的：第一年的無索償記錄可賺取無索償折扣20%，第二年為30%，依次類推，而連續五年的無索償記錄將無索償折扣累進到最高的60%。對於其他類別的汽車，折扣表相當可能從10%開始，經過連續三年的無索償記錄後提升到最高的30%。"},{"id":"B36","ch":1,"ref":"1.1(c)","t":1,"s":"b3","q":"如被保險人享有百分之六十的無索償折扣，經過一次索償後，無索損折扣將減至:","qi":[],"qe":"If the insured enjoys a 60% no-claims discount, after one claim, the no-claims discount will be reduced to:","qei":[],"o":[{"z":"百分之三十","e":"30%"},{"z":"百分之二十","e":"20%"},{"z":"百分之十","e":"10%"},{"z":"百分之一","e":"1%"}],"a":0,"x":"私家車而言，無索償折扣以所謂「折扣回減機制」運作一次索償不一定會撤銷來年的折扣。舉個例子，如果在某個保單年度中所享用的折扣屬於四年的相應折扣率（即50%），而當年發生了一次索償，那麽續保時的折扣率便會被調低至 20%。"},{"id":"B37","ch":1,"ref":"1.1(c)(ii)","t":1,"s":"by","q":"無索償折扣會應用於私家車的保險中，當私家車得到最高的無索償折扣時，不會因一次意外索償而完全取消所有折扣。這種運作稱為：","qi":[],"qe":"No claim discount applies to motor insurance of private vehicles. With private cars, a single claim will not completely destroy all entitlement of the discount. This is called:","qei":[],"o":[{"z":"無索償折扣扣減機制","e":"No claim discount reduction system"},{"z":"平均機制","e":"Average system"},{"z":"折扣回減機制","e":"Step-back system"},{"z":"不能作廢保單條款","e":"Unvoidable policy terms"}],"a":2,"x":"私家車而言，無索償折扣以所謂「折扣回減機制」運作一次索償不一定會撤銷來年的折扣。舉個例子，如果在某個保單年度中所享用的折扣屬於四年的相應折扣率（即50%），而當年發生了一次索償，那麽續保時的折扣率便會被調低至 20%。"},{"id":"B38","ch":1,"ref":"1.1(d)","t":1,"s":"b4y","q":"你預期以下哪項不屬於本港所簽發的無擴展汽車保單的除外責任？","qi":[],"qe":"Which of the following do you expect not belong to the exclusions of non-extended motor policies issued in Hong Kong?","qei":[],"o":[{"z":"財物損毀責任","e":"Property damage"},{"z":"發生在保險人指定保障區範圍以外的意外","e":"Accidents occurring outside the specified geographical area of cover of the insured"},{"z":"被保險汽車首一千元損毀","e":"First HK$1,000 damage of the insured vehicle"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"無拓展是指《汽車保險(第三者風險)條例》是指「法令」保險保障的範圍，對第三者造成財產損害的法律責任不屬於強制保險的範圍。"},{"id":"B39","ch":1,"ref":"1.1(d)/1.1.1(a)","t":1,"s":"by","q":"下列哪項不大可能出現於大部份汽車保險保單的除外責任？","qi":[],"qe":"Which of the following is not likely to be an exclusion of most of the motor insurance policies?","qei":[],"o":[{"z":"戰爭及核子風險","e":"War and nuclear risks"},{"z":"合約上的責任","e":"Contractual liability"},{"z":"屬於社交、娛樂及消閒用途","e":"Use for social, entertainment and leisure purposes"},{"z":"未經批準的車輛用途","e":"Unauthorized purpose of use for the car"}],"a":2,"x":"汽車的用途是個釐定保費的重要依據，因此，如果某張保單規定了受保汽車只能作社交、家事及娛樂之用，但該車卻在遇上意外事故時被用作的士，這意外事故是不保的。"},{"id":"B40","ch":1,"ref":"1.1(d)(ii)/1.1.3(b","t":1,"s":"b","q":"根據各類汽車保險〈汽車行業除外〉，均有一些通用的除外責任，其中包括下列哪項或哪些除外責任？","qi":[],"qe":"According to all different motor insurances (except for motor trade insurance), there is/are exclusion(s) including which of the following?","qei":[],"o":[{"z":"賽車","e":"Car racing"},{"z":"汽車測試","e":"Car testing"},{"z":"用在汽車行業的用途","e":"Motor trade use"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"汽車的用途是個釐定保費的重要依據，因此，如果某張保單規定了受保汽車只能作社交、家事及娛樂之用，但該車卻在遇上意外事故時被用作的士，這意外事故是不保的。"},{"id":"B41","ch":1,"ref":"1.1(d)(iii)(3)","t":1,"s":"b","q":"在一般保險的責任保險中，合約的附加責任(協議已約定承擔的法律責任)是：","qi":[],"qe":"In liability insurance of General Insurance, contractual liability (liability which has assumed under an agreement) is:","qei":[],"o":[{"z":"屬於除外責任","e":"An exclusion"},{"z":"自動獲得保障","e":"Automatically covered"},{"z":"在法律上是不可保的","e":"legally uninsurable"},{"z":"不可保的","e":"Uninsurable"}],"a":0,"x":"合約附加的責任，此詞常用於責任保險，意指根據保單索取彌償的人已在某項協議中同意承擔的法律責任，而這項法律責任是不可能在沒有這項協議的情況下產生的。"},{"id":"B42","ch":1,"ref":"1.1(d)(iii)","t":1,"s":"b4","q":"你認為以下哪項或哪些損失原因屬於汽車保險保單的除外責任？","qi":[],"qe":"Which of the following causes of loss do you think is/are exclusion(s) of motor insurance policies?","qei":[],"o":[{"z":"戰爭風險","e":"War risks"},{"z":"合約附加的責任","e":"Contractual liability"},{"z":"核子和輻射風險","e":"Nuclear and radioactive risks"},{"z":"上述所有各項","e":"All of the above"}],"a":3,"x":"戰爭、合約附加責任及核子和輻射風險均為除外責任。"},{"id":"B43","ch":1,"ref":"1.1(e)","t":1,"s":"b3y","q":"汽車保險怎樣釐定保費？","qi":[],"qe":"How to determine motor insurance premiums?","qei":[],"o":[{"z":"車輛的用途","e":"The use of the vehicle"},{"z":"引擎的立方容量","e":"The engine power"},{"z":"被保人對其車輛的估計價值","e":"The insured's estimate of car value"},{"z":"上述各項都是","e":"All of the above"}],"a":3,"x":"保障種類、馬力、汽車價值、用途、物理特徵及司機等均為計算保費的元素。"},{"id":"B44","ch":1,"ref":"1.1(e)","t":1,"s":"by","q":"您認為以下哪一種不屬於保險人釐定綜合私家汽車保險單保費的考慮因素？","qi":[],"qe":"Which of the following do you think is not a factor considered by insurers in determining the premium of comprehensive motor insurance for private vehicles?","qei":[],"o":[{"z":"被保險人對車輛的估計價值","e":"The insured's estimate of car value"},{"z":"保障範圍","e":"The scope of cover"},{"z":"被保險人的性別","e":"Gender of the insured"},{"z":"被保險車輛的引擎容量","e":"The engine power of car insured"}],"a":2,"x":"保障種類、馬力、汽車價值、用途、物理特徵及司機等均為計算保費的元素。"},{"id":"B45","ch":1,"ref":"1.1(f)","t":1,"s":"b3y","q":"有一種由被保險人要求的汽車保險保單自負額，通常是為了換取保單的折扣，這種自負額稱為：","qi":[],"qe":"An insurance policy excess is requested by the insured in return for a premium discount, such excess is called:","qei":[],"o":[{"z":"標準自負額","e":"Standard excess"},{"z":"自願性自負額","e":"Voluntary excess"},{"z":"承保自負額","e":"underwriting excess"},{"z":"非強制性自負額","e":"Non-compulsory excess"}],"a":1,"x":"自負額可以是自願性自負額（也就是被保險人為了換取保費折扣而自己要求的）"},{"id":"B46","ch":1,"ref":"1.1(f)(ii)","t":1,"s":"by","q":"下列哪項有關標準自負額的陳述並不正確？","qi":[],"qe":"Which of the following is incorrect in describing standard excesses?","qei":[],"o":[{"z":"它們必定和任何自願性自負額並行","e":"They will always be in parallel with any voluntary excess"},{"z":"這類自負額不容許提供保費扣減","e":"These excesses do not qualify for any premium reduction"},{"z":"適用於同一業務類別的所有保單","e":"Applicable to all policies within the same class"},{"z":"這類自負額容許提供一項標準保費的扣減","e":"These excesses is qualified for one discount on standard premium"}],"a":3,"x":"標準自負額不會有保費折扣。"},{"id":"B47","ch":1,"ref":"1.1(g)","t":1,"s":"by","q":"「有權追回款項條款」適用於：","qi":[],"qe":"\"\"Avoidance of Certain Terms and Right of Recovery\"\" Clause is applicable to:","qei":[],"o":[{"z":"只在特別條款（例如額外保費）生效時","e":"Only when a special term (e.g. additional premium) is in effect"},{"z":"在強制性條款凌駕於保單條款時","e":"When compulsory terms are over the policy terms"},{"z":"意外中只有被保人的汽車遭損壞","e":"When only the insured's vehicle is damaged in an accident"},{"z":"只由第三者引起的損毀","e":"Damage caused by third party only"}],"a":1,"x":"根據規定，凡為施行「使若干條款無效及有權追回款項」條款而發出的保險單內載列任何條件，訂定如在引致可根據該保險單提出申索的事故發生後，某些指明事情獲得辦理或沒有辦理，便不會根據該保險單產生法律責任或已如此產生的法律責任即告終止，則該條件對任何適用強制汽車保險相關規定的申索並無效力。"},{"id":"B48","ch":1,"ref":"1.1(g)","t":1,"s":"b34y","q":"「有權追回款項條款」可於以下哪項情況下使用？","qi":[],"qe":"\"\"Avoidance of Certain Terms and Right of Recovery\"\" Clause can be applied to which of the following circumstances?","qei":[],"o":[{"z":"當強制性條款凌駕於保險條款之上","e":"When compulsory terms are over the policy terms"},{"z":"當只有被保險人的車輛受損的時候","e":"When only the insured's vehicle is damaged"},{"z":"當涉及第三者財產損毀的時候","e":"When damage of property of third party is involved"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"根據規定，凡為施行「使若干條款無效及有權追回款項」條款而發出的保險單內載列任何條件，訂定如在引致可根據該保險單提出申索的事故發生後，某些指明事情獲得辦理或沒有辦理，便不會根據該保險單產生法律責任或已如此產生的法律責任即告終止，則該條件對任何適用強制汽車保險相關規定的申索並無效力。"},{"id":"B49","ch":3,"ref":"3.1.3(c)註","t":1,"s":"b3y","q":"保險人拒絕索償是因被保險人違反保單條款，但有一種索償是可能凌駕於拒絕索償的理由，這是：","qi":[],"qe":"Insurer may refuse a claim because the insured has breach of the policy terms. But there is a claim that can be over the reason to refuse, which is:","qei":[],"o":[{"z":"個人意外保險","e":"Personal accident insurance"},{"z":"關於被保險人財產的保險","e":"Related to property insurance of the insured"},{"z":"關於強制性保險保障的範圍","e":"Related to the cover of compulsory insurance"},{"z":"以上所述各項","e":"All of the above"}],"a":2,"x":"根據規定，凡為施行「使若干條款無效及有權追回款項」條款而發出的保險單內載列任何條件，訂定如在引致可根據該保險單提出申索的事故發生後，某些指明事情獲得辦理或沒有辦理，便不會根據該保險單產生法律責任或已如此產生的法律責任即告終止，則該條件對任何適用強制汽車保險相關規定的申索並無效力。"},{"id":"B50","ch":1,"ref":"1.1.1(a)","t":1,"s":"by","q":"汽車保險中，私家車用途是：","qi":[],"qe":"For motor insurance, private car is used for:","qei":[],"o":[{"z":"受保駕駛者視為陌生人的乘客","e":"Passengers being treated as strangers by insured driver"},{"z":"非為獎賞或租金而接載的乘客","e":"For carriage of passengers not for reward or hire"},{"z":"為了租金而提供接載服務的乘客","e":"For carriage of passengers for hire"},{"z":"會給予小費的乘客(如給予小費予的士司機)","e":"For passengers who will give tips (e.g. tips for tax drivers)"}],"a":1,"x":"該車只能用於社交、家事及娛樂目的，或用於被保險人的業務或專業之上；不得用來出租或取酬、參加比賽…或用於任何與汽車銷售行業有關連的目的。"},{"id":"B51","ch":1,"ref":"1.1.1(a)","t":1,"s":"by","q":"以下哪項是不屬於香港汽車保單中造成「本身損失及損害」的保障範圍？","qi":[],"qe":"Which of the following is not the area being covered in \"\"loss or damage itself\"\" in a car policy of Hong Kong?","qei":[],"o":[{"z":"於碰撞中對汽車做成的損害","e":"Damage of vehicle as a result of collision"},{"z":"對輪呔造成損毀，對汽車並未做成其他損害","e":"Damage to tyres but no damage to the vehicle"},{"z":"汽車上的配件及備用零件","e":"Accessories and spare parts of the car"},{"z":"除對輪呔造成損毀外，對汽車亦做成其他損害","e":"Damage to tyres as well as to the car"}],"a":1,"x":"後果損失、折舊、損耗，以及電氣或機械故障均不獲賠償。"},{"id":"B52","ch":1,"ref":"1.1.1(a)(i)","t":1,"s":"b4y","q":"以下哪項損失及損毀的例子，可得到綜合私家車保單的保障？","qi":[],"qe":"Which of the following example on loss and damage that will be covered by comprehensive private car policy?","qei":[],"o":[{"z":"更換破舊的死氣喉","e":"Replacement of worn out exhaustion pipe"},{"z":"更換破舊的電線的開支","e":"replacement cost for worn out electric wires"},{"z":"被保險人的車輛的車胎被割損(沒有其他損毀)","e":"The tyres of the insured's vehicle are slashed (no other damages)"},{"z":"被保險人的車輛被盜賊偷去時損毀","e":"The insured's vehicle is damaged arising from theft"}],"a":3,"x":"後果損失、折舊、損耗，以及電氣或機械故障均不獲賠償。"},{"id":"B53","ch":1,"ref":"1.1.1(a)(i)","t":1,"s":"by","q":"在香港現時未擴展的汽車保險保障中，以下哪項是除外責任？","qi":[],"qe":"In the current non-extended car insurance cover in Hong Kong, which of the following is an exclusion?","qei":[],"o":[{"z":"汽車冷卻器的損壞","e":"Damage of car cooler"},{"z":"汽車在維修過程中租用其他車輛的費用","e":"Expense of hiring another car during repairs of the insured vehicle"},{"z":"汽車零件遭盜竊","e":"Theft of spare parts of the car"},{"z":"汽車擋風玻璃遭撞擊而損壞","e":"Damage of the windshield as a result of collision"}],"a":1,"x":"受保汽車的損失或損害（本身損害）：這種「全險」範圍的財產保險，承保被保險人的汽車，及屬於該汽車並於遇事時在其上的配件和零件，並以該車遭受損失或損害時的合理市價為彌償上限。"},{"id":"B54","ch":1,"ref":"1.1.1(b)(iii)","t":1,"s":"by","q":"以下哪項屬於私家車保險得到折扣的途徑？","qi":[],"qe":"Which of the following is/are way(s) to get discount for private car insurance policy?","qei":[],"o":[{"z":"自願性自負額","e":"Voluntary excess"},{"z":"無索償折扣","e":"No claim discount"},{"z":"汽車長期「停用」","e":"A car is laid-up for a minimum period"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"無索償折扣和自願性自負額以外，用同一份保單承保多於一輛汽車或受保汽車暫時停用了超過最低限度的時間後，也可以獲得保費折扣。"},{"id":"B55","ch":1,"ref":"1.1.2","t":1,"s":"b","q":"以下哪項對於電單車保單的說明是正確的？","qi":["只有當整輛電單車遭到偷竊，才會作出賠償","通常不會設有醫療開支的保障","可享有的無索償折扣，比私家車低","通常會於火災或盜竊引起的損失設有標準自負額"],"qe":"Which of the following about Motor Cycle insurance are correct?","qei":["Compensation will be made only when the whole machine is stolen","There is no cover for medical expenses in general","No claim discount will be less than private cars","There is usually standard excess in respect of any loss arising from fire or theft"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":0,"x":"只有當整輛電單車被盜時才能構成有效的盜竊索償。僅是電單車的配件被盜是不會受到承保的。通常對受保電單車的任何損失或損害（因火災或盜竊引起的除外），都設有標準自負額。"},{"id":"B56","ch":1,"ref":"1.1.2","t":1,"s":"b3y","q":"在電單車保單中，「本身損毀或意外損毀」保障的除外責任包括：","qi":["電單車部份配件因盜竊所招致的損失","因意外而引致的修理費","司機因投保車輛意外損毀而引致的醫療開支","自負額"],"qe":"For motor cycle insurance, the exclusions of cover for \"\"own damage or accidental damage\"\" include:","qei":["Loss of part of the accessories of motor cycle due to theft","Repair expense caused by accident","Medical expense of driver due to accidental damage of insured vehicle","Excess"],"o":[{"z":"只有i","e":"i only"},{"z":"只有iii","e":"iii only"},{"z":"i, ii","e":""},{"z":"i, iii, iv","e":""}],"a":3,"x":"只有當整輛電單車被盜時才能構成有效的盜竊索償。僅是電單車的配件被盜是不會受到承保的。通常對受保電單車的任何損失或損害（因火災或盜竊引起的除外），都設有標準自負額。"},{"id":"B57","ch":1,"ref":"1.1.2","t":1,"s":"b4y","q":"以下哪項描述不屬於「電單車」保單的保障範圍？","qi":[],"qe":"Which of the following description is not covered by \"Motor Cycle\" insurance?","qei":[],"o":[{"z":"電單車乘客在意外中身體受傷","e":"Passenger of motor cycle is injured in an accident"},{"z":"當整輛電單車遭到偷竊","e":"When the whole motor cycle is stolen"},{"z":"電單車的意外損毀","e":"Accidental damage of motor cycle"},{"z":"為電單車乘客所付的醫療開支","e":"Medical expense for passenger of motor cycle"}],"a":3,"x":"承保醫療費用的標準保單部分及擴展人身意外保險保障並不存在。"},{"id":"B58","ch":1,"ref":"1.1.2","t":1,"s":"b","q":"以下哪項是對於電單車保險的正確描述？","qi":["相對於私家車保險的「無索償折扣」為低","盜竊索償部份祗適用於整輛車被盜去","乘客引致的第三者責任通常是不保的","火災及盜竊不設有標準自負額"],"qe":"Which of the following are correct in describing motor cycle insurance?","qei":["Relatively less in \"no claim discount\" when compared with private car policy","Theft claims are admissible only if the whole machine is stolen","Third party cover is not usually granted for the liability of passengers","No standard excess for fire and theft"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":3,"x":"私家車以外之汽車無索償折扣最高為30%。只有當整輛電單車被盜時才能構成有效的盜竊索償。僅是電單車的配件被盜是不會受到承保的。通常對受保電單車的任何損失或損害（因火災或盜竊引起的除外），都設有標準自負額。"},{"id":"B59","ch":1,"ref":"1.1.2(c)","t":1,"s":"by","q":"電單車保險的保障範圍不包括：","qi":[],"qe":"The cover of motor cycle insurance excludes:","qei":[],"o":[{"z":"司機的意外受傷","e":"Accidental injury of driver"},{"z":"祗限整部車輛被盜去","e":"Limited to only when the whole machine is stolen"},{"z":"後座乘客在發生意外後的醫療費用","e":"Medical expense of back-seat passenger after an accident"},{"z":"對乘客造成的受傷負責","e":"Liability to the passenger's injury"}],"a":2,"x":"承保醫療費用的標準保單部分及擴展人身意外保險保障並不存在。"},{"id":"B60","ch":1,"ref":"1.1.3(a)","t":1,"s":"by","q":"一些特別車輛(如：救護車及鏟泥車)所購買的保險類別為：","qi":[],"qe":"The kind of insurance purchased for some specialized vehicles (e.g. ambulance and mechanical digger) is:","qei":[],"o":[{"z":"商用","e":"Commercial"},{"z":"汽車貿易","e":"Motor trade"},{"z":"專門車輛","e":"Specialized vehicles"},{"z":"綜合","e":"Comprehensive"}],"a":0,"x":"的士、輕型貨車到巨型貨櫃車及為專門用途而特別製造或改造的汽車均屬商用車輛保險之保障範圍。"},{"id":"B61","ch":1,"ref":"1.1.3(a)(ii)","t":1,"s":"b5y","q":"一部商用車輛如果同時使用於建築工程上，例如挖掘地洞，商業車輛保單可能在這段操作期間拒絕提供保障。這種除外責任稱為：","qi":[],"qe":"If a commercial vehicle is used in construction projects, such as digging holes, commercial vehicle policy may refuse to provide cover during the project's operating period. This exclusion is called:","qei":[],"o":[{"z":"謀生工具條款","e":"Tool of trade clause"},{"z":"業務使用條款","e":"Business use clause"},{"z":"工業行動條款","e":"Industrial action clause"},{"z":"專業責任條款","e":"Professional liability clause"}],"a":0,"x":"汽車被用作謀生工具（例如正在用作謀生工具的機械挖土機），除非屬於強制保險相關法定條文所要求的保障範圍。（這項除外責任條款稱為「謀生工具條款」。）"},{"id":"B62","ch":1,"ref":"1.1.3(a)(ii)(i)","t":1,"s":"b3","q":"在香港，會把車輛用作「謀生工具」有關的除外責任，較可能出現於下列哪項商用車輛保險單中？","qi":[],"qe":"In Hong Kong, exclusions for use of the vehicle as a tool of trade will be likely to appear in which of the following commercial vehicle policies?","qei":[],"o":[{"z":"運送貨櫃或拖架工具的商用車輛","e":"Commercial vehicle for transportation of containers or trailer tools"},{"z":"的士","e":"Taxi"},{"z":"機械挖土機","e":"Mechanical digger"},{"z":"送遞薄餅的電單車","e":"Motor cycle for delivering pizza"}],"a":2,"x":"汽車被用作謀生工具（例如正在用作謀生工具的機械挖土機），除非屬於強制保險相關法定條文所要求的保障範圍。（這項除外責任條款稱為「謀生工具條款」。）"},{"id":"B63","ch":1,"ref":"1.1.3(b)","t":1,"s":"b4","q":"由於車房的業務絕大程度與汽車有關，而且有特別的需要，提供的保障亦有所不同，這類保單稱為：","qi":[],"qe":"As the business of garages largely concerns motor vehicles and has special insurance needs, therefore the cover provided will be different. This kind of policies is called:","qei":[],"o":[{"z":"汽車行業風險","e":"Motor Trade risks"},{"z":"商業車輛風險","e":"Commercial vehicle risks"},{"z":"貿易車輛風險","e":"Trading vehicle risks"},{"z":"維修貿易風險","e":"Repair trading risks"}],"a":0,"x":"汽車行業風險：從事主要與汽車有關的業務的人，諸如買賣車輛、修理車輛、代客開車、洗車、救援拖車等，對保險會有特別的需要。這類風險的保單，稱為汽車行業保單，可能涉及在道路上使用汽車或處所風險，並提供多樣化的保險保障組合。"},{"id":"B64","ch":1,"ref":"1.1.3(b)(iv)","t":1,"s":"b","q":"車房及其他類似風險會有特別的需要，這是：","qi":[],"qe":"Garages and other similar risks have special needs, these are:","qei":[],"o":[{"z":"汽車行業風險","e":"Motor Trade risks"},{"z":"汽車責任限額","e":"Motor liability limit"},{"z":"批發及貿易","e":"Wholesale and trading"},{"z":"第三者損毀","e":"Third party damage"}],"a":0,"x":"汽車行業風險：從事主要與汽車有關的業務的人，諸如買賣車輛、修理車輛、代客開車、洗車、救援拖車等，對保險會有特別的需要。這類風險的保單，稱為汽車行業保單，可能涉及在道路上使用汽車或處所風險，並提供多樣化的保險保障組合。"},{"id":"B65","ch":1,"ref":"1.2.1","t":1,"s":"b","q":"以下哪項關於個人意外及疾病保險是不正確的？","qi":[],"qe":"Which of the following is incorrect about personal accident and sickness insurance?","qei":[],"o":[{"z":"個人意外保險是意外保險中首先面世的主要險種","e":"Personal accident insurance was the first major class of accident insurance"},{"z":"個人意外死亡保障權益與人壽保險相同","e":"The insured benefit of death arising from personal accident is the same as life insurance"},{"z":"它主要保障內容是死於意外的整筆權益","e":"Its main scope of cover is the lump sum benefit in the event of death arising from accident"},{"z":"除了整筆權益，也可以提供每週利益","e":"Apart from lump sum benefits, weekly benefits can be provided"}],"a":1,"x":"人身意外保險屬於意外保險中首先面世的主要險種，它起源於早期鐵路上發生的意外事故不斷上升所引發的保險需求。人身意外保險保障三個主要項目:整筆支付的利益、按周計算的利益及醫療費用"},{"id":"B66","ch":1,"ref":"1.2.1(a)","t":1,"s":"b4","q":"根據個人意外保險保單中，每周利益會於以下哪種情況發放？","qi":[],"qe":"According to personal accident insurance policy, weekly benefits will be issued under which of the following circumstances?","qei":[],"o":[{"z":"死亡","e":"Death"},{"z":"醫療開支","e":"Medical expenses"},{"z":"暫時性喪失能力","e":"Temporary disablement"},{"z":"永久喪失能力","e":"Permanent disablement"}],"a":2,"x":"按周計算的利益：這些是針對暫時完全殘疾（傷殘程度達100%者為之「完全殘疾」）或暫時部分殘疾（傷殘程度低於100%）的定期付款。"},{"id":"B67","ch":1,"ref":"1.2.1(a)","t":1,"s":"by","q":"個人意外保險屬於意外保險的首個主要類別，是因應早期以下哪項不斷上升的意外而發展？","qi":[],"qe":"Personal accident insurance was the first major class of accident insurance, originally developed to deal with a demand arising from what kind of accidents?","qei":[],"o":[{"z":"汽車","e":"Cars"},{"z":"鐵路","e":"Railways"},{"z":"船隻","e":"Ships"},{"z":"腳踏車","e":"Bicycles"}],"a":1,"x":"人身意外保險屬於意外保險中首先面世的主要險種，它起源於早期鐵路上發生的意外事故不斷上升所引發的保險需求。"},{"id":"B68","ch":1,"ref":"1.2.1(a)","t":1,"s":"by","q":"個人意外保險提供的保障包括三個標題，分別是：整筆權益(一筆過的款項)、每週利益及","qi":[],"qe":"The policy cover of personal accident insurance include three main headings, namely lump sum benefits, weekly benefits and","qei":[],"o":[{"z":"退休年金","e":"Annuity"},{"z":"牙科護理","e":"Dental care"},{"z":"醫療開支","e":"Medical expenses"},{"z":"住院權益","e":"Hospitalization benefits"}],"a":2,"x":"人身意外保險保障三個主要項目:整筆支付的利益、按周計算的利益及醫療費用"},{"id":"B69","ch":1,"ref":"1.2.1(a)","t":1,"s":"by","q":"標準的個人意外保單所提供保障的三大標題，包括整筆支付的利益、醫療費用及：","qi":[],"qe":"A standard personal accident policy cover may be described under three main headings, including lump sum benefits, medical expenses and:","qei":[],"o":[{"z":"按周計算的利益","e":"Weekly benefits"},{"z":"輔導服務","e":"Counseling services"},{"z":"住院權益","e":"Hospitalization benefits"},{"z":"意外中衣物損毀的財產保險","e":"Property insurance for clothing items damaged in an accident"}],"a":0,"x":"人身意外保險保障三個主要項目:整筆支付的利益、按周計算的利益及醫療費用"},{"id":"B70","ch":1,"ref":"1.2.1(a)(ii)","t":1,"s":"b","q":"個人意外保單中的按周計算的利益，可以在下列哪個情況下提取？","qi":[],"qe":"The weekly benefits of personal accident insurance policy can be withdrawn under which of the following circumstances?","qei":[],"o":[{"z":"暫時喪失全部能力","e":"Total disablement"},{"z":"暫時喪失部分能力","e":"Partial disablement"},{"z":"意外受傷住院期間","e":"During the period of hospitalization after an accident"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"按周計算的利益：這些是針對暫時完全殘疾（傷殘程度達100%者為之「完全殘疾」）或暫時部分殘疾（傷殘程度低於100%）的定期付款。"},{"id":"B71","ch":1,"ref":"1.2.1(a)","t":1,"s":"by","q":"在個人意外及疾病保單中，以下哪一項不屬於保單中的保障範圍？","qi":[],"qe":"In personal accident and sickness insurance policy, which of the following will not be covered?","qei":[],"o":[{"z":"因意外導致死亡或受傷的整筆權益","e":"Lump sum benefits of death or injury caused by an accident"},{"z":"由於暫時性的喪失能力而發放的每週利益","e":"Weekly benefits for temporary disablement"},{"z":"由於意外受傷入院而發放的每日醫療權益","e":"Daily medical benefits for hospitalization due to an accident"},{"z":"因意外受傷而招致的醫療開支","e":"Medical expenses arise from accidental injury"}],"a":2,"x":"人身意外保險保障三個主要項目:整筆支付的利益、按周計算的利益及醫療費用按周計算的利益：這些是針對暫時完全殘疾（傷殘程度達100%者為之「完全殘疾」）或暫時部分殘疾（傷殘程度低於100%）的定期付款。"},{"id":"B72","ch":1,"ref":"1.2.1(a)","t":1,"s":"b34y","q":"以下哪項對人身意外保險的整付利益的描述是正確的？","qi":["利益是「主要保額」的某一百分比","死亡或主要受傷均可取得百份之一百的主要保額","多重受傷的總額可取得多於百分之一百的賠償","對指明損傷及其有關的利益分配往往是在保單訂明的"],"qe":"Which of the following are correct in describing lump sum benefits of personal accident insurance?","qei":["The benefit is calculated as a percentage of \"\"principal sum insured\"\"","Death or major injuries may merit a 100% benefit","The total of multiple injuries may merit more than 100% benefit","The policy specifies the defined injuries and related benefit allocation"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":1,"x":"死亡會得到100%的保險金給付，而指定的主要損傷（比如喪失雙肢體和完全喪失視力等）的任何一項同樣會得到100%的保險金給付。不構成任何上述指定主要損傷的完全永久殘疾也會得到100%的保險金給付。較為輕微的永久性傷害，所得的保險金給付百分率較低，"},{"id":"B73","ch":1,"ref":"1.2.1(a)","t":1,"s":"b","q":"以下哪項不屬於慣常用於人身意外保險的保障範圍？","qi":[],"qe":"Which of the following is not commonly used as cover of personal accident insurance?","qei":[],"o":[{"z":"按周計算的利益","e":"Weekly benefits"},{"z":"醫療費用","e":"Medical expenses"},{"z":"整筆支付利益","e":"Lump sum benefits"},{"z":"住院利益","e":"Hospitalization benefits"}],"a":3,"x":"人身意外保險保障三個主要項目:整筆支付的利益、按周計算的利益及醫療費用"},{"id":"B74","ch":1,"ref":"1.2.1(a)(ii)","t":1,"s":"by","q":"根據個人意外保險保單，按周計算的利益通常以下列哪項情況發放?","qi":[],"qe":"According to personal accident insurance policy, weekly benefits will be issued under which of the following circumstances?","qei":[],"o":[{"z":"死亡","e":"Death"},{"z":"暫時喪失能力","e":"Temporary disablement"},{"z":"醫療開支","e":"Medical expenses"},{"z":"永久喪失能力","e":"Permanent disablement"}],"a":1,"x":"按周計算的利益：這些是針對暫時完全殘疾（傷殘程度達100%者為之「完全殘疾」）或暫時部分殘疾（傷殘程度低於100%）的定期付款。"},{"id":"B75","ch":1,"ref":"1.2.1(a)(ii)","t":1,"s":"b","q":"個人意外保單中的按周計算的利益，可以在下列哪個情況下提取？","qi":[],"qe":"The weekly benefit in a personal accident policy can be withdrawn under which of the following circumstances?","qei":[],"o":[{"z":"完全傷殘","e":"Totally disabled"},{"z":"部份殘疾","e":"partially disabled"},{"z":"死亡或意外死亡","e":"death or accidental death"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"按周計算的利益：這些是針對暫時完全殘疾（傷殘程度達100%者為之「完全殘疾」）或暫時部分殘疾（傷殘程度低於100%）的定期付款。"},{"id":"B76","ch":1,"ref":"1.2.1(b)","t":1,"s":"by","q":"在個人意外保單的「意外身體受傷」的定義為：","qi":[],"qe":"In personal accident insurance, \"\"accidental bodily injury\"\" is defined as:","qei":[],"o":[{"z":"意外及外在的原因引起的","e":"Physical injury from accident or external means"},{"z":"暴力及可見的身體受傷","e":"Physical injury from violent and visible means"},{"z":"單獨及獨立於任何其他原因","e":"Solely and independently of any other cause"},{"z":"符合以上各項的要求","e":"All of the above"}],"a":3,"x":"意外的身體受傷：保單可能規定必須「由意外、外在、暴力及明顯可見的方式純粹地和直接地引起或導致的」等字句。"},{"id":"B77","ch":1,"ref":"1.2.1(b)(v)","t":1,"s":"by","q":"不論是獨立保單形式或是組合保單一部份的保障形式，在個人意外保險中，所包括的一般除外責任較可能包括：","qi":[],"qe":"For personal accident insurance, whether it is in the form of independent policy or combined policy, the general exclusions will include:","qei":[],"o":[{"z":"自殺","e":"Suicide"},{"z":"故意傷害自己身體","e":"Deliberately self-inflicted injury"},{"z":"危險的運動(例如:爬山)","e":"Dangerous sports (e.g. mountaineering)"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"除外責任：基本風險，比如戰爭、叛亂、核風險等。危險活動，例如作為乘客或車手參加賽車，作為專業運動員參與體育運動，及飛行活動（作為付費乘客進行者除外）。違反社會原則的活動，例如自殺、蓄意令自己受傷、酗酒或濫藥（服用由合格醫生開的藥則屬例外）。"},{"id":"B78","ch":1,"ref":"1.2.1(b)(v)","t":1,"s":"b34y","q":"「個人意外」保險需要為下列哪項補償作出賠償？","qi":["自殺","意外死亡","蓄意令自己受傷","爬山引致的傷亡"],"qe":"Which of the following will be covered in \"\"personal accident\"\" insurance?","qei":["Suicide","Accidental death","Deliberately self-inflicted injury","Death or injury caused by mountaineering"],"o":[{"z":"只有i","e":"i only"},{"z":"只有ii","e":"ii only"},{"z":"ii , iv","e":""},{"z":"ii, iii , iv","e":""}],"a":1,"x":"除外責任：基本風險，比如戰爭、叛亂、核風險等。危險活動，例如作為乘客或車手參加賽車，作為專業運動員參與體育運動，及飛行活動（作為付費乘客進行者除外）。違反社會原則的活動，例如自殺、蓄意令自己受傷、酗酒或濫藥（服用由合格醫生開的藥則屬例外）。"},{"id":"B79","ch":1,"ref":"1.2.1(b)(v)","t":1,"s":"b","q":"以下那項不屬於人身意外保險的除外責任？","qi":[],"qe":"Which of the following is not an exclusion of personal accident insurance?","qei":[],"o":[{"z":"自殘身體","e":"Self-inflicted bodily injury"},{"z":"爬山而導致受傷","e":"Injury caused by mountaineering"},{"z":"駕駛小型飛機時，在空中相撞","e":"Collision in air when flying a small airplane"},{"z":"電單車乘客在交通意外中身亡","e":"Death of a motor cycle passenger in a traffic accident"}],"a":3,"x":"除外責任：基本風險，比如戰爭、叛亂、核風險等。危險活動，例如作為乘客或車手參加賽車，作為專業運動員參與體育運動，及飛行活動（作為付費乘客進行者除外）。違反社會原則的活動，例如自殺、蓄意令自己受傷、酗酒或濫藥（服用由合格醫生開的藥則屬例外）。"},{"id":"B80","ch":1,"ref":"1.2.1(b)(v)(3)","t":1,"s":"by","q":"個人意外保險的保障包括：","qi":[],"qe":"The policy cover of personal accident insurance includes:","qei":[],"o":[{"z":"自殺","e":"Suicide"},{"z":"濫用藥物","e":"drug abuse"},{"z":"被搶劫案中的劫匪所槍傷","e":"Gun shot by the thief in a robbery"},{"z":"上述所有各項","e":"All of the above"}],"a":2,"x":"意外的身體受傷：保單可能規定必須「由意外、外在、暴力及明顯可見的方式純粹地和直接地引起或導致的」等字句。"},{"id":"B81","ch":1,"ref":"1.2.1(c)","t":1,"s":"by","q":"釐定意外保險保費的基本因素包括：","qi":[],"qe":"The basic factor in the calculation of premium for accident insurance includes:","qei":[],"o":[{"z":"過往5年的意外數目","e":"Number of accidents in the past 5 years"},{"z":"被保險人的居住地點","e":"Place of residence of the insured"},{"z":"從死亡表中取得","e":"From mortality tables"},{"z":"被保險人的專業職業","e":"Profession of the insured"}],"a":3,"x":"個別的特點（如年齡）可能會影響核保的結果，但根據被保險人的職業計算保費是標準的做法。"},{"id":"B82","ch":1,"ref":"1.2.1(e)(iv)","t":1,"s":"by","q":"個人意外保單：","qi":[],"qe":"Personal accident insurance policies:","qei":[],"o":[{"z":"只能由被保險人才可取消","e":"Can only be cancelled by insured"},{"z":"可能由保險人取消，但這種情況並不常見","e":"May be cancelled by insurer, which is not very often"},{"z":"只能由於被保險人改變職業才可取消","e":"Can only be cancelled when the insured changes profession"},{"z":"不能於保單生效兩年後才取消","e":"Cannot be cancelled after two years of the policy in effect"}],"a":1,"x":"人身意外保單一般為期一年，期滿後是否續保是個相互協議的問題。保單一般包含註銷條款，允許單方面發出訂明通知以中止保單，保費可退。"},{"id":"B83","ch":1,"ref":"1.2.1(e)(v)","t":1,"s":"b4y","q":"在個人意外保單，被保人的年齡：","qi":[],"qe":"For personal accident insurance policies, the age of insured:","qei":[],"o":[{"z":"在同一個保險年齡範圍內並不重要","e":"Is not important if within the same insurable band of ages"},{"z":"直接影響每年保費","e":"Directly affects the annual premium"},{"z":"影響首年保費","e":"Affects the first year premium"},{"z":"是承保人考慮的最重要特點","e":"Is the most important factor considered by insurers"}],"a":0,"x":"雖然保費並非根據受保人的年齡來釐定，但是保單通常指明可保年齡的範圍（例如從 18 歲到 70歲—就成人保險保障而言）。"},{"id":"B84","ch":1,"ref":"1.2.1(e)(iv)","t":1,"s":"b","q":"保險人取消慣常人身意外保單是：","qi":[],"qe":"Generally, insurers cancel a personal accident insurance policy is:","qei":[],"o":[{"z":"不可能的","e":"Impossible"},{"z":"法律所禁止的","e":"prohibited by law"},{"z":"保單條文所禁止的","e":"Prohibited by terms of the policy"},{"z":"可能的","e":"Possible"}],"a":3,"x":"人身意外保單一般為期一年，期滿後是否續保是個相互協議的問題。保單一般包含註銷條款，允許單方面發出訂明通知以中止保單，保費可退。"},{"id":"B85","ch":1,"ref":"1.2.2","t":1,"s":"by","q":"醫療保險的保障範圍包括：","qi":[],"qe":"The cover of medical insurance includes:","qei":[],"o":[{"z":"因意外導致的受傷而已","e":"Injury arising from accident only"},{"z":"因疾病導致的受傷而已","e":"Injury arising from sickness only"},{"z":"因意外或疾病導致的受傷","e":"Injury arising from accident or sickness"},{"z":"以上所有皆不正確","e":"None of the above is correct"}],"a":2,"x":"醫療保險的目的，是要承保由意外事故或疾病引致的醫療費用。"},{"id":"B86","ch":1,"ref":"1.2.2","t":1,"s":"b3y","q":"香港醫療保險機制下，包括以下哪些保障？","qi":[],"qe":"Under the mechanism of medical insurance in Hong Kong, it covers which of the following?","qei":[],"o":[{"z":"因病或意外導致入院","e":"Hospitalization due to sickness or accident"},{"z":"先天性疾病","e":"Congenital conditions"},{"z":"生育控制，節育的支出","e":"Birth control/infertility treatment expense"},{"z":"非必要性手術如整容","e":"non-compulsory operations such as cosmetic surgery"}],"a":0,"x":"醫療保險的目的，是要承保由意外事故或疾病引致的醫療費用。"},{"id":"B87","ch":1,"ref":"1.2.2","t":1,"s":"b","q":"以下哪項會受到醫療保險保單所保障？","qi":[],"qe":"Which of the following will be covered by medical insurance policies?","qei":[],"o":[{"z":"交通意外導致的受傷","e":"Injury arising from traffic accident"},{"z":"不育治療","e":"Infertility treatment"},{"z":"為美容而進行的整容手術","e":"Cosmetic surgery for beauty purpose"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"醫療保險的目的，是要承保由意外事故或疾病引致的醫療費用。"},{"id":"B88","ch":1,"ref":"1.2.2(a)&(b)","t":1,"s":"b","q":"醫療保險保障涵蓋以下哪項？","qi":[],"qe":"The cover of medical insurance includes which of the following?","qei":[],"o":[{"z":"意外或疾病引致的醫療費用","e":"Medical expense arising from accident or sickness"},{"z":"生育或不育有關醫療的開支","e":"Medical expense related to birth or infertility"},{"z":"整容","e":"Cosmetic surgery"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"生育控制/不育治療及整容手術均為醫療保險的特殊除外責任。"},{"id":"B89","ch":1,"ref":"1.2.2(b)","t":1,"s":"b","q":"以下哪項正確描述醫療保險的除外責任？","qi":[],"qe":"Which of the following is correct in describing the exclusions of medical insurance?","qei":[],"o":[{"z":"包括個人意外保單的除外責任","e":"Include exclusions of personal accident insurance policies"},{"z":"包括個人意外保單沒有提供的除外責任","e":"Include exclusions not mentioned in personal accident insurance policies"},{"z":"包括「自願性」醫療開支(例如：整容手術)","e":"Include \"voluntary\" medical expense (e.g. cosmetic surgery)"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"人身意外保單的除外責任及整容手術均為醫療保險的特殊除外責任。"},{"id":"B90","ch":1,"ref":"1.2.2(b)(ii)","t":1,"s":"b","q":"以下哪項是一般在香港簽發的醫療保險保單中的除外責任？","qi":[],"qe":"Which of the following is a general exclusion of the medical insurance policies issued in Hong Kong?","qei":[],"o":[{"z":"整容手術","e":"Cosmetic surgery"},{"z":"事先存在的狀況","e":"Congenital conditions"},{"z":"例行醫療檢查","e":"Routine medical examinations"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"整容手術、(保險生效前)已患的疾病及已存在的殘疾及例行醫療檢查及身體檢查均為醫療保險的特殊除外責任。"},{"id":"B91","ch":1,"ref":"1.2.3","t":1,"s":"b4","q":"自願醫保計劃的目標是:","qi":[],"qe":"The objectives of the Voluntary Health Insurance Scheme are:","qei":[],"o":[{"z":"為巿民更容易獲得個人住院保險，並提升個人住院保險的質素和透明度，自願醫保為願意及有能力使用私營醫療服務的消費者提供一個額外的選擇","e":"To make it easier for people to obtain personal hospital insurance, and to improve the quality and transparency of personal hospital insurance, Voluntary Health Insurance provides an additional option for consumers who are willing and able to use private medical services."},{"z":"自願醫保為一眾基層市民能享受到高端醫療的住院保險計劃","e":"Voluntary Health Insurance is a hospitalization insurance plan that allows grassroots citizens to enjoy high-end medical care."},{"z":"自願醫保為所有市民能享受到高端醫療的住院保險計劃","e":"Voluntary Health Insurance is a hospitalization insurance plan that allows all citizens to enjoy high-end medical care"},{"z":"為巿民更容易獲得更優惠的個人住院保險，自願醫保為願意及有能力使用私營醫療服務的消費者提供一個額外的選擇","e":"It makes it easier for the public to obtain more favorable personal hospitalization insurance, and Voluntary Health Insurance provides an additional option for consumers who are willing and able to use private medical services."}],"a":0,"x":"自願醫保旨在為消費者帶來某些好處。透過令巿民更容易獲得個人住院保險，並提升個人住院保險的質素和透明度，自願醫保為願意及有能力使用私營醫療服務的消費者提供一個額外的選擇。"},{"id":"B92","ch":1,"ref":"1.2.3","t":1,"s":"b","q":"客人為自己，父母，以及祖父母各買一張自願醫保保單，總可扣稅額為？","qi":[],"qe":"If a customer buys a voluntary health insurance policy for himself, his parents and his grandparents, what is the total tax deductible?","qei":[],"o":[{"z":"4萬港幣","e":"HKD $40,000"},{"z":"3萬港幣","e":"HKD $30,000"},{"z":"稅額的20%","e":"20% of tax"},{"z":"8000港幣","e":"HKD $8000"}],"a":0,"x":"外祖父母、父母和兄弟姊妹。不論受保人獲多少張保單承保，每年扣減所涉的保費上限為每名受保人8,000港元，但可申請扣減的指明親屬人數不設上限。"},{"id":"B93","ch":1,"ref":"1.3.1","t":1,"s":"b34","q":"在一般家居保險中，受保範圍包括","qi":["因火災導致財物盜竊損失","因火災導致財物非盜竊損失","賊人從撬窗而入的盜竊損失","逃避火災過程中遺失物件"],"qe":"In general household insurance, the cover includes:","qei":["Loss of property in theft arising from fire","Loss of property not in theft arising from fire","Loss in theft arising from burglar break-in","Loss of belongings in the process of escaping fire"],"o":[{"z":"i, ii","e":""},{"z":"i, ii, iii","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":1,"x":"家居保險主要是提供財產保險，所承保的是屬於被保險人的建築物及／或其內部的物品。同時指明危險中保障必定承保火災，並進而包含火險中大部分（若非所有）可保的附加危險。（附加危險的項目很多，包括風暴／旋風、地震、爆炸、動物／被汽車碰撞等）。除此之外，盜竊引起的損失或損害也包括在內。"},{"id":"B94","ch":1,"ref":"1.3.1","t":1,"s":"b5","q":"一般的家居保險單，會提供下列哪項的保障？","qi":[],"qe":"A general household insurance policy provides which of the following cover?","qei":[],"o":[{"z":"財產保障","e":"Property cover"},{"z":"若干的責任保障","e":"Certain liability cover"},{"z":"若干的經濟權益保障","e":"Certain pecuniary benefit cover"},{"z":"上述所有各項","e":"All of the above"}],"a":3,"x":"一般家居保險單包括承保被保險人的建築物及/或其內部的物品經濟權益保險、作為身處香港任何地方的私人，向第三者承擔的法律責任。"},{"id":"B95","ch":1,"ref":"1.3.1","t":1,"s":"b","q":"家居保險為下列哪項提供保障？","qi":["個人意外權益","財產保障","經濟權益","責任保障"],"qe":"Household insurance provides cover for which of the following?","qei":["Personal accident benefit","Property cover","Pecuniary benefit","Liability cover"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, iii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":3,"x":"四項均為家居保險之保障範圍。"},{"id":"B96","ch":1,"ref":"1.3.1","t":1,"s":"by","q":"家居保險一般是由下列哪個保險部簽發的？","qi":[],"qe":"Household insurance is usually issued by which of the following insurance department?","qei":[],"o":[{"z":"火險","e":"Fire insurance"},{"z":"意外保險","e":"Accident insurance"},{"z":"汽車保險","e":"Motor insurance"},{"z":"人壽及健康保險","e":"Life and health insurance"}],"a":0,"x":"家居保險是私人保險(有時稱為個人或私人險種)中的主要成員，很多保險公司是透過其火險部門或財產保險部門來承保這項業務的。"},{"id":"B97","ch":1,"ref":"1.3.1(a)","t":1,"s":"b4y","q":"家居保險的主要保障範圍是：","qi":[],"qe":"The cover of household insurance mainly includes:","qei":[],"o":[{"z":"建築物及/或家居物件","e":"Buildings and/or household items"},{"z":"向第三者承擔的法律責任","e":"Third party legal liability"},{"z":"由受保危險引致的額外損失或另覓住宿開支","e":"Additional loss or alternative accommodation cost arising from insured peril"},{"z":"人身意外的保障","e":"Personal accident cover"}],"a":0,"x":"家居保險主要是提供財產保險，所承保的是屬於被保險人的建築物及／或其內部的物品。"},{"id":"B98","ch":1,"ref":"1.3.1(a)","t":1,"s":"by","q":"住宅物業的業主及住客較可能投保以下哪類保單？","qi":[],"qe":"The landlord and tenant of residential property are more likely to purchase which of the following policies?","qei":[],"o":[{"z":"火險保單而已","e":"Fire insurance only"},{"z":"家居物件保單而已","e":"Household contents policy only"},{"z":"建築物保單","e":"Buildings policy"},{"z":"建築物及家居物件保單","e":"Buildings and contents policy"}],"a":3,"x":"業主及租客將選擇建築物及家居物件保險保障 -建築物(業主:大廈結構)及家居物件(租客)。"},{"id":"B99","ch":1,"ref":"1.3.1(a)(i)","t":1,"s":"b","q":"保障家居物件的保險較適合：","qi":[],"qe":"The insurance that covers household contents are more suitable for:","qei":[],"o":[{"z":"按揭人的銀行","e":"Bank of mortgager"},{"z":"房東","e":"Landlord"},{"z":"租客","e":"Tenant"},{"z":"業主或住客","e":"Landlord or tenant"}],"a":2,"x":"租客相對選擇為家居財物提供保障。"},{"id":"B100","ch":1,"ref":"1.3.1(a)(i)","t":1,"s":"b3y","q":"只就物業的損失或損毀提供保障的家居保單適合：","qi":[],"qe":"The household policy that only covers the loss or damage of the buildings is more suitable for:","qei":[],"o":[{"z":"租客","e":"Tenant"},{"z":"房東","e":"Landlord"},{"z":"業主及住客","e":"Owner and tenant"},{"z":"擔任該物業按揭的銀行","e":"The bank where the property is mortgaged"}],"a":1,"x":"業主//房東將選擇建築物(大廈結構)之保險保障。"},{"id":"B101","ch":1,"ref":"1.3.1(a)(1)","t":1,"s":"b4y","q":"以下哪項屬於家居保險保單中的指明危險？","qi":[],"qe":"Which of the following is a specified peril of household insurance policies?","qei":[],"o":[{"z":"火災造成的損失；","e":"Loss arising from fire"},{"z":"盜竊造成的損失；","e":"Loss arising from theft"},{"z":"颱風造成的損失；","e":"Loss arising from typhoon"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"家居保險主要是提供財產保險，所承保的是屬於被保險人的建築物及／或其內部的物品。同時指明危險中保障必定承保火災，並進而包含火險中大部分（若非所有）可保的附加危險。（附加危險的項目很多，包括風暴／旋風、地震、爆炸、動物／被汽車碰撞等）。除此之外，盜竊引起的損失或損害也包括在內。"},{"id":"B102","ch":1,"ref":"1.3.1(b)","t":1,"s":"by","q":"以下哪項不屬於家居保險的保障範圍？","qi":[],"qe":"Which of the following is not under the cover of household insurance?","qei":[],"o":[{"z":"火災","e":"Fire"},{"z":"暴亂","e":"Riot"},{"z":"爆炸","e":"Explosion"},{"z":"失竊","e":"Theft"}],"a":1,"x":"戰爭、暴亂及類似風險屬除外責任。"},{"id":"B103","ch":1,"ref":"1.3.1(b)(iv)","t":1,"s":"by","q":"一個物業在特定期間內空置，家居保單通常會暫停提供保障。這段期間為:","qi":[],"qe":"Household policies usually suspend cover if the premises are unoccupied for a period of time. This period is:","qei":[],"o":[{"z":"48小時","e":"48 hours"},{"z":"1星期","e":"1 week"},{"z":"30天","e":"30 days"},{"z":"60天","e":"60 days"}],"a":2,"x":"有關處所連續空置超過比如 30天，保單通常會暫停承保盜竊和洗衣機等漏水。其實，家居保險單一般規定，被保險人必須就超過比如 30天的可預見空置期，向保險人發出書面通知。"},{"id":"B104","ch":1,"ref":"1.3.1(b)(vi)","t":1,"s":"by","q":"如果投保額一百萬，而實際價值是二百萬，但真正損失是一百萬，賠償額應該是：","qi":[],"qe":"If the sum insured is HK$1 million and the actual value is HK$2 million, but the actual loss is HK$1 million. The claim payment will be:","qei":[],"o":[{"z":"一百萬","e":"HK$1 million"},{"z":"二百萬","e":"HK$2 million"},{"z":"因投保不足，故不作賠償作為懲罰","e":"As the sum insured is insufficient, there will be no claim payment as penalty"},{"z":"五十萬(計算比例分攤)","e":"HK$500,000 (pro rata average)"}],"a":3,"x":"當保費是按照由被保險人自選的保額計算時，保單條款中會包括一項比例分攤條件，規定如果損失發生時出現了不足額保險的情況，被保險人就不會就全數損失獲得保障。為價值200萬的物件投保100萬是物件的50%價值，所以賠償時只會獲得損失總額的50%。"},{"id":"B105","ch":1,"ref":"1.3.3","t":1,"s":"b","q":"旅遊保險通常歸類於：","qi":[],"qe":"Travel insurance usually belongs to:","qei":[],"o":[{"z":"指明保險","e":"Specified insurance"},{"z":"渡假保險","e":"Holiday insurance"},{"z":"「全險」","e":"\"\"All risks\"\""},{"z":"一籃子保單","e":"Package policy"}],"a":3,"x":"旅遊保險單視為了有多年歷史的「一籃子」保單。"},{"id":"B106","ch":1,"ref":"1.3.3(a)","t":1,"s":"by","q":"以下哪項屬旅遊保險所保障的範圍？","qi":[],"qe":"Which of the following is a cover of travel insurance?","qei":[],"o":[{"z":"投保人自殺","e":"Suicide of insured"},{"z":"使用汽車時所引致的責任","e":"Liability arising from using motor vehicle"},{"z":"於酒店酒吧中因損壞財物引致的責任","e":"Liability of property damage in the hotel pub"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"旅遊保險保障行李及個人財物丟失/受損害，而自殺及使用汽車均不是保障範圍內。"},{"id":"B107","ch":1,"ref":"1.3.3(a)","t":1,"s":"by","q":"在本港簽發的旅遊保單中，以下哪種情況較可能/或會得到保障？","qi":[],"qe":"For travel insurance policies issued in Hong Kong, which of the following circumstances will be more likely to be covered?","qei":[],"o":[{"z":"乘飛機時導致行李遺失","e":"Loss of luggage when traveling by plane"},{"z":"旅遊期間治療胃病的醫療開支","e":"Medical expense on stomach treatment during travel"},{"z":"旅遊期間因盜賊行劫導致的財物損失","e":"Loss of property arising from robbery during travel"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"旅遊保險保障行李及個人財物丟失/受損害及醫療費用及住院保險利益。"},{"id":"B108","ch":1,"ref":"1.3.3(a)","t":1,"s":"b","q":"一般在香港簽發的旅遊保險單，以下哪項較不可能得到保障？","qi":[],"qe":"For travel insurance policies generally issued in Hong Kong, which of the following circumstances will be unlikely to be covered?","qei":[],"o":[{"z":"自然死亡","e":"Natural death"},{"z":"個人公眾責任","e":"Personal public liability"},{"z":"個人行李的遺失及偷竊","e":"Loss and theft of personal luggage"},{"z":"由意外所引起的醫療費用","e":"Medical expense arising from accident"}],"a":0,"x":"自然死亡不是保障範圍內。"},{"id":"B109","ch":1,"ref":"1.3.3(a)","t":1,"s":"by","q":"下列哪項是旅遊保險的保障範圍？","qi":["醫療開支","損失訂金","公眾責任保障","送返開支"],"qe":"Which of the following is covered in travel insurance?","qei":["Medical expenses","Loss of deposit","Public liability cover","Repatriation expenses"],"o":[{"z":"i & iii","e":""},{"z":"i & ii","e":""},{"z":"以上全部正確","e":"All of the above"},{"z":"以上全部不正確","e":"None of the above"}],"a":2,"x":"旅遊保險保障醫療費用及住院保險利益、個人責任及緊急服務。"},{"id":"B110","ch":1,"ref":"1.3.3(b)","t":1,"s":"by","q":"以下哪項較可能是一般於香港簽發的旅遊保險的除外責任？","qi":[],"qe":"Which of the following is likely to be an exclusion for travel insurance issued in Hong Kong?","qei":[],"o":[{"z":"被保險人於空中撞機身亡","e":"Death of insured in a plane crash"},{"z":"被保險人於渡假時自殺身亡","e":"The insured commits suicide during holiday"},{"z":"被保險人的行李於酒店房間遭盜竊","e":"Theft of insured's luggage in a hotel room"},{"z":"被保險人於渡假期間失足墮下所引起的醫療開支","e":"Medical expense arising from a fall of insured during holiday"}],"a":1,"x":"自然死亡不是保障範圍內。"},{"id":"B111","ch":1,"ref":"1.3.4(b)","t":1,"s":"b3y","q":"以下哪項很可能不屬於責任保險組合保單的範圍？","qi":[],"qe":"Which of the following is likely not a cover for combined liability policy?","qei":[],"o":[{"z":"公眾責任","e":"Public liability"},{"z":"產品責任","e":"Products liability"},{"z":"汽車責任","e":"Vehicles liability"},{"z":"僱員補償責任","e":"Employees' compensation liability"}],"a":2,"x":"責任保險組合保單通常在一份文件內提供公衆責任、產品責任和僱員補償等三種障。個別客戶也可能需要董事及高級管理人員責任及/或專業責任保險保障。"},{"id":"B112","ch":1,"ref":"1.3.3(c)","t":1,"s":"b4y","q":"以下哪項不是旅遊保險的保費計算考慮因素?","qi":[],"qe":"Which of the following is not a factor to be considered when calculating the premium of travel insurance?","qei":[],"o":[{"z":"旅遊目的地區範圍","e":"Geographical area of travel destination"},{"z":"旅遊日數","e":"Duration"},{"z":"被保險人的性別(男性 / 女性)","e":"gender of insured (male/female)"},{"z":"同行人數","e":"Number of people accompanied"}],"a":2,"x":"旅遊保險釐定保費的根據:地域範圍、持續時間、受保人數目及年度保單。"},{"id":"B113","ch":1,"ref":"1.3.3(d)(ii)","t":1,"s":"b","q":"旅遊保險的「總保險單」相當可能與以下哪項有關？","qi":[],"qe":"A \"\"Master Policy\"\" in travel insurance is likely with:","qei":[],"o":[{"z":"一個大的個別保額","e":"A high individual sum insured"},{"z":"高級行政人員的保險","e":"Insurance of a senior executive"},{"z":"旅遊代理人提供的「度假套餐」有關","e":"A travel agent offering ¡¥package holidays¡¦"},{"z":"海上旅遊的保險","e":"Insurance connected with travelling by sea"}],"a":2,"x":"「總保單」：向很多安排度假「套餐」的旅行代理商簽發「總保單」是一種頗為普遍的做法，而個別客戶只會收到一張略述主要保險條文的保險憑證。"},{"id":"B114","ch":1,"ref":"1.3.3(d)(i)","t":1,"s":"b","q":"保險人對旅遊保單的核保：","qi":[],"qe":"The underwriting of travel insurance by insurers:","qei":[],"o":[{"z":"必須很徹底，因為受保範圍較廣","e":"Must be very thorough, because of wider coverage"},{"z":"至少比個人意外保險的核保徹底","e":"At least more thorough than personal accident insurance"},{"z":"甚少出現個別的風險核保","e":"There are little individual underwriting risks"},{"z":"與人壽保險的準則相符","e":"With the same standards as life insurance"}],"a":2,"x":"旅遊保險的特點是盡量將一切都簡單化，因為人們通常在最後關頭才去投保，而且不能做到「用家方便」的產品很難在這種大型的市場中取得成功。所以，甚少對風險個別地進行核保。"},{"id":"B115","ch":1,"ref":"1.3.4","t":1,"s":"by","q":"以下哪項對於商業組合保單的描述是正確的：","qi":[],"qe":"Which of the following is correct in describing commercial combined policies:","qei":[],"o":[{"z":"流行程度頗低","e":"They are not popular"},{"z":"市場上極為罕見","e":"They are rare in the market"},{"z":"在法律上是禁止的","e":"They are prohibited by law"},{"z":"目前已較普遍","e":"The are more popular now"}],"a":3,"x":"商業組合保單可以是度身訂造保單，包括提供公衆責任、產品責任和僱員補償等三種保障，現時這類保障已較普遍。"},{"id":"B116","ch":1,"ref":"1.3.4","t":1,"s":"by","q":"商業保險組合的保險範圍包括：","qi":[],"qe":"The area of commercial combined policies includes:","qei":[],"o":[{"z":"財產保險的保障","e":"Cover for property insurance"},{"z":"經濟權益保險的保障","e":"Cover for pecuniary insurance"},{"z":"責任保險的保障","e":"Cover for liability insurance"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"這類保障可以包括任何類型的保障，包括財產、經濟權益及責任風險。"},{"id":"B117","ch":1,"ref":"1.3.4","t":1,"s":"b4y","q":"以下哪項屬於商業保險組合保單的特點？","qi":[],"qe":"Which of the following is a feature of commercial combined policies?","qei":[],"o":[{"z":"它通常以「全險」形式為財產提供保障","e":"Usually offers cover on an \"\"all risks\"\" basis for property"},{"z":"它可以在保費上累積一定的減省","e":"It can accumulate certain savings on premiums"},{"z":"它在文件上提供一定程度上的方便","e":"It provides certain level of convenience on documentation"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"這種保單傾向於提供「全險」保險保障，在同一張保單下提供實物損害和營業中斷保障，通常在一份文件內提供公衆責任、產品責任和僱員補償等三種保障。個別客戶也可能需要董事及高級管理人員責任及／或專業責任保險保障。同時被保險人共同追求的不僅是一份保單就能提供多種保險保障的方便，還期望能整體上節省保費。"},{"id":"B118","ch":1,"ref":"1.3.4(a)","t":1,"s":"b35","q":"包含財產及經濟權益保障的商業組合保單，通常用以下哪項形式提供財產保險保障？","qi":[],"qe":"Commercial combined policy, covering property and pecuniary insurance, usually provides prope
