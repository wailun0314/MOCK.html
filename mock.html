:1,"s":"by","q":"以下哪項關於「海損」的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing \"\"\"\"average\"\"?","qei":[],"o":[{"z":"它的意思是部分損失而非全部","e":"It means partial but not total loss"},{"z":"它通常與不足額保險有關","e":"It usually involves under-insurance"},{"z":"「共同海損」代表分擔出現的損失","e":"\"\"General average\"\" means sharing the loss occurred"},{"z":"「單獨海損」是指船体或貨物某部份招致損失","e":"\"\"Particular average\"\" means loss of hull or part of the cargo"}],"a":1,"x":"財產保險合約「適用比例分攤」，意思是說，必須全額投保，否則須按發生損失時投保不足的比例分攤損失，以作懲罰。在水險中，“Average”是指部分損失（即非全損）。"},{"id":"B269","ch":1,"ref":"1.7(a)","t":1,"s":"b34","q":"「單獨海損」是:","qi":[],"qe":"\"Particular Average\" is:","qei":[],"o":[{"z":"一種在水險出現非全損","e":"An incomplete loss in marine insurance"},{"z":"一種在火險出現和投保額不足有關","e":"A type of fire insurance related to underinsured amount"},{"z":"一種計算保費的統計術語","e":"a statistical term for calculating insurance premiums"},{"z":"普遍用在各種保險","e":"Commonly used in various insurances"}],"a":0,"x":"單獨海損是影響有關保險標的的部分損失。"},{"id":"B270","ch":1,"ref":"1.7(a)","t":1,"s":"b","q":"有關水險中的「海損」，一般分為兩種，一種是「共同海損」，而另一種是：","qi":[],"qe":"Generally there are two types of \"\"average\"\" in marine insurance, one is \"\"general average\"\", the other is:","qei":[],"o":[{"z":"特定海損","e":"Specified average"},{"z":"單獨海損","e":"Particular average"},{"z":"特殊海損條件","e":"Special average condition"},{"z":"海損的比例計算條件","e":"Pro rata calculation condition for average"}],"a":1,"x":"海損為單獨海損及共同海損。"},{"id":"B271","ch":1,"ref":"1.7(a)","t":1,"s":"b5","q":"「共同海損」是","qi":[],"qe":"\"General Average\" is:","qei":[],"o":[{"z":"一個古老慣例去公平地分擔某些損失","e":"an ancient practice to equitably share certain losses"},{"z":"一個古老慣例要求所有保險人去同等支付","e":"An ancient practice requires all insurers to pay equally"},{"z":"保單條款要求被保險人承擔一部份損失","e":"Policy provisions require the insured to bear a portion of the loss"},{"z":"一個海上相撞分擔過失的機制","e":"A mechanism for sharing fault in collisions at sea"}],"a":0,"x":"共同海損損失是由共同海損行為引起的部分損失（所謂「部分損失」是指整個海上冒險〔即某艘船的某段航程所涉及的權益的總和，尤其包括船隻本身及船上所載任何貨品〕的部分損失）。凡發生共同海損損失，蒙受損失的一方有權在海商法施加的條件的規限下，從被該行為惠及的具有權益的每一個人，包括他自己，按比率獲得分擔損失（稱為「共同海損分擔」）。"},{"id":"B272","ch":1,"ref":"1.7(a)(i)","t":1,"s":"by","q":"在海上船險中，以下哪項屬於單獨海損？","qi":[],"qe":"For marine shipwreck, which of the following is particular average?","qei":[],"o":[{"z":"因船隻相撞造成的輕微損毀","e":"Slight damage caused by collision of ships"},{"z":"因盜竊而損失的貨運物品","e":"Loss of cargo arising from theft"},{"z":"因漏電失火令導向舵損毀","e":"Damage of steering wheel due to fire caused by short circuit"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"單獨海損是影響有關保險標的的部分損失。"},{"id":"B273","ch":1,"ref":"1.7(a)(ii)","t":1,"s":"b","q":"以下哪項對共同海損的描述是正確的？","qi":["有關損失必須是故意發生的","所作犧牲必須達致本身期望的目標","有關損失由所有整體冒險業務的既得利益者分擔","有關損失由犧牲貨物的物主以外所有既得益者分擔"],"qe":"Which of the following is a correct description of the general average?","qei":["The loss must be intentional","The sacrifices must be made to achieve the desired goal","The losses are shared among all vested interests in the overall venture business","The loss is shared by all vested beneficiaries other than the owner of the sacrificed goods\""],"o":[{"z":"i & ii","e":""},{"z":"ii & iii","e":""},{"z":"i, ii & iii","e":""},{"z":"i, ii, iii & iv","e":""}],"a":2,"x":"凡在發生危險時，為了保存共同冒險中陷於危險中的財產而自願和合理地作出或招致任何特殊犧牲或費用，屬於共同海損行為。凡發生共同海損損失，蒙受損失的一方有權在海商法施加的條件的規限下，從被該行為惠及的具有權益的每一個人，包括他自己，按比率獲得分擔損失（稱為「共同海損分擔」）。"},{"id":"B274","ch":1,"ref":"1.7(a)(ii)","t":1,"s":"b45y","q":"以下哪項對共同海損的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing general average?","qei":[],"o":[{"z":"當整體冒險事業出現危機時出現","e":"Occurs when there is a crisis in the entire adventure business"},{"z":"整體事業最終是得救的","e":"The entire business will be saved eventually"},{"z":"本質上不屬於犧牲的","e":"Not sacrifice in nature"},{"z":"出現損失時必須共同承擔","e":"Must share when there is a loss"}],"a":2,"x":"凡在發生危險時，為了保存共同冒險中陷於危險中的財產而自願和合理地作出或招致任何特殊犧牲或費用，屬於共同海損行為。"},{"id":"B275","ch":1,"ref":"1.7(a)(ii)","t":1,"s":"b","q":"為了犧牲而成功挽救冒險事業，而損失者可以向其他利益代表索取分擔出現的損失。這個慣例稱為：","qi":[],"qe":"Saving the adventure business by sacrifice, the party with loss can seek for contribution from the parties interested. This practice is called:","qei":[],"o":[{"z":"分攤","e":"Contribution"},{"z":"代位權","e":"Subrogation"},{"z":"共同海損","e":"General average"},{"z":"按比例海損","e":"Pro rata average"}],"a":2,"x":"凡在發生危險時，為了保存共同冒險中陷於危險中的財產而自願和合理地作出或招致任何特殊犧牲或費用，屬於共同海損行為。"},{"id":"B276","ch":1,"ref":"1.7(d)","t":1,"s":"by","q":"在水險保單中，下列哪三個構成損失的原因不是推定全損而是實際全損？","qi":["船隻被火災完全摧毀","船隻在風暴中消失","船隻被盜且不能找回","船隻嚴重損毀在經濟角度上而言不值得維修"],"qe":"For marine insurance policies, which 3 of the following reasons for the loss are not constructive loss but actual total loss?","qei":["The ship is completely destroyed by fire","The ship vanishes in a storm","The ship is stolen and cannot be recovered","The ship is severely damaged and uneconomical to repair"],"o":[{"z":"i, ii, iii","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, iii, iv","e":""},{"z":"i, ii, iv","e":""}],"a":0,"x":"保險標的被毀掉、保險標的遭損壞的程度使其不再屬受保類別的物品或被保險人已在無法挽回的情況下失去該保險標的為實際全損。"},{"id":"B277","ch":1,"ref":"1.7(g)","t":1,"s":"b4y","q":"以下哪項對船東保賠組織的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing Protection and Indemnity Associations?","qei":[],"o":[{"z":"主要是為船體碰撞的責任負責","e":"Mainly responsible for the liability of collision of ships"},{"z":"提供代表船東運作的自保計劃","e":"Provides self-insurance plans representing the operation of shipowners"},{"z":"屬於相互賠償社的組織","e":"Belongs to mutual compensation organizations"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"船東保賠組織成立的目的是向本身的會員船東提供某些不易從商業保險人（或牟利保險人）那裏購得的保險，屬於自保計劃/相互賠償社的例子。"},{"id":"B278","ch":1,"ref":"1.7(g)","t":1,"s":"b3y","q":"船東保賠組織是一個：","qi":[],"qe":"Protection and Indemnity Associations are:","qei":[],"o":[{"z":"註冊的慈善機構","e":"Registered charity organizations"},{"z":"獨資貿易商的組織","e":"Independently financed trading organizations"},{"z":"相互賠償社","e":"Mutual compensation organizations"},{"z":"專利(合股)公司","e":"Patented (partnership) companies"}],"a":2,"x":"船東保賠組織成立的目的是向本身的會員船東提供某些不易從商業保險人（或牟利保險人）那裏購得的保險，屬於自保計劃/相互賠償社的例子。"},{"id":"B279","ch":1,"ref":"1.7(g)","t":1,"s":"by","q":"在水險的責任風險保險：","qi":[],"qe":"The liability insurance of marine insurance:","qei":[],"o":[{"z":"通常包括在水險保單","e":"Is usually included in marine insurance policy"},{"z":"是不會出現在水險保單","e":"Will not appear in a marine insurance policy"},{"z":"是法律強制性的要求","e":"Is a mandatory statutory requirement"},{"z":"大部份是由船東保賠組織提供保障","e":"Mostly provided by Protection and Indemnity Associations"}],"a":3,"x":"船東保賠組織成立的目的是向本身的會員船東提供某些不易從商業保險人（或牟利保險人）那裏購得的保險，屬於自保計劃/相互賠償社的例子。"},{"id":"B280","ch":1,"ref":"1.7(h)","t":1,"s":"by","q":"「協會條款」在水險中是以編號條款形式構成一套公認的合約用詞，這協會是：","qi":[],"qe":"\"\"Institute Clauses\"\" in marine insurance form a recognized policy wording in the form of numbered terms. This institute is:","qei":[],"o":[{"z":"美國保險人協會","e":"Institute of American Underwriters"},{"z":"倫敦保險人協會","e":"Institute of London Underwriters"},{"z":"香港保險人協會","e":"Institute of Hong Kong Underwriters"},{"z":"水險保險人協會","e":"Institute of Marine Insurers"}],"a":1,"x":"倫敦保險人協會條款在國際水險業中聲譽卓著，是被公認的保單措詞，並且幾乎被全球所有的保險人、銀行和有利害關係的機構所採納使用。"},{"id":"B281","ch":1,"ref":"1.7.1(a)","t":1,"s":"b","q":"對於海上貨物保險，以下哪項的保障陳述是正確的？","qi":[],"qe":"Which of the following is correct in describing marine cargo insurance?","qei":[],"o":[{"z":"包括共同海損，而不包括救助費用","e":"Includes general average but not salvage charges"},{"z":"包括救助費用，而不包括共同海損","e":"Includes salvage charges but not general average"},{"z":"共同海損及救助費用均為保障範圍","e":"Covers both general average and salvage charges"},{"z":"共同海損及救助費用均不屬保障範圍","e":"Do not cover general average and salvage charges"}],"a":2,"x":"共同海損及救助費用均為保障範圍。"},{"id":"B282","ch":1,"ref":"1.7.1(a)","t":1,"s":"by","q":"在貨物條款的保障下，「倉至倉」的保障形式是：","qi":[],"qe":"Under the cover of Institute Cargo Clauses, the cover of \"\"warehouse to warehouse\"\" is:","qei":[],"o":[{"z":"只涉及陸路的運送","e":"Involved with land transits only"},{"z":"只涉及水路上的運送","e":"Involved with sea transits only"},{"z":"全個運送過程，包括陸路及水路上的運送","e":"The entire transportation process, including land and sea transits"},{"z":"只包括由港口運抵貨倉途中的運送","e":"Includes transit from the harbour to the warehouse only"}],"a":2,"x":"海上貨物保險保障大多數是「倉至倉」的保障，意思是保險保障自貨物離開發貨人的倉庫時開始，直至到達最終存放目的地時完結。這幾乎一定會同時涉及陸路和水上的運送。"},{"id":"B283","ch":1,"ref":"1.7.1(a)(i)","t":1,"s":"by","q":"以下哪項在水險中提供最廣闊的保障範圍？","qi":[],"qe":"Which of the following provides the widest scope of cover for marine insurance?","qei":[],"o":[{"z":"約定價值保單","e":"Agreed values policy"},{"z":"協會貨物條款A","e":"Institute Cargo Clauses (A)"},{"z":"協會貨物條款B","e":"Institute Cargo Clauses (B)"},{"z":"協會貨物條款C","e":"Institute Cargo Clauses (C)"}],"a":1,"x":"協會貨物條款A(ICC(A))：有關的本身損害保險保障是「全險」的，很多時候這是就付運的貨物提供貸款或保證的銀行唯一可以接納的保險保障。"},{"id":"B284","ch":1,"ref":"1.7.1","t":1,"s":"b","q":"海上貨物保險的保障範圍？","qi":[],"qe":"What is the coverage of marine cargo insurance?","qei":[],"o":[{"z":"只可以水路上的","e":"Only available on waterways"},{"z":"只可以陸路上的","e":"Only by land"},{"z":"水路陸路都可以，水路到貨艙之間","e":"It can be done by water or land, between the waterway and the cargo hold"},{"z":"貨倉到貨倉之間","e":"From warehouse to warehouse"}],"a":3,"x":"海上貨物保險保障大多數是「倉至倉」的保障，意思是保險保障自貨物離開發貨人的倉庫時開始，直至到達最終存放目的地時完結。這幾乎一定會同時涉及陸路和水上的運送。"},{"id":"B285","ch":1,"ref":"1.7.1(a)(i)","t":1,"s":"by","q":"下列哪三種水險，是以「特定危險」為根據？","qi":["貨物條款A","貨物條款B","貨物條款C","遊艇條款保險"],"qe":"Which 3 of the following marine insurance are based on specified risks?","qei":["Institute Cargo Clauses (A)","Institute Cargo Clauses (B)","Institute Cargo Clauses (C)","Yacht Clauses insurance"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii , iv","e":""}],"a":2,"x":"協會貨物條款A(ICC(A))：有關的本身損害保險保障是「全險」的，很多時候這是就付運的貨物提供貸款或保證的銀行唯一可以接納的保險保障，而其他條款則以特定危險為根據。"},{"id":"B286","ch":1,"ref":"1.7.1(a)/(d)","t":1,"s":"b5y","q":"協會貨物條款(A)是以「全險」作為根據，以下哪項是會得到保障？","qi":[],"qe":"Institute Cargo Clauses (A) is based on all risks, which one or more of the following perils is/are likely to be covered?","qei":[],"o":[{"z":"在火災中被燒的貨物","e":"Cargo damaged in a fire"},{"z":"在運送途中被盜竊的貨物","e":"Theft of cargo in transit"},{"z":"在航行中，被大浪捲走的貨物","e":"Loss of cargo in the waves during shipment"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"所有情況均為保障範圍內。"},{"id":"B287","ch":1,"ref":"1.7.1(a)(i)","t":1,"s":"b","q":"以下哪項海上保險是以「全險」型式發出的？","qi":["船體保險","協會貨物條款A","協會貨物條款B","遊艇保險"],"qe":"Which of the following marine insurance is issued on an all risks basis?","qei":["Hull insurance","Institute Cargo Clauses(A)","Institute Cargo Clauses(B)","Pleasure craft insurance"],"o":[{"z":"只有 ii","e":"Only ii"},{"z":"i, ii","e":""},{"z":"ii, iii","e":""},{"z":"i, ii, iii, iv","e":""}],"a":0,"x":"協會貨物條款A(ICC(A))：有關的本身損害保險保障是「全險」的，很多時候這是就付運的貨物提供貸款或保證的銀行唯一可以接納的保險保障，而其他條款則以特定危險為根據。"},{"id":"B288","ch":1,"ref":"1.7.2(a)","t":1,"s":"b","q":"以下哪項是海洋船體保險的保障範圍的標準特點?","qi":["損害防止的開支","共同海損及救助費用","保障船主所承受的一切責任風險","保障範圍包括船隻整體及設備的損失及損毀"],"qe":"Which of the following are the standard features of cover for marine hull insurance?","qei":["Sue and labour charges","General average and salvage charges","Cover for all liability risks of shipowners","Cover includes loss and damage of entire hull and its equipment"],"o":[{"z":"i, ii","e":""},{"z":"ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":2,"x":"「財產損害」、共同海損和救助費用、損害防止費用及碰撞責任(保單只負責該等法律責任的 75%)為保障範圍內。"},{"id":"B289","ch":1,"ref":"1.7.2(a)(i)","t":1,"s":"b","q":"在船體保險中的定值保險的保障包括：","qi":[],"qe":"In hull insurance, the cover for valued insurance includes:","qei":[],"o":[{"z":"只當在全損的情況下提供賠償","e":"Provides cover only when total loss happens"},{"z":"只賠償部份損失","e":"Compensates part of the loss only"},{"z":"這種保單沒有保額","e":"There is no insured sum for this policy"},{"z":"賠償時不需扣減損耗","e":"Claims are payable without deduction for wear and tear"}],"a":3,"x":"賠償是按照以新代舊(new forold)的原則作出的，即不就損耗及折舊作扣減。"},{"id":"B290","ch":1,"ref":"1.7.2(a)(iv)","t":1,"s":"by","q":"在船體碰撞責任作面，以下哪個機構會提供最大的責任保障？","qi":[],"qe":"In terms of hull collision liability, which of the following organizations may provide the biggest liability cover?","qei":[],"o":[{"z":"船東保賠組織","e":"Protection and Indemnity Associations"},{"z":"有關之保險人","e":"Related insurers"},{"z":"倫敦保險人協會","e":"Institute of London Underwriters"},{"z":"負責處理之保險代理人","e":"Insurance agent responsible for the handling"}],"a":1,"x":"「財產損害」、共同海損和救助費用、損害防止費用及碰撞責任(保單/保險人只負責該等法律責任的75%)為保障範圍內。"},{"id":"B291","ch":1,"ref":"1.7.2(a)(iv)","t":1,"s":"by","q":"在船體保險中，保單只負責碰撞責任的：","qi":[],"qe":"In hull insurance, the policy only covers collision liability:","qei":[],"o":[{"z":"0.9","e":""},{"z":"0.1","e":""},{"z":"0.25","e":""},{"z":"0.75","e":""}],"a":3,"x":"「財產損害」、共同海損和救助費用、損害防止費用及碰撞責任(保單/保險人只負責該等法律責任的75%)為保障範圍內。"},{"id":"B292","ch":1,"ref":"1.7.2(b)(ii)","t":1,"s":"by","q":"船體保險中的免賠額是：","qi":[],"qe":"The deductible in hull insurance is:","qei":[],"o":[{"z":"約束著部份海損索償","e":"Restricts partial loss claims"},{"z":"約束著全部損失的索償","e":"Restricts total loss claims"},{"z":"約束著部份海損及全部損失的索償","e":"Restricts partial loss and total loss claims"},{"z":"部份海損及全部損失都不受約束","e":"Partial loss and total loss claims are not restricted"}],"a":0,"x":"免賠額就部分損失而非全損索償設定了免賠額，這與其他險種的做法有所不同。"},{"id":"B293","ch":1,"ref":"1.7.2(c)","t":1,"s":"by","q":"海洋船體保險保費的釐定是根據：","qi":[],"qe":"The premium basis for marine hull insurance is:","qei":[],"o":[{"z":"船上貨物的價值","e":"Cargo value of the ship"},{"z":"被保險人的索償經驗","e":"Claims experience of the insured"},{"z":"船東的年齡","e":"Age of the shipowner"},{"z":"船隻的大小","e":"Size of the ship"}],"a":1,"x":"保費的釐定很大程度上受個別被保險人的索償經驗影響。儘管是同一艘船，如果船東或管理人另有其人，應付的保費就可以有極其顯著的差別。"},{"id":"B294","ch":1,"ref":"1.7.3","t":1,"s":"b4y","q":"下列哪項對「遊艇條款」描述不正確？","qi":[],"qe":"Which of the following is incorrect in describing \"\"Yacht Clauses\"\"?","qei":[],"o":[{"z":"免賠額不包括全部損失的賠償","e":"Deductible excludes total loss compensation"},{"z":"不包括責任權益","e":"Excludes liability benefits"},{"z":"倫敦保險人協會規定，以「指明危險」作為基準","e":"According to the Institute of London Underwriters, it is based on \"\"specified risks\"\""},{"z":"特快遊艇(超過十七海浬)需採用快艇條款","e":"Speedboats (over 17 knots) must adopt Speedboat Clauses"}],"a":1,"x":"很多承保遊艇的保單同時承保財產及責任風險。"},{"id":"B295","ch":1,"ref":"1.7.3(b)","t":1,"s":"by","q":"以下哪項屬於遊艇保險的除外責任","qi":[],"qe":"Which of the following is an exclusion of pleasure craft insurance?","qei":[],"o":[{"z":"遊艇上的釣魚裝備","e":"Fishing gear on the pleasure craft"},{"z":"船外的引擎跌落水中","e":"Outboard motors falling overboard"},{"z":"沒有標記母艇名稱的小艇","e":"A ship's boat not marked with the parent boat's name"},{"z":"以上各項","e":"All of the above"}],"a":3,"x":"除外責任包括：(i) 裝於船外的引擎落入或跌落水中。(ii) 個人財物。(iii)可消耗的物料、釣魚裝備用具及繫泊用具。(iv) 該船的小艇如果沒有展示母艇的名稱作為永久的標記。"},{"id":"B296","ch":1,"ref":"1.7.3(b)","t":1,"s":"b","q":"以下哪項屬於遊艇保險的除外責任","qi":[],"qe":"Which of the following is excluded from Pleasure craft insurance?","qei":[],"o":[{"z":"遊艇上的釣魚裝備","e":"fishing gear on board"},{"z":"船外的引擎跌落水中","e":"The outboard motors falling overboard"},{"z":"個人財物","e":"Personal effects"},{"z":"以上各項","e":"All of the above"}],"a":3,"x":"除外責任包括：(i) 裝於船外的引擎落入或跌落水中。(ii) 個人財物。(iii)可消耗的物料、釣魚裝備用具及繫泊用具。(iv) 該船的小艇如果沒有展示母艇的名稱作為永久的標記。"},{"id":"B297","ch":1,"ref":"1.7.3(e)","t":1,"s":"b45","q":"遊艇保險的理賠通常基於不折舊的方法。但對於某些例外的物品可能會作出折舊扣減，而最高折舊扣減額為原值的三分之一，例如：","qi":["船帆","船外的引擎","船隻的小艇","船上的個人財物"],"qe":"The indemnity in pleasure craft insurance is usually not based on depreciation, but deduction up to one third may made for depreciation of some items, such as:","qei":["Sails","Outboard motors","Ship's boat","Personal effects on the boat"],"o":[{"z":"i, ii","e":""},{"z":"i, ii, iii","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":0,"x":"本身損害索償的結清是按以新代舊原則進行的但某些指明物品（例如船帆及安裝於船外的引擎）則須進行折舊扣減，最高扣減額為三分之一。"},{"id":"B298","ch":1,"ref":"1.7.1(b)","t":1,"s":"b","q":"戰爭和類似風險:","qi":[],"qe":"War and similar risks:","qei":[],"o":[{"z":"是商業保險永不提供","e":"Commercial insurance will never provide it"},{"z":"是所有險種都自由地提供","e":"All insurances are freely available"},{"z":"可能會在汽車和火災保險中找到","e":"May be found in auto and fire insurance"},{"z":"可能會在水和航空保單找到","e":"May be found in water and aviation policies"}],"a":3,"x":"戰爭、罷工等風險引起的損失；水上保障中可支付額外保費及採用協會戰爭及罷工條款來投保此等危險。"},{"id":"B299","ch":1,"ref":"1(b)(ii)","t":1,"s":"by","q":"“全險”保單不大可能保障以下哪項或哪些或成因所導致的損失或損害？","qi":[],"qe":"Which one or more of the following causes loss/damage is/are not likely to be covered by an \"\"All risk\"\" policy?","qei":[],"o":[{"z":"遭一名持械盜賊偷竊","e":"Theft by armed robber"},{"z":"手錶因跌入海中所造成手錶內部的損害","e":"Damage to watch which is dropped in a sea"},{"z":"因濕度持續高企造成手錶內部的損害","e":"Internal damage to watch from prolonged high humility"},{"z":"以上各項皆是","e":"All of the above"}],"a":2,"x":"因濕度持續高企造成手錶內部的損害相對較為不可保情況，原因是可能某手錶的設計並不合適於高濕度的環境中使用，但保險人亦有責任證明有關損失不屬於保障範圍之內。"},{"id":"B300","ch":1,"ref":"1.4.1(b)","t":1,"s":"b","q":"有一種保單，與火險有密切的關連，但承保火災後的財務影響，這種保險被冠以下列哪項或哪些名稱：","qi":[],"qe":"An insurance closely linked with fire insurance, but covering the financial effects after a fire, is/are known as which one or more of the following terms.","qei":[],"o":[{"z":"附加危險保險","e":"additional perils insurance"},{"z":"利潤中斷保險","e":"profit interruption insurance"},{"z":"營業中斷保險","e":"business interuption insurance"},{"z":"以上各項","e":"all of the above terms"}],"a":2,"x":"火災營業中斷保險是一種經濟權益保險，它與火險有別但卻又密切相關。"},{"id":"B301","ch":1,"ref":"1.4.1(a)","t":1,"s":"b","q":"以下哪項不屬於火災保險中“火”的限定？","qi":[],"qe":"Which of the following is not defined as the constitute \"\"FIRE\"\" in fire insurance policy?","qei":[],"o":[{"z":"實際燃燒","e":"Actual ignition"},{"z":"火災必須在受保處所裡發生","e":"Must occurrence on the insured premises"},{"z":"不應起火的實際上起火了","e":"Something that should not be on fire, but it on fire"},{"z":"不是由被保險人故意或引起安排的","e":"Must not stared by or arranged by the insured"}],"a":1,"x":"火災無須在受保處所燃燒，因此，在鄰近物業燃燒並符合以上定義的火災所產生的熱量、煙或水進而對受保財產造成的損害，也可構成有效的火災索償。"},{"id":"B302","ch":1,"ref":"1.7.2(b)(ii)","t":1,"s":"b","q":"船體險保單中免賠額，不適用於：","qi":[],"qe":"The deductibles with hull insurance policies are usually not suitable for:","qei":[],"o":[{"z":"火險索償","e":"fire claims"},{"z":"失竊索償","e":"theft claims"},{"z":"全損索償","e":"total loss claims"},{"z":"單獨海損索償","e":"particular average claims"}],"a":2,"x":"船體險保單就部分損失而非全損索償設定了免賠額，這與其他險種的做法有所不同。"},{"id":"B303","ch":1,"ref":"1.1(f)","t":1,"s":"by","q":"以下哪項有關免賠額的描述是正確的？","qi":[],"qe":"Which one or more of the following statements regarding deductibles is/are true?","qei":[],"o":[{"z":"它是可與「自負額」互換的","e":"they are interchangeable with excess"},{"z":"免賠額金額通常低於自負額","e":"deductibles are often for smaller amount than excess"},{"z":"它們隱含於合約中","e":"they are implied into the contract"},{"z":"以上各項皆是","e":"all of the above"}],"a":0,"x":"自負額（也稱免賠額）是指一項訂明的金額，每次損失中的該金額或以下的金額是不受保的。"},{"id":"B304","ch":1,"ref":"1.1.3(a)(i)","t":1,"s":"b","q":"在本港，商業車輛標準組合保單中「本身損害」部份，相當可能出現與以下哪項有關的特殊除外責任？","qi":[],"qe":"Special exclusions likely to be found in the \"\"Own Damage\"\" section of a standard comprehensive policy for commercial vehicles relate to:","qei":[],"o":[{"z":"火災和盜竊","e":"Fire and theft"},{"z":"超載或勞損","e":"Overloading or strain"},{"z":"碰撞和推翻","e":"Collision and overturning"},{"z":"停放或停泊時造成的損害","e":"Damage whilst parked or garaged"}],"a":1,"x":"超載或勞損是除外責任。"},{"id":"B305","ch":1,"ref":"1.2.1","t":1,"s":"b4","q":"一般保險之保險產品與以下哪項或多項有關？","qi":[],"qe":"General insurance included insurance product relating to which one or more of the following?","qei":[],"o":[{"z":"投資相連保單","e":"Investment Link Policy"},{"z":"年金","e":"Annuities"},{"z":"人生意外及疾病保單","e":"Personal accident & sickness insurance"},{"z":"以上各項皆是","e":"All of the above"}],"a":2,"x":"一般保險產品與人生意外及疾病保單有關。"},{"id":"B307","ch":1,"ref":"1.4.6","t":1,"s":"by","q":"以下哪項句子對忠實保證保險是不正確的？","qi":[],"qe":"Which of the following statement is not true for Fidelity Gurantee Insurance?","qei":[],"o":[{"z":"保證袛限於金錢損失","e":"Cover strictly relating to money"},{"z":"核查及監督制度是核保的考慮","e":"System of check and suspension is the underwriting"},{"z":"不記名保障包括所有職員","e":"¡§Blanket cover¡¨policy are covers all staff"},{"z":"保單保障顧員不誠實行為","e":"Policy covers dishonest acts by guaranteed staff"}],"a":0,"x":"承保僱主因任何人在受其僱用的期間進行任何欺詐、盜竊或不誠實等行為而導致的金錢或財產損失。"},{"id":"B308","ch":1,"ref":"1.2.1b(v)","t":1,"s":"by","q":"以下哪項或哪些很可能是人身意外保險的除外責任？","qi":[],"qe":"Which one or more of the following is/are probably excluded from the personal accident insurance?","qei":[],"o":[{"z":"自殺","e":"Suicide"},{"z":"因愛滋病而死","e":"Death from AIDs"},{"z":"受保人醉酒駕駛遭致死亡","e":"Dealth caused by the insured person¡¦s drunk-driving"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"違反社會原則的活動及因疾病而受傷、（保險生效前）已患疾病引起加重或加速的殘疾屬除外責任。"},{"id":"B309","ch":1,"ref":"1.4.1a(d)","t":1,"s":"b","q":"以下哪項就後果損失(即營業中斷)保單之計算損失的描述是不正確的？","qi":[],"qe":"Which of the following statement concerning the loss calculation under the Consequential loss (Business Interruption) policy is not correct:","qei":[],"o":[{"z":"基本上，它嘗試計算中斷期間之損失","e":"Essentially, it tries to measure the loss of the interruption period"},{"z":"這是一個非常複雜過程，經常需要專業會計師協助","e":"It is a complicated process, often requiring the assistance of accountants"},{"z":"最後數額一定不能超過中斷期間之數額","e":"The final amount must not be more the loss of damage casuing interruption"},{"z":"與上年度出現中斷期間的收入相比","e":"In comparison of the income during the interruption period last year"}],"a":3,"x":"計算彌償期間的損失首先與上年度中類似的、業務並沒有出現中斷的期間内的收入等等相比較，然後再就某些因素，比如在彌償期間內發生更激烈的市場競爭和爆發傳染病等並非由有關受保意外事故引起的事件，作出任何必要的趨勢調整。"},{"id":"B310","ch":1,"ref":"1.6","t":1,"s":"b5","q":"以下哪項或哪些是責任保險保單中的通用除外責任？","qi":[],"qe":"Which one or more of the following is/are (a) general exclusion(s) with liability insurance policies?","qei":[],"o":[{"z":"過失","e":"Fault"},{"z":"義務","e":"Obligation"},{"z":"合約附加的責任","e":"Contractual liability"},{"z":"以上各項","e":"All of the above"}],"a":2,"x":"合約附加的責任常為各責任保險保單中的通用除外責任。"},{"id":"B311","ch":1,"ref":"1(b)(ii)","t":1,"s":"b","q":"保單1承保「火災、閃電和爆炸」,而保單2則承保「意外損失和損壞」，保單1的保障範圍可以描述為「指明危險」，而保單2的保障範圍則可描述為:","qi":[],"qe":"Policy 1 covers 'Fire, Lightning and Explosion'. Policy 2 covers 'Accidental loss and damage'. The cover for Policy 1 may be described as a 'specified perils' and the cover for Policy 2 as:","qei":[],"o":[{"z":"全險","e":"All risks"},{"z":"複合保險","e":"Multiple risks"},{"z":"不指明危險","e":"Unspecified perils"},{"z":"非指明危險","e":"Non-specified perils"}],"a":0,"x":"「全險」:只要不在除外責任之列，任何可能的風險所引致的損失或損害都受到這類保單承保。"},{"id":"B312","ch":1,"ref":"1.1(g)","t":1,"s":"by","q":"以下哪項不大可能涉及在汽車保險保單中的「有權追回款項條款」？","qi":[],"qe":"Which of the following circumstances would not likely involve the 'Avoidance of Certain Terms and Right of Recovery'Clause in motor insurance policy?","qei":[],"o":[{"z":"未能在合理時間內報告受傷行人","e":"Failure to report injury to pedestrian within a reasonable time"},{"z":"未能在合理時間內報告受保損壞車輛","e":"Failure to report the damaged of insured vehicle within a reasonable time"},{"z":"在意外事發現向受傷行人承認法律責任","e":"Legal liability of the injury pedestrian at the scene of an accidence"},{"z":"以上各項皆是","e":"All of the above"}],"a":1,"x":"主要為被保險人尚未取得保險人的書面同意以前即以任何方式向第三者承認法律責任，根據「有權追回款項條款」便不會在保險單產生法律責任，或已如此產生的法律責任即告終止，則該條件對任何適用強制汽車保險相關規定的申索並無效力。"},{"id":"B313","ch":1,"ref":"1.7(f)","t":1,"s":"b","q":"在水險中的定值保單是指:","qi":["承諾全損保險保障","同意部分損失保險保障","沒有指明保額","為了商業上的方便購買"],"qe":"In marine cargo insurance, valued policies is:","qei":["A promise value basis for total losses","An agreed value basis for partial losses","No amount insured","Effected for the sake of commercial convenience purchase"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"i, iii, iv","e":""},{"z":"i, ii. iii, iv","e":""}],"a":1,"x":"為了商業上的方便，承保船隻或貨物的保險一般是以約定價值方式提供保險保障的—除了保額以外，保單還指明一個約定價值。就全損及部分損失而言，該約定價值將被當作是損失發生時的財產價值。"},{"id":"B314","ch":1,"ref":"1.2.1e(v)","t":1,"s":"b","q":"以下那項是正確描述人身意外保單中的年齡限制?","qi":[],"qe":"Which of the following descriptions about the age limit of personal accident is correct?","qei":[],"o":[{"z":"任何類別沒有最低年齡限制","e":"No lower age limit of any kind policies"},{"z":"被保人沒有最高年齡限制","e":"No upper age limit of insured"},{"z":"保單通常指明可保年齡的範圍","e":"Usually specify an insurable band of ages"},{"z":"退休人士沒有保險保障和沒有續保保障","e":"No insured or continues insured for the person who retired"}],"a":2,"x":"雖然保費並非根據受保人的年齡來釐定，但是保單通常指明可保年齡的範圍。"},{"id":"B611","ch":1,"ref":"1.2.1(a)","t":1,"s":"by","q":"以下那項或那些是人身意外保險保單的醫療費用保障的正確陳述？","qi":[],"qe":"Which of the following(s) is/are correct in describing the medical expenses of Personal Accident?","qei":[],"o":[{"z":"所提供的保險保障並無限額","e":"About the cover are subject to unlimited"},{"z":"保險保障不適用於常用保單的除外責任","e":"The covers are usually not suitable for the common policy exceptions"},{"z":"費用必須由意外傷害導致","e":"The expenses must arise from accidental injury"},{"z":"以上各項皆是","e":"All of the above"}],"a":2,"x":"可獲償付的醫療費用必須由「身體受傷」而非疾病導致，並受每宗事故賠償限額限制。"},{"id":"B316","ch":1,"ref":"1.1(g)","t":1,"s":"b","q":"在某些情形下，即使被保險人違反了保單條款，保險人仍須就屬於「法令」保險範圍內的索償作出賠償，這些索償較多出現於汽車意外，這條款是:","qi":[],"qe":"There are situations the insurer must meet compulsory insurance claims even though there is a breach of policy terms on the part of the insured. The claims most likely appear from motor accidents, this clause is also called:","qei":[],"o":[{"z":"有權追回款項條款","e":"Avoidance of Certain Terms and Right of Recovery Clause"},{"z":"比例分攤條款","e":"Pro Rata Average"},{"z":"特別條款","e":"Special terms"},{"z":"專業責任條款","e":"Professional liability clause"}],"a":0,"x":"被保險人違反了保單條款，保險人仍須就屬於「法令」保險範圍內的索償作出賠償的條款名稱為「使若干條款無效及有權追回款項」條款。"},{"id":"B317","ch":1,"ref":"1.1(b)","t":1,"s":"b4","q":"汽車保險中第三者保險的保障對象包括？","qi":[],"qe":"What are the covered objects of third-party insurance in car insurance?","qei":[],"o":[{"z":"受保汽車裝卸「貨物」(可包括運往新居的家居用品)","e":"Insured motor vehicle loading and unloading \"cargo\" (can include household items shipped to a new home)"},{"z":"任何乘客(例如因疏忽地打開車門而導致意外事故)","e":"Any passenger (e.g. causing an accident by opening a car door inadvertently)"},{"z":"受保汽車裝卸「貨物」(包括商用汽車所運載的貨物)","e":"Insured motor vehicles loading and unloading \"cargo\" (including cargo carried by commercial motor vehicles)"},{"z":"屬於僱員補償保險的保障範圍內的索償","e":"Claims covered by employees' compensation insurance"}],"a":1,"x":"第三者責任保險保障的對象是被保險人及任何其他受保司機及任何乘客(例如因疏忽地打開車門而導致意外事故)。"},{"id":"B318","ch":1,"ref":"1.3.3(c)","t":1,"s":"b","q":"以下哪項或哪些是旅遊保險釐定保費的因素？","qi":[],"qe":"Which one or more of the following element(s) is/are deciding the premium of travel insurance?","qei":[],"o":[{"z":"地域範圍","e":"geographical area"},{"z":"持續時間","e":"No. of days involved with the trip"},{"z":"受保人數目","e":"Persons covered"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"所有以上的答案均為計算保費的因素。"},{"id":"B319","ch":1,"ref":"1.1(c)(ii)","t":1,"s":"b","q":"無索償折扣(NCD)以所謂「折扣回減機制」運作，一次索償表示已獲得最高折扣者，其折扣是:","qi":[],"qe":"The NCD system operates on what is called a 'step-back system', what is the meaning of a single claim for the insured who indicates highest discount:","qei":[],"o":[{"z":"每次索償會將所有折扣回減至0%","e":"Each claim will destroy all discount"},{"z":"每次索償會將折扣回減10%","e":"Each claim will reduce 10% of discount"},{"z":"每次索償會將折扣回減20%","e":"Each claim will reduce 20% of discount"},{"z":"每次索償會將折扣回減30%","e":"Each claim will reduce 30% of discount"}],"a":3,"x":"對私家車而言，當年發生了一次索償，那麽續保時的折扣率便會被調低30%。"},{"id":"B320","ch":1,"ref":"1.3.3","t":1,"s":"b","q":"旅遊保險屬於那一種保險：","qi":[],"qe":"Which category is travel insurance:","qei":[],"o":[{"z":"個人保險","e":"Personal insurances"},{"z":"責任保險","e":"Insurance of Liability"},{"z":"「全險」","e":"“All Risks”"},{"z":"一籃子保單","e":"Package Policy"}],"a":3,"x":"旅遊保險單視為了有多年歷史的「一籃子」保單。"},{"id":"B321","ch":1,"ref":"1.7.2(b)(ii)","t":1,"s":"b","q":"通常用於非全損免賠額保單可能是:","qi":[],"qe":"The non-total loss of Deductible Policies is likely be:","qei":[],"o":[{"z":"盜竊保險","e":"Theft Insurance"},{"z":"船體保險","e":"Marine hull insurance"},{"z":"貨物保險","e":"Marine cargo insurance"},{"z":"火災及指明危險保險","e":"Fire and specified perils insurance"}],"a":1,"x":"船體保險單就部分損失而非全損索償設定了免賠額，這與其他險種的做法有所不同。"},{"id":"B322","ch":1,"ref":"1(a)","t":1,"s":"b","q":"一般保險包括以下哪項或哪些保險產品？","qi":[],"qe":"General insurance includes insurance products relating to which one or more of the following:","qei":[],"o":[{"z":"財產保險","e":"Insurance of property"},{"z":"危疾附約","e":"Critical illness rider"},{"z":"長期護理","e":"Long term care"},{"z":"上述所有各項","e":"All of the above"}],"a":0,"x":"一般保險不包括危疾附約。"},{"id":"B323","ch":1,"ref":"1.1(d)(iv)(2)","t":1,"s":"b5","q":"以下那項或那些是綜合汽車保險保障肯定不會承保的","qi":[],"qe":"? Which one or more of the following statements of comprehensive cover for motor vehicle is absolutely not insurable?","qei":[],"o":[{"z":"司機於駕駛時睡著","e":"Driver fell asleep whilst driving"},{"z":"司機從不曾持有駕駛執照","e":"Driver never ever hold a duly licensed"},{"z":"司機駕駛的速度比一般速度快","e":"Driver drives faster than normal speed"},{"z":"以上所述各項","e":"All of the above"}],"a":1,"x":"不曾持有駕駛執照(非法行為)汽車保險固然不能在保障範圍內。"},{"id":"B324","ch":1,"ref":"1.2.2(b)(ii)","t":1,"s":"b","q":"以下哪項不是一般保單(醫療保險保單)的除外責任？","qi":[],"qe":"Which of the following is NOT a general exclusion of the general insurance (medical insurance policies)?","qei":[],"o":[{"z":"中年女人面部「煥然一新」的費用","e":"Cost of face-lift of the middle age woman"},{"z":"先天性畸形的治療","e":"Congenital abnormalities treatment"},{"z":"保險生效前已患的疾病","e":"Pre-existing conditions"},{"z":"由汽車意外令致面部受傷的牙科治療費用","e":"The dental free from facial injuries during the motor accident"}],"a":3,"x":"因意外事故所需進行的牙科治療費用不是除外責任。"},{"id":"B325","ch":1,"ref":"1.2.1(c)","t":1,"s":"b","q":"以下那項不是人生意外保險保單的正確描述?","qi":[],"qe":"Which of the following is incorrect in describing the Personal Accident?","qei":[],"o":[{"z":"保費根據受保人的年齡來釐定","e":"The premiums are based on the age of the insured person"},{"z":"根據被保險人的職業計算保費","e":"The standard premium calculation is based upon the insured¡¦s occupation"},{"z":"可購買個人保單 / 團體保單","e":"PA cover may be provided as a personal policy / Group policies"},{"z":"人身意外保單的合約通常為一年，有可取消條約的情況","e":"PA policies normally represent annual contracts, have Cancellable condition"}],"a":0,"x":"多種個別的特點（如年齡）可能會影響核保的結果，但根據被保險人的職業計算保費是標準的做法。"},{"id":"B326","ch":1,"ref":"1.6.2","t":1,"s":"b","q":"一名兒童因有問題的玩具而受傷害，這情況受保於那項責任保單？","qi":[],"qe":"A child is hurt due to the toy had dangerous, Which of the following liability policies is covered?","qei":[],"o":[{"z":"公眾責任保險","e":"Public Liability Insurance"},{"z":"產品責任保險","e":"Product Liability Insurance"},{"z":"專業保險","e":"Professional Insurance"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"每位製造商或賣家均對其消費者負有一項照顧責任，就是不可製造或向他們銷售「有問題的產品」，使他們因此蒙受傷害或損害，此為產品責任保險。"},{"id":"B327","ch":1,"ref":"1.5.3(a)","t":1,"s":"b","q":"香港政府有計劃進行某填海項目，並提供特別的建築用的工業設備予承建商使用。該些工業設備應在以下哪項承保？","qi":[],"qe":"The Hong Kong Government has plans for a certain reclamation project, supplying some special construction plants and equipment for contractor's use. Such plant and equipment should be insured under:","qei":[],"o":[{"z":"建築「全險」保險保單第一部份","e":"Section I of contractors all risk policy"},{"z":"安裝工程「全險」保險保單","e":"An erection all risk policy"},{"z":"建築「全險」保險保單第二部份","e":"Section II of contractors all risk policy"},{"z":"裝配及安裝保險保單","e":"Assembling and installation policy"}],"a":0,"x":"第一部分就指明的財產以「全險」方式提供財產保險。受保財產相當可能包括合約工程和任何由委託人供應的物料，附加承保建築用的裝置、設備和機械（作為單獨的裝置及機械保單的替代方法）也行。"},{"id":"B328","ch":1,"ref":"1.5.3","t":1,"s":"b","q":"以下哪項有關在香港的建築全險的說明是不正確的？","qi":[],"qe":"Which of the following statement regarding the contractors¡risk insurance in Hong Kong is not true?","qei":[],"o":[{"z":"減弱支撐通常都是屬於責任保障的除外責任","e":"Weakling of support is usually excluded from the liability cover"},{"z":"一項或多項的免賠額可應用於保單兩部份內的每一部份","e":"One or more deductible is apply for with each in the two sections of policy"},{"z":"財產保險保障部份承保大部份損失，其中包括錯誤設計","e":"Property insurance is usually covered all forms of loss, including the result of faulty design"},{"z":"保險保單格式包括兩部份，財產保險及責任保險","e":"Cover two sections of policy, property insurance and liability insurance"}],"a":2,"x":"財產保險保障設有通常適用於「全險」保險保障的除外責任。還有一些適用於此類保障的，包括錯誤設計、有缺陷的材料、不良工匠技藝及只於盤點時才發現的損失在内的其他除外責任。"},{"id":"B329","ch":2,"ref":"2.0","t":1,"s":"by","q":"在核保的過程，人壽保險及一般保險的基本分別在於：","qi":[],"qe":"In the process of underwriting, the basic difference between life and general insurance is:","qei":[],"o":[{"z":"人壽保險核保屬於「一次過」事件","e":"Underwriting of life insurance is a \"\"one-off\"\" exercise"},{"z":"一般保險核保屬於「一次過」事件","e":"Underwriting of general insurance is a \"\"one-off\"\" exercise"},{"z":"一般保險只涉及實質危險","e":"General insurance involves actual risks only"},{"z":"一般保險通常涉及較低的保額","e":"General insurance usually involves less insured sum"}],"a":0,"x":"人壽保險核保屬於「一次過」事件，有別於人壽保險，一般保險的風險評估是一個持續的、或最低限度是可重複的過程。"},{"id":"B330","ch":2,"ref":"2.0","t":1,"s":"by","q":"核保的程序涉及：","qi":[],"qe":"The processes of underwriting involve:","qei":[],"o":[{"z":"風險的類別","e":"Risk categories"},{"z":"風險的選擇","e":"Selection of risks"},{"z":"決定標準合約的條款","e":"Confirm the terms of standard contracts"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"以上三種均為核保過程中的重要過程。"},{"id":"B331","ch":2,"ref":"2.0","t":1,"s":"by","q":"一般在判定一項風險的可保性和決定採納甚麼合約條件的人是：","qi":[],"qe":"Usually the person who decides if a risk is insurable and the terms of the contract is:","qei":[],"o":[{"z":"代理人","e":"Agent"},{"z":"核保人","e":"Underwriter"},{"z":"保險經紀","e":"Insurance brokers"},{"z":"保險公司的行政總裁","e":"Chief executive officer of insurance companies"}],"a":1,"x":"核保人將負責整個核保過程。"},{"id":"B332","ch":2,"ref":"2.0","t":1,"s":"by","q":"核保過程涉及：","qi":[],"qe":"The processes of underwriting involve:","qei":[],"o":[{"z":"選擇風險，但不涉及保險合約的條款","e":"Selection of risks, but not the terms for the insurance contract"},{"z":"選擇承保的風險及合約的條款","e":"Selection of risks undertaken and terms of the contract"},{"z":"只涉及釐訂保費","e":"Only the calculation of premiums"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"核保重要過程包括選擇風險(判斷可保性)及決定合約條款。"},{"id":"B333","ch":2,"ref":"2.1","t":1,"s":"b","q":"投保書屬於被保險人對保險人投保時的重要文件，用於向保險人披露重要事實，披露重要事實屬於那個壽險原則？","qi":[],"qe":"Proposal is an important document for the insured to the insurer, which is used for disclosure of materials facts to the insurer. Disclosure of material facts belongs to which insurance principle?","qei":[],"o":[{"z":"可保權益","e":"Insurable interests"},{"z":"近因","e":"Proximate cause"},{"z":"彌償","e":"Indemnity"},{"z":"最高誠信","e":"Utmost good faith"}],"a":3,"x":"投保人必須遵守最高誠信責任，即是無論保險人有沒有明確發問，投保人都有義務披露所有的重要事實。"},{"id":"B334","ch":2,"ref":"2.1","t":1,"s":"b","q":"被保人有意不披露關於投保物件的重要事實或資料，而當保險人知道會拒絕受保，這種行為稱為:","qi":[],"qe":"The insured intentionally fails to disclose material facts or information about the insured property when the insurance company knows and refuses to cover it.This behaviour is called:","qei":[],"o":[{"z":"無知","e":"Ignorance"},{"z":"欺詐","e":"Fraud"},{"z":"最高誠信","e":"Utmost Good Faith"},{"z":"可保利益","e":"insurable interest"}],"a":2,"x":"投保人必須遵守最高誠信責任，即是無論保險人有沒有明確發問，投保人都有義務披露所有的重要事實。"},{"id":"B335","ch":2,"ref":"2.1(a)","t":1,"s":"by","q":"某個術語用在一般保險中，含義和人壽保險中的「申請表」相同。這個術語是：","qi":[],"qe":"A certain term used in general insurance and its meaning is the same as \"\"applications\"\" as in life insurance. This term is:","qei":[],"o":[{"z":"保險憑証","e":"Insurance proof"},{"z":"暫保單","e":"Cover notes"},{"z":"投保書","e":"Proposals"},{"z":"續保要求","e":"Renewal requirements"}],"a":2,"x":"投保書也稱為投保單、申請表，當中以申請表在人壽保險中用得較為普遍。投保書是一種問卷形式的文件，必須由投保人在提出保險保障申請時填寫。"},{"id":"B336","ch":2,"ref":"2.1","t":1,"s":"b","q":"違反最高誠信是:","qi":[],"qe":"Violated Utmost Good Faith is:","qei":[],"o":[{"z":"令保單無效","e":"void the policy"},{"z":"令受損害一方有權可以將保單無效","e":"The injured party is entitle to void the policy"},{"z":"保單無效可將保費沒收","e":"If the policy is void, the premium will be forfeited"},{"z":"以上全部皆不是","e":"None of the above"}],"a":1,"x":"如投保人違反最高誠信，保險人可令保單變成無效的合約。"},{"id":"B337","ch":2,"ref":"2.1.1","t":1,"s":"by","q":"以下那項不屬於保單中的重要事實?","qi":[],"qe":"Which of the following is not a material fact of insurance policy?","qei":[],"o":[{"z":"五十五歲的投保人(公眾責任)","e":"The insured who is 55-year old (public liability)"},{"z":"儲存大量汽油的辦公室(火險)","e":"An office with large quantity of fuel stored (fire insurance)"},{"z":"多次被盜竊的地方(家居保險)","e":"A place which has been robbed many times before (household insurance)"},{"z":"曾遭意外導致雙足殘廢(意外保險)","e":"Disablement of both legs from previous accident (accident insurance)"}],"a":0,"x":"五十五歲的投保人(年紀)與公眾責任並不構成直接的關係。"},{"id":"B338","ch":2,"ref":"2.1.1","t":1,"s":"b","q":"當被保人明知自己有心臟問題但不披露，保單會:","qi":[],"qe":"When the insured knowingly does not disclose their heart problem, the policy will:","qei":[],"o":[{"z":"不受影響","e":"Not affected"},{"z":"只保障其他疾病","e":"Only other diseases are covered"},{"z":"被保險公司決定是否無效","e":"The insurance company decides the validity"},{"z":"自動延伸保障範圍","e":"Automatic extension of coverage"}],"a":2,"x":"如投保人違反最高誠信，保險人可令保單變成無效的合約。"},{"id":"B339","ch":2,"ref":"2.1.1","t":1,"s":"b3","q":"專業評估風險","qi":[],"qe":"Professional risk assessment","qei":[],"o":[{"z":"只會考慮或實質(物質)危險","e":"Only consider or substantial (material) danger"},{"z":"只關心人性元素","e":"Only concerned with the human element"},{"z":"和實質和道德危險有關","e":"related to material and moral danger"},{"z":"可以由估價表計算","e":"Can be calculated from the valuation table"}],"a":2,"x":"對特定的投保進行風險評估時，核保人有必要全面了解該實際危險及道德危險。"},{"id":"B340","ch":2,"ref":"2.1.1","t":1,"s":"b","q":"指出下面哪一句是正確","qi":[],"qe":"Which of the following sentences is correct","qei":[],"o":[{"z":"所有保險合約一定要由書面作證","e":"All insurance contracts must have written evidence as proof"},{"z":"不論有沒有被問到，普通法重要事實一定要披露","e":"Common law material facts must be disclosed whether asked or not"},{"z":"違反保險保証，一定要和索償情況有關係，保險人才可以拒絕責任","e":"A breach of insurance guarantee must related to the claim situation before the insurance company can deny liability."},{"z":"損害賠償永不適用在個人保險","e":"Damages never apply to personal insurance"}],"a":1,"x":"重要事實的法律定義為：「在訂定保費或決定是否承擔風險方面會影響一名審慎的保險人的判斷的任何情況」，投保人必須遵守最高誠信責任，即是無論保險人有沒有明確發問，投保人都有義務披露所有的重要事實。"},{"id":"B341","ch":2,"ref":"2.1.1(a)","t":1,"s":"by","q":"任何對投保風險的可保性或可能採用的條件造成不利影響的資料，可被描述為：","qi":[],"qe":"Any information that could adversely affect the insurability of the risks insured or conditions to be used can be described as:","qei":[],"o":[{"z":"重要事實","e":"Material facts"},{"z":"必要事實","e":"Necessary facts"},{"z":"基本事實","e":"Basic facts"},{"z":"核保要求","e":"Underwriting requirements"}],"a":0,"x":"重要事實是「必須申報的實情」（這是法律的規定，也好讓核保人對有關擬保風險能夠作出專業的評估）。"},{"id":"B342","ch":2,"ref":"2.1.1(b)","t":1,"s":"b5y","q":"以下哪項屬於非重要事實？","qi":[],"qe":"Which of the following is a non-material fact?","qei":[],"o":[{"z":"改善或降低有關風險的事實","e":"Facts that improve or decrease the risk"},{"z":"過往的損失經驗","e":"Previous losses experience"},{"z":"以往的索償的經驗","e":"Previous claims experience"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"改善或降低風險的情況屬於「非重要」事實。"},{"id":"B343","ch":2,"ref":"2.1.1(b)","t":1,"s":"by","q":"以下哪項屬於不須披露的重要事實？","qi":[],"qe":"Which of the following is a material fact needs not be revealed?","qei":[],"o":[{"z":"一項減低風險的事實","e":"A fact that decreases the risk"},{"z":"涉及過往賠償及損失的事實","e":"Facts that relate to previous claims and losses"},{"z":"風險比預期大","e":"Risk is greater than expected"},{"z":"潛在損失比預期大","e":"Potential loss is greater than expected"}],"a":0,"x":"改善或降低風險的情況屬於「非重要」事實，所以屬於不須披露的重要事實。"},{"id":"B344","ch":2,"ref":"2.1.1(b)","t":1,"s":"by","q":"在農業保險申請表中，以下那項不屬於重要事實？","qi":[],"qe":"For application of agriculture insurance, which of the following is not a material fact?","qei":[],"o":[{"z":"減低水災發生的事實","e":"Facts that decrease the risk of flooding"},{"z":"在以往經歷中，涉及不受保險保障的水災索償的事實","e":"Facts relate to previous experience in claims of flooding not covered by insurance"},{"z":"涉及風險大於正常的事實","e":"Facts relate to risk greater than normal"},{"z":"可能出現損失的程度高於標準水平","e":"Possibility of potential loss greater than standard level"}],"a":0,"x":"改善或降低風險的情況屬於「非重要」事實，所以屬於不須披露的重要事實。"},{"id":"B345","ch":2,"ref":"2.1.1(b)註(2)/Note","t":1,"s":"by","q":"在正常情況下，要証明一項事實的重要性是屬於：","qi":[],"qe":"In normal circumstance, to prove the importance of a fact is:","qei":[],"o":[{"z":"保險人的責任","e":"The insurer's responsibility"},{"z":"被保人的責任","e":"The insured's responsibility"},{"z":"保險人及被保險人的責任","e":"The insurer's and insured's responsibility"},{"z":"由法庭裁決","e":"Judged by the court"}],"a":0,"x":"如果有不明確的情況，保險人一般有責任證明有關事實是重要的，而投保人所提供的資料是不充分的。這項責任是不容易完成的。"},{"id":"B346","ch":2,"ref":"2.1.1(c)","t":1,"s":"by","q":"在一般保險中，風險估定以確定風險的可保性是：","qi":[],"qe":"In general insurance, the assessment of risk to ensure it is insurable is:","qei":[],"o":[{"z":"只在保單索償時進行","e":"It arises only when there is a claim"},{"z":"只在保單續保時進行","e":"It arises only at policy renewal"},{"z":"在保單續保或其他時候重覆進行","e":"It arises repeatedly at policy renewal and other times"},{"z":"只在保單開始時進行","e":"It arises only when the policy begins"}],"a":2,"x":"風險評估通常出現在投保階段、保單續保的時候、索償發生時、對現有條款作重大更改時及風險有所變化的時間。"},{"id":"B347","ch":2,"ref":"2.1.1(c)","t":1,"s":"by","q":"核保一般保險的特性：","qi":[],"qe":"The feature of underwriting of general insurance:","qei":[],"o":[{"z":"保單條款與人壽保險一樣，核保之後便不能改變","e":"Policy terms are the same as life insurance, and cannot be changed after underwriting"},{"z":"與人壽保險類似，但不涉及可保權益的考慮","e":"Similar to life insurance, but do not involve the consideration of insurable interests"},{"z":"與人壽保險一樣，可保權益只需在保單開始時存在","e":"Same as life insurance, insurable interests must exist when the policy begins"},{"z":"需要持續核保，每年續約或更新保單條件","e":"Requires continuous underwriting, annual policy renewal or change policy terms"}],"a":3,"x":"一般保險的風險評估是一個持續的、或最低限度是可重複的過程。"},{"id":"B348","ch":2,"ref":"2.1.1(d)","t":1,"s":"b3y","q":"保險核保人在風險評估過程中，可能涉及：","qi":[],"qe":"In the process of risk assessment of underwriting, it may involve:","qei":[],"o":[{"z":"風險的可保性","e":"Insurability of a risk"},{"z":"標準保費是否合適","e":"If standard premium is applicable"},{"z":"是否要採納自負額或免賠額","e":"If to use excess or deductible"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"可保性(接納)、標準保費及措辭、自負額等都是風險評估的相關因素。"},{"id":"B349","ch":2,"ref":"2.1.2(a)","t":1,"s":"by","q":"風險的估定是實質本性與有關事實的結合，可稱為 :","qi":[],"qe":"The assessment of risk is an integration of the physical nature and related facts, which can be called:","qei":[],"o":[{"z":"核保人承保的考慮因素","e":"Factors considered by underwriters"},{"z":"道德危險","e":"Moral hazards"},{"z":"實質危險","e":"Physical hazards"},{"z":"受保商數","e":"Sum insured"}],"a":2,"x":"實質危險指的是風險的客觀、物質性本質，即是明顯而且容易被確認的特點，這將影響發生損失的機會，及其嚴重程度。"},{"id":"B350","ch":2,"ref":"2.1.2(a)","t":1,"s":"b","q":"結構、佔用和位置是會作為評估火災危險的因素","qi":[],"qe":"Structure, occupancy and location are factors used to assess fire risk","qei":[],"o":[{"z":"是","e":"True"},{"z":"除了佔用; 是","e":"True, except occupancy"},{"z":"假","e":"false"},{"z":"除了結構; 假","e":"False, except structure"}],"a":0,"x":"建築材料對火險的重要性是十分明顯的。木質建築物比起混凝土的同類型建築物自然要付更高的保費。"},{"id":"B351","ch":2,"ref":"2.1.2","t":1,"s":"b","q":"以下哪句句子正確:","qi":[],"qe":"Which of the following sentences is correct","qei":[],"o":[{"z":"實質危險通常是比道德危險較容易評估","e":"Physical Hazards is easier to asset compare to Moral Hazards"},{"z":"雖然不是法律要求，投保書在主要的險種都恆久採用","e":"Although it is not a legal requirement, proposal form is always used in all major types of insurance."},{"z":"責任出現前的先決條件是合約的基準原則","e":"The basic principles of the contract are the prerequisites for liability to arise"},{"z":"責任出現後的先決條件是合約的基準原則","e":"The basic principles of the contract are the prerequisites after the liability arise"}],"a":0,"x":"比起實質危險，道德危險屬於較主觀及較難理解的概念。"},{"id":"B352","ch":2,"ref":"2.1.2(b)","t":1,"s":"b","q":"下例那項並不是道德危險的例子:","qi":[],"qe":"The following is not an example of moral hazards:","qei":[],"o":[{"z":"粗心大意","e":"Carelessness"},{"z":"心思熟慮","e":"thoughtfulness"},{"z":"不合情理","e":"Unreasonableness"},{"z":"不誠實","e":"Dishonesty"}],"a":1,"x":"我們可以簡述道德危險可能出現的負面形態如下:不誠實、粗心大意及魯莽、不合情理及反社會行為。"},{"id":"B353","ch":2,"ref":"2.1.2(a)","t":1,"s":"by","q":"以下哪項危險屬於較易理解及辦別，而且擁有客觀的特質？","qi":[],"qe":"Which of the following hazards is self-evident and easily ascertained, and objective in nature?","qei":[],"o":[{"z":"道德危險","e":"Moral hazards"},{"z":"非道德危險","e":"Non-moral hazards"},{"z":"實質危險","e":"Physical hazards"},{"z":"非實質危險","e":"Non-physical hazards"}],"a":2,"x":"實質危險指的是風險的客觀、物質性本質，即是明顯而且容易被確認的特點，這將影響發生損失的機會，及其嚴重程度。"},{"id":"B354","ch":2,"ref":"2.1.2(a)","t":1,"s":"b","q":"以下哪一項不屬於在一般情況下影響一項風險的實質危險?","qi":[],"qe":"Which of the following is not a Physical hazards that affects a risk under normal circumstances?","qei":[],"o":[{"z":"引起盜竊的吸引力(盜竊保險)","e":"Attract theft (Theft Insurance)"},{"z":"令人不滿的索償經驗","e":"Unsatisfactory claims experience"},{"z":"被保險對索償的無理態度","e":"The insured’s unreasonable attitude toward claims"},{"z":"被保險人的身體狀況(個人意外保險)","e":"Physical condition of the insured (personal accident insurance)"}],"a":2,"x":"被保險對索償的無理態度屬於道德風險。"},{"id":"B355","ch":2,"ref":"2.1.2(a)","t":1,"s":"b5","q":"在不同保險業務類別中，以下哪些風險與實質危險有關？","qi":["受保物件的實質價值(盜竊險)","被保人及其員工的粗心大意(意外保險)","被保人職業(公眾責任保險)","被保建築物的建築結構(火險)"],"qe":"In different insurance business categories, which of the following risks are related to physical hazards?","qei":["Actual value of the insured item (theft insurance)","Carelessness of the insured and his employees (accident insurance)","Occupation of the insured (public liability insurance)","Construction structure of the insured building (fire insurance)"],"o":[{"z":"(i), (ii), (iii)","e":""},{"z":"(i), (ii), (iv)","e":""},{"z":"(i), (iii), (iv)","e":""},{"z":"(ii), (iii), (iv)","e":""}],"a":2,"x":"被保人及其員工的粗心大意(意外保險)屬道德危險。"},{"id":"B356","ch":2,"ref":"2.1.2(a)","t":1,"s":"b","q":"投保書中問題的答案可能會引起保險人的進一步查詢(檢驗)，例如：","qi":[],"qe":"The answers to questions in a proposal may lead the insurer to make further enquiry (investigate), for example:","qei":[],"o":[{"z":"大額款項的盜竊保險","e":"Theft insurance with large sum insured"},{"z":"曾多次意外撞車的汽車保險","e":"Motor insurance with several accidental collision records"},{"z":"大額的建築火險保險","e":"Fire insurance with large sum insured"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"以上三個情況保險人將會以實際危險(有關客觀發生的事實)的方式用於核保的過程。"},{"id":"B357","ch":2,"ref":"2.1.2(a)","t":1,"s":"by","q":"當為火災保險作實質危險估定時，應考慮哪些因素？","qi":[],"qe":"When performing actual risk assessment for fire insurance, what factors need to be considered?","qei":[],"o":[{"z":"結構物料","e":"Structural materials"},{"z":"投保人年齡","e":"Age of the insured"},{"z":"投保人之道德操守","e":"Moral conduct of the insured"},{"z":"以上全部都不是","e":"None of the above"}],"a":0,"x":"建築材料對火險的重要性是十分明顯的。木質建築物比起混凝土的同類型建築物自然要付更高的保費。"},{"id":"B358","ch":2,"ref":"2.1.2(a)(i)","t":1,"s":"b","q":"以下哪一項不是影響一項風險的道德危險？","qi":[],"qe":"Which of the following will not affect the risk of a moral hazard?","qei":[],"o":[{"z":"被保險人一方的不誠實","e":"Dishonesty of the insured"},{"z":"建築物中的建築材料","e":"Construction materials of the building"},{"z":"被保險人及受僱僱員的粗心大意","e":"Carelessness of the insured and his employees"},{"z":"被保險人對索償的無理態度","e":"Unreasonable attitude of the insured in claims"}],"a":1,"x":"建築材料對火險的重要性是十分明顯的。木質建築物比起混凝土的同類型建築物自然要付更高的保費，以上為實質危險。"},{"id":"B359","ch":2,"ref":"2.1.2(b)","t":1,"s":"b","q":"想處理不利的道德危險是困難的，原因是:","qi":[],"qe":"Dealing with adverse moral hazards is difficult because:","qei":[],"o":[{"z":"投保人時常會告訴事實的全部","e":"Policyholders often tell the whole truth"},{"z":"投保人時常不會告訴事實的全部","e":"Policyholders often don’t tell the whole truth"},{"z":"每個人都不同","e":"Different with everyone"},{"z":"以上全部皆不是","e":"None of the above"}],"a":1,"x":"把道德危險作為「人性元素」來考慮，或許更能明白其中的含義。也就是說，這是指被保險人及其他與該風險有關的人（例如被保險人的家庭成員和僱員）的態度、行為及操守的本質和特點。"},{"id":"B360","ch":2,"ref":"2.1.2(b)","t":1,"s":"by","q":"以下哪項是道德危險的不正確描述？","qi":[],"qe":"Which of the following is incorrect in describing moral hazards?","qei":[],"o":[{"z":"涉及人性行為的特點","e":"Involve the features of human behaviour"},{"z":"道德危險有分為好與壞","e":"There are good and bad moral hazards"},{"z":"不單涉及不誠實，還涉及主觀的特點","e":"Not only involve dishonesty, but also involve subjective features"},{"z":"比實質危險容易察覺","e":"Easier to observe than physical hazards"}],"a":3,"x":"比起實質危險，道德危險屬於較主觀及較難理解的概念。"},{"id":"B361","ch":2,"ref":"2.1.2(b)","t":1,"s":"by","q":"一些主觀因素，如態度、行為及操守都可以成為評估風險的考慮因素，這些因素亦稱為：","qi":[],"qe":"Some subjective factors, such as attitude, behaviour and conduct may be considered in risk assessment. These factors are also called:","qei":[],"o":[{"z":"實質(物質)危險","e":"Physical (material) hazards"},{"z":"道德危險","e":"Moral hazards"},{"z":"重要事實","e":"Material facts"},{"z":"檢驗報告","e":"Assessment report"}],"a":1,"x":"把道德危險作為「人性元素」來考慮，或許更能明白其中的含義。也就是說，這是指被保險人及其他與該風險有關的人（例如被保險人的家庭成員和僱員）的態度、行為及操守的本質和特點。"},{"id":"B362","ch":2,"ref":"2.1.2(b)","t":1,"s":"b3","q":"被保人不合情理:","qi":[],"qe":"The insured is unreasonable:","qei":[],"o":[{"z":"會構成不利的道德危險","e":"Would pose an adverse moral hazard"},{"z":"會構成不利的實質危險","e":"Would pose an physical hazards"},{"z":"意思是保險人會對索償制度上加大困難","e":"This means that the insurer will have a more difficult claim system"},{"z":"意思是風險不能投保","e":"This means that the risk cannot be insured"}],"a":0,"x":"道德危險通常教人把焦點放在被保險人的道德行為和準則上。儘管這些都是重要的，而且肯定是屬於道德危險，但是它的意義更為廣泛，還包括了態度、生活方式及粗心大意之類。"},{"id":"B364","ch":2,"ref":"2.1.3","t":1,"s":"by","q":"以下哪項不是投保書的主體問題？","qi":[],"qe":"Which of the following is not the main question in a proposal?","qei":[],"o":[{"z":"投保人的姓名","e":"Name of the insured"},{"z":"投保人的地址","e":"Address of the insured"},{"z":"投保人的年齡","e":"Age of the insured"},{"z":"投保人過往的索償經驗","e":"Previous claims experience of the insured"}],"a":2,"x":"投保人的詳情：諸如姓名、地址及職業。這些內容可能影響實質危險，而且是身份識別及溝通的必需資料。保險經歷：核保人需要知道被保險人是否還購買了其他保險，以及是否曾經遭到其他保險人拒保或施加異常限制的條款。"},{"id":"B365","ch":2,"ref":"2.1.3","t":1,"s":"by","q":"擬定投保書中的問題時，會選擇以下哪項作為根據？","qi":[],"qe":"When drafting the questions in a proposal, which of the following will be based upon?","qei":[],"o":[{"z":"投保人的詳情","e":"Details of the insured"},{"z":"投保人的保險經歷","e":"Insurance history of the insured"},{"z":"投保人的損失及索償經歷","e":"Losses/claims history of the insured"},{"z":"以上全部各項","e":"All of the above"}],"a":3,"x":"保險經歷、投保人的詳情、損失／索償經歷及被保險人所作的估值都是擬定投保書的內容。"},{"id":"B366","ch":2,"ref":"2.1.3","t":1,"s":"b","q":"投保人的名稱在投保書:","qi":[],"qe":"The name of the policyholder in the proposal forms:","qei":[],"o":[{"z":"可能會對評估實質危險重要","e":"might be important to assess physical hazards"},{"z":"只會對身份記認目的有意義","e":"Only meaningful for identification purposes"},{"z":"會對收的保費是個人很重要的因素","e":"It is an important personal factor that will effect the premium charges"},{"z":"不是真正保險人需要的","e":"The insurer does not really need it."}],"a":0,"x":"投保人的詳情：諸如姓名、地址及職業。這些內容可能影響實質危險，而且是身份識別及溝通的必需資料。"},{"id":"B367","ch":2,"ref":"2.1.3","t":1,"s":"by","q":"投保書是一種工具，投保人可利用這文件提交投保風險的詳細介紹，當中的態度必須符合以下哪項保險原則？","qi":[],"qe":"Proposal is an instrument and the insured can use the document to submit details of the risk insured. The attitude of which must meet which of the following insurance principles?","qei":[],"o":[{"z":"可保權益","e":"Insurable interests"},{"z":"最高誠信","e":"Utmost good faith"},{"z":"近因","e":"Proximate cause"},{"z":"代位權","e":"Subrogation"}],"a":1,"x":"承保人可以透過很多方法和渠道，例如投保書，獲取擬保風險的重要事實的詳情。"},{"id":"B368","ch":2,"ref":"2.1.3","t":1,"s":"b5y","q":"以下哪項或哪些資料屬於投買汽車保險時的重要範圍？","qi":["投保人的詳細資料，例如：姓名、地址","投保人的職業","投保人的年齡","投保人的損失 / 索償經歷"],"qe":"Which of the following are important aspects when purchasing a motor insurance?","qei":["Details of the insured, such as name, address","Occupation of the insured","Age of the insured","Losses/claims history of the insured"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":3,"x":"保險經歷、投保人的詳情、損失／索償經歷及被保險人所作的估值都是擬定投保書的內容。"},{"id":"B369","ch":2,"ref":"2.1.4(a)","t":1,"s":"by","q":"以下哪項一般保險業務，填妥的投保書是唯一的資料來源？","qi":[],"qe":"A completed proposal is the only information source for which of the following general insurance business?","qei":[],"o":[{"z":"火險","e":"Fire insurance"},{"z":"盜竊險","e":"Theft insurance"},{"z":"汽車保險(私家車)","e":"Motor insurance (private vehicle)"},{"z":"公眾責任","e":"Public liability"}],"a":2,"x":"某些業務類別（大多數是個人險種，例如私家車）的投保書，基本上是核保資料的唯一來源。"},{"id":"B370","ch":2,"ref":"2.2.1","t":1,"s":"b","q":"以下哪項或哪些有關保險報價的說明是正確的？","qi":[],"qe":"Which one or more of the following statements regarding insurance quotation is/are true?","qei":[],"o":[{"z":"它以書面或口頭形式出現","e":"They must always be in writing or by communication"},{"z":"它可以涉及有關保費及（或）合約條款","e":"They may regarding to the premium and/or contract terms"},{"z":"在法律上，要求一項報價可視為一項合約的要約","e":"Requesting a quotation is regarded at law as a contract offer"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"以報價的形式提供，其中包括以下一種或多種特點：(a) 可以是書面或口頭的；(b)可以只涉及設想中的保費，或同時提及其他的合約條款；(c)報價可能被視為可供承約的要約行為，因此必須在採用「報價」等詞及草擬報價單的文字時特別小心。"},{"id":"B371","ch":2,"ref":"2.2.1","t":1,"s":"by","q":"由客人查詢，經保險公司以書面發出但並不代表實際保費的稱為：","qi":[],"qe":"As enquired by client, issued in writing by insurance company but does not represent the actual premium is called:","qei":[],"o":[{"z":"報價","e":"Quotation"},{"z":"建議書","e":"Recommendation"},{"z":"投保書","e":"Proposal"},{"z":"保單","e":"Policy"}],"a":0,"x":"報價可以只涉及設想中的保費，或同時提及其他的合約條款"},{"id":"B372","ch":2,"ref":"2.2.1","t":1,"s":"b","q":"在一般保險中的報價是：","qi":[],"qe":"In general insurance, quotation is:","qei":[],"o":[{"z":"被保險中給投保人的；","e":"Given to the insured by the insurer"},{"z":"所有經安排的合約，均有這個特別項目","e":"All arranged contracts have this special item"},{"z":"表示保險人接納投保人的要約；","e":"Represents insurer accepts the offer of the insured"},{"z":"在法律上代表保險人發出的一項正式要約","e":"Legally represents the insurer issues a formal offer"}],"a":3,"x":"報價可能被視為可供承約的要約行為，因此必須在採用「報價」等詞及草擬報價單的文字時特別小心。"},{"id":"B373","ch":2,"ref":"2.2.1","t":1,"s":"b","q":"以下哪項是對報價的不正確描述？","qi":[],"qe":"Which of the following is incorrect in describing quotation?","qei":[],"o":[{"z":"可以是書面或口頭","e":"It can be in writing or verbal"},{"z":"這代表保險人的一項要約","e":"It represents an offer from insurer"},{"z":"內容只可作為參考用途","e":"Content is for reference only"},{"z":"當中涉及的保費已是最終的決定","e":"The premium involved is finalized"}],"a":3,"x":"報價可能被視為可供承約的要約行為，而不是最終決定。"},{"id":"B374","ch":2,"ref":"2.2.2","t":1,"s":"b","q":"以下哪項關於投保書的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing proposals?","qei":[],"o":[{"z":"保單一經批核，便不需要保存投保書","e":"Once the policy is approved, there is no need to keep the proposal"},{"z":"有時可能是核保的唯一資料來源","e":"Sometimes can be the only information source for underwriting"},{"z":"專家的報告被視為投保書的輔助文件","e":"Reports from experts can be the supplementary documents in a proposal"},{"z":"投保書的資料及聲明是合約的基礎","e":"Information of proposal and declaration are the basis for a contract"}],"a":0,"x":"已完成的投保書擔當着重要的角色，所以它不應被視為暫時性的文件。"},{"id":"B375","ch":2,"ref":"2.2.2","t":1,"s":"b3","q":"以下哪一項關於投保書是不正確的？","qi":[],"qe":"Which of the following is incorrect about proposals?","qei":[],"o":[{"z":"空白表格不是保險人所發出的合約要約","e":"Blank forms are not an offer of the contract issued by insurer"},{"z":"它有時是核保的資料來源","e":"Sometimes it can be the information source for underwriting"},{"z":"它是由保險中介人所設計及印製的","e":"It is designed and printed by insurance intermediaries"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"投保書由保險人所設計及印製的。"},{"id":"B376","ch":2,"ref":"2.2.2","t":1,"s":"b","q":"以下哪項對於投保書的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing proposals?","qei":[],"o":[{"z":"在核保之後便失去功用","e":"Loses its function after underwriting"},{"z":"於續保時才有功用","e":"Is useful only at renewal"},{"z":"屬於主要文件，而任何附加資料亦視作投保書一部份","e":"Is a major document, and any supplementary information is part of the proposal"},{"z":"完全沒用，可隨時丟棄","e":"Completely useless and can be discarded any time"}],"a":2,"x":"已完成的投保書擔當着重要的角色，所以它不應被視為暫時性的文件。一些保險人在寄發保單文件的同時，也會附上已填妥的投保書的副本，以提醒被保險人他自己曾經提供過什麽資料，而且這些資料已成為保險人所作承諾的基礎。"},{"id":"B377","ch":2,"ref":"2.2.2","t":1,"s":"b","q":"在火險或意外險的投保書的聲明:","qi":[],"qe":"Statement in the fire or accident insurance proposal form:","qei":[],"o":[{"z":"是用來延伸最高誠信的責任","e":"is used to extend the liability of utmost good faith"},{"z":"令全部投保書和合約都受制於最高誠信","e":"All proposal forms and contracts are subject to the utmost good faith"},{"z":"要獨立証人見証","e":"require independent witnesses"},{"z":"以上全部皆不是","e":"None of the above"}],"a":0,"x":"投保書的資料是保險人獲取擬保風險的重要事實的詳情。"},{"id":"B378","ch":2,"ref":"2.2.2(c)","t":1,"s":"b","q":"導致一般保險合約的訂立及形成保險人承諾基礎的資料主要來源：","qi":[],"qe":"The major information source leading to the set up of insurance contract and the basis for the promise of insurer is:","qei":[],"o":[{"z":"保單","e":"Policy"},{"z":"保險保證","e":"Warranty"},{"z":"暫保單","e":"Cover notes"},{"z":"填妥的投保書","e":"Completed proposal"}],"a":3,"x":"投保書上提供的資料是承保人可用於核保決定的主要資料。"},{"id":"B379","ch":2,"ref":"2.2.2(c)","t":1,"s":"by","q":"簽發的投保書交給保險人後：","qi":[],"qe":"Once a proposal is issued to the insurer:","qei":[],"o":[{"z":"保單便具有約束力","e":"Policy is binding"},{"z":"投保書的作用便完成，可以棄置","e":"The function of proposal is completed and can be discarded"},{"z":"保險人不可再索取進一步資料","e":"Insurer cannot ask for more information"},{"z":"保險人應好好保存，供日後作參考之用","e":"Insurer should keep the document properly for future reference"}],"a":3,"x":"投保書對合約而言擔當着重要的角色，所以它不應被視為暫時性的文件。正由於它的重要性，一些保險人在寄發保單文件的同時，也會附上已填妥的投保書的副本，以提醒被保險人他自己曾經提供過什麽資料，而且這些資料已成為保險人所作承諾的基礎。"},{"id":"B380","ch":2,"ref":"2.2.2(e)","t":1,"s":"b35y","q":"在一般保險的業務來說，除了投保書，還有額外的文件(如專家報告)，這文件：","qi":[],"qe":"In the business of general insurance, apart from proposal there are additional documents (e.g. experts' reports) and they are:","qei":[],"o":[{"z":"不構成投保書的一部份","e":"Not considered part of the proposal"},{"z":"屬例行公事，對保單的風險評估並無作用","e":"Routine business, have no use on risk assessment of the policy"},{"z":"通常由投保人提供及支付有關費用","e":"Related expenses usually paid by insurer"},{"z":"構成投保書的一部份，並須知會投保人","e":"Part of the proposal and must inform the insured"}],"a":3,"x":"任何專家的報告或其他文件必須視為投保書的一部分，這個事實應該讓投保人加以注意。"},{"id":"B381","ch":2,"ref":"2.2.3(a)","t":1,"s":"by","q":"以下哪項是對暫保單的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing cover note?","qei":[],"o":[{"z":"暫保單是暫時性的文件，會被保單取代","e":"Cover note is a temporary document and to be replaced by policy"},{"z":"它與保單憑証的性質完全相同","e":"Its nature is the same as certificate of insurance"},{"z":"它視乎投保書的資料是否足夠","e":"It depends on whether there is sufficient information of the proposal"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"暫保單是一份暫時性的文件，它實際上構成一份暫時性保單。"},{"id":"B383","ch":2,"ref":"2.2.3(c)(i)","t":1,"s":"b","q":"以下哪一項有關保險憑證是正確的？","qi":[],"qe":"Which of the following is correct about certificates of insurance?","qei":[],"o":[{"z":"其功能與暫保單相似","e":"Its function is similar to cover notes"},{"z":"是一份額外之永久性文件","e":"Is a separate permanent document"},{"z":"此乃強制性保險之憑證","e":"It is proof of compulsory insurance"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"以上三項均為保險憑證的元素。"},{"id":"B384","ch":2,"ref":"2.2.3(b)","t":1,"s":"by","q":"以下哪項對保險單的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing policies?","qei":[],"o":[{"z":"它是以蓋印形式簽發的","e":"It is issued by seal"},{"z":"它一經簽發便不可取消","e":"Once issued, it cannot be cancelled"},{"z":"它是保險合約的證據","e":"It is the evidence of the contract"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"在法律上，保單的正確性是可以被質疑的，但是法律一般假設合約的內容已顯示了各方的意圖，除非能提出有力證據以作反證。"},{"id":"B385","ch":2,"ref":"2.2.3(b)","t":1,"s":"by","q":"一般保險中，保險的證據的基本文件是：","qi":[],"qe":"In general insurance, the basic document for evidence of insurance is:","qei":[],"o":[{"z":"保單","e":"Policy"},{"z":"暫保單","e":"Cover note"},{"z":"投保書","e":"Proposal"},{"z":"保險憑證","e":"Certificate of insurance"}],"a":0,"x":"保險單（或稱保單）是無形的保險合約的有形證據—一項最正式、最常用的證據。"},{"id":"B386","ch":2,"ref":"2.2.3(b)","t":1,"s":"by","q":"已簽發的保險單：","qi":[],"qe":"Insurance policies issued:","qei":[],"o":[{"z":"會取代暫保單","e":"Will replace cover notes"},{"z":"可結合其他附加文件(投保書)成為整體合約的一部份","e":"Can integrate with other supplementary documents (proposal) to be part of the entire contract"},{"z":"會被視為合約的証據","e":"Will be regarded as evidence of the contract·|"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"保單是合約的證據，主要收納其他資料以及取代任何暫保單。"},{"id":"B388","ch":2,"ref":"2.3.1(b)(i)","t":1,"s":"b3y","q":"在一般保險中，一份典型之「承保表」包括","qi":[],"qe":"In General insurance, which of the following is/are included in 'The Schedule'","qei":[],"o":[{"z":"保單編號","e":"policy number"},{"z":"被保人之姓名","e":"Name of the insured"},{"z":"標的物之描述","e":"description of the subject matter of insurance"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"承保表包含了:保單編號、被保險人的詳細資料、保單限額、有效期、保險標的的描述、保費、保險中介人的身份、任何適用的特別條款、該合約適用的任何額外利益及任何保險批單。"},{"id":"B389","ch":2,"ref":"2.2.3(c)","t":1,"s":"by","q":"在一般保險中一種屬於合約期內的永久性文件，經常用於證明強制保險的存在，這種文件是：","qi":[],"qe":"In general insurance, a permanent document within the contractual period which is used as proof of the existence of compulsory insurance. This document is called:","qei":[],"o":[{"z":"保險憑證","e":"Certificate of insurance"},{"z":"保單","e":"Policy"},{"z":"暫保單","e":"Cover note"},{"z":"投保書","e":"Proposal"}],"a":0,"x":"對有必要知道法例強制的汽車或遊艇保險是否存在的人（例如警方）而言，保險憑證是唯一法律認可的證明。"},{"id":"B390","ch":2,"ref":"2.2.3(c)","t":1,"s":"by","q":"以下哪項保險會提供保險憑證？","qi":[],"qe":"Which of the following insurance will provide certificate of insurance?","qei":[],"o":[{"z":"船上貨物保險","e":"Marine cargo insurance"},{"z":"旅遊保險","e":"Travel insurance"},{"z":"汽車保險","e":"Motor insurance"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"汽車、旅遊及海上貨物保險亦會發出保險憑證。"},{"id":"B391","ch":2,"ref":"2.2.3(c)","t":1,"s":"b","q":"以下哪類保險不會預期以保險憑證發出？","qi":[],"qe":"Which of the following insurance is not expected to issue certificate of insurance?","qei":[],"o":[{"z":"火險","e":"Fire insurance"},{"z":"汽車保險","e":"Motor insurance"},{"z":"旅遊保險","e":"Travel insurance"},{"z":"船上貨物保險(總保險單)","e":"Marine cargo insurance (master policy)"}],"a":0,"x":"汽車、旅遊及海上貨物保險亦會發出保險憑證。"},{"id":"B392","ch":2,"ref":"2.2.3(c)(iv)","t":1,"s":"b3","q":"在某種保險類別中, 如果保單被取消, 必須取回保險憑證; 該類保險是:","qi":[],"qe":"In some insurance categories, if the policy is cancelled the certificate of insurance must be recovered. A category of such insurance is:","qei":[],"o":[{"z":"公眾責任","e":"Public liability"},{"z":"汽車","e":"Motor"},{"z":"旅遊","e":"Travel"},{"z":"海上貨物","e":"Marine cargo insurance"}],"a":1,"x":"在汽車保險中，一旦保險被取消，保險人必須索回保險憑證，這足以顯示保險憑證在法律上的重要性。"},{"id":"B393","ch":2,"ref":"2.2.4","t":1,"s":"b","q":"只要被保人已經支付全年保費:","qi":[],"qe":"As long as the insured has paid the full year’s premium:","qei":[],"o":[{"z":"他不需負責另加保費","e":"He is not responsible for additional premiums"},{"z":"若果保險人業務業績惡劣，他要支付額外保費","e":"If the insurer has poor performance, he will have to pay additional premiums"},{"z":"任何情況都不會有退回保費","e":"There will be no refund of premium under any circumstances"},{"z":"他永不有機會退回全部保費","e":"He never gets the chance to get the full premium back"}],"a":0,"x":"支付全年保費後保單持有人將不用於同年度再繳付保費。"},{"id":"B394","ch":2,"ref":"2.2.4(a)(ii)","t":1,"s":"b","q":"保險人在核保時，會區分屬於同一風險類別的個別風險的特質，從而對保費作出上下調整，這核保程序稱之為風險：","qi":[],"qe":"During underwriting, insurer will distinguish the features of individual risks falling within the same risk category, so that adjustment up or down to the broad classification premium can be made. This process of underwriting is called risk:","qei":[],"o":[{"z":"估定","e":"Assessment"},{"z":"核保","e":"Underwriting"},{"z":"類別","e":"Classification"},{"z":"差別對待","e":"Discrimination"}],"a":3,"x":"在保險核保中，「風險差別對待」已經使用了很久，並沒有任何邪惡的含義，只不過是指區分屬於同一風險類別的個別風險的特質（有好有壞），慿此來對同屬某個籠統風險類別的保費作上下的調整。"},{"id":"B395","ch":2,"ref":"2.2.4(a)(ii)","t":1,"s":"b","q":"核保人提及的所謂風險差別對待是指：","qi":[],"qe":"Risk discrimination as mentioned by underwriters is:","qei":[],"o":[{"z":"對投保表現出偏好及不好","e":"Likes and dislikes about the insured"},{"z":"選擇利益好的風險","e":"Choose profitable risks"},{"z":"調整保費作為對不同危險的獎賞及懲罰","e":"Adjust the premium as a reward or penalty for different risks"},{"z":"拒絕對商業風險的危險投保","e":"Refuse dangerous insurance of commercial risks"}],"a":2,"x":"在保險核保中，「風險差別對待」已經使用了很久，並沒有任何邪惡的含義，只不過是指區分屬於同一風險類別的個別風險的特質（有好有壞），慿此來對同屬某個籠統風險類別的保費作上下的調整。"},{"id":"B396","ch":2,"ref":"2.2.4(a)(ii)","t":1,"s":"by","q":"風險差別對待是指：","qi":[],"qe":"Risk discrimination means:","qei":[],"o":[{"z":"分辨承保的風險","e":"Distinguish the risks insured"},{"z":"確定保費的高低","e":"Adjust the premium up or down"},{"z":"釐訂保險合約的條件","e":"Determine the terms of insurance contract"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"在保險核保中，「風險差別對待」已經使用了很久，並沒有任何邪惡的含義，只不過是指區分屬於同一風險類別的個別風險的特質（有好有壞），慿此來對同屬某個籠統風險類別的保費作上下的調整。"},{"id":"B397","ch":2,"ref":"2.2.4(b)(ii)","t":1,"s":"b35y","q":"根據一般保險保單條文","qi":[],"qe":"According to the terms of general insurance policy","qei":[],"o":[{"z":"保費永遠毋須於保單生效前繳付","e":"Premium is never required to be paid before the policy is in effect"},{"z":"保費必須於保單生效前繳付","e":"Premium must be paid before the policy is in effect"},{"z":"保費不是保單合約的主要元素","e":"Premium is not a major element of policy contract"},{"z":"保費可能須要按保單條款於合約生效前繳付","e":"Premium may be required to be paid before the policy is in effect according to policy terms"}],"a":3,"x":"實際做法視乎保單措詞而定，有些保單嚴格規定，保險保障的有效性以收到保費為先決條件；其他保單可能要求被保險人「已經支付或承諾支付」保費，而被保險人過去數年一直支付保費的行為可能構成了支付保費的現行承諾。"},{"id":"B398","ch":2,"ref":"2.2.4(b)","t":1,"s":"b3","q":"以下哪項關於一般保險的保費支付的重要性的說明是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing the importance of premium payment in general insurance?","qei":[],"o":[{"z":"保費支付必須是在保險生效前","e":"Premium must be paid before the insurance is in effect"},{"z":"即使保費尚未支付，保障也可能有效","e":"Even the premium is not yet paid, the cover can be in effect"},{"z":"支付給保險代理人的保費也構成對保險人的法律責任","e":"Premium payment to insurance agent can constitute legal liability of insurer"},{"z":"有些保險條款使得保費支付成為合約生效前的先決條件","e":"Some contract terms specify payment of the premium is a condition precedent"}],"a":0,"x":"實際做法視乎保單措詞而定，有些保單嚴格規定，保險保障的有效性以收到保費為先決條件；其他保單可能要求被保險人「已經支付或承諾支付」保費，而被保險人過去數年一直支付保費的行為可能構成了支付保費的現行承諾。"},{"id":"B399","ch":2,"ref":"2.2.4(b)(iii)(1)","t":1,"s":"by","q":"一般保險中，當保費繳交予中介人時：","qi":[],"qe":"In general insurance, when premium is paid to the intermediaries:","qei":[],"o":[{"z":"在法律下是不正確的","e":"It is legally incorrect"},{"z":"代理人可獲雙倍佣金","e":"The agent will get double commission"},{"z":"還未算繳交，直至保費繳交至保險人","e":"Not considered as paid until the premium has reached the insurer"},{"z":"在法律下相等於已繳費予保險人","e":"Legally equivalent to paying the premium to insurer already"}],"a":3,"x":"實際做法視乎保單措詞而定，有些保單嚴格規定，保險保障的有效性以收到保費為先決條件；其他保單可能要求被保險人「已經支付或承諾支付」保費，而被保險人過去數年一直支付保費的行為可能構成了支付保費的現行承諾。"},{"id":"B400","ch":2,"ref":"2.2.4(b)(iii)(2)","t":1,"s":"b4y","q":"保費通常在保單生效前繳付，但如保險人慣性設有信貸安排，即使保費仍未繳交，有關的合約仍可有效。這原則叫：","qi":[],"qe":"Premium is usually paid before the policy in effect. But if the insurer normally has credit arrangement, related contract still can be effective even the premium is not paid yet. This principle is called:","qei":[],"o":[{"z":"通融","e":"Ex gratia"},{"z":"最高誠信","e":"Utmost good faith"},{"z":"不容反悔","e":"Estoppel"},{"z":"寬限期","e":"Days of grace"}],"a":2,"x":"就支付保費的準時性而言，寬免這種作為是指保險人清晰地以陳述或行為方式表示，不堅持一項明確地要求在保險保障生效前支付保費的合約規定。因此，如果保險人曾經毫不猶疑地收取過遲交的保費，他可能會被當作已經為日後準時支付保費的要求作出寬免。如果被保險人想另外引用不容反悔原則，便須證明曾經倚賴保險人上述的陳述或行為。"},{"id":"B401","ch":2,"ref":"2.2.5","t":1,"s":"by","q":"對一般保險徵收附加費的機構或計劃包括香港汽車保險局及：","qi":[],"qe":"Institutions or plans that impose a premium levy on insurance include Motor Insurers' Bureau of Hong Kong and:","qei":[],"o":[{"z":"僱員補償保障計劃","e":"Employees' Compensation Plan"},{"z":"僱員補償條例","e":"Employees' Compensation Ordinance"},{"z":"僱員補償援助計劃","e":"Employees Compensation Assistance Scheme"},{"z":"僱員補償保險局","e":"Employees Compensation Insurer Bureau"}],"a":2,"x":"僱員補償援助計劃屬徵收附加費的計劃。"},{"id":"B402","ch":2,"ref":"2.2.5","t":1,"s":"by","q":"於汽車保險中，為了保障無償債能力的汽車保險人，香港汽車保險局從汽車保單加設保費徵費。以下哪項描述是正確？","qi":[],"qe":"To cover insolvency of motor insurers, Motor Insurers' Bureau of Hong Kong imposes a premium levy on motor insurance policies. Which of the following descriptions is correct?","qei":[],"o":[{"z":"汽車保費之1%","e":"1% of the motor premiums"},{"z":"汽車保費之3%","e":"3% of the motor premiums"},{"z":"於1998已撤銷有關徵費","e":"The levy was cancelled in 1998"},{"z":"有關的徵費會存放於沒有能力償債之保險人","e":"The levy would be deposited at insurers with insolvency"}],"a":1,"x":"汽車保險局的經費來自針對保險人簽發的所有汽車保單收取的保費徵款，徵款額為汽車保費的3%。徵款不屬於保險人所有，必須轉交給汽車保險局。"},{"id":"B403","ch":2,"ref":"2.2.5","t":1,"s":"b","q":"汽車保險與僱員補償保險的保費都繳納徵費，它的目的是：","qi":[],"qe":"There is a levy imposed on the premiums of motor insurance and employees' compensation insurance, its purpose is to:","qei":[],"o":[{"z":"協助保險人應付龐大的索償額","e":"Help insurers deal with large amount of claims"},{"z":"給被保險人提供額外的保障","e":"Provide extra cover for the insured"},{"z":"在有需要時執行強制保險的目的","e":"To execute the purpose of compulsory insurance if necessary"},{"z":"為香港特別行政區增加稅收","e":"To provide extra tax income for HKSAR"}],"a":2,"x":"在處理賠償時執行強制保險的目的，向事故受害者作出補償。"},{"id":"B404","ch":2,"ref":"2.2.5(a)","t":1,"s":"by","q":"香港汽車保險局在汽車保單加設的保費徵費是為了保障：","qi":[],"qe":"The premium levy imposed by Motor Insurers' Bureau of Hong Kong on motor insurance is to cover:","qei":[],"o":[{"z":"汽車上的財產損毀","e":"Property damage in a vehicle"},{"z":"汽車造成的財產損毀","e":"Property damage caused by a vehicle"},{"z":"意外導致死亡或受傷的人","e":"Injury and death caused by an accident"},{"z":"被保險汽車的乘客","e":"Passengers of the insured vehicle"}],"a":2,"x":"該局承諾會在有不受保「法令」責任情況下介入，向交通意外事故受害者作出補償。"},{"id":"B405","ch":2,"ref":"2.2.5(a)","t":1,"s":"b","q":"由汽車保險費附加徵收的款項，用以補償由於駕駛著沒有強制性保險或事後下落不明的車輛所引致第三者傷亡，對於此徵款，下列哪項的描述是正確的？","qi":[],"qe":"The premium levy imposed on motor insurance is to compensate third party injury or death arising from motorists without compulsory insurance or hit and run motor accidents. Which of the following descriptions is correct?","qei":[],"o":[{"z":"此徵收款項為汽車保費的百分之一","e":"Premium levy is 1% of the motor premiums"},{"z":"為無恥的保險人所引致的受害人提供補償","e":"To provide compensation to victims of shameless insurers"},{"z":"此徵款將於不久將來後取消","e":"The levy will be cancelled in the near future"},{"z":"以上各項皆正確","e":"All of the above are correct"}],"a":0,"x":"汽車保險局的經費來自針對保險人簽發的所有汽車保單收取的保費徵款，徵款額為汽車保費的3%。徵款不屬於保險人所有，必須轉交給汽車保險局。"},{"id":"B406","ch":2,"ref":"2.2.5(b)","t":1,"s":"by","q":"香港汽車保險局是在強制性汽車保險不存在時支持貫徹這類保險的原意。以下哪項是僱員補償保險與強制性汽車保險的目的相同？","qi":[],"qe":"Motor Insurers' Bureau of Hong Kong supports the principle of levies when there is non-existence of compulsory insurance. Which of the following has the common purpose shared between employees' compensation insurance and compulsory motor insurance?","qei":[],"o":[{"z":"香港保險業聯會","e":"The Hong Kong Federation of Insurers"},{"z":"僱主責任援助計劃","e":"Employers Responsibility Assistance Scheme"},{"z":"僱員補償保險局","e":"Employees Compensation Insurer Bureau"},{"z":"僱員補償援助計劃","e":"Employees Compensation Assistance Scheme"}],"a":3,"x":"僱員補償援助計劃屬與香港汽車保險局相似的機構。"},{"id":"B408","ch":2,"ref":"2.3","t":1,"s":"by","q":"在普通法中一般保險保單措詞：","qi":[],"qe":"In common law, the policy wording of general insurance:","qei":[],"o":[{"z":"是不受規管的","e":"Is not regulated"},{"z":"受政府規管及規定","e":"Is subject to government's rules and regulations"},{"z":"人身意外保單才受規管","e":"Only personal accident policies are regulated"},{"z":"強制保單才受規管","e":"Only compulsory insurance policies are regulated"}],"a":0,"x":"在香港，保單措詞不受規管，保險人因此可以自由地設計和出售自己的產品。"},{"id":"B409","ch":2,"ref":"2.3.1(a)","t":1,"s":"b4y","q":"「淺白英語」保單通常適用於那類保單？","qi":[],"qe":"\"\"Plain English\"\" policy form is applicable to which types of insurance policies?","qei":[],"o":[{"z":"個人保險保單","e":"Personal lines insurance policy"},{"z":"責任保險保單","e":"Liability insurance policy"},{"z":"商業保險保單","e":"Commercial insurance policy"},{"z":"強制性保險保單","e":"Compulsory insurance policy"}],"a":0,"x":"為了顯得更為「用家方便」，保單文件都用第一或第二身寫成，而非不帶個人感情的第三身。因此它採用「我們」和「你們」，而不是「本公司」和「該被保險人」等字眼。保單相當可能製成體積細小的小冊子，有時還會加進插圖及卡通畫。這種形式的保單多數用於個人險種，而非商業風險。"},{"id":"B410","ch":2,"ref":"2.3.1(a)","t":1,"s":"by","q":"在保險條款中, 「淺白英語」的新表達方式, 那個描述是正確?","qi":[],"qe":"Which of the following is correct in describing \"\"plain English\"\" policy forms in insurance terms?","qei":[],"o":[{"z":"它們的原意是為了「用家方便」","e":"Their original intention is for \"\"user-friendly\"\""},{"z":"傾向於利用「我們」或「你們」的表達方式","e":"Tend to use expressions like \"\"we\"\" or \"\"you\"\""},{"z":"多數用於「個人險種」而非商用險種","e":"Mostly used for \"\"personal lines insurance\"\" and not commercial lines insurance"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"為了顯得更為「用家方便」，保單文件都用第一或第二身寫成，而非不帶個人感情的第三身。因此它採用「我們」和「你們」，而不是「本公司」和「該被保險人」等字眼。保單相當可能製成體積細小的小冊子，有時還會加進插圖及卡通畫。這種形式的保單多數用於個人險種，而非商業風險。"},{"id":"B411","ch":2,"ref":"2.3.1(a)","t":1,"s":"b345","q":"保單中使用「淺白英語」是因為：","qi":[],"qe":"Policies use \"\"plain English\"\" because:","qei":[],"o":[{"z":"用家方便","e":"User-friendly"},{"z":"配合法律文件中正式的傳統用語","e":"To tie in with the formal and traditional terms in legal documents"},{"z":"方便以第三身去表達保單中的內文","e":"To facilitate the use of third person to express the content of the policy"},{"z":"只適用於商業保險，而非個人險種","e":"Applicable only to commercial insurance, not personal lines insurance"}],"a":0,"x":"為了顯得更為「用家方便」，保單文件都用第一或第二身寫成，而非不帶個人感情的第三身。"},{"id":"B412","ch":2,"ref":"2.3.1(a)","t":1,"s":"b","q":"只提供給個人而不提供給商業組織的一般保險業務類別，稱為？","qi":[],"qe":"Classes of general insurance which insured individuals, rather than commercial organizations, are often called?","qei":[],"o":[{"z":"個人險種保險","e":"Personal lines insurance"},{"z":"私人保險","e":"Private insurance"},{"z":"非公司保險","e":"Non-corporate insurance"},{"z":"私人保單持有人保險保障","e":"Private policy-holder cover"}],"a":0,"x":"個人險種保險屬個人一般保險類別。"},{"id":"B413","ch":2,"ref":"2.3.1(b)","t":1,"s":"by","q":"以下哪項不會包含於承保表中？","qi":[],"qe":"Which of the following will not be included in policy schedules?","qei":[],"o":[{"z":"被保人的姓名、地址及年齡","e":"Name, address and age of the insured"},{"z":"仲裁條款","e":"Arbitration clauses"},{"z":"保額","e":"Sums insured"},{"z":"標的物的描述","e":"Description of subject matter"}],"a":1,"x":"承保表包含了:保單編號、被保險人的詳細資料、保單限額、有效期、保險標的的描述、保費、保險中介人的身份、任何適用的特別條款、該合約適用的任何額外利益及任何保險批單。"},{"id":"B414","ch":2,"ref":"2.3.1(b)(i)","t":1,"s":"by","q":"保單中會包括被保人的姓名、地址、職業及年齡等資料的部份稱為","qi":[],"qe":"In an insurance policy, the part that contains information like the name, address, occupation and age of the insured is called:","qei":[],"o":[{"z":"承保表","e":"The Schedule"},{"z":"敘文條款","e":"Recital clause"},{"z":"履行條款","e":"Operative clause"},{"z":"保單條件","e":"Policy condition"}],"a":0,"x":"承保表包含了:保單編號、被保險人的詳細資料、保單限額、有效期、保險標的的描述、保費、保險中介人的身份、任何適用的特別條款、該合約適用的任何額外利益及任何保險批單。"},{"id":"B415","ch":2,"ref":"2.3.1(b)(ii)","t":1,"s":"b3y","q":"承保表式的保單格式的敘文條款，較可能包含：","qi":[],"qe":"The recital clauses of scheduled policy forms are likely to include:","qei":[],"o":[{"z":"被保險人的姓名及地址","e":"Name and address of the insured"},{"z":"被保險標的物的完整描述","e":"Complete description of the subject matter insured"},{"z":"對投保書及聲明的參照","e":"Reference for the proposal form and declaration"},{"z":"以上各項皆是","e":"All of the above"}],"a":2,"x":"敘文條款這個名稱不會出現在保單文件中，但是它實際上是個介紹有關合約的引子。它會提及合約方，還會提述投保書及聲明，視它們為合約的一部分，及合約的基礎。"},{"id":"B416","ch":2,"ref":"2.3.1(b)(iii)","t":1,"s":"by","q":"在一般保險保單中，履行條款說明了怎樣可以得到保障的情況，這條款又稱為：","qi":[],"qe":"In general insurance policy, operative clause indicates the circumstances under which the cover is operative. This clause is also called:","qei":[],"o":[{"z":"見證條款","e":"Attestation clause"},{"z":"敘文條款","e":"Recital clause"},{"z":"保單條件","e":"Policy condition"},{"z":"承保條款","e":"Insuring clause"}],"a":3,"x":"履行條款表明在什麽情況下承保的承諾將得以履行（因此，有時也被稱為承保條款）。"},{"id":"B417","ch":2,"ref":"2.3.1(b)(iii)","t":1,"s":"b34y","q":"在「承保表式」保單中，概述在甚麼情況下可以作出有效的索償的部份(有時會包括它本身的除外責任)稱為：","qi":[],"qe":"In \"\"scheduled policy forms\"\", the part that indicates the circumstances under which the cover is operative (sometimes include the exclusions) is called:","qei":[],"o":[{"z":"常用保單除外責任","e":"Common policy exceptions"},{"z":"保單附表","e":"Policy appendix"},{"z":"敘文條款","e":"Recital clause"},{"z":"履行條款","e":"Operative clause"}],"a":3,"x":"履行條款它指明了受保的危險或指出保障範圍屬於「全險」。"},{"id":"B418","ch":2,"ref":"2.3.1(b)(iv)","t":1,"s":"b","q":"承保表式保單中的一般不受保項目是指：","qi":[],"qe":"General exceptions in scheduled policy forms usually means:","qei":[],"o":[{"z":"適用於整份合約的不保項目","e":"Exclusions applicable to the whole contract"},{"z":"又名除外責任","e":"Also called exclusions"},{"z":"附帶條件","e":"Provisos"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"履行條款中的不同部分可以有本身的通用除外責任，適用於各種索償或保險金要求。「通用除外責任」這個標題在保單中明確可見，不過還可以另外使用「除外責任」或（較少用的）「附帶條件」等兩個名稱。"},{"id":"B419","ch":2,"ref":"2.3.1(b)(iv)","t":1,"s":"by","q":"保單內之「通用除外責任項目」是：","qi":[],"qe":"The \"\"General exceptions\"\" in a policy are:","qei":[],"o":[{"z":"適用於某個部份的有關保障","e":"Applicable to certain part of the cover"},{"z":"適用於整份保險合約","e":"Applicable to the whole insurance contract"},{"z":"只適用於敘文條款的保障","e":"Applicable only to the cover of recital clause"},{"z":"只適用於限制履行條款的保障","e":"Applicable only to limit the cover of operative clause"}],"a":1,"x":"通用除外責任意思是指此類除外責任適用於整個合約（即保單的每個部分）。"},{"id":"B420","ch":2,"ref":"2.3.1(b)(iv)","t":1,"s":"by","q":"保單中的哪個部份會拒絕承認保單中每個部份的保障？","qi":[],"qe":"Which part of the policy will refuse to confirm each cover of the policy?","qei":[],"o":[{"z":"履行條款","e":"Operative clause"},{"z":"敘文條款","e":"Recital clause"},{"z":"承保表","e":"Schedule"},{"z":"通用除外責任項目","e":"General exceptions"}],"a":3,"x":"通用除外責任意思是指此類除外責任適用於整個合約（即保單的每個部分）。"},{"id":"B421","ch":2,"ref":"2.3.2(a)","t":1,"s":"b4y","q":"在一般保險單中，保單條件：","qi":[],"qe":"In general insurance policy, policy conditions:","qei":[],"o":[{"z":"可以是明訂，也可以是隱含的","e":"Can be specified or implied"},{"z":"總是出現於保單中","e":"Always appear in a policy"},{"z":"總是隱含的（不會出現於保單中）","e":"Always implied (not appear in the policy)"},{"z":"於保險的保單中所有保險公司的都是一樣","e":"Same for all insurers in the insurance policy"}],"a":0,"x":"所有保險合約都設有一些除外責任；即使上述類型的除外責任沒有在保單文件中出現，但總會存在着某些由法律隱含的附帶條件。"},{"id":"B422","ch":2,"ref":"2.3.2(a)","t":1,"s":"b","q":"以下哪項是對保單的正確說明？","qi":[],"qe":"Which of the following is correct in describing policies?","qei":[],"o":[{"z":"隱含條款及明訂條款均不適用","e":"Implied terms and specified terms are not applicable"},{"z":"隱含條款是適用的，但不會於保單中列出","e":"Implied terms are applicable, but will not be listed in the policy"},{"z":"明訂條款比隱含條款更為重要","e":"Specified terms are more important than implied terms"},{"z":"隱含條款及明訂條款會於保單中列出","e":"Implied terms and specified terms will be listed in the policy"}],"a":1,"x":"所有保險合約都設有一些除外責任；即使上述類型的除外責任沒有在保單文件中出現，但總會存在着某些由法律隱含的附帶條件。"},{"id":"B423","ch":2,"ref":"2.3.2(a)","t":1,"s":"by","q":"適用於保單內各個部份的保單限制, 較可能出現於:","qi":[],"qe":"Policy limitations applicable to all parts of the policy are likely to appear in:","qei":[],"o":[{"z":"通用除外責任項目","e":"General exceptions"},{"z":"敘文條款","e":"Recital clause"},{"z":"保單附表","e":"Policy appendix"},{"z":"見證條款","e":"Attestation clause"}],"a":0,"x":"通用除外責任項目是保單限制中其中一個元素。"},{"id":"B424","ch":2,"ref":"2.3.2(a)","t":1,"s":"by","q":"以下哪項是形容保單除外責任？","qi":[],"qe":"Which of the following describes policy exceptions?","qei":[],"o":[{"z":"總是在保單每個項目中出現","e":"Always appear in every item of the policy"},{"z":"總是在保單其中一個項目中出現","e":"Always appear in one of the items of the policy"},{"z":"不會出現在保單中","e":"Never appears in the policy"},{"z":"以上各項皆不正確","e":"All of the above are incorrect"}],"a":3,"x":"除外責任可以適用於整個合約（「通用除外責任」），或僅從個別保單部分剔除部分保險保障（「部分的除外責任」）。"},{"id":"B425","ch":2,"ref":"2.3.2(b)","t":1,"s":"b5","q":"以下哪項或哪些保單條款，會出現於一般保險的保單中？","qi":[],"qe":"Which of the following policy terms will appear in a general insurance policy?","qei":[],"o":[{"z":"仲裁","e":"Arbitration"},{"z":"取消","e":"Cancellation"},{"z":"索償條款","e":"Claims"},{"z":"以上所列各項","e":"All of the above"}],"a":3,"x":"索償或保險金要求、仲裁、取消、比例分攤、保單修改法律狀況及可調整的保費都均為保單條款元素。"},{"id":"B426","ch":2,"ref":"2.3.2(b)","t":1,"s":"b3","q":"以下哪項不是一般保險單的條件","qi":[],"qe":"Which of the following is not a policy condition?","qei":[],"o":[{"z":"仲裁條款","e":"Arbitration"},{"z":"取消條款","e":"Cancellation"},{"z":"需要可保權益","e":"Required insurable interest"},{"z":"索償條款","e":"Claims"}],"a":2,"x":"索償或保險金要求、仲裁、取消、比例分攤、保單修改法律狀況及可調整的保費都均為保單條款元素。"},{"id":"B427","ch":2,"ref":"2.3.2(a)","t":1,"s":"by","q":"最高誠信及可保權益這兩個保險原則是屬於哪種保單條款？","qi":[],"qe":"The principles of utmost good faith and insurable interests belong to which policy terms?","qei":[],"o":[{"z":"履行條款","e":"Operative clause"},{"z":"敘文條款","e":"Recital clause"},{"z":"隱含條款","e":"Implied clause"},{"z":"明訂條款","e":"Specified clause"}],"a":2,"x":"最高誠信及可保權益為隱含條款，被保人於投保時須遵守有關保險原則而保單中可能沒有列明之保險原則。"},{"id":"B428","ch":2,"ref":"2.3.2(b)","t":1,"s":"b","q":"以下哪項或哪些保單條件，相當可能出現於香港簽發的一般保險保單中？","qi":[],"qe":"Which of the policy conditions is likely to appear in the general insurance policies issued in Hong Kong?","qei":[],"o":[{"z":"仲裁","e":"Arbitration"},{"z":"取消","e":"Cancellation"},{"z":"索償條款","e":"Claims"},{"z":"上述所有各項","e":"All of the above"}],"a":3,"x":"索償或保險金要求、仲裁、取消、比例分攤、保單修改法律狀況及可調整的保費都均為保單條款元素。"},{"id":"B429","ch":2,"ref":"2.3.2(b)","t":1,"s":"b","q":"以下那項/保單條件常見於一般保險保單:","qi":[],"qe":"Which of the following items/policy conditions are commonly found in general insurance policies:","qei":[],"o":[{"z":"仲裁","e":"Arbitration"},{"z":"取消","e":"Cancellation"},{"z":"索償金額","e":"Claims Amount"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"保單條件或條件包括:索償或保險金要求、仲裁、取消、比例分攤、保單修改法律狀況及可調整保費。"},{"id":"B430","ch":2,"ref":"2.3.2(b)(ii)","t":1,"s":"by","q":"下列哪項是香港保單上常見的條件？","qi":[],"qe":"Which of the following is a common condition of policies issued in Hong Kong?","qei":[],"o":[{"z":"最高誠信","e":"Utmost good faith"},{"z":"仲裁","e":"Arbitration"},{"z":"保單除外責任","e":"Policy exclusions"},{"z":"可保權益","e":"
