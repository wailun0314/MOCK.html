"ref":"4.4(b)","t":1,"s":"by","q":"《保險業條例》對保險人的嚴格要求不包括：","qi":[],"qe":"The strict requirements of Insurance Companies Ordinance regarding insurance companies exclude:","qei":[],"o":[{"z":"保險人的授權","e":"Authorization of insurer"},{"z":"股本規定","e":"Capital requirement"},{"z":"盈利指標","e":"Profit index"},{"z":"償付能力的規定","e":"Solvency margin requirement"}],"a":2,"x":"盈利指標不是《保險業條例》對保險公司作出了若干嚴格的要求。"},{"id":"B579","ch":4,"ref":"4.4(c)","t":1,"s":"by","q":"以下那個或哪些機構制定《承保商專業守則》？","qi":[],"qe":"Which of the following issued the \"\"Code of Conduct for Insurers\"\"?","qei":[],"o":[{"z":"保險業條例","e":"Insurance Ordinance"},{"z":"保險業監督","e":"Insurance Authority"},{"z":"香港保險業聯會","e":"The Hong Kong Federation of Insurers"},{"z":"以上各項","e":"All of the above"}],"a":2,"x":"《承保商專業守則》這套守則由香港保險業聯會制定。"},{"id":"B580","ch":4,"ref":"4.4(c)","t":1,"s":"b","q":"以下哪項是對承保商專業守則的不正確描述？","qi":[],"qe":"Which of the following is incorrect in describing the \"\"Code of Conduct for Insurers\"\"?","qei":[],"o":[{"z":"它由香港保險業聯會制定","e":"It was issued by The Hong Kong Federation of Insurers"},{"z":"它通用於香港居民以個人身份作為保單持有人的個人保單","e":"It applies to personal insurances effected by individual policyholders resident in Hong Kong"},{"z":"它適用於所有個人保單","e":"It applies to all personal policies"},{"z":"以上各項皆是","e":"All of the above"}],"a":2,"x":"《承保商專業守則》由香港保險業聯會制定。"},{"id":"B581","ch":4,"ref":"4.4(c)","t":1,"s":"by","q":"《承保商專業守則》由香港保險業聯會制定，適用於：","qi":[],"qe":"The \"\"Code of Conduct for Insurers\"\" was issued by The Hong Kong Federation of Insurers, which applies to:","qei":[],"o":[{"z":"個人及商業保險的保單持有人的保單","e":"Policies effected by individual and corporate policyholders"},{"z":"於任何地方簽發，以個人為保單持有人的個人保單","e":"Policies effected by individual policyholders which are issued from anywhere"},{"z":"於香港簽發，以個人為保單持有人的個人保單","e":"Policies effected by individual policyholders which are issued in Hong Kong"},{"z":"於香港簽發，以個人或公司作為保單持有人的個人保單","e":"Policies effected by individual or corporate policyholders which are issued in Hong Kong"}],"a":2,"x":"《承保商專業守則》適用於在香港簽發，由香港居民以個人身份，只為私人用途購買的保單。"},{"id":"B582","ch":4,"ref":"4.4(c)","t":1,"s":"by","q":"以下哪項的內容是涉及提供建議及銷售慣例？","qi":[],"qe":"Which of the following relates to advising and selling practices?","qei":[],"o":[{"z":"保險業條例","e":"Insurance Ordinance"},{"z":"承保商專業守則","e":"Code of Conduct for Insurers"},{"z":"保險代理管理守則","e":"The Code of Practice for the Administration of Insurance Agents"},{"z":"標準代理合約","e":"Standard Agency Contract"}],"a":1,"x":"《承保商專業守則》旨於推廣保險業界的良好慣例，以及加強消費者認識保險服務應有的水平。"},{"id":"B583","ch":4,"ref":"4.4(c)","t":1,"s":"b","q":"《承保商專業守則》包括優良保險慣例的部份。這部份處理以下哪類的事情？","qi":[],"qe":"The \"Code of Conduct for Insurers\" includes a section on good insurance practices. This section deals with which of the following?","qei":[],"o":[{"z":"承保及索償","e":"Underwriting and claims"},{"z":"客戶的權益及需負的責任","e":"Customers' rights and obligations"},{"z":"廣泛的顧客權利及權益","e":"Customers' rights and interests generally"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"《承保商專業守則》為保險人就多個範疇提供標準，包括:(i) 提供建議及銷售慣例(ii) 索償(iii) 保險代理人的管理(iv) 僱員管理(v) 保險人違規行為(vi) 查詢、投訴及糾紛"},{"id":"B584","ch":4,"ref":"4.4(c)","t":1,"s":"b","q":"以下那項對《承保商專業守則》的說明是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing the \"Code of Conduct for Insurers\"?","qei":[],"o":[{"z":"它適用於香港居民以個人身份作為保單持有人","e":"It was effected by individual policyholders resident in Hong Kong"},{"z":"它適用於個人保險","e":"It was applied to personal insurances"},{"z":"所有保險必須在承保商專業守則範圍之內","e":"All the insurances must within the scope of the Code of Conduct for Insurers"},{"z":"這套守則由香港保險業聯會制定","e":"This Code was introduced by The Hong Kong Federation of Insurers"}],"a":2,"x":"這套守則由香港保險業聯會制定，適用於在香港簽發，由香港居民以個人身份，只為私人用途購買的保單，旨於推廣保險業界的良好慣例，以及加強消費者認識保險服務應有的水平。"},{"id":"B585","ch":4,"ref":"4.4(d)","t":1,"s":"by","q":"以下哪項刊載保險代理人及保險經紀的角色及責任，並包括定義及不適當地自稱為其中一種中介人的處分的法定條例？","qi":[],"qe":"Which of the following publishes the roles and responsibilities of insurance agents and insurance brokers, and their definitions with prescribed penalties for anyone illegally claiming to be one or the other?","qei":[],"o":[{"z":"標準代理合約","e":"Standard agency contract"},{"z":"承保商專業守則","e":"The Code of Conduct for Insurers"},{"z":"保險業條例","e":"Insurance Ordinance"},{"z":"保險代理管理守則","e":"The Code of Practice for the Administration of Insurance Agents"}],"a":2,"x":"《保險業條例》從法規上確定了對持牌保險中介人所作的規定的重要性。"},{"id":"B586","ch":4,"ref":"4.4(f)","t":1,"s":"b","q":"《持牌保險代理人操守守則》的9個一般原則部份包括：","qi":["誠實及持正","公平行事","資料披露","公司管治與管控及程序"],"qe":"The nine general principles of the Code of Conduct for Licensed Insurance Agents include:","qei":["Honesty and integrity","Act fairly","Information disclosure","Corporate Governance and Control and Procedures\""],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":3,"x":"一般原則有以下 9 個部份；(1) 誠實及持正；(2) 公平行事並符合客戶的最佳利益；(3) 以謹慎、技巧和努力行事；(4) 勝任提供意見；(5) 資料披露；(6) 意見的合適性；(7) 利益衝突；(8) 客戶資產；及(9) 公司管治與管控及程序。"},{"id":"B587","ch":4,"ref":"4.4(g)","t":1,"s":"b5","q":"保險經紀公司的規定是因應下列哪項條款設定的?","qi":[],"qe":"\"Requirements\" specified for insurance broker companies were established in accordance with which of the following?","qei":[],"o":[{"z":"標準代理合約","e":"Standard agency contract"},{"z":"承保商專業守則","e":"The Code of Conduct for Insurers"},{"z":"保險業(持牌保險經紀公司的財務及其他要求) 規則","e":"( Insurance (Financial and Other Requirements for Licensed Insurance Broker Companies) Rules)"},{"z":"保險代理管理守則","e":"The Code of Practice for the Administration of Insurance Agents"}],"a":2,"x":"持牌保險經紀公司必須遵守《保險業(持牌保險經紀公司的財務及其他要求)規則》"},{"id":"B588","ch":4,"ref":"4.4(i)","t":1,"s":"by","q":"以下哪項可以直接或間接地運用於客戶服務上？","qi":[],"qe":"Which of the following can be directly or indirectly applied to customer service?","qei":[],"o":[{"z":"個人資料(私隱)條例","e":"Personal Data (Privacy) Ordinance"},{"z":"性別歧視條例","e":"Sex Discrimination Ordinance"},{"z":"殘疾歧視條例","e":"Disability Discrimination Ordinance"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"客戶服務上必須遵守以上三條的條例，其他條例可以再參考4.4(i)。"},{"id":"B589","ch":4,"ref":"4.4(c)","t":1,"s":"by","q":"以下哪項對於《承保商專業守則》的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing the \"\"Code of Conduct for Insurers\"\"?","qei":[],"o":[{"z":"屬於《保險業條例》的一部份","e":"It is part of the \"\"Insurance Ordinance\"\""},{"z":"由香港保險業聯會制定","e":"It is set by The Hong Kong Federation of Insurers"},{"z":"目的是發揮優良保險摜例","e":"Its purpose is to implement good insurance practices"},{"z":"提供建議及銷售慣例","e":"Advising and selling practices"}],"a":0,"x":"《承保商專業守則》不屬於《保險業條例》的一部份。"},{"id":"B590","ch":4,"ref":"4.5","t":1,"s":"by","q":"「佣金回贈」的意思是：","qi":[],"qe":"\"\"rebating of commission\"\" means:","qei":[],"o":[{"z":"進行不適當行為，所以不可取得佣金","e":"Conducting an improper behaviour therefore no commission can be received"},{"z":"在保單被取消的情況下退回佣金給客戶","e":"Refund of commission to clients if the policy is cancelled"},{"z":"將自己佣金的部份給客戶，從而換取業務","e":"Giving part of his commission to the client in return for business"},{"z":"告訴保險人就某份保單，不收取任何佣金","e":"Informing insurer there is no commission charge for a certain policy"}],"a":2,"x":"回佣的意思是指，保險中介人把自己的佣金的一部分回贈給自身的客戶，因此為後者爭取「較便宜」的保費。"},{"id":"B591","ch":4,"ref":"4.5","t":1,"s":"b","q":"如果為了爭取業務，保險中介人提出向一名客戶分享本身的佣金。這種做法稱為：","qi":[],"qe":"In order to solicit business, an insurance intermediary gives part of his commission to his client. This method is called:","qei":[],"o":[{"z":"曲解","e":"Misinterpretation"},{"z":"收受及支付回佣","e":"Rebating of commission"},{"z":"保費折扣","e":"Discount on premiums"},{"z":"佣金代償","e":"Commission compensation"}],"a":1,"x":"回佣的意思是指，保險中介人把自己的佣金的一部分回贈給自身的客戶，因此為後者爭取「較便宜」的保費。"},{"id":"B592","ch":4,"ref":"4.5","t":1,"s":"by","q":"利用佣金利誘以增加生產力及作生意的招徠是一件極嚴重的事情。以下哪項描述是正確的？","qi":["破壞中介人的評級","屬於違反代理合約的理由","在保險業條例中是不合法的","做法近乎賄賂及貪污"],"qe":"Use commission as an inducement to increase productivity and securing business is a grave matter. Which of the following descriptions is correct?","qei":["Destroy rating of intermediaries","Is a reason of breach of agency contract","Is illegal in Insurance Ordinance","It is almost like bribery and corruption"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"回佣不但影響保險中介人，更令保險公司的形象受損。"},{"id":"B593","ch":4,"ref":"4.2","t":1,"s":"b","q":"保險人有時會制定文件，用以提醒某些人仕之操守，以下哪兩項是該文件基本的制定對象？","qi":["保單持有人","保險中介人","香港保險業聯會","保險業監督"],"qe":"Insurers sometimes produce policy document, often incorporating the code of conduct to the organization, which two of the following is such the document primary produced to?","qei":["Policyowner","Insurance Intermediaries","Hong Kong Federation of Insurers","Insurance Authority"],"o":[{"z":"i, ii","e":""},{"z":"i, iii","e":""},{"z":"ii, iii","e":""},{"z":"iii, iv","e":""}],"a":0,"x":"很多香港保險公司已經製作了公開的服務政策及操守守則，這些都是為保險中介人及保單持有人而設立的。"},{"id":"B594","ch":4,"ref":"4.1","t":1,"s":"b","q":"假如保險人採取的客戶服務態度是「需要便取，不需要便算」時，請問會有以下哪項的結果？","qi":["喪失客戶","喪失保險中介人的支持","可能引致政府的關注或介入","會遭受業界及市場的反對"],"qe":"Which of the following are likely to result if the insurer adopts \"\"take it or leave it\"\" attitude towards customer service?","qei":["Loss of customer","Loss of support of insurance intermediaries","Possible government interest or intervention","The disapproved of industry association or market associates"],"o":[{"z":"i, ii","e":""},{"z":"ii, iii","e":""},{"z":"iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":3,"x":"不良手法對待客戶下，將有以下幾個後果:(i) 喪失業務(ii) 喪失保險中介人的支持(iii) 破壞市場聲譽(iv) 監管機構介入"},{"id":"B595","ch":4,"ref":"4.1.1(b)","t":1,"s":"b","q":"提供優良客戶服務十分重要, 以下那項屬於客戶「生產力」的影響?","qi":[],"qe":"There is extremely important of good customer service, which of the following is the impact of Customer productivity?","qei":[],"o":[{"z":"將續保現有保單","e":"Renewal the existing policy"},{"z":"向家人和朋友推薦, 協助招攬新生意","e":"The source of extra business, by recommendations to family and friends"},{"z":"可以避免投訴,提升盈利能力","e":"To avoid the complaints and impact upon profitability"},{"z":"以上各項皆是","e":"All of the above"}],"a":1,"x":"顧客「生產力」指對保險人的表現感到愉快及滿意的顧客，不僅會繼續光顧保險人，而且還會向家人和朋友大力推薦及作口頭廣告，極有效地協助招攬新生意。"},{"id":"B596","ch":4,"ref":"4.4(d)","t":1,"s":"b","q":"為施行法定規管對保險代理人和保險經紀下的定義可以在以下哪一項找到？","qi":[],"qe":"The definitions of Insurance Agents and Insurance Brokers for the purpose of statuory regulation can be found in the:","qei":[],"o":[{"z":"承保商專業守則","e":"The Code of Conduct for Insurers"},{"z":"保險業條例","e":"Insurance Ordinance"},{"z":"個人資料(私隱)條例","e":"Personal Data (Privacy) Ordinance"},{"z":"保險代理管理守則","e":"The Code of Practice for the Administration of Insurance Agents"}],"a":1,"x":"《保險業條例》從法規上確定了對持牌保險中介人所作的規定的重要性。"},{"id":"B598","ch":1,"ref":"1.1","t":1,"s":"b","q":"以下哪項或哪些是汽車投保中的所需資料？","qi":["司機的家庭背景","司機的職業","司機的姓名及地址詳情","司機的過去索償索償紀錄"],"qe":"Which of the following information is required for motor insurance?","qei":["Driver’s background","Driver’s occupation","Driver’s name and address details","Driver's claims history"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"i, iii, iv","e":""},{"z":"ii, iii, iv","e":""}],"a":3,"x":"車保不會考慮家庭背景因素"},{"id":"B599","ch":2,"ref":"2.4.2(b)","t":1,"s":"b","q":"以下哪一項最能形容保單已「失效」的意思？","qi":[],"qe":"Which of the following best describes the policy \"lapsed\"?","qei":[],"o":[{"z":"沒有續保的保險單","e":"Insurance policy not renewed"},{"z":"保險人取消了的保單","e":"Policy canceled by the insurer"},{"z":"被保險人取消了的保單","e":"Policy canceled by the insured"},{"z":"一份新的保單取提了現有的保單","e":"A new policy withdraws from an existing policy"}],"a":0,"x":"沒有續保的保險自然會失效"},{"id":"B613","ch":1,"ref":"1.3.1(a)","t":1,"s":"by","q":"在本港，向房東租用私人單位的租客，較有可能購買：","qi":[],"qe":"","qei":[],"o":[{"z":"商業火險","e":""},{"z":"純家居物件保險保障而已","e":""},{"z":"家居建築物保險保障而已","e":""},{"z":"家居建築物及財物保險保障","e":""}],"a":1,"x":"作為租客，家居物品為租客主要保障範圍。"},{"id":"B601","ch":1,"ref":"1.4.1","t":1,"s":"b5","q":"可以附加於火險保單的特殊(額外) 危險包括:","qi":["地震","閃電","爆炸","惡意破壞"],"qe":"","qei":[],"o":[{"z":"i,ii,iii","e":""},{"z":"i,iii,iv","e":""},{"z":"ii,iii,iv","e":""},{"z":"i,ii,iii,iv","e":""}],"a":1,"x":"特定火險單所承保的額外危險在其承保表上指明，可包括暴動與罷工、沉降與山體滑坡、風暴與颱風、被汽車碰撞、被飛機損壞等。"},{"id":"B602","ch":1,"ref":"1.4.1","t":1,"s":"b","q":"營業中斷保險保單的釐定，是根據時間因素及:","qi":[],"qe":"","qei":[],"o":[{"z":"受保物業的保額","e":""},{"z":"受保物業的保費率","e":""},{"z":"計算彌償期間的損失","e":""},{"z":"受保人選的危險數目","e":""}],"a":2,"x":"在本質上計算彌償期間的損失是如此進行的：首先與上年度中類似的、業務並沒有出現中斷的期間内的收入等等相比較，然後再就某些因素比如在彌償期間內發生更激烈的市場競爭和爆發傳染病"},{"id":"B603","ch":2,"ref":"2.2.3","t":1,"s":"by","q":"「總保險單」是:","qi":[],"qe":"","qei":[],"o":[{"z":"繳付一個總保險費的保單","e":""},{"z":"保單的正本","e":""},{"z":"旅遊代理人用以安排渡假「套餐」的保險單","e":""},{"z":"以全險作為根據","e":""}],"a":2,"x":"保險憑證可以具有不同的作用。當應用於旅遊及海上貨物保險時，可在總保險單下作為保障範圍的摘要而發出。"},{"id":"B604","ch":4,"ref":"4.5","t":1,"s":"b","q":"代理人把部份佣金回贈予本身客戶，此行為稱為:","qi":[],"qe":"","qei":[],"o":[{"z":"回佣","e":""},{"z":"利誘","e":""},{"z":"曲解","e":""},{"z":"保費優惠","e":""}],"a":0,"x":"回佣的意思是指，保險中介人把自己的佣金的一部分回贈給自身的客戶，因此為後者爭取「較便宜」的保費。"},{"id":"B605","ch":2,"ref":"2.3.3","t":1,"s":"b","q":"「時間性起賠」是指:","qi":[],"qe":"","qei":[],"o":[{"z":"必須於指定限期內繳付保費","e":""},{"z":"保險人必須於指定時間內理賠","e":""},{"z":"於保單生效後指定限期內才可索償","e":""},{"z":"喪失能力的時間必須跨越指定期限，才可獲得賠償","e":""}],"a":3,"x":"有些一般保險對殘疾或喪失能力提供利益，但這種殘障或喪失能力的情形必須至少持續了某段期限之後，保險人才會給付利益，而一旦滿足了這項條件整段喪失能力"},{"id":"B606","ch":2,"ref":"2.4.2","t":1,"s":"b","q":"於通常取消條款下:","qi":[],"qe":"","qei":[],"o":[{"z":"保險人有權取消該保單","e":""},{"z":"很多情況下，被保險人有權取消保單","e":""},{"z":"保單被取消後，可退回部份保費","e":""},{"z":"以上各項皆是","e":""}],"a":3,"x":"保險人及被保險人都具有取消權，保險人取消保單將按比例退保費，而被保險人取消保單所得既退款可以短期或比例方式，視乎保單措辭而定。"},{"id":"B607","ch":3,"ref":"3.1.2","t":1,"s":"by","q":"以下哪項屬於處理索償時的不正確態度?","qi":[],"qe":"","qei":[],"o":[{"z":"應避免合理的拖延","e":""},{"z":"當出現欺詐成份時，便應於初期拒絕索償","e":""},{"z":"避免對保單作出不合理解釋","e":""},{"z":"確認責任後，便應盡快支付索償","e":""}],"a":0,"x":"處理索償上應避免不必要的拖延"},{"id":"B608","ch":1,"ref":"1.4.3(a)","t":1,"s":"by","q":"物業因盜竊而損失不涉及火災是屬於：","qi":[],"qe":"","qei":[],"o":[{"z":"除外責任","e":""},{"z":"是會被保障，但受保人必須已指明及已繳交保費","e":""},{"z":"是不會被保障，除非受保人已指明","e":""},{"z":"是屬於保單的保障範圍而無需繳交額外保費","e":""}],"a":3,"x":"任何索償如要成功，被保處所的保安防衛物必須遭到某些破壞。通常規定，只有牽涉「以強行及暴力的方式進入或離開」被保處所的盜竊才屬保障範圍内。竊賊縱火以毀滅盜竊證據這種事情間中會發生，但是，在盜竊保單中，由火災"},{"id":"B614","ch":1,"ref": ,{"z":"人身意外保險中自殺","e":""},{"z":"核及輻射風險","e":""}],"a":3,"x":"核及輻射風險屬於業界除外風險"},{"id":"B651","ch":2,"ref":"2.2.5","t":1,"s":"b45","q":"僱員補償援助計劃的徵費來源是來自?","qi":[],"qe":"","qei":[],"o":[{"z":"僱員補償保險","e":""},{"z":"僱員補償保險人供款","e":""},{"z":"僱主","e":""},{"z":"僱員","e":""}],"a":0,"x":"僱員補償援助計劃的徵費來源是來自僱員補償保險"},{"id":"B652","ch":2,"ref":"2.2.5","t":1,"s":"b5","q":"保險業監管局收取的保費徵費為:","qi":[],"qe":"","qei":[],"o":[{"z":"0.04","e":""},{"z":"0.1","e":""},{"z":"0.01","e":""},{"z":"0.03","e":""}],"a":1,"x":"首階段的徵費率為每保單年度保費的0.04%，其後逐步調整至2021年4月份（即第四亦是最後階段的起點）的0.1%。每張保單的徵費金額設有上限。"},{"id":"Y1002","ch":1,"ref":"1(c)","t":0,"s":"y","q":"戰爭風險及核風險是標準除外責任，以下哪項描述是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"基本風險一般是不可保的","e":""},{"z":"基本風險在給付額外保險費後是可保的","e":""},{"z":"基本風險在「全險」的保障中是受到保障的","e":""},{"z":"以上所有各項","e":""}],"a":0,"x":"戰爭風險及核風險是標準除外責任，一般都不可保。"},{"id":"Y1004","ch":1,"ref":"1(b)(ii)","t":0,"s":"y","q":"財產保險保障範圍分兩類，分別是「指明危險」和：","qi":[],"qe":"","qei":[],"o":[{"z":"全險","e":""},{"z":"單一危險方式","e":""},{"z":"特定危險","e":""},{"z":"特定壽險","e":""}],"a":0,"x":"財產保險保障範圍分兩類，分別是「全險」和「指明危險」。"},{"id":"Y1005","ch":1,"ref":"1(b)(i)","t":0,"s":"y","q":"只對火災、閃電及家用氣體爆炸造成的損害提供保障的保險比較可能是：","qi":[],"qe":"","qei":[],"o":[{"z":"全險","e":""},{"z":"第三者保險","e":""},{"z":"除外危險","e":""},{"z":"指明危險","e":""}],"a":3,"x":"指明危險(或指名危險)的意思是指，若要構成保單責任，發生了的損失或損害必須由保單所指明的某種危險(即損失的原因或成因) 作為近因而引起的，比如火險保單中指明的閃電。"},{"id":"Y1006","ch":1,"ref":"1(b)","t":0,"s":"y","q":"財產保險保障範圍分兩類，分別是「全險」和：","qi":[],"qe":"","qei":[],"o":[{"z":"特定壽險","e":""},{"z":"特定危險","e":""},{"z":"指明危險","e":""},{"z":"指明壽險","e":""}],"a":2,"x":"財產保險保障範圍分兩類，分別是「全險」和「指明危險」。"},{"id":"Y1008","ch":1,"ref":"1(a)","t":0,"s":"y","q":"一般保險的保障範圍包括：","qi":[],"qe":"","qei":[],"o":[{"z":"財產保險","e":""},{"z":"責任保險","e":""},{"z":"人身保險","e":""},{"z":"以上各項皆是","e":""}],"a":3,"x":"一般保險的保障範圍包括：人身保險，財產保險，經濟權益保險及責任保險。"},{"id":"Y1009","ch":1,"ref":"1.1(c)","t":0,"s":"y","q":"汽車保險無索償折扣機制下，當無索償折扣已積累到一個高的水平時，發生一次索償不會清除下年度的無索償折扣。這種制度稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"平均機制","e":""},{"z":"折扣回減機制","e":""},{"z":"不能作廢保單條款","e":""},{"z":"無索償折扣回扣計劃","e":""}],"a":1,"x":"對私家車而言，無索償折扣以所謂「折扣回減機制」運作 --一次索償不一定會撤銷來年的折扣。"},{"id":"Y1010","ch":1,"ref":"1.1(c)","t":0,"s":"y","q":"有些保險向往來沒有提出索償的客戶提供保費折扣，以下哪項或哪些是對有關制度的描述是正確的？","qi":["這稱為「無索償折扣」","對私家車而言，折扣的百份率是很高的","全年沒有提供索償的後果是下一年會有保費折扣","全年沒有提出索償的後果是退還該年度的年保費"],"qe":"","qei":[],"o":[{"z":"只有(i)","e":""},{"z":"只有(ii) 及(iii)","e":""},{"z":"(i)、(ii) 及(iii)","e":""},{"z":"(i)、(ii)、(iii) 及(iv)","e":""}],"a":2,"x":"汽車保險有一個非常重要，也幾乎是最為獨特的特征，就是如果被保險人在剛過去的保單年度中沒有任何索償，那麼保險人便會對續保年保費給予稱為無索償折扣的累進折扣。就私家車而言，第一年的無索償記錄能得到百分之二十的無索償折扣(NCD)，第二年將為百分之三十，依次類推，而五年的無索償記錄將無索償折扣累進到百分之六十的最高比率。對於其他類別的汔車，折扣相當可能從百分之十開始，最高提升到百分之三十。"},{"id":"Y1011","ch":1,"ref":"1.1(c)","t":0,"s":"y","q":"所謂「折扣回減機制」，對下列哪項車輛最為適合？","qi":[],"qe":"","qei":[],"o":[{"z":"電單車","e":""},{"z":"商用車輛","e":""},{"z":"私家車","e":""},{"z":"以上各項皆是","e":""}],"a":2,"x":"對私家車而言，無索償折扣以所謂「折扣回減機制」運作 --一次索償不一定會撤銷來年的折扣。對其他種類的汽車而言，一次索償已足以撤銷來年的無索償折扣，必須在新的一年內沒有提出過索償方可重新獲得最低的折扣率。"},{"id":"Y1013","ch":1,"ref":"1.1(c)(ii)","t":0,"s":"y","q":"在「折扣回減機制」，不會因一次索償而導致所有折扣取消，適用於：","qi":[],"qe":"","qei":[],"o":[{"z":"私家車保險","e":""},{"z":"商用車輛保險","e":""},{"z":"電單車保險","e":""},{"z":"汽車租賃買賣的保險","e":""}],"a":0,"x":"對私家車而言，無索償折扣以所謂「折扣回減機制」運作 --一次索償不一定會撤銷來年的折扣。"},{"id":"Y1021","ch":1,"ref":"1.1","t":0,"s":"y","q":"以下哪項不屬於汽車保險的主要類別？","qi":[],"qe":"","qei":[],"o":[{"z":"商用車輛","e":""},{"z":"私家車","e":""},{"z":"的士","e":""},{"z":"電單車","e":""}],"a":2,"x":"汽車保險的三個主要類別：私家車、電單車和商用車輛。"},{"id":"Y1028","ch":1,"ref":"1.1(b)(iii)","t":0,"s":"y","q":"「法令」保險在香港汽車保險業界屬於：","qi":[],"qe":"","qei":[],"o":[{"z":"保險人的汽車保險組合中的一個重要部分","e":""},{"z":"較昂貴，因此普遍程度較第三者保險為低","e":""},{"z":"較便宜，因此普遍程度較汽車保險組合為高","e":""},{"z":"在保險人的汽車保險業務中屬於沒有重要性，因為保障範圍狹窄，不能期望有人會買","e":""}],"a":3,"x":"「法令」保險在保險人的汽車保險業務中沒有重要性，因為保障範圍狹窄，不能期望有人會買。"},{"id":"Y1030","ch":1,"ref":"1.1(b)","t":0,"s":"y","q":"以下哪項有關「法令」保險的描述是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"保險人沒有宣傳「法令」保險","e":""},{"z":"「法令」保險是僅僅符合法定最低要求的保險","e":""},{"z":"理論上，而非實際上，這是可以購買到的汽車保險中最便宜的一種","e":""},{"z":"以上各項皆是","e":""}],"a":3,"x":"所有各項陳述都是正確的，"},{"id":"Y1031","ch":1,"ref":"1.1(g)","t":0,"s":"y","q":"「使若干條款無效及有權追回款項」條款可於以下哪項情況下使用？","qi":[],"qe":"","qei":[],"o":[{"z":"當強制保險的相關規定凌駕於保險條款之上","e":""},{"z":"當只有被保險人的車輛受損的時候","e":""},{"z":"意外中只有被保人的汽車遭損毀","e":""},{"z":"只有第三者引起的損毀","e":""}],"a":0,"x":"在某些情形下，即使被保險人違反了保單條款，強制保險的相關規定仍不容計保險人拒絶向第三者賠償死亡或受傷的損失。"},{"id":"Y1033","ch":1,"ref":"1.1","t":0,"s":"y","q":"在香港的汽車保險人所稱的第三者責任保險，保障範圍包括：","qi":[],"qe":"","qei":[],"o":[{"z":"第三者的財產損失","e":""},{"z":"對第三者造成的傷亡而已","e":""},{"z":"對第三者造成的傷亡及受保人的車輛損壞","e":""},{"z":"對第三者的受傷、死亡、以及第三者的財產損失","e":""}],"a":3,"x":"純第三者責任保險保障的保障範圍是任何受保駕駛者(或任何乘客)對第三者造成死亡、受偒或財產損害而應負的法律責任。"},{"id":"Y1034","ch":1,"ref":"1.1(a)&(b)","t":0,"s":"y","q":"提供最狹窄保障範圍的汽車保險是：","qi":[],"qe":"","qei":[],"o":[{"z":"「法令」保險","e":""},{"z":"純第三者責任保險保障","e":""},{"z":"綜合保險保障","e":""},{"z":"第三者責任、火災及盜竊保險保障","e":""}],"a":0,"x":"提供最狹窄保障範圍的汽車保險是「法令」保險。"},{"id":"Y1038","ch":1,"ref":"1.1(a)","t":0,"s":"y","q":"下列哪項有關「法令」汽車保險的陳述是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"是可以買到的汽車保險中保障最狹窄的","e":""},{"z":"只保障第三者的死亡或受傷的情況","e":""},{"z":"因為便宜，所以普遍","e":""},{"z":"以上所有各項皆為正確","e":""}],"a":2,"x":"純法令保險保障已經很難在市場上找到了，"},{"id":"Y1039","ch":1,"ref":"1.1(a)","t":0,"s":"y","q":"以下哪項汽車保險單，保障範圍包括對受保車輛造成的損失及損壞？","qi":["「法令」保險","第三者責任保險保障","第三者責任、火災及盜竊保險保障","綜合保險保障"],"qe":"","qei":[],"o":[{"z":"(i) 及(ii)","e":""},{"z":"(i) 及(iii)","e":""},{"z":"(ii) 及(iii)","e":""},{"z":"(iii) 及(iv)","e":""}],"a":3,"x":"第三者責任、火災及盜竊保險保障的保障範圍包括受保汽車遭受由火災或盜竊引起的損失或損害的財產保險。市面上的汽車保險保障中，綜合保險保障是保障範圍最廣闊的一種，受保汽車的保險保障是「全險」的。"},{"id":"Y1040","ch":1,"ref":"1.1(a)","t":0,"s":"y","q":"一般保險的保障範圍包括：","qi":[],"qe":"","qei":[],"o":[{"z":"財產保險","e":""},{"z":"長期人身保險","e":""},{"z":"投資相連保險","e":""},{"z":"以上各項皆是","e":""}],"a":0,"x":"一般保險的保障範圍包括：人身保險，財產保險，經濟權益保險及責任保險。"},{"id":"Y1047","ch":1,"ref":"1.1(g)&3.1.3note","t":0,"s":"y","q":"以下哪項相當可能不涉及「使若干條款無效及有權追回款項」條款？","qi":[],"qe":"","qei":[],"o":[{"z":"未有於合適時間內報告行人受傷","e":""},{"z":"未有於合適時間內報告受保汽車的失竊","e":""},{"z":"於事發現場向受傷行人承認責任","e":""},{"z":"鼓勵受傷行人提出申索而違反保單條款","e":""}],"a":1,"x":"最常見的情形是，被保險人未能向保險人作出意報告，或被保險人在沒有預先取得保險人的書面同意以前向第三者承認法律責任。在這些情況下，如果被保險人須負上第三者責任，儘管被保險人違反了保單條款，保險人仍須向第三者作出賠償。"},{"id":"Y1048","ch":1,"ref":"1.1(f)&2.3.3","t":0,"s":"y","q":"汽車保險中「附加的」自負額是指？","qi":[],"qe":"","qei":[],"o":[{"z":"有關強制性的保險，按法律要求而必需的","e":""},{"z":"適用於指定業務範圍內的所有保單","e":""},{"z":"因應特別投保條件的承保目的而適用的","e":""},{"z":"被保險人為得到保費折扣而自顧選擇的","e":""}],"a":2,"x":"汽車保險中「附加的」自負額是指因應特別投保條件的承保目的而適用的。"},{"id":"Y1051","ch":1,"ref":"1.1.1(a)(ii)","t":0,"s":"y","q":"私家車的法律責任中法定保險的保障額是：","qi":[],"qe":"","qei":[],"o":[{"z":"一億港元","e":""},{"z":"一百萬港元","e":""},{"z":"二百萬港元","e":""},{"z":"以上沒有任何保障金額適用","e":""}],"a":0,"x":"法定保險的保障通常是法定最低額，即每宗事故一億港元。"},{"id":"Y1054","ch":1,"ref":"1.1.1(a)(i)","t":0,"s":"y","q":"一輛汽車高速行駛翻側，全車損壞。但沒有令到任何生命損傷，請問以下哪類保單可獲賠償？","qi":[],"qe":"","qei":[],"o":[{"z":"綜合私家車保單","e":""},{"z":"第三者責任保險保障","e":""},{"z":"第三者責任、火險、及盜竊保險保障","e":""},{"z":"以上所有各項","e":""}],"a":0,"x":"綜合私家車保單的保障範圍包括受保汽車的損失或損害。這種「全險」範圍的財產保險，承保被保險人的汽車，及屬於該汽車並於遇事時在其上的配件及零件，並以該車遭受損失或損害時的合理市價為彌償上限。"},{"id":"Y1056","ch":1,"ref":"1.1.1&1.1.2&1.1.3","t":0,"s":"y","q":"以下哪項不屬於主要的汽車類別？","qi":[],"qe":"","qei":[],"o":[{"z":"商用車輛","e":""},{"z":"私家車","e":""},{"z":"出租汽車","e":""},{"z":"電單車","e":""}],"a":2,"x":"汽車保險的主要類別包括私家車、電單車及商用車輛。"},{"id":"Y1057","ch":1,"ref":"1.1.1(b)(i)","t":0,"s":"y","q":"擴展汽車保險保單的保障範圍包括：","qi":[],"qe":"","qei":[],"o":[{"z":"刪除保單某項除外責任","e":""},{"z":"擴大受保司機人身意外保險的保障","e":""},{"z":"擴大受保汽車修理期間的使用損失","e":""},{"z":"包括以上各項","e":""}],"a":3,"x":"可支付額外的保費從而擴大保險保障的範圍包括刪除保單的某項除外責任或增加保險利益項目，例如擴展人身意外保險保障，豁免第三者財產損害自付額等。"},{"id":"Y1060","ch":1,"ref":"1.1.2","t":0,"s":"y","q":"以下哪項描述不屬於「電單車」保單的保障範圍？","qi":[],"qe":"","qei":[],"o":[{"z":"電單車乘客在意外中身體受傷","e":""},{"z":"受保電單車的任何損害(因火災或盜竊引起的除外)","e":""},{"z":"只有當整輛電單車被盜竊，才能就盜竊而索償","e":""},{"z":"為電單車乘客所付的醫療開支","e":""}],"a":3,"x":"承保醫療費用的標準保單部分及擴展人身意外保險保障並不存在。"},{"id":"Y1062","ch":1,"ref":"1.1.2&(c)","t":0,"s":"y","q":"以下哪些適用於電單車保險？","qi":["只有當整輛電單車被盜時，才能就盜竊而索償","沒有提供醫療費用保障","因火災或盜竊而導致的損失設有標準自負額","最高的無索償折扣比私家車的為低"],"qe":"","qei":[],"o":[{"z":"只有(i) 和(ii)","e":""},{"z":"(i), (ii) 和(iv)","e":""},{"z":"(ii), (iii), (iv)","e":""},{"z":"以上皆是","e":""}],"a":1,"x":"通常對受保電單車的任何損失或損害(因火災或盜竊引起的除外)，都設有額標準自負額。"},{"id":"Y1064","ch":1,"ref":"1.1.3(b)(iv)","t":0,"s":"y","q":"由於車房的業務絶大程度與汽車有關，而且有特別的需要，提供的保障亦有所不同，這類保單稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"汽車行業風險","e":""},{"z":"汽車責任限額","e":""},{"z":"批發及貿易","e":""},{"z":"第三者責任","e":""}],"a":0,"x":"汽車行業風險是指車房及其他類似風險，只要其業務絶大程度上與汽車有關，就會有特別的保險需要。這類風險的保單，可能涉及在道路上使用汽車或處所上的風險，並提供多樣化的保險保障組合。"},{"id":"Y1065","ch":1,"ref":"1.1.3(b)&2.3.5(a)(ii)","t":0,"s":"y","q":"所有類型的汽車保險保單(汽車行業除外) 都有一些通用的除外責任。以下哪項屬於除外責任的範圍？","qi":[],"qe":"","qei":[],"o":[{"z":"運送貨櫃或拖架工具的商用車輛","e":""},{"z":"的士","e":""},{"z":"機械挖土機","e":""},{"z":"送遞薄餅的電單車","e":""}],"a":3,"x":"與食物中毒及相關的索償(如汽車被用作流動食物售賣處) 屬於除外責任的範圍。"},{"id":"Y1067","ch":1,"ref":"1.1.3(a)(ii)","t":0,"s":"y","q":"在香港，會把車輛用作「謀生工具」有關的車輛較可能出現於下列哪項商用車輛保險單中？","qi":[],"qe":"","qei":[],"o":[{"z":"謀生工具","e":""},{"z":"汽車貿易","e":""},{"z":"專門車輛","e":""},{"z":"綜合","e":""}],"a":2,"x":"在香港，會把車輛用作「謀生工具」有關的車輛較可能出現專門車輛保險單中。"},{"id":"Y1068","ch":1,"ref":"1.1.3(b)(iv)","t":0,"s":"y","q":"車房及其他類似風險會有特別的需要，這包括：","qi":[],"qe":"","qei":[],"o":[{"z":"賽車","e":""},{"z":"速度測試","e":""},{"z":"汽車行業風險","e":""},{"z":"以上各項","e":""}],"a":2,"x":"汽車行業風險是指車房及其他類似風險，只要其業務絶大程度上與汽車有關，就會有特別的保險需要。這類風險的保單，可能涉及在道路上使用汽車或處所上的風險，並提供多樣化的保險保障組合。"},{"id":"Y1069","ch":1,"ref":"1.2","t":0,"s":"y","q":"健康保險屬於下列哪項保險類別？","qi":[],"qe":"","qei":[],"o":[{"z":"財產保險","e":""},{"z":"人身保險","e":""},{"z":"經濟權益保險","e":""},{"z":"責任保險","e":""}],"a":1,"x":"健康保險(或稱 \"意外及健康保險\")屬於「人身保險」，因為保險標的是人的生命、肢體或健康。"},{"id":"Y1075","ch":1,"ref":"1.2.1(a)(ii)","t":0,"s":"y","q":"在人身意外的保單中，每周利益最可能在以下哪項情況下發放？","qi":[],"qe":"","qei":[],"o":[{"z":"死亡","e":""},{"z":"醫療費用","e":""},{"z":"永久傷殘","e":""},{"z":"部分傷殘","e":""}],"a":3,"x":"按周計算的利益是針對暫時完全殘疾(傷殘程度達 100% 者為之「完全殘疾」)或暫時部分殘疾(傷殘程度低於 100%) 的定期付款。"},{"id":"Y1078","ch":1,"ref":"1.2.1(a)","t":0,"s":"y","q":"以下哪項不是人身意外及疾病保險的慣常保障範圍？","qi":[],"qe":"","qei":[],"o":[{"z":"意外受傷的醫療費用","e":""},{"z":"意外死亡或其他指明損傷的整筆利益支付","e":""},{"z":"暫時或永久喪失工作能力的每周利益支付","e":""},{"z":"住院權益","e":""}],"a":3,"x":"人身意外保險保障可以在三個主要項目之下加以描述，各項均以受保人遭受訂明身體受傷作為保單責任的先決條件：整筆支付的利益、按周計算的利益和醫療費用。"},{"id":"Y1085","ch":1,"ref":"1.2.1(a)","t":0,"s":"y","q":"人身意外保單中的每週權益，可以在下列哪個情況下提取？","qi":[],"qe":"","qei":[],"o":[{"z":"喪失全部能力","e":""},{"z":"喪失部分能力","e":""},{"z":"意外受傷住院期間","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"按周計算的利益是針對暫時性喪失全部或部分能力的定期付款。金額按周計算，但通常在殘疾期間按月支付，並設最長付款期限(通常為一百零四個星期)。"},{"id":"Y1089","ch":1,"ref":"1.2.2b","t":0,"s":"y","q":"醫療保險中，最有可能保障的範圍包括；","qi":[],"qe":"","qei":[],"o":[{"z":"整容手術","e":""},{"z":"例行身體檢查","e":""},{"z":"矯正先天性殘疾","e":""},{"z":"意外中受傷骨折","e":""}],"a":3,"x":"醫療保險的目的，是要承保由意外事故或疾病引致的醫療費用。醫療保險的特殊除外責任包括先天性疾病：(保險生效前)已患的疾病及已存在的殘疾：生育控制／不育治療；整容手術；例行醫療檢查及身體檢查；及牙科治療(除非在保單期間內因意外事故而需進行)。"},{"id":"Y1090","ch":1,"ref":"1.2.2(b)","t":0,"s":"y","q":"在香港，一份典型的醫療保險的除外責任不包括下列哪項？","qi":[],"qe":"","qei":[],"o":[{"z":"令中年婦女「容貌煥然一新」的費用","e":""},{"z":"矯正先天性缺陷的費用","e":""},{"z":"醫療保險生效前殘疾的費用","e":""},{"z":"因交通意外而導致面都受傷的牙科治療費用","e":""}],"a":3,"x":"醫療保險的特殊除外責任包括先天性疾病；(保險生效前)已患的疾病及已存在的殘疾；生育控制／不育治療；整容手術；例行醫療檢查及身體檢查；及牙科治療(除非在保單期間內因意外事故而需進行)。"},{"id":"Y1093","ch":1,"ref":"1.2.3c","t":0,"s":"y","q":"相比標準計劃其條款及保障會為客戶帶來更高的保障稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"豪華計劃","e":""},{"z":"增強計劃","e":""},{"z":"增補計劃","e":""},{"z":"靈活計劃","e":""}],"a":3,"x":"靈活計劃的設計必須符合「更佳保障原則」，即與標準計劃相比，其條款及保障會為客戶帶來更高的保障。"},{"id":"Y1118","ch":1,"ref":"1.2.3d","t":0,"s":"y","q":"保單保證受保人可以續保至：","qi":[],"qe":"","qei":[],"o":[{"z":"65 歲","e":""},{"z":"80 歲","e":""},{"z":"99 歲","e":""},{"z":"100 歲","e":""}],"a":3,"x":"保單保證受保人可以續保至 100 歲，並且不設「終身保障限額」 - -即醫療保險單承諾在受保人的一生中累計支付的最高金額。"},{"id":"Y1122","ch":1,"ref":"","t":0,"s":"y","q":"在產品內加入「其他保障」成為認可產品的一部分的目的是？","qi":[],"qe":"","qei":[],"o":[{"z":"顧及從事長期業務的保險公司必須在個人償款住院保險產品中提供長期保險保障","e":""},{"z":"顧及從事一般業務的保險公司必須在個人償款住院保險產品中提供一般保險保障","e":""},{"z":"顧及從事長期業務的保險公司必須在個人償款住院保險產品中提供一般保險保障","e":""},{"z":"顧及從事一般業務的保險公司必須在個人償款住院保險產品中提供長期保險保障","e":""}],"a":0,"x":"在產品內加入「其他保障」成為認可產品的一部分的目的是顧及從事長期業務的保險公司必須在個人償款住院保險產品中提供長期保險保障。案答選 A。參考章節1.23c"},{"id":"Y1129","ch":1,"ref":"1.2.3c","t":0,"s":"y","q":"有關診斷成像檢測所設定的保障：","qi":[],"qe":"","qei":[],"o":[{"z":"標準計劃屬於共同保險安排，靈活計劃屬於自付費安排","e":""},{"z":"標準計劃屬於自付費安排，靈活計劃屬於共同保險安排","e":""},{"z":"標準計劃屬和靈活計劃都屬於自付費安排","e":""},{"z":"標準計劃屬和靈活計劃都屬於共同保險安排，然而靈話計劃可能提供額外的自付費安排","e":""}],"a":3,"x":"有關診斷成像檢測所設定的保障，標準計劃和靈活計劃都屬於共同保險安排，然而靈話計劃可能提供額外的自付費安排。"},{"id":"Y1134","ch":1,"ref":"1.2.3c","t":0,"s":"y","q":"如屬對保障地域範圍作出限制的靈活計劃，是否能對海外的住院開支提供保障？","qi":[],"qe":"","qei":[],"o":[{"z":"任何情況下都不可以","e":""},{"z":"靈活計劃並不可以對保障地域範圍作出限制","e":""},{"z":"靈活計劃的基本保障/標準計劃部分是可以提供保障的，然而額外保障的部分則因保障地域範圍不可以提供保障","e":""},{"z":"靈活計劃的基本保障/標準計劃部分是不可以提供保障的，然而額外保障的部分則不受保障地域範圍規限，可以提供保障","e":""}],"a":2,"x":"靈活計劃的基本保障/標準計劃部分是可以對海外的住院開支提供保障的，然而額外保障的部分則因保障地域範圍不可以提供保障。"},{"id":"Y1143","ch":1,"ref":"1.3.1","t":0,"s":"y","q":"一般的家居保險單，會提供下列哪項的保障？","qi":[],"qe":"","qei":[],"o":[{"z":"財產保障","e":""},{"z":"若干的人身保障","e":""},{"z":"若干的經濟權益保障","e":""},{"z":"上述所有各項","e":""}],"a":3,"x":"家居保險不僅包括財產保險(主要是「全險」保障)，也涉及一些責任保險，甚至一些人身保險與經濟權益保險。"},{"id":"Y1145","ch":1,"ref":"1.3.1","t":0,"s":"y","q":"家居保險的主要承保範圍：","qi":[],"qe":"","qei":[],"o":[{"z":"建築物及 / 或其內部的物品","e":""},{"z":"責任保險","e":""},{"z":"人身意外保險","e":""},{"z":"火災所引起的結構危險","e":""}],"a":0,"x":"家居保險主要是提供財產保險，所承保的是屬於被保險人的建築物及 /或其內部的物品。"},{"id":"Y1147","ch":1,"ref":"1.3.1","t":0,"s":"y","q":"香港的家居保險的主要保障範圍是：","qi":[],"qe":"","qei":[],"o":[{"z":"建築物 /家居物件的財產保險","e":""},{"z":"對導致第三者死亡或受傷的責任保險","e":""},{"z":"因損失或損害而帶來的額外開支或租金損失","e":""},{"z":"受保人因火災而死亡的人身意外保險","e":""}],"a":0,"x":"家居保險主要提供財產保險，所承保的是屬於被保險人的建築物及／或其內部的物品。"},{"id":"Y1150","ch":1,"ref":"1.3.1(a)(9)","t":0,"s":"y","q":"買了家居保險的人身意外保險，通常會在那些情況下獲得保障？","qi":[],"qe":"","qei":[],"o":[{"z":"謀殺","e":""},{"z":"任何意外","e":""},{"z":"任何成因","e":""},{"z":"火災或盜竊","e":""}],"a":3,"x":"如果被保險人或其任何家庭成員在火災中死亡或死於盜賊之手，就會獲一次性支付人身意外保險利益。"},{"id":"Y1153","ch":1,"ref":"1.3.1(a)","t":0,"s":"y","q":"為取得較佳的保障，住宅物業的業主及佔用人購買以下哪類保單是較可取的方法？","qi":[],"qe":"","qei":[],"o":[{"z":"火險保單而已","e":""},{"z":"家居物件保單而已","e":""},{"z":"建築物保單而已","e":""},{"z":"建築物及家居物件保單","e":""}],"a":3,"x":"家居保險的保障範圍不是指明危險的就是「全險」的。建築物的保障傾向是指明危險的，而家居物件保障則傾向是「全險」的。"},{"id":"Y1154","ch":1,"ref":"1.3.1(a)(1)","t":0,"s":"y","q":"在一般家居保險中，受保範圍包括：","qi":["因火災導致財物盜竊損失","因火災導致財物非盜竊損失","賊人從窗戶進入的盜竊損失","逃避火災過程中遺失物件"],"qe":"","qei":[],"o":[{"z":"(i) 及(ii)","e":""},{"z":"(i)、(ii) 及(iii)","e":""},{"z":"(ii)、(iii) 及(iv)","e":""},{"z":"(i)、(ii)、(iii) 及(iv)","e":""}],"a":1,"x":"基本的指明危險保障必定承保火災，也能進而包含火險中大部份可保的附加危險。附加危險的項目很多，包括風暴／旋風、地震、爆炸、動物／車輛碰撞等。除此之外，盜竊引起的損失或損害也包括在內。但在逃避火災過程中遺失物件則不在受保範圍。"},{"id":"Y1157","ch":1,"ref":"1.3.1(a)","t":0,"s":"y","q":"住宅物業的業主及住客較可能投保以下哪類保單？","qi":[],"qe":"","qei":[],"o":[{"z":"火險保單而已","e":""},{"z":"純家居物件保單而已","e":""},{"z":"純建築物保單","e":""},{"z":"建築物及家居物件保單","e":""}],"a":3,"x":"家居保險的保障範圍不是指明危險的就是「全險」的。建築物的保障傾向是指明危險的，而家居物件保障則傾向是「全險」的。"},{"id":"Y1158","ch":1,"ref":"1.3.1(b)(ii)","t":0,"s":"y","q":"在基本的家居保險中，以下哪項情況引致受保建築受損相當可能是不保事項？","qi":[],"qe":"","qei":[],"o":[{"z":"暴亂","e":""},{"z":"火災","e":""},{"z":"爆炸","e":""},{"z":"企圖盜竊","e":""}],"a":0,"x":"暴亂屬除外責任，"},{"id":"Y1160","ch":1,"ref":"1.3.2(a)","t":0,"s":"y","q":"以下哪項不屬於旅遊保險的保障事項？","qi":[],"qe":"","qei":[],"o":[{"z":"投保人自殺身亡","e":""},{"z":"患上嚴重感冒的醫療開支","e":""},{"z":"在酒店不小心引起的責任","e":""},{"z":"以上所有各項","e":""}],"a":0,"x":"投保人自殺身亡是旅遊保險的除外責任。"},{"id":"Y1163","ch":1,"ref":"1.3.2(c)","t":0,"s":"y","q":"以下哪項不是旅遊保險的保費計算考慮因素？","qi":[],"qe":"","qei":[],"o":[{"z":"保險日數","e":""},{"z":"地區範圍","e":""},{"z":"被保險人的性別(男性 / 女性)","e":""},{"z":"同行人數","e":""}],"a":2,"x":"釐定旅遊保險保費的重要因素不包括被保險人的性別。"},{"id":"Y1164","ch":1,"ref":"1.3.2(d)(i)","t":0,"s":"y","q":"香港的旅遊保險的核保是：","qi":[],"qe":"","qei":[],"o":[{"z":"必須徹底核保，因為受保的風險種類繁多","e":""},{"z":"最少也要與個人意外保險的核保般徹底","e":""},{"z":"不能與其他種類保險般深入核保","e":""},{"z":"採納與人壽保險核保的標準","e":""}],"a":2,"x":"旅遊保險業務的特點是盡量將一切都簡單化，因為人們通常在最後關頭才去投保，而且不能做到「用家方便」的產品很難在這種大型的市場中取得成功。所以，甚少對風險個別地進行核保。"},{"id":"Y1165","ch":1,"ref":"1.3.2(c)","t":0,"s":"y","q":"旅遊保險的保費根據源於：","qi":[],"qe":"","qei":[],"o":[{"z":"地域範圍","e":""},{"z":"行程天數","e":""},{"z":"同行者的人數","e":""},{"z":"以上各項皆有可能","e":""}],"a":3,"x":"所有各項都是釐定旅遊保險保費的重要因素。"},{"id":"Y1167","ch":1,"ref":"1.3.3(d)","t":0,"s":"y","q":"保險人對旅遊保單的核保：","qi":[],"qe":"","qei":[],"o":[{"z":"是所有保險產品中核保得最徹底的","e":""},{"z":"起碼比個人意外保險的核保徹底","e":""},{"z":"甚少出現個別的風險核保","e":""},{"z":"與人壽保險的準則相符","e":""}],"a":2,"x":"旅遊保險業務的特點是盡量將一切都簡單化，因為人們通常在最後關頭才去投保，而且不能做到「用家方便」的產品很難在這種大型的市場中取得成功。所以，甚少對風險個別地進行核保。"},{"id":"Y1168","ch":1,"ref":"1.3.3(d)(iii)","t":0,"s":"y","q":"旅遊保險人發出的渡假「套餐」旅遊保單，當遭遇一群保單持有人的巨大風險(如飛機墜毁)，該賠償金額可能極為龐大，這稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"積累","e":""},{"z":"複合危險","e":""},{"z":"複合風險","e":""},{"z":"基本風險","e":""}],"a":0,"x":"旅遊保險人發出的渡假「套餐」旅遊保單，當遭遇一群保單持有人的巨大風險(如飛機墜毀)，該賠償金額可能極為龐大，這稱為積累。"},{"id":"Y1172","ch":1,"ref":"1.3.3","t":0,"s":"y","q":"旅遊保險通常歸屬於：","qi":[],"qe":"","qei":[],"o":[{"z":"指明保險","e":""},{"z":"度假保險","e":""},{"z":"全險","e":""},{"z":"一籃子保單","e":""}],"a":3,"x":"旅遊保險保障通常屬於「一籃子」交易，"},{"id":"Y1173","ch":1,"ref":"1.3.3","t":0,"s":"y","q":"旅遊保險中，最適合形容該保障是：","qi":[],"qe":"","qei":[],"o":[{"z":"一張短期人壽保單","e":""},{"z":"只提供行程上索償的保單","e":""},{"z":"可以形容是一籃子的保單","e":""},{"z":"對個人責任提供保障","e":""}],"a":2,"x":"旅遊保險保障通常屬於「一籃子」交易，"},{"id":"Y1174","ch":1,"ref":"1.3.3(a)(viii)","t":0,"s":"y","q":"以下哪些情況相當可能是旅遊保險之賠償範圍？","qi":[],"qe":"","qei":[],"o":[{"z":"被保人自殺","e":""},{"z":"因使用汽車而導致的責任","e":""},{"z":"在酒店的酒吧因意外導致財物破壞的責任","e":""},{"z":"以上各項皆不是","e":""}],"a":2,"x":"旅遊保險的保障範圍頗為廣泛，其中包括對個人責任保障，即承保受保人對第三者的死亡、受傷或財產損害所承擔的法律責任，及相關訟費及開支。"},{"id":"Y1178","ch":1,"ref":"1.3.4(a)","t":0,"s":"y","q":"提供財產及經濟權益方面保障的組合保單可以以下哪一種形式簽發？","qi":[],"qe":"","qei":[],"o":[{"z":"全險","e":""},{"z":"指明危險","e":""},{"z":"約定價值","e":""},{"z":"火險與盜竊險","e":""}],"a":0,"x":"財產及經濟權益保險組合保單傾向於提供「全險」保障，在同一張保單下提供實物損害和營業中斷保障。"},{"id":"Y1180","ch":1,"ref":"1.3.4","t":0,"s":"y","q":"商業保險組合保單通常包括哪些項目？","qi":[],"qe":"","qei":[],"o":[{"z":"財產保險","e":""},{"z":"責任保險","e":""},{"z":"經濟權益保險","e":""},{"z":"以上兩項或以上的組合","e":""}],"a":3,"x":"商業保險組合保單通常包括財產保險、經濟權益保險及責任保險。"},{"id":"Y1181","ch":1,"ref":"1.3.4(b)","t":0,"s":"y","q":"以下哪項保單較不可能屬於責任保險組合保單的保障範圍？","qi":[],"qe":"","qei":[],"o":[{"z":"公眾責任保單","e":""},{"z":"汽車責任保單","e":""},{"z":"產品責任保單","e":""},{"z":"僱員補償保單","e":""}],"a":1,"x":"在典型的情況下，責任保險組合保單在一份文件內提供公眾責任、產品責任和僱員補償等三種保障。"},{"id":"Y1182","ch":1,"ref":"1.3.4","t":0,"s":"y","q":"商業保險「組合」保單：","qi":[],"qe":"","qei":[],"o":[{"z":"提供全險保險","e":""},{"z":"累積保費的節省","e":""},{"z":"可以節省多份保單","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"所有各項都是商業保險組合保單的特點，"},{"id":"Y1183","ch":1,"ref":"1.3.4(c)","t":0,"s":"y","q":"「傘括」類型組合保障相當可能承保(或保障)：","qi":[],"qe":"","qei":[],"o":[{"z":"過量雨水帶來的風險","e":""},{"z":"財產保險而已","e":""},{"z":"責任保險而已","e":""},{"z":"所有風險(財產保險、責任保險和經濟權益保險)","e":""}],"a":3,"x":"「傘括」類型組合保險保障可以包括任何類型的保障，包括財產、經濟權益及責任風險。"},{"id":"Y1187","ch":1,"ref":"1.4.1a(d)(ii)","t":0,"s":"y","q":"營業中斷保險中，有一項重要的保單條文，保障在受保危險發生後的一段時間的損失，這段時間稱之為：","qi":[],"qe":"","qei":[],"o":[{"z":"保障期間","e":""},{"z":"保單日期","e":""},{"z":"彌償期間","e":""},{"z":"事件發生後的保險期間","e":""}],"a":2,"x":"營業中斷保險所保障的是，在接著火災等受保危險的發生的一段時間內所遭受的損失。很明顯，必須為「中斷期間」(或彌償期間) 設下一個期限。"},{"id":"Y1190","ch":1,"ref":"1.4.1(a)(iii)","t":0,"s":"y","q":"在火險保單當中，爆炸引致的損失是：","qi":[],"qe":"","qei":[],"o":[{"z":"是屬於基本保單所保險的","e":""},{"z":"屬於除外責任","e":""},{"z":"某些情況下爆炸引致的損失是受保的(例如：家用氣體爆炸)","e":""},{"z":"必須額外繳付保費才能得到保障的","e":""}],"a":2,"x":"雖然在標準火險保單中，爆炸是一項除外的危險，但有關的除外責任條款載明不適用於作家居用途(非商用) 的氣體(或鍋爐) 的爆炸這項受保危險，所導致的損害。"},{"id":"Y1194","ch":1,"ref":"1.4.1(a)(i)","t":0,"s":"y","q":"以下哪項是火災營業中斷保險可以提供補償的範圍？","qi":[],"qe":"","qei":[],"o":[{"z":"毛利(按保單的定義)","e":""},{"z":"工資(不包括毛利的計算)","e":""},{"z":"受保危險引致的必要開支","e":""},{"z":"以上各項都是","e":""}],"a":3,"x":"火災營業中斷保險的保障範圍包括：(i) 因受保危險而導致的毛利潤(按保單定義)損失。(ii) 因受保危險而導致的必要和合理的附加費用(例如租用其他物業)。(iii)營業中斷期間支付的工資。"},{"id":"Y1195","ch":1,"ref":"1.4.1a","t":0,"s":"y","q":"以下哪項是明文刊載受火災營業中斷保險保障的範圍？","qi":[],"qe":"","qei":[],"o":[{"z":"淨利潤","e":""},{"z":"毛利潤","e":""},{"z":"受保處所的損失","e":""},{"z":"以上各項皆是","e":""}],"a":1,"x":"火災營業中斷保險的保障範圍包括：(i) 因受保危險而導致的潤毛利潤(按保單定義)損失。(ii) 因受保危險而導致的必要和合理的附加費用(例如租用其他物業)。(iii)營業中斷期間支付的工資。"},{"id":"Y1196","ch":1,"ref":"1.4.1a(d)(i)","t":0,"s":"y","q":"以下哪些是適用於營業中斷保險的名稱？","qi":[],"qe":"","qei":[],"o":[{"z":"後果損失","e":""},{"z":"附加危險","e":""},{"z":"商業「全」險","e":""},{"z":"上述各項","e":""}],"a":0,"x":"「營業中斷保險」有時也稱為「後果損失保險」或「利潤損失保險」。"},{"id":"Y1199","ch":1,"ref":"1.4.1a(c)","t":0,"s":"y","q":"火災營業中斷保險保費的釐定，是根據時間因素及：","qi":[],"qe":"","qei":[],"o":[{"z":"受保物業的保額","e":""},{"z":"受保物業的保費率","e":""},{"z":"因火災損失之受保物業內物件的保費率","e":""},{"z":"受保人選的受傷數目","e":""}],"a":2,"x":"計算火災營業中斷保險的保費是複雜的，首先以火險中建築物室內的保險費率作為基本費率，然後再根據保障的相關時間因素來計算附加費。"},{"id":"Y1201","ch":1,"ref":"1.4.1(b)(i)","t":0,"s":"y","q":"在香港承保的標準火險保單通常受到「受比例分攤條件」約束，即是：","qi":[],"qe":"","qei":[],"o":[{"z":"假如投保額不足的話，保單屬無效","e":""},{"z":"財產價值是按市場價值來釐定","e":""},{"z":"保單費用是按市場上的平均數來釐定","e":""},{"z":"假如損失時出現保額不足的話，實質上等同保險人與被保險人共購一份保險","e":""}],"a":3,"x":"比例分攤條件指的是財產保險通常要求全額投保：在理賠時會對不足額保險的情況作出懲罰。"},{"id":"Y1203","ch":1,"ref":"1.4.1(a)(iv)","t":0,"s":"y","q":"以下哪項不屬於需要特別附加於商業火險保單基本保障的額外危險？","qi":[],"qe":"","qei":[],"o":[{"z":"旋風","e":""},{"z":"閃電","e":""},{"z":"地震","e":""},{"z":"惡意破壞","e":""}],"a":1,"x":"不管火災是否隨後發生閃電都是受保危險，"},{"id":"Y1204","ch":1,"ref":"1.4.1","t":0,"s":"y","q":"某中式酒樓發生火警，波及上一層屬於林先生的單位，而該單位是受到一份火災保險的保障。為什麼你認為林先生不能得到該保險的保障？","qi":[],"qe":"","qei":[],"o":[{"z":"林先生是可以得到該保險的保障","e":""},{"z":"因為林先生的單位不是首先起火","e":""},{"z":"因為有關情況不符合保單內有關「火」的定義","e":""},{"z":"如有林先生的保單額外保障附加危險，就保障有關情況","e":""}],"a":0,"x":"發生在鄰近物業中並符合定義的火災所產生的熱量、煙或水進而對受保財產造成的損害，也可構成有效的火災索償。"},{"id":"Y1205","ch":1,"ref":"1.4.1(a)(ii)","t":0,"s":"y","q":"以下哪項符合火險保險內「火災」的定義？","qi":[],"qe":"","qei":[],"o":[{"z":"由閃電直接引致的火災所帶來的損毀","e":""},{"z":"麵包烤爐內的麵包不小心被烘焦了","e":""},{"z":"由被保險人故意引起或安排","e":""},{"z":"以上所有各項皆不正確","e":""}],"a":0,"x":"「火災」這項危險是指不應起火的物體(不論是否受保財產)實際上起火了，而且不是由被保險人故意引起或安排的(即不是欺詐)。"},{"id":"Y1210","ch":1,"ref":"1.4.1","t":0,"s":"y","q":"投保一般火險後，以下哪些情況屬於賠償範圍？","qi":[],"qe":"","qei":[],"o":[{"z":"因長期日光暴曬引致的油漆損害","e":""},{"z":"建築物因意外火災引起的濃煙，引致損失","e":""},{"z":"被保人緃火所引起的濃煙，引致損失","e":""},{"z":"一家餐廳的熔爐長期因使用發出的煙引致油漆損害","e":""}],"a":1,"x":"發生在鄰近物業中並符合定義的火災所產生的熱量、煙或水進而對受保財產造成的損害，也可構成有效的火災索償。"},{"id":"Y1211","ch":1,"ref":"1.4.1(a)(i)","t":0,"s":"y","q":"火險保單中，「火災」的定義：","qi":[],"qe":"","qei":[],"o":[{"z":"只限於在受保處裡發生的火警","e":""},{"z":"不限於受保處所裡發生的火警","e":""},{"z":"不包括任何人故意引起的火警","e":""},{"z":"不包括被保險人疏忽引致的火警","e":""}],"a":1,"x":"「火災」這項危險是指不應起火的物體(不論是否受保財產)實際上起火了，而且不是由被保險人故意引起或安排的(即不是欺詐)。火災無須在受保處所燃燒。"},{"id":"Y1213","ch":1,"ref":"1.4.1(b)(ii)","t":0,"s":"y","q":"在火災及附加危險保險中，通常會在哪些情況下受到自負額的限制？","qi":[],"qe":"","qei":[],"o":[{"z":"當出現不足額保險的情況","e":""},{"z":"針對閃電造成的損害","e":""},{"z":"針對某些附加危險而已","e":""},{"z":"針對所有索償而不論原因","e":""}],"a":2,"x":"用於基本保障(即火災、閃電和「某種」爆炸)中的自負額並不多見，然而，某些附加危險的保障設有標準的自負額。"},{"id":"Y1217","ch":1,"ref":"1.4.1a(d)(i)","t":0,"s":"y","q":"營業中斷保險是為「利潤」作出保障，它亦稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"中斷賠償","e":""},{"z":"利潤保障","e":""},{"z":"後果損失","e":""},{"z":"中斷期間","e":""}],"a":2,"x":"「營業中斷保險」是該險種最為趨時的名稱，但是有時也稱為「後果損失保險」或「利潤損失保險」"},{"id":"Y1219","ch":1,"ref":"1.4.2(d)","t":0,"s":"y","q":"以下哪項關於約定價值保單的陳述是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"它通常為貴重物品提供保險","e":""},{"z":"全損時將支付保額","e":""},{"z":"須專家進行獨立的專業估值","e":""},{"z":"以上各項皆是","e":""}],"a":3,"x":"以「全險」方式承保貴重物品這個本來意圖仍然重要。給貴重物品承保「全保」，通常採用約定價值保障(意義是全損時不需理會實際價值而支付保額)，而相關保額或約定價值相當可能是依據獨立而專業的估值來釐訂的。"},{"id":"Y1220","ch":1,"ref":"1.4.2(b)","t":0,"s":"y","q":"以下哪項不是「全險」保單中的除外責任？","qi":[],"qe":"","qei":[],"o":[{"z":"機械生鏽損毀","e":""},{"z":"機器損毀後石頭從環上掉下","e":""},{"z":"因不小心在船邊掉下的相機","e":""},{"z":"因折舊而令電腦的價值下降","e":""}],"a":2,"x":"損耗、折舊等是必然發生的，因此是不可保的。"},{"id":"Y1222","ch":1,"ref":"1.4.2(b)","t":0,"s":"y","q":"在「全險」中，一般的除外責任包括哪些項貝？","qi":[],"qe":"","qei":[],"o":[{"z":"損耗","e":""},{"z":"折舊","e":""},{"z":"基於逐漸運作而引起的損失","e":""},{"z":"上述各項","e":""}],"a":3,"x":"損耗、折舊等是必然發生的，因此是不可保的。"},{"id":"Y1223","ch":1,"ref":"1.4.2(d)(ii)","t":0,"s":"y","q":"「全險」保險的「約定價值」保障是指：","qi":[],"qe":"","qei":[],"o":[{"z":"各項損失的支付金額均在事前議定","e":""},{"z":"支付全損的索償金額在事前議定","e":""},{"z":"支付部份損失的索償金額在事前議定","e":""},{"z":"對於每項及各項索償，保額與最低支付金額相同","e":""}],"a":1,"x":"給貴重物品承保「全保」，通常採用約定價值保障(全損時支付保額，其實際價值無須理會)，而約定價值須於開始時依據獨立而專業的估值來釐訂。"},{"id":"Y1229","ch":1,"ref":"1.4.3(b)(iii)&(d)(iv)","t":0,"s":"y","q":"以下哪項有關盜竊保險中的陳述是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"若不是以全額投保，損失將按比例分攤計","e":""},{"z":"有些保險人仍稱之為入屋盜竊保險","e":""},{"z":"由盜賊引起的火災損失是可獲得保障的","e":""},{"z":"保單條款通常要求盜竊是以強行及暴力的方式進人或離開","e":""}],"a":2,"x":"竊賊緃火以毁滅盜竊證據這種事情間中會發生，但是，在盜竊保單中，由火災引起的損害屬於除外責任的範圍。"},{"id":"Y1232","ch":1,"ref":"1.4.3","t":0,"s":"y","q":"以下哪項或哪些有關商業盜竊保單的描述是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"是以「全險」的方式來承保的","e":""},{"z":"盜竊帶來的損害都被列為除外責任","e":""},{"z":"只有牽涉「以強行及暴力方式進入或離開」被保處所的盜竊才屬於保障範圍內。","e":""},{"z":"以上各項皆是","e":""}],"a":2,"x":"根據保單條款，任可索償如要成功，被保處所的保安防衞物必須遭到某些破壞。通常規定，只有牽涉「以強行及暴力的方式進入或離開」被保處所的盜竊才屬保障範圍內。"},{"id":"Y1238","ch":1,"ref":"1.4.4(a)","t":0,"s":"y","q":"在商用玻璃的維修工程中，常須要用圍板檔住有關之地方，此項工程的成本，在玻璃保險中：","qi":[],"qe":"","qei":[],"o":[{"z":"需要被保險人提出要求才可以得到索償","e":""},{"z":"需要被保險人多付額外的保費才可獲得保障","e":""},{"z":"是屬於基本的保障而不需要多付任何另外保費","e":""},{"z":"是一般的除外責任","e":""}],"a":2,"x":"玻璃保險提供「全險」保障，範圍不僅包括被保固定玻璃的碎裂，還包括其引致的，暫時用圍板檔住被保處所所需的額外費用。"},{"id":"Y1246","ch":1,"ref":"1.4.5(d)(i)","t":0,"s":"y","q":"以下哪項有關可調整保費的描述是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"嚴格來說，在法律上是不可強制執行","e":""},{"z":"保單條件會要求被保險人保留足夠的相關記錄","e":""},{"z":"這與財產保險有關","e":""},{"z":"以上全部各項","e":""}],"a":1,"x":"必須保留足夠的記錄以證實損失金額及進行保費調整。"},{"id":"Y1250","ch":1,"ref":"1.4.6(a)(i)","t":0,"s":"y","q":"忠實保證保險的定義：","qi":[],"qe":"","qei":[],"o":[{"z":"是金錢保險的另一種名稱","e":""},{"z":"保障因職員的不誠實行為而導致的損失","e":""},{"z":"保障因非職員的偷竊及建築物損壞的損失","e":""},{"z":"不屬於經濟權益保險","e":""}],"a":1,"x":"忠實保證保險可能是意外保險的最早形式，它屬於經濟權益保險，承保僱主因任何人在受其僱用的期間進行任何欺詐、盜竊或不誠實等行為而導致的金錢或財產損失。"},{"id":"Y1262","ch":1,"ref":"1.5.1(a)","t":0,"s":"y","q":"鍋爐爆炸保險保障在什麼時間因鍋爐或壓力容器發生的爆炸或倒塌所帶來的損失？","qi":[],"qe":"","qei":[],"o":[{"z":"任何時間","e":""},{"z":"工作時間之內","e":""},{"z":"工作時間以外","e":""},{"z":"在正常工作過程中","e":""}],"a":3,"x":"鍋爐爆炸保險承保鍋爐或壓力容器「在正常運作過程中」爆炸(屬物理性質而非化學性質的) 或倒塌所帶來的損失。"},{"id":"Y1265","ch":1,"ref":"1.5.2(b)","t":0,"s":"y","q":"以下哪項或哪些是機器損壞保險的除外責任？","qi":[],"qe":"","qei":[],"o":[{"z":"一項(通常非通龐大的) 免賠額","e":""},{"z":"戰爭和有關的風險","e":""},{"z":"機器損壞的後果損失","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"所有各項都是機器損壞保險的除外責任，"},{"id":"Y1267","ch":1,"ref":"1.5.2(a)","t":0,"s":"y","q":"機器損壞保險是對於受保物「不可預見及突如其來」的實質損失或毁壞提供保險，這類保障是屬於：","qi":[],"qe":"","qei":[],"o":[{"z":"經濟權益保障","e":""},{"z":"責任保障","e":""},{"z":"財產保障","e":""},{"z":"後果損失保障","e":""}],"a":2,"x":"機器損壞保險是對於受保物「不可預見及突如其來」的實質損失或毁壞提供保險，這類保障是屬於財產保障。"},{"id":"Y1269","ch":1,"ref":"1.5.3(a)","t":0,"s":"y","q":"建築工程「全險」保險的保障範圍通常包括：","qi":[],"qe":"","qei":[],"o":[{"z":"財產及責任保險的組合","e":""},{"z":"財產保險而已","e":""},{"z":"責任保險而已","e":""},{"z":"經濟權益保險","e":""}],"a":0,"x":"常見的建築工程「全險」保單格式包含兩部分：第一部分：就指明的財產以「全險」方式提供財產保險。第二部分：承保對因建築工程導致第三者受傷或財產損失所負的法律責任。"},{"id":"Y1271","ch":1,"ref":"1.5.3(a)(ii)","t":0,"s":"y","q":"建築「全險」通常由兩部份所組成，第一部分提供「全險」的財產保險，第二部分提供：","qi":[],"qe":"","qei":[],"o":[{"z":"責任保險","e":""},{"z":"僱主責任保險","e":""},{"z":"忠實保證保險","e":""},{"z":"盜竊保險","e":""}],"a":0,"x":"第二部分承保對因建築工程導致第三者受傷或財產損失所負的法律責任。"},{"id":"Y1272","ch":1,"ref":"1.5.3(a)","t":0,"s":"y","q":"「建築全險保單」中的第一部分會提供以下哪項保障？","qi":[],"qe":"","qei":[],"o":[{"z":"颱風對正在進行的工程損毀","e":""},{"z":"因錯誤設計而導致損失","e":""},{"z":"責任保險而已","e":""},{"z":"經濟權益保險","e":""}],"a":0,"x":"第一部分就指明的財產以「全險」方式提供財產保險。因錯誤設計而導致損失屬除外責任。第二部分承保對因建築工程導致第三者受傷或財產損失所負的法律責任。"},{"id":"Y1279","ch":1,"ref":"1.5.3(a)(i)","t":0,"s":"y","q":"香港政府正計劃進行填海工程，並提供機器供承建商使用。為該機器提供保障的保險是：","qi":[],"qe":"","qei":[],"o":[{"z":"建築工程「全險」保險第一部分","e":""},{"z":"安裝工程「全險」保險","e":""},{"z":"建築工程「全險」保險第二部分","e":""},{"z":"裝配及安裝保險","e":""}],"a":0,"x":"建築工程「全險」保險第一部分就指明的財產以「全險」方式提供財產保險。受保財產相當可能包括合約工程和任何由委託人供應的物料，附加承保建築用的裝置、設備和機械(作為單獨的裝置及機械保單的替代方法)也行。清除殘物損物的費用也可包括在內。"},{"id":"Y1280","ch":1,"ref":"1.5.3(b)","t":0,"s":"y","q":"某承建商打算在距離中國銀行大廈幾米的地方展開挖掘工程。以下哪項危險很大可能被其承建商購買的建築工程「全險」列為除外責任，但卻可額外付費贖回？","qi":[],"qe":"","qei":[],"o":[{"z":"地陷","e":""},{"z":"消除或減弱第三者建築而承擔的法律責任","e":""},{"z":"消除或減弱第三者建築而導致本身的損害","e":""},{"z":"消除或減弱第三者建築而導致本身的損害或承擔的法律責任","e":""}],"a":1,"x":"建築工程「全險」保險的第二部分豁免承保就屬於被保險人的財產(例如保單第一部分所承保的工程)的損失或損害承擔的法律責任，及多種危險，包括減弱或消除支撐力(可以額外支付保費購買批單來承保這些風險)。"},{"id":"Y1284","ch":1,"ref":"1.6","t":0,"s":"y","q":"責任保險可能從法定要求(條例的條款) 及普通法(疏忽) 下及合約下(協議下) 產生，下列哪項是可保的？","qi":[],"qe":"","qei":[],"o":[{"z":"法律要求而已","e":""},{"z":"普通法而已","e":""},{"z":"法律及普通法而已","e":""},{"z":"法定、普通法及合約下的責任","e":""}],"a":2,"x":"各別保障所保的法律責任可能因法規(即由立法機關制定的法律) 及 / 或普通法(通常因疏忽)而產生。法律責任也可以在合約下產生，然而藉協議承擔的法律責任，通常屬於責任保障的除外責任。"},{"id":"Y1285","ch":1,"ref":"1.6","t":0,"s":"y","q":"在港簽發的「責任保險」中「第三者」是指：","qi":[],"qe":"","qei":[],"o":[{"z":"被保險人的僱員","e":""},{"z":"與被保險人毫無關係的人","e":""},{"z":"被保險人的家庭成員","e":""},{"z":"與任何索償無關的人","e":""}],"a":1,"x":"「第三者」一詞相當可能會被闡釋為保險人和正向保險人索取彌償的人這兩人以外的任何人。"},{"id":"Y1287","ch":1,"ref":"1.6(a)","t":0,"s":"y","q":"索償發展及賠償進度都十分快捷(大多數的財產保單) 這類保險成為：","qi":[],"qe":"","qei":[],"o":[{"z":"長期責任業務","e":""},{"z":"短期責任業務","e":""},{"z":"一般保險業務","e":""},{"z":"長期保險業務","e":""}],"a":1,"x":"「責任短期可決」業務一般包括財產保險，"},{"id":"Y1289","ch":1,"ref":"1.6","t":0,"s":"y","q":"在責任保險的形式下，合約下的責任(藉協議而承擔的責任) 是：","qi":[],"qe":"","qei":[],"o":[{"z":"通常的除外責任","e":""},{"z":"法律上不可保的","e":""},{"z":"自動得到保障的","e":""},{"z":"不保的","e":""}],"a":0,"x":"法律責任也可以在合約下產生，然而藉協議承擔的法律責任，通常屬於責任保障的除外責任。"},{"id":"Y1294","ch":1,"ref":"1.6.1","t":0,"s":"y","q":"以下哪項 / 哪些有關僱員補償條例的描述是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"通常只適合用於受傷或死亡","e":""},{"z":"賠償金額可能比實際的損失還要低","e":""},{"z":"必須證明僱主的疏忽","e":""},{"z":"必須於工作期間引致受傷的死亡","e":""}],"a":2,"x":"《僱員補償條例》下的法律責任是加諸於僱主身上的法定責任。如果僱員在受僱期間因工遭遇意外事故以致受傷或死亡，那麼，僱主必須向僱員或其受養人支付規定的補償金額，而有關金額可能在個別個案中比實際的損失還要低。相對應「有過失法律責任」，這種法律責任是「嚴格法律責任」，即不論僱主一方是否疏忽，也要負責給予補償。"},{"id":"Y1295","ch":1,"ref":"1.6.1","t":0,"s":"y","q":"以下哪項 / 哪些有關僱員補償保單的描述是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"它並不要求大部份僱主投保","e":""},{"z":"它可以賠償不是僱主引致的疏忽或責任","e":""},{"z":"它提供多於《僱員補償條例》的補償","e":""},{"z":"以上各項皆符合","e":""}],"a":1,"x":"僱員補償保險是強制保險的一個主要分支。相對應「有過失法律責任」，《僱員補償條例》下的法律責任是「嚴格法律責任」，即不論僱主一方是否疏忽，也要負責給予補償。"},{"id":"Y1296","ch":1,"ref":"1.6.1","t":0,"s":"y","q":"比較《僱員補償條例》下的責任及普通法下的責任時：","qi":[],"qe":"","qei":[],"o":[{"z":"《僱員補償條例》下的責任可以在沒有疏忽的證明的情況下產生","e":""},{"z":"普通法下的責任不容許僱主提出反駁","e":""},{"z":"根據《僱員補償條例》下的責任的賠償通常會超過根據普通法下的責任的賠償","e":""},{"z":"以上各項皆正確","e":""}],"a":0,"x":"相對應「有過失法律責任」，《僱員補償條例》下的法律責任是「嚴格法律責任」，即不論僱主是否曾經疏忽，也要負責給予補償。受傷或死亡的僱員或其受養人有權獲得全額補償，但是首先要確立僱主的法律責任，而僱主或其保險人可以提出爭議。僱主必須向僱員或其受養人支付規定的補償金額，而有關金額可能在個別個案中比實際的損失還要低。"},{"id":"Y1308","ch":1,"ref":"1.6.2","t":0,"s":"y","q":"有問題的玩具會引致兒童受傷，這樣牽涉的法律責任與以下哪種保險有關？","qi":[],"qe":"","qei":[],"o":[{"z":"公眾責任保險","e":""},{"z":"產品責任保險","e":""},{"z":"專業彌償保險","e":""},{"z":"錯誤及疏忽保險","e":""}],"a":1,"x":"每位製造商或賣家均對其消費者負有一項照顧責任，就是不可製造或向他們銷售「有問題的產品」，使他們因此蒙受傷害或損害。產品責任保單承保就由所售賣、供應或維修的貨品，或所提供的服務等引起，及在由被保險人擁有或佔用的處所以外的地方發生的傷害或損害，承擔的法律責任。類似法律責任如在被保險人的處所引起，應該由公眾責任保單承保。"},{"id":"Y1309","ch":1,"ref":"1.6.2","t":0,"s":"y","q":"產品在製造過程中出現錯誤，引致消費者在使用時漏電，索償時會涉及以下哪項保險？","qi":[],"qe":"","qei":[],"o":[{"z":"公眾責任","e":""},{"z":"專業責任","e":""},{"z":"產品責任","e":""},{"z":"以上全部各項","e":""}],"a":2,"x":"每位製造商或賣家均對其消費者負有一項照顧責任，就是不可製造或向他們銷售「有問題的產品」，使他們因此蒙受傷害或損害。產品責任保單承保就由所售賣、供應或維修的貨品，或所提供的服務等引起，及在由被保險人擁有或佔用的處所以外的地方發生的傷害或損害，承擔的法律責任。"},{"id":"Y1310","ch":1,"ref":"1.6.3","t":0,"s":"y","q":"一名律師未能及時採取法律行動，令其客戶蒙受巨大的損失。下列哪項保障可承擔該名律師面對的法律責任？","qi":[],"qe":"","qei":[],"o":[{"z":"公眾責任保險","e":""},{"z":"產品責任保險","e":""},{"z":"忠誠保證保險","e":""},{"z":"專業彌償保險","e":""}],"a":3,"x":"專業彌償保單為「專業」人士提供保障，例如律師、醫生(醫療事故責任保險)、會計師、建築師、基金經理、受托人等，因此，這種保障是承保專業作為及不作為中的失誤，其中包括提供不適當的見。"},{"id":"Y1311","ch":1,"ref":"1.6.3","t":0,"s":"y","q":"以下哪項對於專業彌償保險的描述不正確？","qi":[],"qe":"","qei":[],"o":[{"z":"以索償申報的方式簽發","e":""},{"z":"保障包括有毛病的產品責任","e":""},{"z":"保障包括專業人士的疏忽行為及錯誤","e":""},{"z":"又稱為 \"為醫療有關的怠忽職守\"","e":""}],"a":1,"x":"有毛病的產品責任屬產品責任保險的保障範圍，"},{"id":"Y1315","ch":1,"ref":"1.6.3","t":0,"s":"y","q":"醫療事故責任保險屬於：","qi":[],"qe":"","qei":[],"o":[{"z":"住院保險","e":""},{"z":"公眾責任保險","e":""},{"z":"醫療責任保險","e":""},{"z":"為醫生而設的專業彌償保險","e":""}],"a":3,"x":"專業彌償保單為「專業」人士提供保障，例如律師、醫生(醫療事故責任保險、會計師、建築師、基金經理、受托人等，因此，這種保障是承保專業作為及不作為中的失誤，其中包括提供不適當的見。"},{"id":"Y1316","ch":1,"ref":"1.6.5","t":0,"s":"y","q":"以下哪項對於公眾責任保險的描述不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"保費一般是暫繳的，而且可以調整的","e":""},{"z":"主要保障對象是公眾及僱員","e":""},{"z":"保障範圍是不包括僱員","e":""},{"z":"保障實際索償的損失及訴訟費用","e":""}],"a":1,"x":"不屬於專門的責任保險(如汽車保險、僱員補償保險、產品責任保險、專業彌償保險等)責任，可保的法律責任，就是公眾責任保單的保障範圍。"},{"id":"Y1318","ch":1,"ref":"1.6.5(d)","t":0,"s":"y","q":"一間快餐店買了兩份公眾責任保險，一份保 2005 年，一份保 2006 年。快餐店於 2006 年收到某一顧客就 2005 年於其處所受傷的申索。這宗索償很可能涉及：","qi":[],"qe":"","qei":[],"o":[{"z":"很可能是第一份保險，因為公眾責任保險通常是以「索償發生」的方式訂立的","e":""},{"z":"很可能是第二份保險，因為公眾責任保險通常是以「索償申報」的方式訂立的","e":""},{"z":"肯定是第一份保險，因為公眾責任保險必以「索償發生」的方式訂立的","e":""},{"z":"肯定是第二份保險，因為公眾責任保險必(must be)以「索償申報」的方式訂立的","e":""}],"a":0,"x":"公眾責任保險通常是用「索償發生」的方式提供保險保障的，「索償申報」方式則不常用。"},{"id":"Y1328","ch":1,"ref":"1.7(f)","t":0,"s":"y","q":"以下哪項關於水險保單中的約定價值是正確？","qi":[],"qe":"","qei":[],"o":[{"z":"被保險人必須對貨物進行獨立的評估","e":""},{"z":"它只適用於非全損","e":""},{"z":"它不具保額","e":""},{"z":"它是為了商業上的方便而購買的","e":""}],"a":3,"x":"為了商業上的方便，承保船隻或貨物的保險一般是以約定價值方式提供保險保障的 - -除了保額以外，保單還指明一個約定價值。就全損及部分損失而言，該約定價值(而非受保財產的實際價值) 將被當作是損失發生時的財產價值。"},{"id":"Y1332","ch":1,"ref":"1.7.1(a)","t":0,"s":"y","q":"根據海上貨物保險，「倉至倉」是以下哪項的正確陳述？","qi":[],"qe":"","qei":[],"o":[{"z":"只是指任何水上的運輸途徑","e":""},{"z":"只是指有關陸上的運輸途徑","e":""},{"z":"是指包括水上及陸上的運輸途徑","e":""},{"z":"是指由港口至貨倉的有關連輸途徑","e":""}],"a":2,"x":"海上貨物保險保障大多數是「倉至倉」的保障，意思是保險保障自貨物離開發貨人的倉庫時開始，直至到達最終存放目的地時完結。這幾乎一定會同時涉及陸路和上水上的運送。"},{"id":"Y1333","ch":1,"ref":"1.7.1(a)","t":0,"s":"y","q":"一批貨物投買協會貨物條款 A，經運送後存放在目的地的海關貨倉，但被火災燒毁。這個情況能不能得到保障？","qi":[],"qe":"","qei":[],"o":[{"z":"不能，因保障是「港至港」一卸貨保障就終止","e":""},{"z":"能，火是受保危險，而且保障是「倉至倉」","e":""},{"z":"不能，只有火險保單才能保障這個情況","e":""},{"z":"能，火是受保危險，而且保障是「港至港」","e":""}],"a":1,"x":"根據協會貨物條款A，有關的本身損害保險保障是「全險」的，很多時候這是就付運的貨物提供貸款或保證的銀行唯一可以接納的保險保障。海上貨物保險保障大多數是「倉至倉」的保障。"},{"id":"Y1334","ch":1,"ref":"1.7(h)","t":0,"s":"y","q":"「協會條款」在水險是以編號條款形式構成一套公認的合約用詞，這協會是：","qi":[],"qe":"","qei":[],"o":[{"z":"德國保險人協會","e":""},{"z":"倫敦保險人協會","e":""},{"z":"香港水險協會","e":""},{"z":"水險保障協會","e":""}],"a":1,"x":"香港的商業水險中，大部分保單均以協會條款作為措詞。協會(指倫敦保險人協會)條款在國際水險業中聲譽卓著，是被公認的保單措詞，並且幾乎被全球所有的保險人、銀行和有利害關係的機構所採納使用。"},{"id":"Y1336","ch":1,"ref":"1.7(b)","t":0,"s":"y","q":"遇上海上風險，某人因拯救船上財物，向拯救者支付一筆償金，稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"救助","e":""},{"z":"代位權","e":""},{"z":"分攤","e":""},{"z":"共同海損","e":""}],"a":0,"x":"在海商法中，「救助」一詞一般指以「無效果 - -無報酬」為條件而搶救正受海上風險、海盜或敵對行為威脅的船隻或其他海上財產，行動成功的話，有關財產的擁有人必須向救助人員支付一筆名為「救助償金」的金錢，在海上保險條款中則稱為「救助費用」。"},{"id":"Y1338","ch":1,"ref":"1.7(a)(ii)","t":0,"s":"y","q":"為了挽救冒險中受險的生意而犧牲，，損失者可以向其他利益代表要求分擔出現的損失。這個慣例稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"分攤","e":""},{"z":"代位權","e":""},{"z":"共同海損","e":""},{"z":"按比例海損","e":""}],"a":2,"x":"凡在發生危險時，為了保存共同冒險中陷於危險中的財產而自願和合理地作出或招致任何特殊犧牲或費用，屬於共同海損行為。"},{"id":"Y1339","ch":1,"ref":"1.7(a)","t":0,"s":"y","q":"一般水險有兩種海損，一種是共同海損，而另一種是：","qi":[],"qe":"","qei":[],"o":[{"z":"單獨海損","e":""},{"z":"獨立海損","e":""},{"z":"海損的特別條例","e":""},{"z":"分攤海損","e":""}],"a":0,"x":"在水險中的有兩種部分損失：單獨海損和共同海損。"},{"id":"Y1342","ch":1,"ref":"1.7(a)(ii)","t":0,"s":"y","q":"一項海上冒險中作出犧牲，成功挽救其他財物。遭受損失者有權向其他財產擁有權益者作出追討，這稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"代位權","e":""},{"z":"分攤","e":""},{"z":"共同海損","e":""},{"z":"單獨海損","e":""}],"a":2,"x":"凡在發生危險時，為了保存共同冒險中陷於危險中的財產而自願和合理地作出或招致任何特殊犧牲或費用，屬於共同海損行為。"},{"id":"Y1349","ch":1,"ref":"1.7.2(a)(iv)","t":0,"s":"y","q":"碰撞責任保障並不常見。這類保障一般只承擔其中四分之三的法律責任，餘下四分之一：","qi":[],"qe":"","qei":[],"o":[{"z":"船東通常不會投買","e":""},{"z":"不能在別處投買","e":""},{"z":"向船東保賠組織投買","e":""},{"z":"由一份獨立的船體保險提供保障","e":""}],"a":2,"x":"保單只負責碰撞法律責任的 75% (總是以 3/4this 表示)。餘下的25%，連同某些其他類型的「船東法律責任」，則由船東保賠組織承保。"},{"id":"Y1352","ch":1,"ref":"1.7.2(a)","t":0,"s":"y","q":"以下哪項是海洋船舶保險的保障範圓的標準特點？","qi":["損害防止的開支","共同海損及救援的費用","保障船主所承受的一切責任風險","保障範圍包括船隻整體及設備的損失及損毀"],"qe":"","qei":[],"o":[{"z":"(i) 及(ii)","e":""},{"z":"(ii) 及(iii)","e":""},{"z":"(i), (ii) 及(iv)","e":""},{"z":"(i)、(ii)、(iii) 及(iv)","e":""}],"a":2,"x":"船舶保險(有時稱為「船殼及機器保險」)不僅承保受保船隻的船殼，還承保其設備、物料、救生艇，以及該船需用的燃料等。損害防止費用及共同海損和救助費用是受保的。協會船舶條款所提供的財產保險保障一般是指明危險的(海險、火災、爆炸等)。"},{"id":"Y1354","ch":1,"ref":"1.7.2","t":0,"s":"y","q":"船舶保險的財產損害部份有可能是：","qi":[],"qe":"","qei":[],"o":[{"z":"船上裝有的貨物","e":""},{"z":"船上設備","e":""},{"z":"船身主體部份","e":""},{"z":"船頭之損毀部份","e":""}],"a":2,"x":"船舶保險(有時稱為「船殼及機器保險」)不僅承保受保船隻的船殼，還承保其設備、物料、救
