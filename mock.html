Insurable interests"}],"a":1,"x":"索償或保險金要求、仲裁、取消、比例分攤、保單修改法律狀況及可調整的保費都均為保單條款元素。"},{"id":"B431","ch":2,"ref":"2.3.2(b)(iv)","t":1,"s":"by","q":"購買不足額的保險會引致應用比例分攤的原則，即：","qi":[],"qe":"Under-insurance will lead to the application of average principle, which means:","qei":[],"o":[{"z":"賠償已邀交的保費","e":"Compensate the premiums paid"},{"z":"賠償保額","e":"Compensate the sum insured"},{"z":"按損失比例減低賠償","e":"Reduce compensation according to rate of loss"},{"z":"兩份保單同時作出賠償","e":"Two policies make compensation at the same time"}],"a":2,"x":"比例分攤是對損失發生時保額不足的情況加以懲罰。"},{"id":"B432","ch":2,"ref":"2.3.3(a)","t":1,"s":"by","q":"以下哪項是一般保險中自負額的不正確陳述？","qi":[],"qe":"Which of the following is incorrect in describing excess of general insurance?","qei":[],"o":[{"z":"標準自負額適用於所有同一種類保單","e":"Standard excess is applicable to all policies in that class"},{"z":"附加自負額是由承保人額外規定的","e":"Imposed excess is requested by the underwriter additionally"},{"z":"自願性自負額由被保險人主動提出的","e":"Voluntary excess is raised by the insured"},{"z":"所有各類型保單均可由被保險人主動提出自負額藉以減低保費","e":"All insurance policies allow the insured to choose an excess in order to obtain a premium reduction"}],"a":3,"x":"自願性自負額是被保險人自己選擇的，藉此取得扣減保費的優惠，但不是所有各類型保單均可由被保險人主動提出。"},{"id":"B433","ch":2,"ref":"2.3.3(a)","t":1,"s":"by","q":"自負額通常包括以下哪項？","qi":["標準的自負額","施加的自負額","核保的自負額","自願的自負額"],"qe":"Excesses usually include which of the following?","qei":["Standard excess","Imposed excess","Underwriting excess","Voluntary excess"],"o":[{"z":"i, ii , iii","e":""},{"z":"i, ii , iv","e":""},{"z":"ii, iii , iv","e":""},{"z":"i, ii, iii , iv","e":""}],"a":1,"x":"自負額分為標準、施加及自願的三種。"},{"id":"B434","ch":2,"ref":"2.3.3(a)","t":1,"s":"by","q":"以下哪項描述對標準的自負額是正確的？","qi":[],"qe":"Which of the following is correct in describing standard excess?","qei":[],"o":[{"z":"是保險公司額外實施的，藉此抗衡不利的特點","e":"It is imposed by the insurer to counteract adverse features"},{"z":"是被保險人取得保費扣減的手法","e":"It is the method used by the insured in order to obtain premium reduction"},{"z":"適用於所有同類保單(例如「年輕司機」自負額)","e":"It is applicable to all policies in that class (e.g. \"young driver\" excess)"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"標準自負額適用於所有同類的保單（例如汽車保單中的「年輕司機自負額」）。"},{"id":"B435","ch":2,"ref":"2.3.3(a)(i)","t":1,"s":"by","q":"汽車保險中保險人會對一些特定風險，要求作出自負額名為：","qi":[],"qe":"For motor insurance insurer may request excess for certain specified risks, which is:","qei":[],"o":[{"z":"附加自負額","e":"Imposed excess"},{"z":"標準自負額","e":"Standard excess"},{"z":"自願性自負額","e":"Voluntary excess"},{"z":"歧視性自負額","e":"Discriminatory excess"}],"a":1,"x":"標準自負額適用於所有同類的保單（例如汽車保單中的「年輕司機自負額」）。"},{"id":"B436","ch":2,"ref":"2.3.3(a)(i)","t":1,"s":"by","q":"大部份的汽車保險單中，都設有「年輕駕駛人仕」的自負額。這種自負額稱為：","qi":[],"qe":"For most motor insurance policies there is an excess for \"\"young driver\"\". This excess is called:","qei":[],"o":[{"z":"普遍自負額","e":"Popular excess"},{"z":"標準自負額","e":"Standard excess"},{"z":"自願自負額","e":"Voluntary excess"},{"z":"個人核保自負額","e":"Personal underwriting excess"}],"a":1,"x":"標準自負額適用於所有同類的保單（例如汽車保單中的「年輕司機自負額」）。"},{"id":"B437","ch":2,"ref":"2.3.3(a)(ii)","t":1,"s":"by","q":"以下哪項自負額是承保人為抗衡不利特點而額外實施，而且投保人不會得到保費扣減？","qi":[],"qe":"Which of the following excesses is used by underwriters to counteract adverse features and the insured will not get any premium reduction?","qei":[],"o":[{"z":"標準自負額","e":"Standard excess"},{"z":"附加自負額","e":"Imposed excess"},{"z":"自願自負額","e":"Voluntary excess"},{"z":"核保自負額","e":"Underwriting excess"}],"a":1,"x":"施加的自負額由核保人額外規定的（保費不獲扣減），藉以抵消擬保風險的某些不利因素（例如某張「全險」保單已錄得了幾項小額索償）。"},{"id":"B438","ch":2,"ref":"2.3.3(a)(iii)","t":1,"s":"by","q":"在汽車保險中，以下哪項自負額可得到保費的扣減？","qi":[],"qe":"In motor insurance, which of the following excesses can obtain premium reduction?","qei":[],"o":[{"z":"標準自負額","e":"Standard excess"},{"z":"自願性自負額","e":"Voluntary excess"},{"z":"由保險公司所訂定的自負額","e":"Excess as set by the insurers"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"自願的自負額是被保險人自己選擇的，藉此取得扣減保費的優惠。"},{"id":"B439","ch":2,"ref":"2.3.3(b)","t":1,"s":"b5y","q":"如果一份保險保單受到免賠額約束，它的意思是指：","qi":[],"qe":"If an insurance policy is subject to deductible, it means:","qei":[],"o":[{"z":"低於免賠額的索償不會獲賠償","e":"The amount of claim below the deductible will not be compensated"},{"z":"保險人就有關保費提供折扣","e":"Insurers provide discount on the premiums"},{"z":"如果不足額保險出現的話，索償的付款便會減少","e":"If under-insurance occurs, the compensation payment will be reduced"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"起賠額的功能是排除小額索償，而只就達到或超逾該起賠額的損失作出足額賠償。"},{"id":"B440","ch":2,"ref":"2.3.3(b)","t":1,"s":"by","q":"以下哪項對於免賠額的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing deductible?","qei":[],"o":[{"z":"免賠額與起賠額的意義相同","e":"Deductible has the same meaning as franchise"},{"z":"任何低於免賠額的索償都得不到賠償","e":"Any amount of claim below the deductible will not be compensated"},{"z":"任何高於免賠額的索償都可全數獲得賠償","e":"Any amount of claim above the deductible will be fully compensated"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"起賠額的功能是排除小額索償，而只就達到或超逾該起賠額的損失作出足額賠償。"},{"id":"B441","ch":1,"ref":"1.7.2","t":1,"s":"by","q":"1,000,000元保額的單獨海損的免賠額為損失的5%，當出現索償時，被保險人須承擔：","qi":[],"qe":"The deductible for a particular average with a sum insured at HK$1,000,000 is 5% of the loss. When a claim arises, the insured must bear:","qei":[],"o":[{"z":"50,000元(對於全部損失索償)","e":"HK$50,000 (to total loss claim)"},{"z":"950,000元(對於非全部損失索償)","e":"HK$950,000 (to non-total loss claim)"},{"z":"1,000,000元(對於非全部損失索償)","e":"HK$1,000,000 (to non-total loss claim)"},{"z":"0元(對於全部損失索償)","e":"HK$0 (to total loss claim)"}],"a":3,"x":"免賠額就部分損失而非全損索償設定了免賠額，這與其他險種的做法有所不同。"},{"id":"B442","ch":2,"ref":"2.3.3(c)","t":1,"s":"b3y","q":"起賠額的意思是：","qi":[],"qe":"Franchise means:","qei":[],"o":[{"z":"任何高於起賠額的索償可獲全數賠償","e":"Any claim exceeding the franchise will be compensated in full"},{"z":"任何低於起賠額的索償都得不到賠償","e":"Any claim below the franchise will not be compensated"},{"z":"希望消除小額索償","e":"Intends to eliminate small claims"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"起賠額的功能是排除小額索償，而只就達到或超逾該起賠額的損失作出足額賠償。"},{"id":"B443","ch":2,"ref":"2.3.3(c)","t":1,"s":"by","q":"如果一份保單的起賠額是五百元正，對於五百元的索償，保險人需給付多少錢？","qi":[],"qe":"If the franchise of a policy is HK$500, for a claim of HK$500, how much the insurer must pay?","qei":[],"o":[{"z":"三百元","e":"HK$300"},{"z":"四百元","e":"HK$400"},{"z":"五百元","e":"HK$500"},{"z":"保險人無需付給此索償","e":"There is no need for the insurer to pay the claim"}],"a":2,"x":"起賠額的功能是排除小額索償，而只就達到或超逾該起賠額的損失作出足額賠償。500元已到起賠額之金額，並由保險人負責。"},{"id":"B444","ch":2,"ref":"2.3.5","t":1,"s":"b","q":"以下哪項除外責任屬於保單的條款?","qi":[],"qe":"Which of the following exclusions is a term of the policy?","qei":[],"o":[{"z":"一般除外責任","e":"General exclusions/exceptions"},{"z":"特定除外責任","e":"Specific Exclusions"},{"z":"業界除外責任","e":"Market Exclusions"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"除外責任分為通用、特定及業界除外責任。"},{"id":"B445","ch":2,"ref":"2.3.4(a)","t":1,"s":"by","q":"以下哪項屬於對保證的正確描述？","qi":[],"qe":"Which of the following is correct in describing warranties?","qei":[],"o":[{"z":"違反保證可令致保單由生效日期開始時當作無效","e":"A breach of warranty automatically discharges policy liability as from the date it is in effect"},{"z":"保證可分為明示，隱含及中性","e":"Warranties can be express, implied and neutral"},{"z":"正常情況下，保證以明示方式出現於保單條件中","e":"In normal circumstance, warranty is express in policy conditions"},{"z":"違反保證必然與損失之間存在著因果關係","e":"A breach in warranty definitely has a causal relationship with loss"}],"a":2,"x":"在典型的一般保險投保書上的聲明中的保證，承諾投保書上的回答都是完整及真實的。"},{"id":"B446","ch":2,"ref":"2.3.4(a)","t":1,"s":"b3","q":"以下哪項描述是指被保險人作出一項絕對承諾，而涉及的承諾可以是作出或避免作出一些行為？","qi":[],"qe":"Which of the following description means the insured makes an absolute undertaking, and that undertaking maybe to do something, or refrain from doing something?","qei":[],"o":[{"z":"保證","e":"Warranty"},{"z":"免賠額","e":"Deductibles"},{"z":"背書","e":"Endorsement"},{"z":"明示條件","e":"Express condition"}],"a":0,"x":"「保證」可以被視為一項被保險人對保險人所作出的、必須確實遵守的承諾。"},{"id":"B447","ch":2,"ref":"2.3.4(a)","t":1,"s":"by","q":"優良保險慣例的一般原則建議不應因違反保證而拒絕索償，除非：","qi":[],"qe":"The general principle of good insurance practice suggests not to refuse a claim because of a breach in warranty, unless:","qei":[],"o":[{"z":"索償額巨大","e":"Claim amount is large"},{"z":"涉及強制性的保險索償","e":"It involves claim of compulsory insurance"},{"z":"違反保証與索償有重要的因果關係","e":"A casual connection between a breach of warranty and a loss exists"},{"z":"這並非被保險人在該單的第一次索償","e":"It is not the first claim of the insured on that policy"}],"a":2,"x":"為了減輕保證的嚴酷程度，由香港保險業聯會發出以供會員遵守的《承保商專業守則》，規定保險人只可於違反保證和損失之間存在着因果關係，或違反屬欺詐行為的情況下，利用該違反作為拒賠的理由。"},{"id":"B448","ch":2,"ref":"2.3.4(a)","t":1,"s":"b","q":"若被保人違反投保書內所提出的保証，保險人是會按一般守則要求一種關係才會拒絕賠償，這程「關係」是指：","qi":[],"qe":"If the insured commits a breach of the warranty mentioned in the proposal, insurer will follow the code of conduct to request a relationship to refuse the claim. Such \"\"relationship\"\" means:","qei":[],"o":[{"z":"該項違反是與導致的損失有著重大的關係","e":"There is an important relationship of the breach and the loss caused"},{"z":"該項違反是與導致的損失毋須有任何的關係","e":"It is not necessary for any relationship of the breach and the loss caused"},{"z":"被保險人與該項保証的關係","e":"Relationship between the insured and the warranty"},{"z":"保險人與該項保証的關係","e":"Relationship between the insurer and the warranty"}],"a":0,"x":"《承保商專業守則》規定保險人只可於違反保證和損失之間存在着因果關係，或違反屬欺詐行為的情況下，利用該違反作為拒賠的理由。"},{"id":"B449","ch":2,"ref":"2.3.4(a)","t":1,"s":"b","q":"以下哪項有關保險保證的說明是正確的?","qi":["若然違反保證，保險人便可拒絕承諾有關合約","保險人在拒絕索償前會要求的一種關係","保險人可要求被保險人採取一些行動(設置警鍾)","保險人可要求被保險人避免一些行動(拆御有關設施)"],"qe":"Which of the following is correct about insurance warranties?","qei":["IF there is a breach in warranty, insurer can refuse to honour the contract","Insurer will request a relationship before refusing a claim","Insurer can request the insured to take certain actions (install alarm)","Insurer can request the insured avoid certain action (uninstall related facilities)"],"o":[{"z":"i , ii","e":""},{"z":"iii, iv","e":""},{"z":"i, ii, iii","e":""},{"z":"i, ii, iii, iv","e":""}],"a":3,"x":"以上四項均為保證的說明，並以假設的方式說明其中兩個保證的元素:有所為、有所不為。同時《承保商專業守則》規定保險人只可於違反保證和損失之間存在着因果關係，或違反屬欺詐行為的情況下，利用該違反作為拒賠的理由。"},{"id":"B450","ch":2,"ref":"2.3.4(a)","t":1,"s":"by","q":"當一位公正的保險人利用違反保證事項為由來拒絕一個可能有效的索償前，他會考慮所違反之事項是否與那項索償情況有任何「關係」。此「關係」意思是指：","qi":[],"qe":"If a fair insurer uses the breach in warranty as reason to refuse a possible effective claim, he will consider the breach has any \"relationship\" with the claim. Here, \"relationship\" means:","qei":[],"o":[{"z":"所違反保證事項屬於蓄意造成","e":"The breach in warranty is intentionally caused"},{"z":"有牽涉欺詐成份","e":"It involves fraudulent elements"},{"z":"該項違反保證對那項索償情況有著重大意義","e":"The breach in warranty has significant meaning with the claim"},{"z":"那違反保證事項已曾經發生過","e":"The breach in warranty has happened before"}],"a":2,"x":"《承保商專業守則》規定保險人只可於違反保證和損失之間存在着因果關係，或違反屬欺詐行為的情況下，利用該違反作為拒賠的理由。"},{"id":"B451","ch":2,"ref":"2.3.4(a)","t":1,"s":"b5","q":"根據「承保商專業守則」規定，違反保證和損失之間必須存在著「因果關係」時，又或者該違反屬於以下那種情況下，才可作為拒賠的理由？","qi":[],"qe":"According to \"\"Code of Conduct for Insurers\"\", a \"\"casual connection\"\" between a breach of warranty and a loss must exist, or the breach is under which of the following circumstances that can be used as a reason to refuse the claim?","qei":[],"o":[{"z":"屬於故意的情況下","e":"The breach is intentional"},{"z":"屬於欺詐的情況下","e":"The breach is fraudulent"},{"z":"屬於不知情的情況下","e":"The breach is not aware of"},{"z":"屬於在一般情況下故意或無意的情況下","e":"The breach is intentional or unintentional under normal circumstances"}],"a":1,"x":"《承保商專業守則》規定保險人只可於違反保證和損失之間存在着因果關係，或違反屬欺詐行為的情況下，利用該違反作為拒賠的理由。"},{"id":"B452","ch":2,"ref":"2.3.4(a)(iii)&3.1.","t":1,"s":"b","q":"某製品公司，買了一份火災保障包括建築物及物件。後經過一場火災的重大損毀，保險人委派理賠師在火災肇事地點的某露天處發現一些受損的殘損物件，理賠師對製品公司提出該保障有一保證不把存貨放在露天處的條款，這保證對該事件有什麼關係？","qi":[],"qe":"A manufacturer purchases a fire insurance covering buildings and contents. There are serious damages after a fire, the loss adjuster appointed by the insurer found some debris at the site where it was not roofed. The loss adjuster informs the manufacturer that the cover has a warranty that inventory cannot be stored at a place not roofed. What is the relationship of this warranty to the incident?","qei":[],"o":[{"z":"視乎是否蓄意違反該保證。香港法律容許屬非惡意違反的保證","e":"Depends on whether the breach of warranty is intentional. The law in Hong Kong allows unintentional breach of warranty"},{"z":"視乎保險人有否在損失發生前引起被保險人對違反的注意，如沒有保險人不可應用該保證","e":"Depends on whether the insurer has alerted the insured about the breach before loss occurs. If not the insurer cannot use that warranty"},{"z":"如該違反沒有做成任何損失，按照優良保險慣例，有關保險人不得以違反保證而不承擔責任","e":"If the breach does not cause any loss, according to good insurance practice, related insurer cannot refuse the claim because of the breach of warranty"},{"z":"視乎建築物有否損毀，因該保證是保證物件的","e":"Depends on whether the building is damaged, because the warranty covers contents"}],"a":2,"x":"保險人承諾根據該會發出的《承保商專業守則》，如要拒絕賠償或支付保險金，必會給予充分的解釋。"},{"id":"B453","ch":2,"ref":"2.3.4(b)","t":1,"s":"by","q":"以下哪項對於保單中的條件的描述是正確的？","qi":["在其他法律分科中，是屬於一種基本條款","合約生效前的先決條件，是合約開始前必須滿足的條件","違反合約生效後的先決條件，是會令合約變為無效","違反責任出現前的先決條件，是會使索償變為無效"],"qe":"Which of the following is correct in describing conditions in a policy?","qei":["In other legal classification, it is a fundamental term","Condition precedent to the contract must be complied with in order for the contract to commence","A breach in condition subsequent to the contract will make the contract void","A breach in condition precedent to liability will invalidate a claim"],"o":[{"z":"i, ii , iii","e":""},{"z":"i, ii , iv","e":""},{"z":"ii, iii , iv","e":""},{"z":"i, ii, iii , iv","e":""}],"a":3,"x":"在合約法中，一個合約的條件屬於該合約的基本條款，其基本的程度足以在違反之後，讓受屈一方有權把合約當作已廢除，並同時尋求某些其他補救。(i) 合約生效前的先決條件:合約生效之前必須履行的條款，例如失實陳述條件。(ii) 合約生效後的條件:例如在人身意外保險中，保費主要是根據受保人的職業釐定的，因此受保人如果在保單有效期內轉換職業，便須按照明示的要求通知保險人，並且取得保險人的同意。(iii) 責任出現前的先決條件:違反這類條款不會毀了整個合約，但會使某索償或保險金要求變成無效。一個明文和清晰地述明違反將會令被保險人喪失權利的通知條件。"},{"id":"B454","ch":2,"ref":"2.3.4(b)(i)","t":1,"s":"b","q":"保險單中的失述陳述條件屬於：","qi":[],"qe":"The condition of misrepresentation in an insurance policy is:","qei":[],"o":[{"z":"陳述","e":"Representation"},{"z":"合約生效前的條件","e":"A condition precedent to the contract"},{"z":"合約生效後的條件","e":"A condition subsequent to the contract"},{"z":"責任出現前的先決條件","e":"A condition precedent to liability"}],"a":1,"x":"合約生效前的先決條件:合約生效之前必須履行的條款，例如失實陳述條件。"},{"id":"B455","ch":2,"ref":"2.3.4(b)(i)","t":1,"s":"b","q":"香港所簽發的火險保單包含了一項失實陳述條件的條款，這條屬於：","qi":[],"qe":"The fire insurance policies issued in Hong Kong have a condition for misrepresentation, which is:","qei":[],"o":[{"z":"保證","e":"Warranties"},{"z":"責任出現前的先決條件","e":"Conditions precedent to liability"},{"z":"合約生效前的先決條件","e":"Conditions precedent to the contract"},{"z":"合約生效後的先決條件","e":"Conditions subsequent to the contract"}],"a":2,"x":"合約生效前的先決條件:合約生效之前必須履行的條款，例如失實陳述條件。"},{"id":"B456","ch":2,"ref":"2.3.4(b)(ii)","t":1,"s":"by","q":"在個人意外保單中，通常會指明被保人在轉職後要作出通知，若違反這些條件，保單便變為無效。這種情況下的條件便屬於：","qi":[],"qe":"Personal accident insurance policies usually specify that the insured must notify the insurer when changing employment. If there is a breach in this condition, the policy will be void. In this situation the condition is:","qei":[],"o":[{"z":"隱含條款","e":"Implied terms"},{"z":"合約生效前的先決條件","e":"Conditions precedent to the contract"},{"z":"合約生效後的條件","e":"Conditions subsequent to the contract"},{"z":"責任出現前的先決條件","e":"Conditions precedent to liability"}],"a":2,"x":"合約生效後的條件:例如在人身意外保險中，保費主要是根據受保人的職業釐定的，因此受保人如果在保單有效期內轉換職業，便須按照明示的要求通知保險人，並且取得保險人的同意。"},{"id":"B457","ch":2,"ref":"2.3.4(b)(iii)","t":1,"s":"by","q":"在某種情況下，保單持有人因為延誤提出索償，而令致保險公司提出拒絕是次賠償，但該保單依然維持生效。這種情況引用了以下哪項條件？","qi":[],"qe":"In some circumstances, policyholder delays his claim and the insurer refuses to pay, but the policy is still in effect. This situation refers to which of the following conditions?","qei":[],"o":[{"z":"避免某些條件及追償條款","e":"Avoidance of certain conditions and recovery clause"},{"z":"合約生效後的先決條件","e":"Conditions subsequent to the contract"},{"z":"責任出現前的先決條件","e":"Conditions precedent to liability"},{"z":"合約生效前的先決條件","e":"Conditions precedent to the contract"}],"a":2,"x":"責任出現前的先決條件:違反這類條款不會毀了整個合約，但會使某索償或保險金要求變成無效。一個明文和清晰地述明違反將會令被保險人喪失權利的通知條件。"},{"id":"B458","ch":2,"ref":"2.3.4(b)(iii)","t":1,"s":"by","q":"違反以下哪項條件會令到有關的索償無效，但保單依然有效？","qi":[],"qe":"A breach of which of the following conditions will invalidate a claim but the policy is still in effect?","qei":[],"o":[{"z":"合約生效前的先決條件","e":"Conditions precedent to the contract"},{"z":"合約生效後的先決條件","e":"Conditions subsequent to the contract"},{"z":"責任出現前的先決條件","e":"Conditions precedent to liability"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"責任出現前的先決條件:違反這類條款不會毀了整個合約，但會使某索償或保險金要求變成無效。一個明文和清晰地述明違反將會令被保險人喪失權利的通知條件。"},{"id":"B459","ch":2,"ref":"2.3.4(b)(iii)","t":1,"s":"by","q":"大部份一般保險單索償條件，均要求儘快通知有關的索償，不符合要求會引致有關索償無效，但保單繼續有效，這個索償條件稱為：","qi":[],"qe":"The condition of claims for most general insurance policies request notification of claims as soon as possible. Failure to meet the requirement will invalidate the claim but the policy remains in effect. This condition of claims is called:","qei":[],"o":[{"z":"隱含的條件","e":"Implied condition"},{"z":"責任出現前的先決條件","e":"Conditions precedent to liability"},{"z":"合約發生前的先決條件","e":"Conditions precedent to the contract"},{"z":"合約發生後的條件","e":"A condition subsequent to the contract"}],"a":1,"x":"責任出現前的先決條件:違反這類條款不會毀了整個合約，但會使某索償或保險金要求變成無效。一個明文和清晰地述明違反將會令被保險人喪失權利的通知條件。"},{"id":"B460","ch":2,"ref":"2.3.4(c)","t":1,"s":"by","q":"以下哪項對於投保書中的陳述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing the representations in a proposal?","qei":[],"o":[{"z":"投保書中的陳述可以是口頭的","e":"The representations in a proposal can be verbal"},{"z":"重要的陳述只需要是實質上真實的","e":"Important representations only need to be substantially true"},{"z":"有關陳述必須出現於保單用詞中","e":"Related representations must appear in the policy wording"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"陳述可以是口頭的，也可以是書面的。"},{"id":"B461","ch":2,"ref":"2.3.5","t":1,"s":"b3y","q":"在保單條款內的除外責任有三種，以下那項的陳述是正確的？","qi":[],"qe":"There are three types of exclusions in policy terms, which of the following descriptions is correct?","qei":[],"o":[{"z":"通用除外責任是適用於某類別的所有保單的除外責任","e":"General exclusions are applicable to all policies within the particular class"},{"z":"特定除外責任是承保人按個別風險所設定的除外責任","e":"Specific exclusions are exclusions which the underwriter decides according to particular risks"},{"z":"業界除外責任是市場中所有保險人共同設定的除外責任","e":"Market exclusions are issued by all insurers operating in the market"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"通用除外責任定義為那些適用於某類險種的所有保單的除外責任。特定除外責任是由核保人基於特定風險的額外危險，決定在相關保單中加入的除外責任。業界除外責任屬於通用除外責任的另一種形式，它們很多時候與基本風險有關，而且在某些地區，是與當地政府磋商並徵得其同意後產生的。"},{"id":"B462","ch":2,"ref":"2.3.5(a)(ii)","t":1,"s":"by","q":"以下哪項是汽車保險中標準的除外責任？","qi":[],"qe":"Which of the following is a general exclusion for motor insurance?","qei":[],"o":[{"z":"賽車","e":"Car racing"},{"z":"速度測試","e":"Speed testing"},{"z":"戰爭風險","e":"War risks"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"私家車保險：意圖承保的是為商業或遊樂目的的正常使用，所以用於賽車、速度測試及汽車行業的使用就屬於標準的除外責任。"},{"id":"B463","ch":2,"ref":"2.3.5(c)","t":1,"s":"b5y","q":"在一般保險中，業界的除外責任包括有:","qi":[],"qe":"In general insurance, market exclusions include:","qei":[],"o":[{"z":"核子風險","e":"Nuclear risks"},{"z":"輻射風險","e":"Radioactive risks"},{"z":"戰爭風險","e":"War risks"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"業界除外責任包括核及輻射風險、恐怖主義、音爆損害及戰爭風險。"},{"id":"B464","ch":2,"ref":"2.3.5(d)(ii)","t":1,"s":"by","q":"以下哪項對於公眾利益的概念是正確的？","qi":[],"qe":"Which of the following is correct about the concept of public interest?","qei":[],"o":[{"z":"屬於非書面條件","e":"It is a condition not in writing"},{"z":"違反公眾利益的保單會得不到保障","e":"A policy with contrary to public interest will not be covered"},{"z":"違反公眾利益的索償是無效的","e":"A claim with contrary to public interest will not be compensated"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"法院不容許作某些事情，理由是它們有違公共政策。在保險方面而言，這意味着在某些情況下，應該撇開特定保險的合約方的共同意圖而不為他們執行該合約或當中某些條文。"},{"id":"B465","ch":2,"ref":"2.4.1","t":1,"s":"b","q":"非人壽保險單的續保:","qi":[],"qe":"Renewal of non-life insurance policies:","qei":[],"o":[{"z":"一定要由保險人提出要約","e":"The offer must be made by the insurer"},{"z":"不需要由保險人提出要約","e":"An offer does not need to be made by the insurer"},{"z":"一定要和現時保單條款一樣","e":"It must be the same as the current policy terms"},{"z":"只有在被保人要求才會應允","e":"Will only comply with the request of the insured"}],"a":1,"x":"保險人和被保險人均無續保，或接受特定條件的義務。續保所採用的確切條款是可以討論和商議的，而要約和承約也屬相關考慮。"},{"id":"B466","ch":2,"ref":"2.4.1","t":1,"s":"by","q":"以下哪項關於「續保」描述正確？","qi":[],"qe":"Which of the following is correct about \"\"renewals\"\"?","qei":[],"o":[{"z":"保險人及客戶均無義務必需續約","e":"Neither the insurer and the insured is bound to renew"},{"z":"保單到期日自動續保","e":"Policy is automatically renewed at expiry date"},{"z":"保險人於保單到期日主動提醒客人續保","e":"Insurer will remind the insured to renew on the policy expiry date"},{"z":"客人於保單到期日主動提醒保險人續保","e":"The insured will remind the insurer to renew on the policy expiry date"}],"a":0,"x":"在法律上，保險人沒有義務向被保險人提醒續保日期漸近。"},{"id":"B467","ch":2,"ref":"2.4.1","t":1,"s":"by","q":"以下哪項有關續保的說明是不正確的?","qi":[],"qe":"Which of the following is incorrect in describing renewals?","qei":[],"o":[{"z":"續保保單被視為一項新的合約","e":"Renewed policy is treated as a new contract"},{"z":"續保後保單條件必定不變","e":"Policy conditions must be unchanged after renewal"},{"z":"沒有續保的合約視為取消合約","e":"A policy without renewal is cancelled"},{"z":"保險人並不一定接納續保","e":"The insurer is not bound to accept renewal"}],"a":1,"x":"即使仍使用同一張保單，續保構成了一個新的合約。這對可保性及條款提供了一個核保檢討的機會（如要續保，該等條款當然必須得到被保險人的同意）。"},{"id":"B468","ch":2,"ref":"2.4.1","t":1,"s":"by","q":"一般保險單通常為期十二個月，若合約雙方對條件不滿而沒有於十二個月後續保，這情況稱為：","qi":[],"qe":"General insurance policies are normally for 12 months, if both contracting parties are dissatisfied with the conditions and do not renew after 12 months, it is called:","qei":[],"o":[{"z":"取消合約","e":"Cancellation of contract"},{"z":"終止合約","e":"Termination of contract"},{"z":"失效合約","e":"Lapse of contract"},{"z":"不續保合約","e":"Non-renewed contract"}],"a":2,"x":"如果保險人不加以提醒，被保險人也沒有採取任何行動，那麽保單就會在期滿時失效。"},{"id":"B469","ch":2,"ref":"2.4.1","t":1,"s":"by","q":"一般保險的續保是，","qi":[],"qe":"The renewal of general insurance policies is:","qei":[],"o":[{"z":"非強制性的","e":"Not compulsory"},{"z":"對於汽車保險是屬於強制性的","e":"It is compulsory for motor insurance"},{"z":"對於長期協議是屬於強制性的","e":"It is compulsory for long-term agreement"},{"z":"所有保單都是強制性的","e":"It is compulsory for all policies"}],"a":0,"x":"保險人和被保險人均無續保，或接受特定條件的義務。"},{"id":"B470","ch":2,"ref":"2.4.1(d)","t":1,"s":"by","q":"以下哪項屬保單失效而不是取消保單？","qi":[],"qe":"Which of the following is a lapse of policy, not cancellation of policy?","qei":[],"o":[{"z":"保單已經由保險人終止","e":"Policy is terminated by the insurer"},{"z":"保單的保障期滿並沒有續保","e":"Period of cover for the policy expires and no renewal is made"},{"z":"保險合約在到期日之前已被終止","e":"Insurance contract is terminated before the expiry date"},{"z":"保險人被清盤，保單被迫取消","e":"The insurer is liquidated and the policy is forced to be cancelled"}],"a":1,"x":"如果保險人不加以提醒，被保險人也沒有採取任何行動，那麽保單就會在期滿時失效。"},{"id":"B471","ch":2,"ref":"2.4.2","t":1,"s":"by","q":"根據取消條款，以下哪項描述是正確的？","qi":[],"qe":"According to cancellation clause, which of the following description is correct?","qei":[],"o":[{"z":"保險人或被保險人有權取消保單","e":"Insurer or the insured has the right to cancel a policy"},{"z":"若保險人取消保單，會退回短期保費","e":"If insurer cancels a policy, short-period premium will be refunded"},{"z":"若被保人取消保單，會按比例退回有關保費","e":"If the insured cancels a policy, premium will be refunded on a pro rata basis"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"保險人或被保險人都有取消保單的權利。保險人取消保單將按比例退保費，而被保險人取消保單所得既退款可以短期或比例方式，視乎保單措辭而定。"},{"id":"B472","ch":2,"ref":"2.4.2","t":1,"s":"b","q":"大多數一般保險都設有取消條款，以下哪兩項是正確的？","qi":["保險人或被保險人可隨時取消保單","不需提出任何理由","如保險人提出取消保單，被保險人可獲退回短期保費","如被保險人提出取消保單，可獲按比例退回保費"],"qe":"Most general insurance has a cancellation clause, which two of the following are correct?","qei":["Insurer and the insured may cancel the policy at any time","No reason is needed","If insurer initiates to cancel the policy, short-period premium will be refunded to the insured","If the insured initiates to cancel the policy, premium will be refunded on a pro rata basis"],"o":[{"z":"i , ii","e":""},{"z":"i , iii","e":""},{"z":"ii , iv","e":""},{"z":"iii , iv","e":""}],"a":0,"x":"保險人或被保險人都有取消保單的權利。保險人取消保單將按比例退保費，而被保險人取消保單所得既退款可以短期或比例方式，視乎保單措辭而定。"},{"id":"B473","ch":2,"ref":"2.4.2","t":1,"s":"by","q":"以下哪項對取消條款的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing cancellation clause?","qei":[],"o":[{"z":"它總是賦予保險人及被保險人雙方的一項權利","e":"It is a right given to both insurer and the insured"},{"z":"這條款並不必須，因普通法已有聲明","e":"This clause is not necessary as it is specified in common law"},{"z":"所有一般保險均附有此條款","e":"All general insurance has this clause"},{"z":"如保險人提出取消，須按比例退回保費","e":"If insurer initiates to cancel the policy, premium must be refunded on a pro rata basis"}],"a":3,"x":"合約條款明確地允許單方面於期滿前取消合約，否則須經合約雙方同意方可。在實務中，大多數一般保險單都設有取消條款。保險人或被保險人都有取消保單的權利。保險人取消保單將按比例退保費，而被保險人取消保單所得既退款可以短期或比例方式，視乎保單措辭而定。"},{"id":"B474","ch":2,"ref":"2.4.2","t":1,"s":"b5","q":"根據一般保單的取消條款，以下哪項屬於正確的描述？","qi":[],"qe":"According to the cancellation clause of general insurance policies, which of the following description is correct?","qei":[],"o":[{"z":"保險人有權取消該保單","e":"Insurer has the right to cancel a policy"},{"z":"通常由被保險人取消該保單","e":"Usually the insured cancels the policy"},{"z":"若該保單由保險人取消，已繳交的保費可以按比例退還","e":"If the policy is cancelled by insurer, premiums paid can be refunded on a pro rata basis"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"保險人及被保險人都具有取消權，保險人取消保單將按比例退保費，而被保險人取消保單所得既退款可以短期或比例方式，視乎保單措辭而定。"},{"id":"B475","ch":2,"ref":"2.4.2(a)","t":1,"s":"by","q":"在保險公司取消保單的情況下，保險公司通常：","qi":[],"qe":"If insurer cancels a policy, insurer usually will:","qei":[],"o":[{"z":"按比例退回應繳保費","e":"Refund the premium paid on a pro rata basis"},{"z":"退回全部保費","e":"Refund all premiums"},{"z":"退回短期保費","e":"Refund short-period premium"},{"z":"沒有保費退回","e":"No refund of premium"}],"a":0,"x":"保險人取消保單將按比例退保費，而被保險人取消保單所得既退款可以短期或比例方式，視乎保單措辭而定。"},{"id":"B476","ch":2,"ref":"2.2.4(b)(ii)","t":1,"s":"b","q":"就一般保險合約而言：","qi":[],"qe":"With general insurance contract, the payment of premium:","qei":[],"o":[{"z":"保費永遠無須於保險保障生效前支付","e":"Never required before cover operates"},{"z":"保費必須於保險保障生效前支付","e":"Always required before cover operates"},{"z":"保費的支付不屬於合約的必要元素","e":"No an essentials element in a contract"},{"z":"保費有時須於保險保障前根據保單條文支付","e":"Sometimes required by policy provision before cover operates"}],"a":3,"x":"實際做法視乎保單措詞而定，有些保單嚴格規定，保險保障的有效性以收到保費為先決條件。"},{"id":"B477","ch":2,"ref":"2.3.2(b)(vi)","t":1,"s":"b","q":"有關可調整保費的保單條件：","qi":[],"qe":"The policy condition relating to adjustable premiums:","qei":[],"o":[{"z":"嚴格地說，在法律上不可強制執行","e":"Is, strictly speaking, unenforceable in law"},{"z":"要求被保險人保留足夠的相關記錄","e":"Requires the insured to keep adequate relevant records"},{"z":"通常與財產保險的保費有關","e":"Normally refers to premiums of property insurance"},{"z":"與汽車保險的無索償折扣制度有關","e":"Is related to no claim discount system in motor insurance"}],"a":1,"x":"如果保費因基於一些可變動的因素來計算而屬臨時性質，便需有項保單條件要求被保險人保留足夠的記錄，以便計算精確的保費，作為於保單期滿時調整保費之用。"},{"id":"B478","ch":2,"ref":"2.1.1(c)","t":1,"s":"b5","q":"以下哪項對一般保險的風險估定以確定風險的可保性描述並不正確","qi":[],"qe":"Regarding to the general insurance, which of the following is not correct of the risk assrsment?","qei":[],"o":[{"z":"保單起保時","e":"Policy inception"},{"z":"保單續保和索償的時候，提供再次檢討的機會。","e":"At policy renewal and claims, gives a chance to review"},{"z":"保單是可以由保險人取消","e":"Allow the insurer to cancel the policy"},{"z":"有別於人壽保險，一般保險的風險估定是一個持續的過程","e":"Unlike life insurance, risk assessment is an on-going process."}],"a":0,"x":"通常風險評估出現在投保階段、保單續保時、索償發生時、擬對現有條款作出重大更改時及風險有所變化的時間。"},{"id":"B479","ch":2,"ref":"2.3.3(c)(i)","t":1,"s":"by","q":"於僱員補償條例中，除非殘疾維持了至少3天以上，否則便沒有得到殘疾利益，這是指保單條件包含了:","qi":[],"qe":"In Employees?? Compensation Ordinance, the diability benefit may not be payable unless disablement is last for 3 days or above, the Policy Conditions included:","qei":[],"o":[{"z":"自負額","e":"Excess"},{"z":"保單保證","e":"Warranties"},{"z":"免賠額","e":"Deductible"},{"z":"保單時間起賠額","e":"Time Franchise"}],"a":3,"x":"有些一般保險對殘疾或喪失能力提供利益，但這種殘障或喪失能力的情形必須至少持續了某段期限之後，保險人才會給付利益，而一旦滿足了這項條件，整段喪失能力期間均獲給付保險利益。"},{"id":"B480","ch":2,"ref":"2.3.1(b)(ii)","t":1,"s":"b","q":"（承保表式）保單中提及合約各方（但不提名字），介紹投保書和聲明，提及有關保費（但不是金額）的部分可稱為:","qi":[],"qe":"That section of a \"scheduled\" policy which refers to the parties (But not by name) ,to the proposal form and declaration, and to the premium ( not by the amount ) is known as the:","qei":[],"o":[{"z":"保單承保表","e":"Schedule"},{"z":"敘文條款","e":"Recital Clause"},{"z":"履行條款","e":"Operative Clause"},{"z":"見證條款","e":"Attestation Clause"}],"a":1,"x":"敘文條款不會出現在保單文件中，但是它實際上是個介紹有關合約的引子。它會提及合約方（但名字則不提，可在承保表中找到），還會提述投保書及聲明，視它們為合約的一部分，及合約的基礎。保費的支付（而非金額）可能也會提及。"},{"id":"B481","ch":2,"ref":"2.2.5(a)","t":1,"s":"b5y","q":"為了補償遇上相關的汽車保險人無償付能力而未能獲得賠償的某些汽車意外受害人而設的經費由何而來?","qi":[],"qe":"To allocate to the Insolvency Fund Scheme, which was established for the purpose of compensating certain motor vehicle accident victims in the event of the insolvency of the motor insurers concerned, the funding comes from:","qei":[],"o":[{"z":"政府資助","e":"The government"},{"z":"保險索償投訴局","e":"The Insurance Claims Complaints Bureau"},{"z":"香港保險業聯會","e":"The Hong Kong Federation of Insurers"},{"z":"汽車保險局徵款而來的保費","e":"A premium levy of the Motor Insurers Bureau of Hong Kong"}],"a":3,"x":"汽車保險局的經費來自針對保險人簽發的所有汽車保單收取的保費徵款，徵款額為汽車保費的3%。徵款不屬於保險人所有，必須轉交給汽車保險局。"},{"id":"B482","ch":2,"ref":"2.3.1(b)(iii)(e)","t":1,"s":"by","q":"如果承保人在保單上加上特殊條款(例如：一個承保自負額)，哪部份會對此有所提及?","qi":[],"qe":"If the underwriter imposes special condition (e.g. underwriting excess) on the ploicy, which part will mention this?","qei":[],"o":[{"z":"敘文條款","e":"Recital Clause"},{"z":"履行條款","e":"Operative clause"},{"z":"保單條件","e":"Policy condition"},{"z":"通用除外責任","e":"General exception"}],"a":1,"x":"履行條款或承保表中列出適用於該部份的任何自負額/免賠額。"},{"id":"B483","ch":2,"ref":"2.4.2(b)","t":1,"s":"b","q":"短期保費退款通常適用於:","qi":[],"qe":"Short-period refund of premium usually applicable to:","qei":[],"o":[{"z":"保險失效","e":"The lapse of policy"},{"z":"被保險人取消保單","e":"The insured cancel the policy"},{"z":"保險人取消保單","e":"The insurer cancel the policy"},{"z":"保險人清盤","e":"The insurer is in liquidation"}],"a":1,"x":"被保險人取消保單所得既退款可以短期或比例方式，視乎保單措辭而定。"},{"id":"B484","ch":2,"ref":"2.3.1(a)","t":1,"s":"by","q":"在保險條款以「用家方便」表達並非正式，一般採用「我們」、「你們」的第一或第二身寫成，以下那個描述是正確表達方式?","qi":[],"qe":"To use 'User- friendly' is not a formal traditional language to express in insurance terms, so that it talks of 'we' and 'you' , the text is expressed in the first and second person. which of the following description is correct?","qei":[],"o":[{"z":"時尚英語","e":"With-it English"},{"z":"淺白英語","e":"Plain English"},{"z":"較易明白英語","e":"Comprehensible English"},{"z":"現代英語","e":"Modern English"}],"a":1,"x":"淺白英語的使用，是近代努力避免採用法律文件的正式傳統用詞的成果。為了顯得更為「用家方便」，保單文件都用第一或第二身寫成，而非不帶個人感情的第三身。因此它採用「我們」和「你們」，而不是「本公司」和「該被保險人」等字眼。"},{"id":"B485","ch":1,"ref":"1.6.5","t":1,"s":"b","q":"以下哪項對於公眾責任保障的描述是正確？","qi":["不會賠償因僱員在工作期間受傷","保單的保費是可以調整的","會賠償因僱員或第三者受傷","訴訟費用及補償金額會包括"],"qe":"Which of the following is correct in describing public liability insurance?","qei":["Will not cover the employees injured during the course of work","The premium may be adjustable","Will cover the employees and third party injury","Will cover the settling claim of disputes and compensation amount"],"o":[{"z":"i, iii","e":""},{"z":"i,ii, iv","e":""},{"z":"ii,iii,iv","e":""},{"z":"i,ii,iii,iv","e":""}],"a":1,"x":"公衆責任保險是承保被保險人因在保單年度內發生的意外事故而須向第三者承擔的法律責任，而保費可以規定為可調整保費。這類保單所承保的是第三者受傷、死亡和財產受損的法律責任。同時也承保法律開支，即因替被保險人辯護或堅持拒絕有關索償而引致的法律開支，及申索成功的第三者的法律開支。"},{"id":"B486","ch":2,"ref":"2.2.3(b)","t":1,"s":"b","q":"以下哪項不是一般保險保單的描述?","qi":[],"qe":"Which of the following is not describing general insurance policy?","qei":[],"o":[{"z":"它是無形的保險合約，是有形證據","e":"A policy is visible evidence of the invisible contract of insurance"},{"z":"保險合約不存在，但有保障效力","e":"Although the insurance contract not existed, the insurance cover is effective"},{"z":"一般保險保單可取代暫保單","e":"The general insurance policy can replace any cover notes"},{"z":"另一名稱叫暫保單","e":"Anther name is Cover note"}],"a":3,"x":"暫保單是一份暫時性的文件，它實際上構成一份暫時性保單。"},{"id":"B487","ch":2,"ref":"2.2.2","t":1,"s":"by","q":"以下那項或那些是對一般保險的投保單描述是正確的","qi":[],"qe":"? Which one / more of the following statement(s) of the proposal form in general insurance is /are correct?","qei":[],"o":[{"z":"它們對問題的回答永遠不是保證，只是陳述","e":"It answers the question is never warranties, only representation"},{"z":"它們的資料對合約的基礎非常重要","e":"The information is vital for the basis of a contract"},{"z":"它們對問題的回答有充足的資料，保險人不需要再查詢其他問題","e":"It answers the question is exhaustive, so that the insurers no other enquiries"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"對於相對次要的風險，投保書相當可能是唯一的實用查詢方法，而是否接受投保可能純粹根據投保書上的答案來決定。投保書中的答案，或從中所作出的推論，都可能顯示須作進一步的查詢。"},{"id":"B488","ch":2,"ref":"2.2.4","t":1,"s":"b","q":"以下哪項關於一般保險的保費的特點是不正確？","qi":[],"qe":"Which of the following feature is incorrect in describing the premium in general insurance?","qei":[],"o":[{"z":"必須收到第一筆保費後，保險保障才會開始","e":"The invariable practice that cover does commence until after the first premium has been received"},{"z":"代表投保人對合約的代價","e":"The consideration for the contract on behalf of the insured"},{"z":"保費可由保額釐定","e":"The premium can be based on the sum insured"},{"z":"以上所有各項都不是","e":"All of the above are incorrect"}],"a":0,"x":"人壽保險中有一個幾乎固定的做法，就是只在收到第一筆保費後，保險保障才會開始。在一般保險中不一定有同樣的規定。"},{"id":"B489","ch":2,"ref":"2.2.4(a)(iii)","t":1,"s":"b","q":"一般保險的產品保險費率的基準，通常以百分比或千分比表示，乘下列某個因素而釐訂：","qi":[],"qe":"General insurance has the premium bases, usually per cent or per mille, a designated rate is applied to a factor such as:","qei":[],"o":[{"z":"保額","e":"the sum insured"},{"z":"每年的銷售額","e":"the annual turnover"},{"z":"每年的工資支出","e":"the annual wageroll"},{"z":"以上各項，視乎不同險種","e":"All of the above, subject to the business of insurance"}],"a":3,"x":"一般保險的產品種類繁多，因此唯一可以預期的，就是不同種類的保險，其保費的基準也不同。"},{"id":"B490","ch":2,"ref":"2.3.5(d)(ii)","t":1,"s":"b","q":"公共政策的法律概念是指:","qi":[],"qe":"The legal concept of ¡¥public policy¡¦ means that:","qei":[],"o":[{"z":"保單承保一個普通市民並非一間公司","e":"A policy insures an ordinary citizen but not a company"},{"z":"政府保險引起不同法律因素","e":"Different legal consideration arise with government insurance"},{"z":"一份合約是不應違返公眾良知的合約","e":"A contract should not be allowed if its offend a public conscience"},{"z":"即使法律責任不存在, 保單必須強制執行","e":"A contract must be enforced even though it is not have legal liability"}],"a":2,"x":"法院不容許作某些事情，理由是它們有違公共政策。在保險方面而言，這意味着社會（透過法官的判決）傳達了一個訊息，表明在某些情況下，應該撇開特定保險的合約方的共同意圖而不為他們執行該合約或當中某些條文。"},{"id":"B491","ch":2,"ref":"2.3.1(b)(i)","t":1,"s":"b","q":"一般保險的保單的某部分包含了所有只與該個合約有關的資料，該部分被稱為：","qi":[],"qe":"That part of a general insurance policy which contains all information relating exclusively to that particular contract is known as the:","qei":[],"o":[{"z":"承保表","e":"Schedule"},{"z":"敘文條款","e":"Recital clause"},{"z":"履行條款","e":"Operative clause"},{"z":"通用除外責任","e":"General exceptions"}],"a":0,"x":"承保表或保單承保表是保單的一部分，它包含了只與受保風險有關的全部資料。"},{"id":"B492","ch":2,"ref":"2.3.4(c)","t":1,"s":"b","q":"以下哪項是「陳述」的最佳描述?","qi":[],"qe":"Which one of the following is the best description of 'Representations'?","qei":[],"o":[{"z":"必須是口頭提供資料","e":"Information must be provided in verbal"},{"z":"和「保證」的意思相同","e":"It is the same meaning as warranties"},{"z":"正式提交經蓋印的說明解釋","e":"The explanation of the formal submission under seal"},{"z":"對投保風險作出的事實陳述","e":"It is a statement bearing upon a risk proposed for insurance"}],"a":3,"x":"陳述是合約一方對另一方就擬保風險作出的、關於事實的或所信的陳述。它可以是口頭的，也可以是書面的。"},{"id":"B493","ch":3,"ref":"3.1(b)","t":1,"s":"by","q":"如必須拒絕一項賠償，以下哪項屬於優良的保險慣例？","qi":["應該在初期拒絕所有賠償，藉此阻止瑣碎的賠償","理賠職員不應在沒有細心考慮的情況下拒絕賠償","一般情況下應該提供拒絕的理由","拒絕賠償前，通常最好由保險人的高層職員作出確認"],"qe":"If it is necessary to refuse a claim, which of the following is good insurance practice?","qei":["Should refuse all claims at an early stage to stop petty claims","Claims staff should not refuse a claim without careful consideration","Usually should provide reasons to refuse","Before refusing a claim, it would be better to obtain the confirmation of a senior member of the insurer's staff"],"o":[{"z":"只有 i , ii","e":"Only i , ii"},{"z":"只有 ii , iii","e":"Only ii , iii"},{"z":"只有 ii, iii, iv","e":"Only ii, iii, iv"},{"z":"i, ii, iii, iv","e":""}],"a":2,"x":"拒賠是一件嚴重的事情。優良的保險做法通常意味着永不拒賠，除非得到保險人的高級職員的批准。作為香港保險業聯會的會員，保險人承諾根據該會發出的《承保商專業守則》，如要拒絕賠償或支付保險金，必會給予充分的解釋。"},{"id":"B494","ch":3,"ref":"3.1","t":1,"s":"by","q":"在受賠償處理中，哪種不是正確的處理方法？","qi":[],"qe":"In handling claims, which of the following is not a proper handling method?","qei":[],"o":[{"z":"應避免不必要的拖延","e":"Should avoid unnecessary delay"},{"z":"出現欺騙成份時，應於初期拒絕賠償","e":"When there is a fraud, should refuse the claim at an early stage"},{"z":"應避免對保單作出不合理的解釋","e":"Should avoid making unreasonable explanation of the policy"},{"z":"認定責任後應立即賠款","e":"Once the liability is confirmed, should pay the claim immediately"}],"a":1,"x":"保險人處理索償或保險金要求的手法不公正、不公平、不合理或過於遲緩，那麽其聲譽便會受損。在合理的範圍下，賠付或給付是保險人最佳的廣告方式。如要拒絕賠償或支付保險金，必會給予充分的解釋。"},{"id":"B495","ch":3,"ref":"3.1.1","t":1,"s":"b","q":"一個有效的索償要乎合下列哪項的要求？","qi":[],"qe":"A valid claim must meet which of the following requirements?","qei":[],"o":[{"z":"索償沒有涉及欺詐成份","e":"There is no fraud in the claim"},{"z":"導致索償的情況必須於保單有效期內發生","e":"The event giving rise to the claim must occur when the policy is in force"},{"z":"導致損失的危險必須是由受保的原因引起","e":"The loss must be caused by an insured peril"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"索償時需考慮當中的因素:(i)被保險人的欺詐行為或以被保險人名義進行的欺詐行為(ii) 保單必須有效(iii) 危險考慮"},{"id":"B496","ch":3,"ref":"3.1.1","t":1,"s":"by","q":"以下哪點是符合一個有效索償的法律要求？","qi":[],"qe":"Which of the following meets the legal requirement of a valid claim?","qei":[],"o":[{"z":"意外發生時保單必須有效","e":"The policy is in force when the accident happens"},{"z":"並不違反公眾利益","e":"It has no breach of public interest"},{"z":"達保單內隱含及明示條款之要求","e":"Meets the requirement of implied and express terms of the policy"},{"z":"以上全部都是","e":"All of the above"}],"a":3,"x":"索償時需考慮當中的因素:(i) 保單必須有效(ii) 隱含及明示合約條款(iii) 合乎公共政策"},{"id":"B497","ch":3,"ref":"3.1.1","t":1,"s":"by","q":"以下哪項是屬於有效索償的法律要求？","qi":["導致損失的近因，必須是受保的危險","索償是符合保單中隱含及明訂條款的要求","當損失發生時，保單必須仍然有效","保單不能與公眾利益有所抵觸"],"qe":"Which of the following is a legal requirement for valid claims?","qei":["The proximate cause for the loss must be the insured peril","The claim meets the requirements of implied and express terms in a policy","The policy is in force when the loss occurs","The policy does not contradict with public interest"],"o":[{"z":"i , ii","e":""},{"z":"ii , iii","e":""},{"z":"i, iii , iv","e":""},{"z":"i, ii, iii , iv","e":""}],"a":3,"x":"索償時需考慮當中的因素:(i) 保單必須有效(ii) 隱含及明示合約條款(iii) 合乎公共政策"},{"id":"B498","ch":3,"ref":"3.1.1","t":1,"s":"by","q":"以下哪項/幾項會使索償變為無效？","qi":["投保事件發生於保單有效日之後","被保險人作出欺詐的行為","發生的事件是屬於除外責任","違反社會上公眾利益的條件"],"qe":"Which of the following will invalidate a claim?","qei":["The insured incident happens after the effective period of the policy","The insured commits fraudulent behaviour","The happening is an exclusion","It is against the condition of public interest"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":3,"x":"索償時需考慮當中的因素:(i) 保單必須有效(ii) 隱含及明示合約條款(iii) 合乎公共政策(iv)被保險人的欺詐行為或以被保險人名義進行的欺詐行為"},{"id":"B499","ch":3,"ref":"3.1.1(h)","t":1,"s":"by","q":"在建議優良保險慣例中，違反保單保証應：","qi":[],"qe":"As suggested by good insurance practice, a breach of warranty in policy should:","qei":[],"o":[{"z":"可以理解為索償可被拒絕","e":"Can be interpreted as a claim and be refused"},{"z":"可以理解為可以發出通融賠償","e":"Can be interpreted as ex gratia payment"},{"z":"只要有關保証出現時才令索償無效","e":"Only when the related warranty appears then the claim is invalid"},{"z":"只要被保險人出現欺詐性行為才令索償無效","e":"Only when the insured commits fraudulent behaviour then the claim is invalid"}],"a":0,"x":"違反保單將有機會影響索償的結果。"},{"id":"B500","ch":3,"ref":"3.1.2(c)","t":1,"s":"by","q":"在沒有法律責任下賠付：","qi":[],"qe":"Payment of a claim when there is no legal obligation to do so is:","qei":[],"o":[{"z":"屬於違法","e":"Illegal"},{"z":"在技術上稱為同情賠款","e":"Technically known as a sympathy payment"},{"z":"在技術上稱為通融賠付","e":"Technically known as an ex gratia payment"},{"z":"是永不合理的，因為這相當於懲罰其他的保單持有人","e":"Never justified, as it penalizes all other policyholders"}],"a":2,"x":"遇上未必有保單責任的個案時，或拒賠將引致艱難的情況，總可考慮作出通融賠付。"},{"id":"B501","ch":3,"ref":"3.1.3","t":1,"s":"by","q":"索償通知上的延誤會使：","qi":[],"qe":"Delay in claims notification will make:","qei":[],"o":[{"z":"被保人必定不能夠得到賠償","e":"The insured definitely unable to receive the compensation"},{"z":"保險人不能作出相應的賠償","e":"The insurer unable to make the relevant compensation"},{"z":"保險人的利益受到損害","e":"Damage to the benefit of insurer"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"索償通知延誤有機會引致被保險人完全喪失相關損失的索償權利或相關事件的保險金要求權。"},{"id":"B502","ch":3,"ref":"3.1.3(c)&2.3.4(b)","t":1,"s":"b","q":"當意外發生後，投保人需盡快通知保險公司，否則該項索償將不被接納，這項要求和下列哪項有關？","qi":[],"qe":"When accident happens, the insured should notify the insurer as soon as practicable, otherwise the claim will not be accepted. This requirement is related to which of the following?","qei":[],"o":[{"z":"隱含條款","e":"Implied clause"},{"z":"責任出現前的條件","e":"Condition precedent to liability"},{"z":"合約生效前的條件","e":"Condition precedent to the contract"},{"z":"合約生效後的條任","e":"Condition subsequent to the contract"}],"a":1,"x":"違反責任出現前的條件不會毀了整個合約，但會使某索償或保險金要求變成無效。"},{"id":"B503","ch":3,"ref":"3.1.3(f)","t":1,"s":"b","q":"在本港簽發的標準火險保單「受比例分攤約束」，意思指：","qi":[],"qe":"The standard fire insurance policy issued in Hong Kong is \"\"subject to average\"\", which means:","qei":[],"o":[{"z":"若損失發生時保額並不足夠，則保單便屬無效","e":"If the sum insured is insufficient when a loss occurs, the policy is invalid"},{"z":"財產價值按平均市場價值計算","e":"Property value is calculated by average market value"},{"z":"保費按該年平均財產價值計算","e":"Premium is calculated by average property value of that year"},{"z":"損失發生時存在不足額保險，被保險人成為共同保險人","e":"There exists under-insurance when the loss occurs, the insured becomes joint insurer"}],"a":3,"x":"在大部分財產保險中，一旦損失發生時存在着不足額保險，保險人便可根據比例分攤條件，按不足額投保的比例降低賠償額，而被保險人將要承擔餘下的金額。"},{"id":"B504","ch":3,"ref":"3.1.3(f)","t":1,"s":"by","q":"在「比例分攤保障」中，如果保額為一千萬，而在火災損毀的實際價值為二千萬，那麼一千二百萬的損毀金額賠償應為：","qi":[],"qe":"In \"\"average\"\", if the sum insured is 10 million, the actual value of damage in fire is 20 million, the amount of damage claim is 12 million, then the compensation should be:","qei":[],"o":[{"z":"六百萬","e":"6 million"},{"z":"一千萬","e":"10 million"},{"z":"一千二百萬","e":"12 million"},{"z":"零元(有關索償因極度不足保額而告無效)","e":"0 dollar (the claim is invalid as the sum insured is extremely insufficient)"}],"a":0,"x":"保額為損失額的50%，引致被保險人只能取得50%的賠償額。"},{"id":"B505","ch":3,"ref":"3.1.3(f)","t":1,"s":"by","q":"以下哪項保險條款的改動會影響到普通法的條款？","qi":[],"qe":"Which of the following change of insurance terms will affect the terms of common law?","qei":[],"o":[{"z":"比例分攤","e":"average"},{"z":"代位權","e":"Subrogation"},{"z":"分攤","e":"Contribution"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"三種改動:比例分攤、代位權及分攤將會影響索償或保險金要求的保單條文"},{"id":"B506","ch":3,"ref":"3.1.3","t":1,"s":"b","q":"普通法的代位權原則有時會被保單的條款更改:","qi":[],"qe":"The common law principles of subrogation are sometimes modified by the terms of the policy:","qei":[],"o":[{"z":"這是不合法的","e":"this is illegal"},{"z":"這是保險人之間的協議","e":"An agreement between the insurers"},{"z":"在賠償之前已獲得代位權","e":"Obtained subrogation rights before compensation"},{"z":"以上全部皆不是","e":"None of the above"}],"a":2,"x":"代位權只能在作出賠償之後才能取得；但是，根據典型的代位條件，被保險人必須應保險人的要求，容許保險人於發生了可能引起索償的事件後(賠償前)行使代位權。"},{"id":"B507","ch":3,"ref":"3.1.4","t":1,"s":"b","q":"當有索償發生，以下那項屬於受保人應付上的責任？","qi":[],"qe":"When claims occur, which of the following is a duty of the insured?","qei":[],"o":[{"z":"保存受損害財物","e":"Preservation of damaged property"},{"z":"提供索償的數額","e":"Provide quantum"},{"z":"提供其他有關類型的索償保單","e":"Disclose any other related policy claims"},{"z":"以上各項皆正確","e":"All of the above"}],"a":3,"x":"保存受損害財物、索償或保險金要求及披露任何其他保險都是受保人應付上的責任。"},{"id":"B508","ch":3,"ref":"3.1.4(d)","t":1,"s":"by","q":"以下哪一項不屬於被保險人出現損失後保單涉及的責任要求？","qi":[],"qe":"Which of the following is not a duty of insured after a loss?","qei":[],"o":[{"z":"提供有效索償的合理証明","e":"Provide reasonable proof for a valid claim"},{"z":"披露任何與該項目相同損失有關的其他保險","e":"Disclose other insurances with the same related loss"},{"z":"保存作為索償物件的已損毀財物","e":"Preservation of damaged property for the claim"},{"z":"向第三者承認責任及行使所有權力","e":"Admit liability to third party and exercise authority"}],"a":3,"x":"向第三者承認責任及行使所有權力不屬於受保人在損失上應付的責任。"},{"id":"B509","ch":3,"ref":"3.1.5","t":1,"s":"by","q":"有關索償的文件費用：","qi":[],"qe":"The documentary cost related to a claim:","qei":[],"o":[{"z":"只由保險人支付","e":"Will be paid by insurer only"},{"z":"只由被保人支付","e":"Will be paid by the insured only"},{"z":"必須由保險人及被保人支付","e":"Must be paid by insurer and the insured"},{"z":"可以由保險人或被保人支付","e":"Can be paid by either insurer or the insured"}],"a":3,"x":"提供證明文件可能是被保險人的責任，也可能是保險人的責任（包括支付所需費用）。"},{"id":"B510","ch":3,"ref":"3.1.5","t":1,"s":"by","q":"一般保險的索償，保險人通常會要求以下的哪項文件證明？","qi":[],"qe":"For claims of general insurance, insurer usually will ask for which of the following documentary evidence?","qei":[],"o":[{"z":"醫療報告","e":"Medical reports"},{"z":"收據或其他數額的證明","e":"Receipts and other proof of quantum"},{"z":"警方或其他有關當局的報告","e":"Police and other related authority reports"},{"z":"上述所有各項","e":"All of the above"}],"a":3,"x":"文件證據包括收據及金額的其他證明、合約要求的文件、水險索償及證人及警方報告等。"},{"id":"B511","ch":3,"ref":"3.1.5(d)","t":1,"s":"by","q":"以下哪項醫療證據是由被保險人負責支付有關開支？","qi":[],"qe":"The cost of which of the following medical evidence will be paid by the insured?","qei":[],"o":[{"z":"於個人意外保單中對於喪失能力的報告","e":"Report on incapacity for personal accident insurance policy"},{"z":"與僱員補償業務有關的報告","e":"Reports related to employees' compensation business"},{"z":"為找出死因而安排的任何驗屍檢查報告","e":"Any reports related to finding out the reason of death"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"提出喪失能力（人身意外）的保險金要求，須出具醫療報告，所需費用由被保險人負責。如果僱主要求受傷的僱員進行體檢，體檢費應由僱主按照《僱員補償條例》支付，但最終是由有關的保險人承擔。"},{"id":"B512","ch":3,"ref":"3.1.5(c)","t":1,"s":"by","q":"以下哪三項文件可能被要求用作證明水險索償？","qi":["檢驗報告","警方報告","提貨單","保單正本"],"qe":"Which three of the following documents may be used as evidence for marine insurance claims?","qei":["Survey report","Police report","Bill of lading","Original policy"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"i, iii, iv","e":""},{"z":"ii, iii, iv","e":""}],"a":2,"x":"水險索償所需文件包括檢驗報告、保單正本、提貨單，或再加上其他的所有權文件。"},{"id":"B513","ch":3,"ref":"3.1.5(c)","t":1,"s":"by","q":"以下哪項不屬於水險索償中所需文件？","qi":[],"qe":"Which of the following is not a required document for marine insurance claims?","qei":[],"o":[{"z":"檢驗報告","e":"Survey report"},{"z":"保單正本","e":"Original policy"},{"z":"提貨單","e":"Bill of lading"},{"z":"警方報告","e":"Police report"}],"a":3,"x":"水險索償所需文件包括檢驗報告、保單正本、提貨單，或再加上其他的所有權文件。"},{"id":"B514","ch":3,"ref":"3.1.6(b)","t":1,"s":"b","q":"聘用於水險貨物索償的檢驗人，與聘用於火險索償的理賠人比較時：","qi":[],"qe":"When compared the surveyors handling marine insurance claims and the loss adjusters handling fire insurance claims:","qei":[],"o":[{"z":"檢驗人起初由保險人委任","e":"Surveyors are appointed by insurer initially"},{"z":"理賠人必須由被保險人委任","e":"Loss adjusters must be appointed by the insured"},{"z":"無論任何時間保險人都不需要向檢驗人支付費用","e":"Insurers do not need to pay for surveyors at any time"},{"z":"理賠人由保險人委任和支付費用","e":"Loss adjusters are appointed and paid by insurer"}],"a":3,"x":"水險的檢驗人與非水險的理賠師之間的最大區別在於後者通常由保險人聘請，而水險的檢驗人是由被保險人聘請的，並且檢驗費用至少是先由被保險人支付的。"},{"id":"B515","ch":3,"ref":"3.1.6(b)","t":1,"s":"b","q":"以下哪三項有關理賠師說明是正確的？","qi":["他們是由保險人委任","他們聲稱是該範圍的專家","他們的收費是按表計算的","他們的建議對保險人具約束力，對被保險人則不具約束力"],"qe":"Which three of the following are correct in describing loss adjusters?","qei":["They are appointed by insurer","They profess to be the expert of that area","Their fees are based on a scale","Their recommendations are binding to insurer, but not binding to the insured"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, iii, iv","e":""}],"a":0,"x":"理賠師通常由保險人聘請及支付服務費，他們聲稱是獨立的專家，提供中立的意見及服務。同時費用可按表計算，視乎同意賠償的金額而定，另作商議也行。"},{"id":"B516","ch":3,"ref":"3.1.6(d)","t":1,"s":"by","q":"以下哪項保險會僱用理賠代理人？","qi":[],"qe":"Which insurance will employ settling agents?","qei":[],"o":[{"z":"火險","e":"Fire insurance"},{"z":"水險貨物保單","e":"Marine cargo policy"},{"z":"僱員補償業務","e":"Employees' compensation business"},{"z":"營業中斷保險","e":"Business interruption insurance"}],"a":1,"x":"保險人在海上貨物保單或保險憑證上，指名獲授權商號在該保險人沒有設置辦事處的地區，為其處理賠案。理賠代理人可以是勞合社代理人，即受倫敦勞合社委任的，遍及包括香港在內的全球主要港口和地區的商號。"},{"id":"B517","ch":3,"ref":"3.1.6(e)","t":1,"s":"by","q":"檢驗代理人通常是：","qi":["處理水險索償的工作","在索償初期通常由被保險人委任","在索償初期通常由保險人委任","以個人或公司名義協助安排檢驗"],"qe":"Survey agents usually:","qei":["Handle marine insurance claims","Usually appointed by the insured initially during a claim","Usually appointed by insurer initially during a claim","Arrange surveying in the name of an individual or a company"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, iii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":1,"x":"海上貨物保險人一般在保單或保險憑證上，指明有關目的地的獲委任檢驗代理人的名稱和地址，並要求收貨人向此代理人申請海上損害檢驗。如果某特定檢驗代理人沒有僱用檢驗人，便須在接獲申請後安排檢驗人。勞合社代理人很多時候替海上保險人充當檢驗代理人，而保險人很多時候委任同一商號作為檢驗及理賠代理人。"},{"id":"B518","ch":3,"ref":"3.1.6(e)","t":1,"s":"by","q":"檢驗代理人最主要的工作是：","qi":[],"qe":"The major task of survey agents is:","qei":[],"o":[{"z":"專門處理水險索償","e":"Handling marine claims specifically"},{"z":"從事有關財產損失","e":"Handling property loss"},{"z":"專門從事責任索償","e":"Handling liability claims specifically"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"檢驗代理人最主要的工作主要處理水險索償。"},{"id":"B519","ch":3,"ref":"3.1.6(f)","t":1,"s":"by","q":"以下哪項對於海損理賠師的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing average adjusters?","qei":[],"o":[{"z":"他們專門從事共同海損的索償","e":"They specialize in general average claims"},{"z":"他們對海事及不同國家的法律要有深入的認識","e":"They have detailed legal & marine knowledge in different countries"},{"z":"他們專門從事不足額保險(比例分攤)的安排","e":"They specialize in the arrangement of under-insurance (average)"},{"z":"一個個案的處理時間可能長達數年","e":"Handling a case can take years"}],"a":2,"x":"這類專家出現於水險的理賠中。更確切地說，他們專門處理共同海損。這是索償相關工作中極為複雜的領域，需要豐富的經驗和專業知識。為共同海損收款和分攤，一般需時數年，而非幾個星期或幾個月。這種工作需要有耐性和行之有法，所以經驗是非常必要的。"},{"id":"B520","ch":3,"ref":"3.1.6(f)","t":1,"s":"by","q":"海損理賠師專門從事：","qi":[],"qe":"Average adjusters specialize in:","qei":[],"o":[{"z":"共同海損的理賠","e":"General average claims"},{"z":"船體理賠","e":"Hull claims"},{"z":"極為複雜的貨物損失的理賠","e":"Complicated cargo loss claims"},{"z":"以上各項","e":"All of the above"}],"a":3,"x":"這類專家出現於水險的理賠中。更確切地說，他們專門處理共同海損。因其專長，海損理算師也可能參與船殼與機器損失和極為複雜的貨物損失的理賠。"},{"id":"B521","ch":3,"ref":"3.2.2","t":1,"s":"by","q":"若對理賠中的數額有所爭拗，以下哪類人仕可提出仲裁？","qi":[],"qe":"If there is a dispute in claims, which of the following can request arbitration?","qei":[],"o":[{"z":"保險人而已","e":"Only insurer"},{"z":"被保人而已","e":"Only the insured"},{"z":"保險人或被保人","e":"Insurer or the insured"},{"z":"保險人及被保人也不可提出","e":"Neither insurer nor the insured"}],"a":2,"x":"被保險人與保險人當然也可以因理賠糾紛上提出仲裁。"},{"id":"B522","ch":3,"ref":"3.2.2","t":1,"s":"by","q":"仲裁與訴訟的分別之處在於？","qi":["仲裁的程序比訴訟為簡單","訴訟的費用必定比仲裁便宜","仲裁中的代表不必符合法律資格","兩者的結果對合約任何一方都具約束力"],"qe":"The difference between arbitration and litigation:","qei":["Arbitration is simpler than litigation","The cost of litigation is less than arbitration","The representatives in arbitration do not need to be legally qualified","The result of both is binding to all contracting parties"],"o":[{"z":"i, ii","e":""},{"z":"i, iii","e":""},{"z":"ii, iii","e":""},{"z":"iii, iv","e":""}],"a":1,"x":"仲裁比起訴訟不那麽正式，雖然仲裁以正式的方式進行，然而案件不在法庭進行聽證，甚至不由符合法律資格的人來代表當事人各方或決定有關事項也沒問題。糾紛還可能出現在保險人與第三者索償人之間，但是第三者不受仲裁條件的約束。"},{"id":"B523","ch":3,"ref":"3.2.2","t":1,"s":"b","q":"以下哪項對於仲裁的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing arbitration?","qei":[],"o":[{"z":"它的形式和程序比起法庭的訴訟簡單","e":"Its format and procedure are less formal than litigation"},{"z":"對第三者並無約束力","e":"Not binding upon third parties"},{"z":"只適用於涉及金額上的糾紛","e":"Only applicable to disputes on quantum"},{"z":"以上各項皆正確","e":"All of the above"}],"a":3,"x":"仲裁比起訴訟不那麽正式，雖然仲裁以正式的方式進行，然而案件不在法庭進行聽證，甚至不由符合法律資格的人來代表當事人各方或決定有關事項也沒問題。糾紛還可能出現在保險人與第三者索償人之間，但是第三者不受仲裁條件的約束。最後糾紛的原因主要有關個別賠案難以處理，產生被保險人與保險人之間的糾紛。"},{"id":"B524","ch":3,"ref":"3.2.2","t":1,"s":"by","q":"以下哪種解決糾紛的情況屬於法庭聽證及裁決等正式的過程？","qi":[],"qe":"Which of the following is the formal procedure for court hearing and verdict in resolving disputes?","qei":[],"o":[{"z":"訴訟","e":"Litigation"},{"z":"調解","e":"Mediation"},{"z":"仲裁","e":"Arbitration"},{"z":"談判","e":"Negotiation"}],"a":0,"x":"訴訟意見上指正式的法庭行動。"},{"id":"B525","ch":3,"ref":"3.2.2","t":1,"s":"by","q":"出現於法庭聽證會上，涉及法律的過程稱之為：","qi":[],"qe":"The procedure appears in court hearing and involves the law is called:","qei":[],"o":[{"z":"仲裁","e":"Arbitration"},{"z":"訴訟","e":"Litigation"},{"z":"糾紛","e":"Dispute"},{"z":"解決","e":"Solution"}],"a":1,"x":"訴訟意見上指正式的法庭行動。"},{"id":"B526","ch":3,"ref":"3.2.2","t":1,"s":"b","q":"為甚麼人身意外保險一般不會設有仲裁條款？","qi":[],"qe":"Why do personal accident insurance not contain arbitration clauses?","qei":[],"o":[{"z":"這類保單是不合法的","e":"Such policies are illegal"},{"z":"人身意外保險不存在金錢上的糾紛","e":"Personal accident insurance do not have dispute on quantum"},{"z":"因為被保險人很多時在索償進行中已去世","e":"Because the insured is likely deceased during the claim"},{"z":"因為這類保單的索償金額不可能高到值得仲裁","e":"Because the claim amount of these policies is not large enough for arbitration"}],"a":1,"x":"人身意外保險以人的生命、肢體、健康或醫療費用作為保險標的的險種。例如由暴力、意外、外在和可見的方式導致身體受傷後，可獲付為相關類別身體受傷指明的金額，所以不存在有關金錢上的糾紛。"},{"id":"B527","ch":3,"ref":"3.2.2","t":1,"s":"by","q":"以下哪項是仲裁一般保險糾紛索償的方法的特點?","qi":[],"qe":"Which of the following is a feature of arbitration in a general insurance dispute?","qei":[],"o":[{"z":"形式及程序比訴訟簡單","e":"The format and procedure are simpler than litigation"},{"z":"通常只適用於數額而已","e":"Usually only applicable to quantum"},{"z":"對第三者沒有約束力","e":"Not binding upon third parties"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"仲裁比起訴訟不那麽正式，雖然仲裁以正式的方式進行，然而案件不在法庭進行聽證，甚至不由符合法律資格的人來代表當事人各方或決定有關事項也沒問題。糾紛還可能出現在保險人與第三者索償人之間，但是第三者不受仲裁條件的約束。最後糾紛的原因主要有關個別賠案難以處理，產生被保險人與保險人之間的糾紛"},{"id":"B528","ch":3,"ref":"3.2.2","t":1,"s":"b5y","q":"仲裁條款出現於以下哪類保單？","qi":[],"qe":"Arbitration clause will appear in which of the following insurance policy?","qei":[],"o":[{"z":"個人意外保險","e":"Personal accident insurance"},{"z":"財產保險","e":"Property insurance"},{"z":"責任保險","e":"Liability insurance"},{"z":"以上各項都是","e":"All of the above"}],"a":1,"x":"仲裁條款會出現於一般保險中的財產保險。"},{"id":"B529","ch":3,"ref":"3.2.1(c)","t":1,"s":"by","q":"在保險索償中之兩種元素為「責任」和「數額」，後者所表達的意思是指：","qi":[],"qe":"The two elements involved in an insurance claim are liability and quantum, the latter means:","qei":[],"o":[{"z":"有關的保額","e":"Related sum insured"},{"z":"保險人在約束下需要給付款項的時間","e":"The time for insurer to make the payment under restriction"},{"z":"保險人應給付之總額","e":"Amount payable by insurer"},{"z":"要確定是否與「近因」的原則有關","e":"To determine if it is related to the principle of \"\"proximate cause\"\""}],"a":2,"x":"數額是指由保險人理賠上所付出的金額。"},{"id":"B530","ch":3,"ref":"3.2.1(c)","t":1,"s":"by","q":"由於一般保險中仲裁條款是有關金額多少的問題，若干保單沒有仲裁條款，以下哪一項金額問題已由保單條款所釐定？","qi":[],"qe":"As the arbitration clause in general insurance applies to quantum, for some policies which do not contain an arbitration clause, quantum will be determined by the terms of which of the following?","qei":[],"o":[{"z":"火險保單","e":"Fire insurance"},{"z":"盜竊保單","e":"Theft policies"},{"z":"個人意外保單","e":"Personal accident policies"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"人身意外保險以人的生命、肢體、健康或醫療費用作為保險標的的險種。例如由暴力、意外、外在和可見的方式導致身體受傷後，可獲付為相關類別身體受傷指明的金額，所以不存在有關金錢上的糾紛。"},{"id":"B531","ch":3,"ref":"3.2.2(c)","t":1,"s":"by","q":"在理賠的情況下，爭議雙方可委任一名獨立仲裁員，如果他們未能就一名仲裁員達成協議，雙方便需各自委任一名仲裁員，再由這些仲裁員委任以下哪一名人仕在商議過程中列席？","qi":[],"qe":"In claims situation, disputing parties appoint one independent arbitrator. If they cannot agree on a single arbitrator, each party appoints an arbitrator. These arbitrators in turn appoint which of the following to be present in the discussion?","qei":[],"o":[{"z":"公斷人","e":"Umpire"},{"z":"公證人","e":"Witness"},{"z":"訴訟人","e":"Litigator"},{"z":"評判師","e":"Evaluator"}],"a":0,"x":"除仲裁員以外，公斷人亦會參與參與仲裁過程，為雙方的選定達成協議。"},{"id":"B532","ch":3,"ref":"3.2.2(c)","t":1,"s":"b","q":"以下那項有關仲裁條款是不正確的？","qi":[],"qe":"Which of the following is NOT correct about arbitration?","qei":[],"o":[{"z":"通常每項索償中只有一個仲裁人","e":"Usually there is only one arbitrator in each claim"},{"z":"如有需要，各方可安排一個仲裁人","e":"Each party can appoint an arbitrator if necessary"},{"z":"如有兩個仲裁人，可選出一名公斷人在出裁決","e":"If there are two arbitrators, an umpire supersedes the arbitrators"},{"z":"公斷人對該索償釐定有關保費事宜","e":"Umpire determines related premium of the claim"}],"a":3,"x":"公斷人只會參與參與仲裁過程，為雙方的選定達成協議。"},{"id":"B533","ch":3,"ref":"3.2.1","t":1,"s":"b5y","q":"以下哪類人仕可決定以何種方法作出「損害賠償」?","qi":[],"qe":"Which of the following can decide the method for \"\"damage compensation\"\"?","qei":[],"o":[{"z":"保險代理人","e":"Insurance agent"},{"z":"保險經紀","e":"Insurance broker"},{"z":"公斷人","e":"Umpire"},{"z":"保險人","e":"Insurer"}],"a":3,"x":"保險人有權選擇怎麽向被保險人提供彌償。"},{"id":"B534","ch":3,"ref":"3.2.1(a)","t":1,"s":"by","q":"現金支付較可能是適合下列那項結清給付形式?","qi":[],"qe":"Payment of money is more appropriate for which of the following settlements?","qei":[],"o":[{"z":"個人意外保險的死亡賠償","e":"Compensation for death in personal accident insurance"},{"z":"醫療賬單開支(旅遊保險)","e":"Paying medical expenses (travel insurance)"},{"z":"第三者受傷的索償(汽車保險)","e":"Third party injury claim (motor insurance)"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"支付現金（總是使用支票或透過銀行轉賬）是一種最為普遍的結清索償或保險金要求方式。"},{"id":"B535","ch":3,"ref":"3.2.1(a)","t":1,"s":"by","q":"對於提供利益而非損害賠償的保單，那項是結清給付的唯一可行方法？","qi":[],"qe":"For policies providing benefit but not damage compensation, which is the only method of settlement?","qei":[],"o":[{"z":"現金支付","e":"Cash Payment"},{"z":"直接支付維修費用","e":"Paying for repairs direct"},{"z":"更換","e":"Replacement"},{"z":"恢復原狀","e":"Reinstatement"}],"a":0,"x":"向被保險人提供利益保單(例如人身意外保險利益)，支付現金是唯一的方式。"},{"id":"B536","ch":3,"ref":"3.2.1(a)","t":1,"s":"by","q":"以下哪項結清方法是以現金支付的唯一可行方法？","qi":[],"qe":"Which of the following can use payment of money as the only method of settlement?","qei":[],"o":[{"z":"汽車損毀","e":"Damage of vehicle"},{"z":"個人意外","e":"Personal accident"},{"z":"財物損失","e":"Loss of property"},{"z":"以上各項均是","e":"All of the above"}],"a":1,"x":"向被保險人提供利益保單(例如人身意外保險利益)，支付現金是唯一的方式。"},{"id":"B537","ch":3,"ref":"3.2.1(c)","t":1,"s":"by","q":"以下哪項是適合以更換作為損害賠償的結清方式？","qi":[],"qe":"Which of the following is appropriate to use replacement as the method of settlement?","qei":[],"o":[{"z":"玻璃保險","e":"Glass insurance"},{"z":"全新或基本上全新的物品","e":"New or virtually new items"},{"z":"不存有折舊問題的物品","e":"Items not subject to depreciation"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"玻璃、不會折舊的物品及全新或幾乎是全新的物品都可以以更換來作結清的方式。"},{"id":"B538","ch":3,"ref":"3.2.2(c)","t":1,"s":"by","q":"以下哪三項是適合「更換」結清給付方式的情況？","qi":["破裂的玻璃(玻璃保險)","遭遺失的珠寶(「全險保險」)","遭盜竊的新攝影機(旅遊保險)","船隻的全損(水險)"],"qe":"Which three of the following are appropriate to use replacement as the method of settlement?","qei":["Breakage of glass (glass insurance)","Lost jewellery (all risks insurance)","Stolen new camera (travel insurance)","Total loss of ship (marine insurance)"],"o":[{"z":"i, ii, iii i, ii, iii","e":""},{"z":"i, ii, iv i, ii, iv","e":""},{"z":"i, iii, iv i, iii, iv","e":""},{"z":"ii, iii, iv ii, iii, iv","e":""}],"a":0,"x":"玻璃、不會折舊的物品及全新或幾乎是全新的物品都可以以更換來作結清的方式。"},{"id":"B539","ch":3,"ref":"3.2.2(d)","t":1,"s":"by","q":"以下哪項可以是形容恢復原狀這種理賠方式","qi":[],"qe":"Which of the following describes reinstatement as a method of settlement?","qei":[],"o":[{"z":"重新修建被損毀的建築物","e":"Restoration of a damaged building"},{"z":"可能是涉及火災保險的","e":"May involve fire insurance"},{"z":"在某些規定的情況下，保險人可能被強制作出此安排","e":"In some circumstances it may be mandatory for the insurer to make such arrangement"},{"z":"以上各項都是","e":"All of the above"}],"a":3,"x":"恢復原狀涉及火險的理賠方式，方式是指使受保財產恢復到在受毀或受損以前那一刻所處的狀況。同時保險人有權選擇怎麽向被保險人提供彌償。然而因為希望令顧客感到滿意，絕少有保險人會強迫被保險人接受不情願的結清方式。"},{"id":"B540","ch":3,"ref":"3.2.3","t":1,"s":"by","q":"以下哪項屬於保險投訴局可處理的範圍？","qi":[],"qe":"Which of the following is under the scope of Insurance Claims Complaints Bureau?","qei":[],"o":[{"z":"酒店的鍋爐爆炸保單","e":"Policy for explosion of boiler in a hotel"},{"z":"正進行仲裁或訴訟的個案","e":"Case currently under arbitration or litigation"},{"z":"涉及五十五萬元的個人意外保單","e":"Personal accident policy of HK$550,000"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"保險投訴局可處理的範圍包括:涉案保單屬於個人保單、投訴個案的索償金額／爭議金額不超過 100萬港元及投訴個案並非正在進行法律程序或仲裁。"},{"id":"B541","ch":3,"ref":"3.2.3","t":1,"s":"b","q":"下列哪項是對保險索償投訴局的不正確描述？","qi":[],"qe":"Which of the following is incorrect in describing Insurance Claims Complaints Bureau?","qei":[],"o":[{"z":"處理70萬以下的索償","e":"Handles claims of below HK$700,000"},{"z":"接受各類型保險的投訴","e":"Accepts complaints of all kinds of claims"},{"z":"不論勝訴與否，也不會向投訴人徵收費用","e":"Win or lose, will not charge the complainant"},{"z":"處理個人保險的投訴","e":"Handles complaints on personal insurance"}],"a":1,"x":"保險投訴局只接受涉案保單屬於個人保單的個案。"},{"id":"B542","ch":3,"ref":"3.2.3","t":1,"s":"by","q":"以下哪項或哪些索償投訴可能是保險投訴局的處理範圍？","qi":["正在進行仲裁的索償","裝在船外的發動器損毀(私人的遊艇保險)","酒店鍋爐的損壞(鍋爐保險)","個人人身意外保險的$250,000死亡利益(私人的人身意外保險)"],"qe":"Which of the following complaints on claims could be under the scope of Insurance Claims Complaints Bureau?","qei":["Claims currently under arbitration","Damage of outboard motor (private pleasure craft insurance)","Damage of boiler in hotel (boiler insurance)","Death benefit of personal accident insurance for HK$250,000 (personal accident insurance)"],"o":[{"z":"i, ii","e":""},{"z":"i, iv","e":""},{"z":"ii, iii","e":""},{"z":"ii, iv","e":""}],"a":3,"x":"保險投訴局可處理的範圍包括:涉案保單屬於個人保單及投訴個案並非正在進行法律程序或仲裁。鍋爐爆炸保險屬工程保險。"},{"id":"B543","ch":3,"ref":"3.2.3(a)","t":1,"s":"by","q":"下列哪項不是保險投訴局的特點?","qi":[],"qe":"Which of the following is not a feature of Insurance Claims Complaints Bureau?","qei":[],"o":[{"z":"賠償的上限為七十萬港幣","e":"The claim is HK$700,000"},{"z":"適用於任何種類索償","e":"Applicable to all kinds of claims"},{"z":"無論勝數與否, 訴訟毋須支付任何費用","e":"Win or lose, the complainant pays no fee"},{"z":"只適用於保險索償投訴局成員的保險人","e":"Applicable only to insurer members of Insurance Claims Complaints Bureau"}],"a":1,"x":"保險投訴局只接受涉案保單屬於個人保單的個案。"},{"id":"B544","ch":3,"ref":"3.2.3(b)","t":1,"s":"by","q":"以下哪項屬於保險投訴局的職權範圍？","qi":[],"qe":"Which of the following is under the scope of Insurance Claims Complaints Bureau?","qei":[],"o":[{"z":"涉及五十五萬的意外賠償","e":"A claim on accident for HK$550,000"},{"z":"七萬五千元的家居電器賠償","e":"A claim on household electric appliance for HK$75,000"},{"z":"二十五萬元的火災賠償","e":"A claim on fire for HK$250,000"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"保險投訴局可處理的範圍包括投訴個案的索償金額／爭議金額不超過 100萬港元。"},{"id":"B545","ch":3,"ref":"3.2.3(b)","t":1,"s":"b5y","q":"以下哪項屬於保險投訴局的權力範圍可處理的個案？","qi":[],"qe":"Which of the following cases is under the scope of Insurance Claims Complaints Bureau?","qei":[],"o":[{"z":"失竊了值七萬五千元的手錶(家居保險)","e":"A watch valued at HK$75,000 is stolen (household insurance)"},{"z":"二萬五千元的醫療開支(個人意外保險)","e":"Medical expense of HK$25,000 (personal accident insurance)"},{"z":"十五萬元的火災損毀(家居火災保單)","e":"Damage by fire for HK$150,000 (household fire policy)"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"保險投訴局可處理的範圍包括投訴個案的索償金額／爭議金額不超過 100萬港元。"},{"id":"B546","ch":3,"ref":"3.2.3(f)","t":1,"s":"by","q":"以下哪項是對保險投訴局處理個案的不正確描述？","qi":[],"qe":"Which of the following is incorrect in describing the handling of cases by Insurance Claims Complaints Bureau?","qei":[],"o":[{"z":"投訴須於索償後6個月內提出","e":"Complaint must be made within 6 months after the claim"},{"z":"個案不得已經進行起訴或仲裁","e":"Case cannot be under arbitration or litigation"},{"z":"保險人必須已向被保險人通知自己的最後決定","e":"Insurer must have notified the insured on its final position"},{"z":"以上各項皆是","e":"All of the above"}],"a":0,"x":"投訴人須於接獲保險人發出的最終決定的六個月內，向保險投訴局作出書面投訴。"},{"id":"B547","ch":3,"ref":"3.2.1","t":1,"s":"b","q":"根據保單條款，誰人可決定是次賠付以支付現金或更換進行？","qi":[],"qe":"Under the policy provision, who is given the option of deciding whether the claim settled by cash or replacement?","qei":[],"o":[{"z":"保險人","e":"Insurer"},{"z":"被保險人","e":"Insured"},{"z":"保險中介人","e":"Insurance intermediary"},{"z":"仲裁員/公斷人","e":"Arbitrators/Umpire"}],"a":0,"x":"保險人有權選擇怎麽向被保險人提供彌償。然而因為希望令顧客感到滿意，絕少有保險人會強迫被保險人接受不情願的結清方式。"},{"id":"B548","ch":3,"ref":"3.1.3(f)","t":1,"s":"b","q":"以下哪項或哪些保單條件可能修改普通法中的條文？","qi":[],"qe":"* Which one or more of the following policy condition is/are likely to amend common law provision?*","qei":[],"o":[{"z":"比例分攤","e":"pro rata condition"},{"z":"代位權","e":"subrogation"},{"z":"分擔","e":"contribution"},{"z":"以上各項皆正確","e":"all of the above are correct"}],"a":3,"x":"保單修改法律情況如比例分攤、分擔及代位都會造成一些影響。"},{"id":"B549","ch":3,"ref":"3.1.6(f)","t":1,"s":"b","q":"下列關於海損理算師的說法中，哪項是不真實的？","qi":[],"qe":"Which of the following statements concerning average adjusters is not true?","qei":[],"o":[{"z":"他們專門從事共同海損的理賠；","e":"they specialists in general average claims"},{"z":"無論何時出現比例分攤(不足額保險)，通常都要用到他們；","e":"they are normally used whenever average (under insurance) arises;"},{"z":"他們必須具有不同國家海事法律上的專業知識；","e":"their experties must include the knowledge of international law of the sea;"},{"z":"他們單處理某一個案有時就可能需時幾年","e":"their work in a case can sometime stretch a several of years"}],"a":1,"x":"海損理算師中並沒有提及比例分攤的情況。"},{"id":"B550","ch":3,"ref":"3.2.1(d)","t":1,"s":"b","q":"當“恢復原狀”一詞運用在一般保險保單時，以下哪項或哪些是這一詞的意義？","qi":[],"qe":"Which one or more of the following is/are the meanings of the 'reinstatement', as used in a general insurance?","qei":[],"o":[{"z":"重建受損的建築物","e":"Rebuilding damaged building"},{"z":"更換受火災焚燒後的汽車","e":"The replacement of the vehicle damaged by fire"},{"z":"恢復及修理受損的建築物","e":"Restoring and repairing the damaged building"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"恢復原狀是使受保財產恢復到在受毀或受損以前那一刻所處的狀況，重建受損的建築物是頗為普遍的結清方式，而恢復原狀一詞的含義與「修理」和「更換」的含義是有重疊的，所以更換受火災焚燒後的汽車也是恢復原狀的一種。"},{"id":"B551","ch":3,"ref":"3.2.3","t":1,"s":"b","q":"以下哪一個案屬於保險索償投訴局的處理範圍內？","qi":[],"qe":"Which one of the following cases falls within the scope of the Insurance Claims Complaints Bureau?","qei":[],"o":[{"z":"關於增加續保保費的投訴","e":"A complaint about an increased renewal premium"},{"z":"被保險人已經向保險人發出令狀的個案","e":"A case where the insured has already issued a writ against the insurer"},{"z":"丟失價值二萬五千港元手錶的個人旅遊保險索償","e":"A travel insurance claim from an individual who lost a watch worth HK$25,000"},{"z":"某公司對比例分攤條件降低其火災索償金額有所不滿","e":"A company is unsatisfied with a reduction of its fire claim on the basis of the pro rate average condition"}],"a":2,"x":"保險投訴局可處理的範圍包括:投訴個案屬金錢性質、涉案保單屬於個人保單及投訴個案並非正在進行法律程序或仲裁及投訴個案的索償金額／爭議金額不超過 100 萬港元。"},{"id":"Y3002","ch":3,"ref":"3.1(b)","t":0,"s":"y","q":"在優良保險手法中，以下哪些是無效索償的不正確描述？","qi":["保險人對於這些索償需使用科學手法","無論任何情況，不應拒絶索償","保險人拒絶索償的話，應該給予充分的解釋","只能跟據香港保險業聯會發出的處理投訴的指引拒賠"],"qe":"","qei":[],"o":[{"z":"i、ii、iii","e":""},{"z":"i、ii、iv","e":""},{"z":"i、iii、iv","e":""},{"z":"ii、iii、iv","e":""}],"a":1,"x":"拒絶給付賠償金或保險金是一件嚴重的事情。很多保險人在由香港保險業聯會發出的《承保商專業守則》中，承諾如果必須拒絶賠償或支付保險金，就應該給予充分的解釋。根據排除法，"},{"id":"B553","ch":3,"ref":"3.2.1(c)","t":1,"s":"b","q":"以下哪項是適合於更換結清方式的情況？","qi":[],"qe":"Which of the following are appropriate to use \"replacement\" as the method of settlement?","qei":[],"o":[{"z":"全新的受保汽車在登記後的首年內被毀","e":"A new replacement vehicle if a brand new insured car is destroyed"},{"z":"第三者的受傷的責任","e":"The liability for the injury of third party"},{"z":"個人意外死亡","e":"The benefit of death from personal accident"},{"z":"以上所有各項都不是","e":"None of the above"}],"a":0,"x":"不會折舊的物品及全新或幾乎是全新的物品都可以以更換來作結清的方式。"},{"id":"B554","ch":3,"ref":"3.1.4","t":1,"s":"b","q":"被保險人發生了損失並要求索償，在普通法中，以下那項或那些是被保險人包括的責任?","qi":[],"qe":"When the insured ask for claims at the time of the loss, in the common law, which one or more will be included in the insured¡¦s duties?","qei":[],"o":[{"z":"沒有任何形式的欺詐行為","e":"Absence in any form of fraud"},{"z":"在合理的範圍下與保險人合作","e":"Reasonable cooperation with the insurer"},{"z":"有責任在合理的可能情況下，盡量地減少損失","e":"A duty to minimize loss as far as is reasonably possible"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"在普通法中，被保險人的責任包括：(i) 在合理的範圍下與保險人合作；(ii)有責任在合理的可能情況下，盡量地減少損失；(iii)不危害保險人的權利（例如代位權）；(iv) 避免欺詐行為（任何形式）。"},{"id":"B555","ch":4,"ref":"4.0","t":1,"s":"b","q":"以下哪3項提供資料及指引，在客戶服務方面鼓勵保險人及其員工？","qi":["香港保險業監管局","保單持有人團體","個別保險人本身","保險業(行業機構)"],"qe":"Which three of the following provide information and guidelines to encourage insurer and its employees on customer service?","qei":["Hong Kong Insurance Authority","Policyholder organization","Individual insurer","Insurance industry (industry organization)"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"i, iii, iv","e":""},{"z":"ii, iii, iv","e":""}],"a":2,"x":"客戶服務方面，公司內部、保險業及監管機構均有不同的指引及聲明，提高整體客戶服務的水平。"},{"id":"B556","ch":4,"ref":"4.0","t":1,"s":"b","q":"以下哪項會對保險人的顧客服務進行監察？","qi":["香港特區政府","保險業組織","保單持有人和公眾","保險人本身(內部部門監管)"],"qe":"Which of the following will monitor the customer service of insurer?","qei":["The government of HKSAR","Insurance industry organization","Policyholder and the public","Insurer itself (internal department monitoring)"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":3,"x":"監察方面，無論政府、監管機構、保險人或客人身上都會對保險人的顧客服務進行監察。"},{"id":"B557","ch":4,"ref":"4.0","t":1,"s":"b","q":"客戶服務經已成為保險人的重要考慮因素，以下哪項或哪些可能會對這題目有興趣？","qi":[],"qe":"Customer service has become an important consideration for insurer. Which of the following will be interested in the topic?","qei":[],"o":[{"z":"個別保險人","e":"Individual insurer"},{"z":"保險業","e":"Insurance industry"},{"z":"政府","e":"Government"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"客戶服務方面，公司內部、保險業及監管機構均有不同的指引及聲明，提高整體客戶服務的水平。"},{"id":"B558","ch":4,"ref":"4.1","t":1,"s":"by","q":"以下哪項對客戶服務的形容是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing customer service?","qei":[],"o":[{"z":"如果表現良好，它可以帶來多項正面的結果","e":"If performing well, it can bring in positive results"},{"z":"如果表現差劣，便可能有流失客戶的結果","e":"If performing poorly, it may result in loss of customers"},{"z":"如果表現差劣，便可能失去中介人的支援","e":"If performing poorly, it may lose the support of intermediaries"},{"z":"政府將整項問題交給業界處理","e":"The government let the industry handle the entire issue"}],"a":3,"x":"監管機構當然會監察行業運作，保險人獲授權在香港經營保險業務外，還希望他們能提高香港的地位及聲譽。"},{"id":"B559","ch":4,"ref":"4.1","t":1,"s":"by","q":"不良服務的負面影響為：","qi":[],"qe":"The negative impact of poor customer service is:","qei":[],"o":[{"z":"可以保留客戶，增加「忠誠度」","e":"Can retain customers and increase loyalty"},{"z":"喪失中介人的支援","e":"Lose the support of intermediaries"},{"z":"提升顧客推薦的「生產力」","e":"Increase customer productivity of recommendations"},{"z":"減少處理投訴的時間，即提升盈利能力","e":"Reduce time to handle complaints means increase in profitability"}],"a":1,"x":"如果保險中介人所付出的努力得不到高質量服務的支援，那麽就不能合理地期望他們能夠擴展業務。"},{"id":"B560","ch":4,"ref":"4.1","t":1,"s":"b","q":"保險人提供不良的客戶服務，會帶來負面結果包括：","qi":["損失生意","喪失中介人的支援","破壞市場聲譽","政府介入"],"qe":"Poor customer service provided by insurer will bring in negative impact, including:","qei":["Loss of business","Lose support of intermediaries","Damage market prestige","Government involvement"],"o":[{"z":"i, ii , iii","e":""},{"z":"i, ii , iv","e":""},{"z":"ii, iii , iv","e":""},{"z":"i, ii, iii , iv","e":""}],"a":3,"x":"不良客戶服務將帶來以下後果:(i)喪失業務(ii) 喪失保險中介人的支持(iii) 破壞市場聲譽(iv) 監管機構介入"},{"id":"B561","ch":4,"ref":"4.1","t":1,"s":"b5","q":"如果不注重客戶服務，便會預期帶來以下哪項「負面」結果？","qi":[],"qe":"If not taking customer service seriously, it is expected to bring in which of the following \"\"negative\"\" results?","qei":[],"o":[{"z":"損失生意","e":"Loss of business"},{"z":"增加口碑推薦的顧客生產力","e":"Increase customer \"\"productivity\"\" of recommendations"},{"z":"因減少耗於處理投訴的時間而提升的盈利能力","e":"Reduce time to handle complaints means increase in profitability"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"不良客戶服務將帶來以下後果:(i)喪失業務(ii) 喪失保險中介人的支持(iii) 破壞市場聲譽(iv) 監管機構介入"},{"id":"B562","ch":4,"ref":"4.1","t":1,"s":"b","q":"如保險人不注重客戶服務，若干投訴後，以下那類或幾項會發生：","qi":[],"qe":"If insurer do not take customer service seriously, after several complaints which of the following may happen?","qei":[],"o":[{"z":"可能會流失客戶","e":"May lose customers"},{"z":"可能不被中介人支持","e":"May not be supported by intermediaries"},{"z":"政府可能會介入","e":"Government may get involved"},{"z":"以上各項","e":"All of the above"}],"a":3,"x":"不良客戶服務將帶來以下後果:(i)喪失業務(ii) 喪失保險中介人的支持(iii) 破壞市場聲譽(iv) 監管機構介入"},{"id":"B563","ch":4,"ref":"4.1.1","t":1,"s":"by","q":"以下哪項屬於提供優良客戶服務的影響：","qi":[],"qe":"Which of the following is an impact of good customer service?","qei":[],"o":[{"z":"提升顧客忠誠度","e":"Increase customer loyalty"},{"z":"提升顧客生產力，向其他客戶大力推薦","e":"Increase customer productivity by recommendations and word of mouth"},{"z":"提升盈利能力","e":"Increase profitability"},{"z":"以上各項皆正確","e":"All of the above are correct"}],"a":3,"x":"客戶服務的正面影響的：(i) 顧客忠誠度(ii) 顧客「生產力」(iii) 提升盈利能力"},{"id":"B564","ch":4,"ref":"4.2","t":1,"s":"b","q":"一種對於保險人意願及服務標準的公開宣言，該聲明較可能包括","qi":[],"qe":"A public declaration about the intentions and service standard of insurer will include:","qei":[],"o":[{"z":"一項對素質及服務承諾的保證","e":"A guarantee of commitment to quality and service"},{"z":"一項不會拒絕任何索償保證","e":"A guarantee not to refuse any claims"},{"z":"一種稱為市場提供最優惠保費的保證","e":"A guarantee to provide the most favoured premium in the market"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"保險人為保險中介人及保單持有人而設立的公開的宣告，内容相當可能包括：(i) 對素質及服務所承擔的義務；(ii) 對高專業標準的奉獻；(iii) 對效率及高商業道德的承諾；(iv)保證公平及迅速地處理索償或保險金要求；(v)有關商業操守及某些做法的具體資訊。"},{"id":"B565","ch":4,"ref":"4.2","t":1,"s":"by","q":"以下哪項不會出現在保險公司的商業標準宣言中？","qi":[],"qe":"Which of the following will not appear in an insurer's business standard declaration?","qei":[],"o":[{"z":"一項對質素和服務的承諾","e":"A commitment to quality and service"},{"z":"一種對效率和商業操守的保証","e":"A promise of efficiency and high business ethics"},{"z":"一種對提供最低保險產品的保証","e":"A guarantee to provide the lowest insurance product"},{"z":"涉及商業操守和實務方法的特定資訊","e":"Specific information on business conduct and certain practices"}],"a":2,"x":"保險人並不可能保留最低保險產品的保証。"},{"id":"B566","ch":4,"ref":"4.2","t":1,"s":"by","q":"下列哪項是預期服務標準的公開宣言？","qi":[],"qe":"Which of the following is expected in a public declaration in service standard?","qei":[],"o":[{"z":"保險人作出的承諾","e":"Commitment of insurer"},{"z":"顧客義務的提醒","e":"Reminder of customer obligations"},{"z":"上述兩項","e":"Both two of the above"},{"z":"上述兩項都不是","e":"None of the above two"}],"a":0,"x":"保險人應主動提供最佳實務及承諾，而不是由顧客所提醒。"},{"id":"B567","ch":4,"ref":"4.2","t":1,"s":"by","q":"保險公司服務方針及操守守則對公司起著關鍵性的推動力，亦同時作為宣告方向的標準，這宣告的原則是：","qi":[],"qe":"The policies and codes of conduct are major motivational forces behind the insurer, as well as a standard of declared intentions. The principle of such declaration:","qei":[],"o":[{"z":"法律所要求的","e":"Is legally required"},{"z":"每個保險人都必須制定相同的原則","e":"Each insurer must set the same principles"},{"z":"每家保險公司都可以自行制定類似的原則","e":"Each insurer can set similar principles on its own"},{"z":"以上各項皆不是","e":"None of the above"}],"a":2,"x":"很多香港公司已經製作了服務方針及操守守則公開的宣告，這種做法將越來越普遍。每家公司在設計這些文件時，當然都有自己的表達風格和內容。"},{"id":"B568","ch":4,"ref":"4.3","t":1,"s":"by","q":"保險人印製在業務上的客戶服務標準宣言，內容包括：","qi":[],"qe":"The content of the declared standards for customer service in business printed by insurer will include:","qei":[],"o":[{"z":"辨別顧客的需要","e":"Identification of customer needs"},{"z":"一種儘快提供文件的承諾","e":"Promise to supply documents promptly"},{"z":"一種對所提供資料保密的保證","e":"Guarantee on confidentiality for information provided"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"客戶服務標準及其實施包括:(a) 識別顧客的需求(b) 保密及依從(c) 提供所需保險保障(d) 保險文件提供的速度(e)理賠承諾，公平地處理索償或保險金要求"},{"id":"B569","ch":4,"ref":"4.3","t":1,"s":"b","q":"客戶服務標準的宣告：","qi":[],"qe":"The declared standards for customer service:","qei":[],"o":[{"z":"必須保持機密","e":"Must be kept confidential"},{"z":"每位保險人也略有不同","e":"Is slightly different for each insurer"},{"z":"不合時宜，很多保險人不再採用","e":"Is not in fashion and many insurers do not adopt it"},{"z":"必須按〈保險公司條例〉要求","e":"Must be according to the requirements of \"\"Insurance Companies Ordinance\"\""}],"a":1,"x":"不同保險人所宣告的客戶服務標準在細節上可能有所差別"},{"id":"B570","ch":4,"ref":"4.3","t":1,"s":"b","q":"一些宣告很可能提醒被保人及中介人某些必須負上的義務，包括：","qi":[],"qe":"Some declarations may remind the insured and intermediaries about certain obligations they have, including:","qei":[],"o":[{"z":"對於重要事實遵行最高誠信原則責任的需要","e":"Apply the principle of utmost good faith on material facts"},{"z":"中介人受到實務守則的約束","e":"Intermediaries are bound by a code of practice"},{"z":"被保險人按時繳交保費的需要","e":"The insured to pay premiums when due"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"被保險人和保險中介人被要求履行的義務包括：(i) 披露的要求：最高誠信責任(ii)支付保費：按時支付保費的義務，以及保險中介人任何允許的信貸安排(iii) 保險代理人受到實務守則的約束"},{"id":"B571","ch":4,"ref":"4.3","t":1,"s":"b","q":"以下那三項相當有可能包括在本港保險人發出的客戶服務標準宣言中？","qi":["確定客人需要","保證必定支付所有索償","準確及公平地提供索償","提供客人需要之保障"],"qe":"Which three of the following are likely to be included in the declared standards for customer service issued by insurers in Hong Kong?","qei":["Identification of customer needs","Guarantee to pay all claims","Deal with claims accurately and fairly","Provision of desired cover"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"i, iii, iv","e":""},{"z":"ii, iii, iv","e":""}],"a":2,"x":"客戶服務標準及其實施包括:(a) 識別顧客的需求(b) 保密及依從(c) 提供所需保險保障(d) 保險文件提供的速度(e)理賠承諾，公平地處理索償或保險金要求"},{"id":"B572","ch":4,"ref":"4.3.1","t":1,"s":"by","q":"針對客戶服務標準的規定及推行, 實需要一種操守及處事的開明手法, 描述這種需要的慣常用語是:","qi":[],"qe":"For the establishment and implementation of customer service standard, it is necessary to have an openness to conduct and practice. The term used to describe such need is:","qei":[],"o":[{"z":"誠信","e":"Good faith"},{"z":"透明度","e":"Transparency"},{"z":"問責性","e":"Accountability"},{"z":"榮譽","e":"Honour"}],"a":1,"x":"「透明度」是現代社會中一個很重要的詞，指操守及做法都應公開交代，並且不論什麽時候都要符合法律及道德的規範。"},{"id":"B573","ch":4,"ref":"4.4","t":1,"s":"b","q":"根據《承保商專業守則》，以下哪項是發揮優良保險慣例的應有標準？","qi":[],"qe":"According to the \"\"Code of Conduct for Insurers\"\", which of the following is a standard of good insurance practice?","qei":[],"o":[{"z":"產品剖析","e":"Product understanding"},{"z":"廣泛的顧客權益","e":"Customers' rights and interests generally"},{"z":"承保及索償","e":"Underwriting and claims"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"守則為保險人提供標準，這包括：(i) 提供建議及銷售慣例(ii) 索償(iii) 保險代理人的管理(iv) 僱員管理(v) 保險人違規行為(vi) 查詢、投訴及糾紛"},{"id":"B574","ch":4,"ref":"4.4","t":1,"s":"b5","q":"以下哪項對於保險公司來說是重要的？","qi":[],"qe":"Which of the following is important to insurer?","qei":[],"o":[{"z":"代理法","e":"Agency law"},{"z":"合約法","e":"Contract law"},{"z":"法定的條例","e":"Statutory ordinance"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"代理法、合約法及法定條例(保險業條例)也對公司運作十分重要。"},{"id":"B575","ch":4,"ref":"4.4(b)","t":1,"s":"b","q":"《保險業條例》不會將一般保險公司就下面哪項事宜作出規管？","qi":[],"qe":"Which of the following is not a matter for which certain requirements are specified for general insurance companies under the Insurance Ordinance?","qei":[],"o":[{"z":"授權","e":"Authorization"},{"z":"償付能力","e":"Solvency margins"},{"z":"資產報酬率","e":"Return on assets"},{"z":"董事及控權人需為「適當的人選」","e":"Fit and proper' directors and controllers"}],"a":2,"x":"《保險業條例》對保險公司作出了若干嚴格的要求:(i) 保險人的授權(ii) 股本規定(iii) 償付能力的規定(iv)控權人、董事、管控要員及獲委任精算師須屬「適當人選」(v) 「足夠」的再保險"},{"id":"B576","ch":4,"ref":"4.4(b)","t":1,"s":"by","q":"根據《保險業條例》，以下哪項是規定了對保險公司嚴格要求","qi":["保險人的股本","保險人有足夠的再保險","保險人的授權","保險人的償付能力"],"qe":"According to \"Insurance Companies Ordinance\", which of the following are strict requirements regarding insurance companies?","qei":["Capital of insurer","Adequate reinsurance of insurer","Authorization of insurer","Solvency margin of insurer"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"i, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":3,"x":"《保險業條例》對保險公司作出了若干嚴格的要求:(i) 保險人的授權(ii) 股本規定(iii) 償付能力的規定(iv)控權人、董事、管控要員及獲委任精算師須屬「適當人選」(v) 「足夠」的再保險"},{"id":"B577","ch":4,"ref":"4.4(b)","t":1,"s":"by","q":"《保險業條例》規定本港的保險人必須：","qi":[],"qe":"\"\"Insurance Ordinance\"\" requires insurer in Hong Kong must:","qei":[],"o":[{"z":"有「足夠」的再保險","e":"Have \"\"adequate\"\" reinsurance"},{"z":"購買能夠維持去年盈利能力的再保險","e":"Purchase reinsurance that can maintain last year's profitability"},{"z":"最少擁有50%的風險已購買再保險","e":"At least 50% of risks have already purchased reinsurance"},{"z":"擁有50%的盈利是來自再保險","e":"Have 50% of profit arising from reinsurance"}],"a":0,"x":"「足夠」的再保險是《保險業條例》對保險公司作出了若干嚴格的要求之一。"},{"id":"B578","ch":4,
