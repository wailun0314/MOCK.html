"qi":[],"qe":"","qei":[],"o":[{"z":"風險的可保性","e":""},{"z":"標準保費率是否適合","e":""},{"z":"應否接納免賠額或自負額","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"所有各都是進行風險評估時須要考慮的事項，"},{"id":"Y2021","ch":2,"ref":"2.1.2(b)(iii)","t":0,"s":"y","q":"甚麼風險因素可影響道德危險？","qi":[],"qe":"","qei":[],"o":[{"z":"引起盜竊的吸引力(盜竊保險)","e":""},{"z":"令人不滿的索償經驗","e":""},{"z":"被保險人對索償的無理態度","e":""},{"z":"被保險人的身體狀況(個人意外保險)","e":""}],"a":2,"x":"道德危險可能出現的負面形態包括\"不合情理\"，即根據普遍被接納的詞意，某人可能非常誠實；然而當他鑽牛角尖或極端固執時，便可能製造極大的麻煩。"},{"id":"Y2022","ch":2,"ref":"2.1.2(b)","t":0,"s":"y","q":"對特定的投保進行評估時，承保人會全面了解風險。當中包括兩大類別，分別為實質危險及：","qi":[],"qe":"","qei":[],"o":[{"z":"道德危險","e":""},{"z":"非實質危險","e":""},{"z":"無形危險","e":""},{"z":"心理危險","e":""}],"a":0,"x":"核保人把危險分為兩類實質(物質) 危險和道德危險。"},{"id":"Y2025","ch":2,"ref":"2.1.2(a)(i)","t":0,"s":"y","q":"以下哪一項不是影響一項風險的道德危險？","qi":[],"qe":"","qei":[],"o":[{"z":"被保險人一方的不誠實","e":""},{"z":"建築物中的建築材料","e":""},{"z":"被保險及受僱僱員的粗心大意","e":""},{"z":"被保險人對索償的無理態度","e":""}],"a":1,"x":"建築材料是實質危險的例子。"},{"id":"Y2027","ch":2,"ref":"2.1.2(a)","t":0,"s":"y","q":"投保書中問題的答案可能會引起保險人的進一步查詢(檢驗)，例如：","qi":[],"qe":"","qei":[],"o":[{"z":"正投保大額款項的盜竊保險","e":""},{"z":"曾多次索償意外撞車的汽車保險","e":""},{"z":"正投保大額的建築火險保險","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"所有各項都可能會引起保險人的進一步查詢，"},{"id":"Y2029","ch":2,"ref":"2.1.2","t":0,"s":"y","q":"在估定一項風險，核保人都會考慮的事情主要分為兩方面，一般稱為「實質危險」及：","qi":[],"qe":"","qei":[],"o":[{"z":"典型危險","e":""},{"z":"道德危險","e":""},{"z":"非實質危險","e":""},{"z":"心理危險","e":""}],"a":1,"x":"核保人把危險分為兩類：實質(物質) 危險和道德危險。"},{"id":"Y2031","ch":2,"ref":"2.1.2","t":0,"s":"y","q":"以下哪一項不屬於在一般情況下影響一項風險的實質危險？","qi":[],"qe":"","qei":[],"o":[{"z":"引起盜竊的吸引力(盜竊保險)","e":""},{"z":"令人不滿的索償經驗","e":""},{"z":"被保險人一方的不誠實","e":""},{"z":"被保險人的身體狀況(個人意外保險)","e":""}],"a":2,"x":"被保險人一方的不誠實屬道德危險，"},{"id":"Y2032","ch":2,"ref":"2.1.2(a)","t":0,"s":"y","q":"核保時，保險人會考慮投保人的實質危險，以下哪項不屬於實質危險？","qi":[],"qe":"","qei":[],"o":[{"z":"目標物件的價值及吸引力(盜竊保險)","e":""},{"z":"被保人的僱員的粗心大意行為(意外保險)","e":""},{"z":"建築物中的建築材料(火險)","e":""},{"z":"員工的工作性質(僱員賠償保險)","e":""}],"a":1,"x":"粗心大意及魯莽屬道德危險，"},{"id":"Y2038","ch":2,"ref":"2.1.3","t":0,"s":"y","q":"投保書是一項重要工具，讓被保險人提供重要事實，同時有助被保險人履行什麼責任？","qi":[],"qe":"","qei":[],"o":[{"z":"代位權","e":""},{"z":"近因","e":""},{"z":"可保權益","e":""},{"z":"最高誠信","e":""}],"a":3,"x":"投保書是一項重要工具，讓被保險人提供重要事實，同時有助被保險人履行最高誠信責任。"},{"id":"Y2041","ch":2,"ref":"2.1.4","t":0,"s":"y","q":"要得到被保人的資料，保險人可以從何得到？","qi":[],"qe":"","qei":[],"o":[{"z":"投保書","e":""},{"z":"檢驗人的專業評估","e":""},{"z":"醫療人員的醫療報告","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"承保人可以透過得多方法和渠道，獲取所投保風險的重要事實的詳情。這些包括：- 投保書 -專業協助：這包括醫療問題(不是一般保險通常要求的)，以及各類技術專家的風險檢驗和報告 - 風險檢驗"},{"id":"Y2042","ch":2,"ref":"2.1.4","t":0,"s":"y","q":"以下哪項有關投保書的描述是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"空白表格一般不算為保險人向客人作出的合約要約","e":""},{"z":"有時是唯一的資料來源","e":""},{"z":"由保險中介人設計及印刷","e":""},{"z":"以上所有各項","e":""}],"a":1,"x":"某些業務類別(大多數是個人險種，例如私家車)的投保書，基本上是核保資料的唯一來源。空白表格一般視為保險人向客人作出的合約要約。投保書屬於保險公司的印刷文件。"},{"id":"Y2043","ch":2,"ref":"2.2.1(c)&(d)","t":0,"s":"y","q":"在投保中，保險人的報價：","qi":[],"qe":"","qei":[],"o":[{"z":"立刻受到約束","e":""},{"z":"永不受到約束","e":""},{"z":"可能受到限制，亦有可能不受到約束","e":""},{"z":"只是一項「協商邀請」，所以不會受到約束","e":""}],"a":2,"x":"如果保險人不願意被報價正式地約束，他應當適當地表示，例如註明有關報價只作參考用途(或說明類似的限制)，或附加某些其他的條件(例如此報價只適用於足以令保險人感覺滿意的投保)。"},{"id":"Y2044","ch":2,"ref":"2.2.1","t":0,"s":"y","q":"以下哪項或哪些有關保險報價的說明是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"它必須以書面形式呈現","e":""},{"z":"它可以涉及有關保費及(/ 或) 合約條款","e":""},{"z":"在法律上，要求一項報價可視為一項合約的要約","e":""},{"z":"以上各項皆是","e":""}],"a":1,"x":"報價可以是書面或口頭的。報價可以只涉及設想中的保費，或同時提及其他的合約條款。報價可能被視為可供承約的要約行為。"},{"id":"Y2045","ch":2,"ref":"2.2.1","t":0,"s":"y","q":"下列哪項有關報價的描述是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"它必須是書面","e":""},{"z":"它涉及保費及合約條款","e":""},{"z":"在法律上代表保險人發出的一項正式要約","e":""},{"z":"它可以作為報價或參考用途","e":""}],"a":0,"x":"報價可以是書面或口頭的。"},{"id":"Y2046","ch":2,"ref":"2.2.1","t":0,"s":"y","q":"以下哪項或哪些關於一般保險報價的陳述不正確？","qi":[],"qe":"","qei":[],"o":[{"z":"必須用書面形式出現","e":""},{"z":"可以涉及保費和 / 或合約條款","e":""},{"z":"法律上，報價被視為一份合約的要約","e":""},{"z":"以上各項皆不正確","e":""}],"a":0,"x":"報價可以是書面或口頭的，"},{"id":"Y2048","ch":2,"ref":"2.2.2(e)","t":0,"s":"y","q":"一般保險來說，除投保書外，還須提供一些額外資料(如專家報告)，這些文件：","qi":[],"qe":"","qei":[],"o":[{"z":"不會構成投保書的一部份","e":""},{"z":"須由投保人提供及支付相關費用","e":""},{"z":"只是例行公事，對風險評估沒有幫助","e":""},{"z":"構成投保書的一部份，須知會投保人","e":""}],"a":3,"x":"任何專家的報告或其他文件必須視為投保書的一部分，這個事實應該讓投保人加以註意。"},{"id":"Y2049","ch":2,"ref":"2.2.2","t":0,"s":"y","q":"以下哪項關於投保書的描述是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"保單一經批核，便不需要保存投保書","e":""},{"z":"有時可能是核保的唯一資料來源","e":""},{"z":"專家的報告被視為投保書的輔助文件","e":""},{"z":"保障的資料及聲明是合約的基礎","e":""}],"a":0,"x":"由於已完成的投保書對合約而言擔當著重要的角色，所以它不應被視為暫時性的文件。"},{"id":"Y2053","ch":2,"ref":"2.2.2(c)","t":0,"s":"y","q":"以下哪項對於投保書的描述是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"屬於臨時性文件，可在簽發保單時棄掉","e":""},{"z":"對於大部份的業務類別來說不十分重要","e":""},{"z":"只在強制性業務類別中屬於重要","e":""},{"z":"是保單的基準","e":""}],"a":3,"x":"由於已完成的投保書對合約而言擔當著重要的角色，所以它不應被視為暫時性的文件。投保書上提供的資料是承保人可用於核保決定的主要(有時也是唯一的)資料。幾乎所有一般保險的投保書均包含一項聲明，內容是所提供的資料將成為將要訂立的合約的基礎。"},{"id":"Y2055","ch":2,"ref":"2.2.3(b)(II)","t":0,"s":"y","q":"構成一般保險合約的訂立、及形成保險人承諾的主要資料來源是：","qi":[],"qe":"","qei":[],"o":[{"z":"保單","e":""},{"z":"暫保單","e":""},{"z":"保險憑證","e":""},{"z":"填妥的投保單","e":""}],"a":3,"x":"由於已完成的投保書對合約而言擔當著重要的角色，所以它不應被視為暫時性的文件。正由於它的重要性，一些保險人在寄發保單文件的同時，也會附上已填妥的投保書的副本，以提醒被保險人他自己曾經提供過什麼資料，而且這些次料已成為保險人所作承諾的基礎。"},{"id":"Y2056","ch":2,"ref":"2.2.3(c)","t":0,"s":"y","q":"以下哪一種保險通常不會簽發保險憑證？","qi":[],"qe":"","qei":[],"o":[{"z":"火險","e":""},{"z":"旅遊險","e":""},{"z":"汽車保險","e":""},{"z":"海上貨物保險(在總保單下)","e":""}],"a":0,"x":"保險憑證可以具有不同的作用。當應用於旅遊及海上貨物保險時，可在總保險單下作為保障範圍的摘要而發出。它的作用和暫保單差不多。與暫保單的情況不同，之後不會再有一份獨立的保單，除非是汽車險。"},{"id":"Y2057","ch":2,"ref":"2.2.3(c)","t":0,"s":"y","q":"下列哪項是向被保險人確認保險已經存在的證明文件？","qi":[],"qe":"","qei":[],"o":[{"z":"暫保單","e":""},{"z":"保險單","e":""},{"z":"保險憑證","e":""},{"z":"投保書","e":""}],"a":0,"x":"暫保單的主要目的是向被保險人書面證明有關保險如所述般存在。"},{"id":"Y2058","ch":2,"ref":"2.2.3(b)","t":0,"s":"y","q":"以下哪項關於一般保險保單的說明是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"它通常用以證明合約的存在","e":""},{"z":"嚴格來說，就算沒有保險單，保險合約依然存在","e":""},{"z":"取代有關保險之前簽發的暫保單","e":""},{"z":"是暫保單的另外一個名稱","e":""}],"a":3,"x":"暫保單被視為暫時性的保單，會被最終的保單文件所取代。"},{"id":"Y2063","ch":2,"ref":"2.2.3(a)","t":0,"s":"y","q":"以下哪三項有關暫保單的描述是不正確的？","qi":["只會就汽車保險發出暫保","最終會被正式保單取代","與保險憑證發揮一樣的功能","被保險人必需繳付保費的按金"],"qe":"","qei":[],"o":[{"z":"(i)、(ii)、(iii)","e":""},{"z":"(i)、(ii)、(iv)","e":""},{"z":"(i)、(iii)、(iv)","e":""},{"z":"(ii)、(iii)、(iv)","e":""}],"a":2,"x":"暫保單是一份暫時性的文件，最終會被保單取代。"},{"id":"Y2065","ch":2,"ref":"2.2.3(c)","t":0,"s":"y","q":"以下哪項有關保險憑證的描述是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"與暫保單是完全一樣的的文件","e":""},{"z":"獨立於保單以外的永久文件","e":""},{"z":"通常與強制性保險有關","e":""},{"z":"沒有列明保險保障的所有範圍","e":""}],"a":0,"x":"不像暫保單，保險憑證是一份獨立及永久文件。"},{"id":"Y2066","ch":2,"ref":"2.2.3(a)","t":0,"s":"y","q":"以下哪項是暫保單的正確描述？","qi":["它是向被保險人確認已經存在的證明文件","它是一份永久性的文件而獨立於保單","暫保單發出前不可收取保費","它是一份暫時性的文件提供了暫時性的保障"],"qe":"","qei":[],"o":[{"z":"(i)、(ii)","e":""},{"z":"(i)、(iii)","e":""},{"z":"(i)、(iv)","e":""},{"z":"(ii)、(iii)","e":""}],"a":2,"x":"暫保單是一份暫時性的文件，它實際上構成一份暫時性保單。顧名思義，它的確是提供保險保障。其主要目的是向被保險人書面證明有關保險如所述般存在。"},{"id":"Y2067","ch":2,"ref":"2.2.3(c)","t":0,"s":"y","q":"一般保險中，有一種文件屬於合約期間的永久性文件，通常用以証明強制性保險存在，這種文件稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"保單","e":""},{"z":"暫保單","e":""},{"z":"投保書","e":""},{"z":"保險憑證","e":""}],"a":3,"x":"保險憑證是一份獨立及永久文件，且是強制保險的證明。"},{"id":"Y2068","ch":2,"ref":"2.2.3(c)","t":0,"s":"y","q":"以下哪項關於保險憑證是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"它被使用及完全取代保單文件","e":""},{"z":"它提供關於保障權益的十分詳細資料","e":""},{"z":"它屬於法律上的要求，證明強制性保險的存在","e":""},{"z":"以上各項皆是","e":""}],"a":2,"x":"簽發強制保險憑證的唯一原因是法例有此要求。保險憑證是強制保險的證明。"},{"id":"Y2070","ch":2,"ref":"2.2.3(c)","t":0,"s":"y","q":"以下哪類保險不預期發出保險憑證？","qi":[],"qe":"","qei":[],"o":[{"z":"火險","e":""},{"z":"汽車保險","e":""},{"z":"旅遊保險","e":""},{"z":"海上貨物保險(總保險單)","e":""}],"a":0,"x":"保險憑證可以具有不同的作用。當應用於旅遊及海上貨物保險時，可在總保險單下作為保障範圍的摘要而發出。與暫保單的情況不同，之後不會再有一份獨立的保單，除非是汽車險。"},{"id":"Y2072","ch":2,"ref":"2.2.3(c)(iv)","t":0,"s":"y","q":"某些一般保險的保單，在保單取消後需要取回保險憑證。這是以下哪一類？","qi":[],"qe":"","qei":[],"o":[{"z":"汽車保險","e":""},{"z":"旅遊保險","e":""},{"z":"海上貨物保險","e":""},{"z":"公眾責任保險","e":""}],"a":0,"x":"在汽車保險中，一旦保險被取消，保險人必須索回保險憑證，這足以顯示保險憑證在法律上的重要性。"},{"id":"Y2073","ch":2,"ref":"2.2.4(a)(ii)","t":0,"s":"y","q":"將類以的風險根據其個別的特質加以區分，以增加或扣減保費，稱為風險 ___。","qi":[],"qe":"","qei":[],"o":[{"z":"估定","e":""},{"z":"管理","e":""},{"z":"類別","e":""},{"z":"差別對待","e":""}],"a":3,"x":"風險差別對待是指區分屬於同一風險類別的個別風險的特質(有好有壞)，憑此來對同屬某個籠統風險類別的保費作上下的調整。"},{"id":"Y2075","ch":2,"ref":"2.2.4(b)","t":0,"s":"y","q":"以下哪項關於一般保費的保費支付的重性的說明是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"這是屬於非法行為","e":""},{"z":"該保險代理可收取雙倍佣金","e":""},{"z":"這不視作已交付保費，直至保險公司收到該保險代理的款項","e":""},{"z":"在法律上視作已支付保費予保險公司","e":""}],"a":0,"x":"在《保險公司條例》中規定了保險人須在訂明情況下就其獲委任保險代理人的行為承擔轉承責任的條文。"},{"id":"Y2076","ch":2,"ref":"2.2.4(a)(ii)","t":0,"s":"y","q":"保險人在核保時，會區分屬於同一風險類別的個別風險的特質，從而對保費作出上下調整，這核保程序會：","qi":[],"qe":"","qei":[],"o":[{"z":"對投保表現出偏好及不好","e":""},{"z":"選擇利益好的風險","e":""},{"z":"調整保費作為對不同危險的奬賞及懲罰","e":""},{"z":"拒絶對商業風險的危險投保","e":""}],"a":2,"x":"風險差別對待是指區分屬於同一風險類別的個別風險的特質(有好有壞)，憑此來對同屬某個籠統風險類別的保費作上下的調整。"},{"id":"Y2078","ch":2,"ref":"2.2.4","t":0,"s":"y","q":"計算保費時，得多險種在開始值得注意的包括：","qi":[],"qe":"","qei":[],"o":[{"z":"基準","e":""},{"z":"風險分類","e":""},{"z":"差別對待","e":""},{"z":"保額","e":""}],"a":1,"x":"很多險種都是把風險歸類，而每類風險均有適用於自己的預定保險費率。"},{"id":"Y2079","ch":2,"ref":"2.2.4(a)(ii)","t":0,"s":"y","q":"核保人有時會涉及「風險差別對待」，意思是指：","qi":[],"qe":"","qei":[],"o":[{"z":"對特別風險的偏愛或偏見","e":""},{"z":"只接受提供最好利益的投保","e":""},{"z":"對應風險特質的好或壞而施加的奬勵或懲罰","e":""},{"z":"拒絶接受特別危險的風險","e":""}],"a":2,"x":"風險差別對待是指區分屬於同一風險類別的個別風險的特質(有好有壞)，憑此來對同屬某個籠統風險類別的保費作上下的調整。"},{"id":"Y2082","ch":2,"ref":"2.2.4(b)(ii)","t":0,"s":"y","q":"根據一般保單的嚴格用詞，保費：","qi":[],"qe":"","qei":[],"o":[{"z":"永遠但須於保障生效前繳交","e":""},{"z":"必須於保障生效前繳交","e":""},{"z":"有時於保障生效前繳交","e":""},{"z":"必須於保障生效起的三十天內繳交","e":""}],"a":2,"x":"實際做法視乎保單措詞而定，有些保單嚴格規定，保險保障的有效性以收到保費為先決條件。"},{"id":"Y2090","ch":2,"ref":"2.3(a)","t":0,"s":"y","q":"一般保單的保單措詞：","qi":[],"qe":"","qei":[],"o":[{"z":"沒有規定","e":""},{"z":"全部都有規定","e":""},{"z":"只是人身意外有所規定","e":""},{"z":"只是強制保險有所規定","e":""}],"a":0,"x":"在香港，保單措詞不受規管，保險人因此可以自由地設計和出售自己的產品。"},{"id":"Y2093","ch":2,"ref":"2.3","t":0,"s":"y","q":"提供保險合約證明的基文件是：","qi":[],"qe":"","qei":[],"o":[{"z":"保單","e":""},{"z":"保險憑證","e":""},{"z":"暫保單","e":""},{"z":"投保書","e":""}],"a":0,"x":"保險單(或稱保單) 是無形的保險合約的有形證據 - - 一項最正式、最常用的證據。"},{"id":"Y2094","ch":2,"ref":"2.3.1(a)","t":0,"s":"y","q":"有些只提供給個人而不會提供給商業機構的一般保險業務類別，稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"個人保險業務","e":""},{"z":"非公司業務","e":""},{"z":"私人業務","e":""},{"z":"私人保單持有者保障","e":""}],"a":0,"x":"「淺白英語」保單多數用於個人險種，而非商業風險。"},{"id":"Y2095","ch":2,"ref":"2.3.1(b)(v)","t":0,"s":"y","q":"一般保險上某些保單限制稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"敍文條款","e":""},{"z":"履行條款","e":""},{"z":"見證條款","e":""},{"z":"保單條件","e":""}],"a":3,"x":"簡單的說，保單條件是多項用來規限保險合約的印刷條文。"},{"id":"Y2099","ch":2,"ref":"2.3.1(b)(ii)","t":0,"s":"y","q":"承保表式保單中的通用除外責任是指：","qi":[],"qe":"","qei":[],"o":[{"z":"適用於整份合約的除外責任","e":""},{"z":"除外責任","e":""},{"z":"附帶條件","e":""},{"z":"以上各項皆是","e":""}],"a":3,"x":"通用除外責任指此類除外責任適用於整個合約(即保單的每個部分)。「通用除外責任」這個標題在保單中明確可見，不過還可以另外使用「除外責任」或(較少用的) 「附帶條件」等兩個名稱。"},{"id":"Y2100","ch":2,"ref":"2.3.1(b)(iii)€","t":0,"s":"y","q":"如果承保人在保單條款中附加若干條文(例如：承保單的自負額)，該條文會顯示於：","qi":[],"qe":"","qei":[],"o":[{"z":"保單承保表","e":""},{"z":"履行條款","e":""},{"z":"保單條款","e":""},{"z":"通用除外責任","e":""}],"a":1,"x":"履行條款可能列出適用於該部分的任何自負額／免賠額(或者在承保表中提及和出現)。"},{"id":"Y2103","ch":2,"ref":"2.3.1(a)","t":0,"s":"y","q":"只提供個人保險而非公司保險在一般保險中稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"個人險種保險","e":""},{"z":"私人保險","e":""},{"z":"非公司保險","e":""},{"z":"私人保單持有人保險","e":""}],"a":0,"x":"只提供個人保險而非公司保險在一般保險中稱為個人險種保險。"},{"id":"Y2104","ch":2,"ref":"2.3.1(b)(v)","t":0,"s":"y","q":"在本港非海上保險的保單條件？","qi":[],"qe":"","qei":[],"o":[{"z":"屬印刊條文","e":""},{"z":"是法定的","e":""},{"z":"是隱含的","e":""},{"z":"不同保險人的保險，都是相同的","e":""}],"a":0,"x":"簡單的說，保單條件是多項用來規限保險合約的印刷條文。"},{"id":"Y2107","ch":2,"ref":"2.3.1(a)","t":0,"s":"y","q":"承保表式保單包括以下哪些 / 哪項內容：","qi":[],"qe":"","qei":[],"o":[{"z":"承保表","e":""},{"z":"履行條款","e":""},{"z":"敘文條款","e":""},{"z":"以上各項皆是","e":""}],"a":3,"x":"承保表式保單包含所有各項內容。"},{"id":"Y2109","ch":2,"ref":"2.3.1(b)(iv)","t":0,"s":"y","q":"承保表式保單中的通用除外責任是指：","qi":[],"qe":"","qei":[],"o":[{"z":"適用於整份合約的不保項目","e":""},{"z":"又名除外責任","e":""},{"z":"又名附帶條件","e":""},{"z":"以上各項皆是","e":""}],"a":3,"x":"通用除外責任意思是指此類除外責任適用於整個合約(即保單的每個部分)。「通用除外責任」這個標題在保單中明確可見，不過還可以另外使用「除外責任」或(較少用的) 「附帶條件」等兩個名稱。"},{"id":"Y2110","ch":2,"ref":"2.3.1(b)(i)","t":0,"s":"y","q":"一般保險合約某個部份包含了所有只是有關該合約的專屬資料。該部份是：","qi":[],"qe":"","qei":[],"o":[{"z":"承保表","e":""},{"z":"敘文條款","e":""},{"z":"履行條款","e":""},{"z":"通用除外責任","e":""}],"a":0,"x":"承保表包含了有關合約的專屬資料。"},{"id":"Y2111","ch":2,"ref":"2.3.1(b)(ii)","t":0,"s":"y","q":"「承保表式」保單的敘文條款，相當可能包括以下哪項或哪些內容？","qi":[],"qe":"","qei":[],"o":[{"z":"被保險人的姓名或地址","e":""},{"z":"對投保書和聲明的介紹","e":""},{"z":"保險標的的完整 / 詳細描述","e":""},{"z":"上述所有各項","e":""}],"a":1,"x":"敘文條款會提述投保書及聲明，視它們為合約的一部分，及合約的基礎。"},{"id":"Y2114","ch":2,"ref":"2.3.1(a)","t":0,"s":"y","q":"「淺白英語」方式的保單最有可能出現於：","qi":[],"qe":"","qei":[],"o":[{"z":"個人性質的保險業務","e":""},{"z":"責任保險保單","e":""},{"z":"商業性質的保險業務","e":""},{"z":"強制性保險保單","e":""}],"a":0,"x":"「淺白英語」保單多數用於個人險種，而非商業風險。"},{"id":"Y2115","ch":2,"ref":"2.3.1(b)(iii)","t":0,"s":"y","q":"承保表式保單中之履行條款包括：","qi":[],"qe":"","qei":[],"o":[{"z":"保險條款","e":""},{"z":"列出所有除外條款","e":""},{"z":"代表保險人之簽署","e":""},{"z":"保單之生效及結束日期","e":""}],"a":0,"x":"承保表式保單中之履行條款包括保險條款。"},{"id":"Y2119","ch":2,"ref":"2.3.2(b)","t":0,"s":"y","q":"在一般保險中，以下哪項相當可能屬於常見的保單條件？","qi":["索償以仲裁形式進行的程序","索償的保序與權利","取消保單的權利","調整保費的條件"],"qe":"","qei":[],"o":[{"z":"(i)、(ii)","e":""},{"z":"(i)、(iii)、(iv)","e":""},{"z":"(ii)、(iii)、(iv)","e":""},{"z":"(i)、(ii)、(iii)、(iv)","e":""}],"a":3,"x":"所有各項都是常見的「保單條件」，"},{"id":"Y2120","ch":2,"ref":"2.3.2(a)","t":0,"s":"y","q":"在一般保險保單中，明訂條件及隱含條件的主要分別是：","qi":[],"qe":"","qei":[],"o":[{"z":"明訂條件可以是口頭的，而隱含條件是以書面訂明的","e":""},{"z":"明訂條件是以書面訂明的，而隱含條件是口頭的","e":""},{"z":"明訂條件會在保單中訂明，而隱含條件則不需要","e":""},{"z":"隱含條件會在保單中訂明，而明訂條件則不需要","e":""}],"a":2,"x":"在一般保險保單中，明訂條件及隱含條件的主要分別是明訂條件會在保單中訂明，而隱含條件則不需要。"},{"id":"Y2121","ch":2,"ref":"2.3.2(b)(vi)","t":0,"s":"y","q":"當保費是可調時，保單條件的提述：","qi":[],"qe":"","qei":[],"o":[{"z":"要保留足夠記錄以便保費調整","e":""},{"z":"保險人有責任提醒被保險人作出保費調整","e":""},{"z":"如保費沒有調整，保單便會被取消","e":""},{"z":"可調整保費的保單要以蓋章發出","e":""}],"a":0,"x":"如果保費因基於一些可變動的因素計算(例如工資或銷售額等)而屬臨時性質，便需有項保單條件要求被保險人保留足夠的記錄，以便計算精確的保費，作為於保單期滿時調整保費之用。"},{"id":"Y2123","ch":2,"ref":"2.3.2(b)","t":0,"s":"y","q":"在香港一般保險之中，以下哪項或哪些屬常見的保單條件？","qi":[],"qe":"","qei":[],"o":[{"z":"仲裁","e":""},{"z":"取消","e":""},{"z":"索償","e":""},{"z":"上述所有各項","e":""}],"a":3,"x":"所有各項都是常見的「保單條件」，"},{"id":"Y2124","ch":2,"ref":"2.3.2(a)","t":0,"s":"y","q":"以下哪項有關保險合約除外責任的說明是不正確？","qi":[],"qe":"","qei":[],"o":[{"z":"通用除外責任適用於特定風險","e":""},{"z":"通用除外責任適用於特定險種的所有保單","e":""},{"z":"業界除外責任適用於幾乎所有有關市場的保險人所簽發的保單","e":""},{"z":"所有除外責任必須列明於保單內","e":""}],"a":3,"x":"即使某些除外責任沒有在保單文件中出現，但總會存在著某些由法律隱含的附帶條件(意思是，應該被視為適用於任何保險合約)，例如欺詐這項除外責任。"},{"id":"Y2125","ch":2,"ref":"2.3.2(a)","t":0,"s":"y","q":"以下哪項對保單條件的說明是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"保單條件可以是明訂或隱含的","e":""},{"z":"明訂條件比隱含條款重要","e":""},{"z":"明訂條件是指實際出現在保單的條款","e":""},{"z":"隱含條件是適用的，然而不會出現在保單文件中","e":""}],"a":1,"x":"明訂條件不一定比隱含條款重要，"},{"id":"Y2129","ch":2,"ref":"2.3.2(a)","t":0,"s":"y","q":"以下哪項保單條件的說明是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"保單條件均包括明訂的及隱含的條件","e":""},{"z":"明訂的條件比隱含的條款更為重要","e":""},{"z":"明訂的條件是在保單中實際出現的條款","e":""},{"z":"隱含的條件是適用的，但不會出現於保單條件中","e":""}],"a":1,"x":"明訂的條件不一定比隱含的條款更為重要，"},{"id":"Y2130","ch":2,"ref":"2.3.2(a)","t":0,"s":"y","q":"一般保單中的除外責任：","qi":[],"qe":"","qei":[],"o":[{"z":"總是影響整份合約的","e":""},{"z":"總是影響合約的一個部份","e":""},{"z":"必須以書面明示於保單上","e":""},{"z":"大都印刊在保單上，但也可在法律上會有隱含的附帶條件","e":""}],"a":3,"x":"除外責任可以適用於整個合約(「通用除外責任」，或對指明的保單部分所提供的保險保障設置某些限制(「部分」的除外責任)。即使上述類型的除外責任沒有在保單文件中出現，但總會存在著某些由法律隱含的附帶條件(意思是，應該被視為適用於任何保險合約)。"},{"id":"Y2132","ch":2,"ref":"2.3.2(b)","t":0,"s":"y","q":"以下哪項是對保單的正確說明？","qi":[],"qe":"","qei":[],"o":[{"z":"隱含條款及明訂條款均不適用","e":""},{"z":"隱含條款是適用的，但不會於保單中列出","e":""},{"z":"明訂條款比隱含條款更為重要","e":""},{"z":"隱合條款及明訂條款會於保單中列出","e":""}],"a":1,"x":"隱含條款及明訂條款均適用。隱含條款不會於保單中列出。明訂條款不一定比隱含條款更為重要。"},{"id":"Y2133","ch":2,"ref":"2.3.2(b)","t":0,"s":"y","q":"以下哪項不是一般保險單的保單條件？","qi":[],"qe":"","qei":[],"o":[{"z":"仲裁","e":""},{"z":"取消","e":""},{"z":"可保利益","e":""},{"z":"索償","e":""}],"a":2,"x":"一些常見的「保單條件」有：(i) 索償或保險金要求(ii) 仲裁(iii) 取消"},{"id":"Y2134","ch":2,"ref":"2.3.2(b)","t":0,"s":"y","q":"以下哪項是常見的保單條件？","qi":[],"qe":"","qei":[],"o":[{"z":"仲裁","e":""},{"z":"索償","e":""},{"z":"取消","e":""},{"z":"以上所列各項","e":""}],"a":3,"x":"一些常見的「保單條件」有：(i) 索償或保險金要求(ii) 仲裁(iii) 取消"},{"id":"Y2137","ch":2,"ref":"2.3.3(c)","t":0,"s":"y","q":"以下哪項有關保單起賠額是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"有關數額會在每個索償個案中扣除","e":""},{"z":"以消除大額索償，支付全數小額索償","e":""},{"z":"經常出現於財產保險中","e":""},{"z":"以上所有都不是","e":""}],"a":2,"x":"起賠額的功能是排除小額索償，而只就達到或超逾該起賠額(視乎所用措詞而定)的損失作出足額賠償。這種條文過去往往出現在某些財產保險中，但現在通常寧可採用自負額／免賠額。"},{"id":"Y2151","ch":2,"ref":"","t":0,"s":"y","q":"以下哪些有關保險保證的陳述是正確？","qi":["違反保證會使保險合約變成可使無效","違反保險的效果是自動的","它們可以使被保險人作出某些行動(例如：設防盜警鐘)","它們可以使被保險人不得不作出某些行動"],"qe":"","qei":[],"o":[{"z":"(i)、(ii)","e":""},{"z":"(i)、(iii)、(iv)","e":""},{"z":"(i)、(ii)、(iii)","e":""},{"z":"(ii)、(iii)、(iv)","e":""}],"a":3,"x":"違反保證會自動產生後果。保證可以被視為一項被保險人對保險人所作出的、必須確實遵守的承諾。這項承諾可能是有所為或有所不為。由香港保險業聯會發出以供會員遵守的《承保商專業守則》，規定保險人只可於違反保證和損失之間存在著因果關係，或違反屬欺詐行為的情況下，利用該違反作為拒賠的理由。參考章節2.34 (a )"},{"id":"Y2152","ch":2,"ref":"2.3.4+O498(ii)","t":0,"s":"y","q":"有一種保單條款，如它們是真實的，只需要實質上正確，這是：","qi":[],"qe":"","qei":[],"o":[{"z":"陳述","e":""},{"z":"保證","e":""},{"z":"條件","e":""},{"z":"隱含條件","e":""}],"a":0,"x":"關於事實的陳述如屬實質上正確(即是說，如審慎的保險人會視所陳述的與實際上正確的事實之間的區別為不重要)，即構成真實的陳述。"},{"id":"Y2153","ch":2,"ref":"2.3.4(a)","t":0,"s":"y","q":"以下哪項是指被保險人作出一項絶對允諾，而涉及的允諾可以是採取或避免採取一些行動？","qi":[],"qe":"","qei":[],"o":[{"z":"條款","e":""},{"z":"保證","e":""},{"z":"條件","e":""},{"z":"陳述","e":""}],"a":1,"x":"在保險中(而非在合約法中)，Warranty一詞翻成「保證」，可以被視為一項被保險人對保險人所作出的，必須確實遵守的承諾。這項承諾可能是有所為或有所不為。"},{"id":"Y2155","ch":2,"ref":"2.3.4(a)","t":0,"s":"y","q":"以下哪項有關保險保證的描述是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"保證是一項絶對的承諾","e":""},{"z":"保證大多數情況是明示的，雖然隱含的情況也是可能的","e":""},{"z":"技術上，違反保證可推翻保險合約","e":""},{"z":"若保險人豁免違反便屬違法","e":""}],"a":3,"x":"保證的承諾是絶對的，意思是說，如果被保險人違反了保證，保單責任便從違反日開始自動解除。保證一般是明示的。技術上，隱含保證(自動生效的、非書面的)也可以存在。由香港保險業聯會發出以供會員遵守的《承保商專業守則》，規定保險人只可於違反保證和損失之間存在著因果關係，或違反屬欺詐行為的情況下，利用該違反作為拒賠的理由。"},{"id":"Y2156","ch":2,"ref":"2.3.4(a)","t":0,"s":"y","q":"某一製品公司的火險保單保障了建築物和物件，保險人的理賠師在火災肇事現場發現了製品的殘損物，理賠師向被保險人指出禁止露天放置製品的保證。請問理賠師的發現產生了以下哪項相關問題？後果如何？","qi":[],"qe":"","qei":[],"o":[{"z":"該違反與火災發生有關嗎？根據《優良保險慣例》，假若該違反和損失存在著因果關係才會引用該違反","e":""},{"z":"保險人有提醒被保險人該有違反嗎？若否，保險人便不能引用該違反","e":""},{"z":"該違反是故意嗎？法律是容許疏忽性違反的","e":""},{"z":"建築物有損毀嗎？該違反只適用於建築物有關的損毀","e":""}],"a":0,"x":"由香港保險業聯會發出以供會員遵守的《承保商專業守則》，規定保險人只可於違反保證和損失之間存在著因果關係，或違反屬欺詐行為的情況下，利用該違反作為拒賠的理由。"},{"id":"Y2160","ch":2,"ref":"2.3.4(b)","t":0,"s":"y","q":"就香港簽發的標準火險合約而言，含有的「失實陳述條件」條文，它是屬於：","qi":[],"qe":"","qei":[],"o":[{"z":"保證","e":""},{"z":"責任出現前的先決條件","e":""},{"z":"合約生效前的先決條件","e":""},{"z":"合約生效後的條件","e":""}],"a":2,"x":"合約生效前的先決條件是指合約生效之前必須履行的條款，例如失實陳述條件。"},{"id":"Y2165","ch":2,"ref":"","t":0,"s":"y","q":"以下哪項有關一般保險中的保證的描述是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"違反保證的話，保險人可以推翻保保險合約","e":""},{"z":"保證不必一定是明示的","e":""},{"z":"保證可以是書面的、口頭的或是混合式的保證","e":""},{"z":"法律規定有關保證必須存在因果關係才能依據違反保證拒絶賠付","e":""}],"a":1,"x":"技術上，隱含保證(自動生效的、非書面的)也可以存在。由香港保險業聯會發出以供會員遵守的《承保商專業守則》，規定保險人只可於違反保證和損失之間存在著因果關係，或違反屬欺詐行為的情況下，利用該違反作為拒賠的理由。參考章節2.34 (a ) (2 )"},{"id":"Y2166","ch":2,"ref":"2.3.4(a)(iv)","t":0,"s":"y","q":"以下哪項對保險中的保證的陳述是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"它不大可能以明示表達","e":""},{"z":"違反保證可導致保險人推翻合約","e":""},{"z":"它可以是明示保證、隱含保證或中性保證","e":""},{"z":"法律規定有關保證必須存在因果關係才能依據違反保證拒絶賠付","e":""}],"a":3,"x":"保證一般屬於明示保證。它們可能是標準的(即適用於同險種的所有保單)，或由核保人根據特定風險而加施加的。技術上，隱含保證(自動生效的、非書面的)也可以存在。由香港保險業聯會發出以供會員遵守的《承保商專業守則》，規定保險人只可於違反保證和損失之間存在著因果關係，或違反屬欺詐行為的情況下，利用該違反作為拒賠的理由。"},{"id":"Y2168","ch":2,"ref":"2.3.5","t":0,"s":"y","q":"香港簽發的一般保單的「除外責任」:","qi":[],"qe":"","qei":[],"o":[{"z":"它總是影響保單的所有部份","e":""},{"z":"它總是影響保單的一個部份","e":""},{"z":"它總是在保單中明示的","e":""},{"z":"它可以是根據法律而隱含的","e":""}],"a":3,"x":"除外責任可以適用於整個合約「通用除外責任」，或僅從個別保單部分剔除部分保險保障「部分的除外責任」。即使除外責任沒有在保單文件中出現，但總會存在著某些由法律隱含的附帶條件(意思是，應該被視為適用於任何保險合約)，例如欺詐這項附除外責任。"},{"id":"Y2170","ch":2,"ref":"2.3.5","t":0,"s":"y","q":"除外責任的種類包括：","qi":[],"qe":"","qei":[],"o":[{"z":"通用除外責任","e":""},{"z":"特定除外責任","e":""},{"z":"業界除外責任","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"除外責任有以下幾個種類：通用、特定及業界除外責任。"},{"id":"Y2172","ch":2,"ref":"2.3.5(d)(ii)","t":0,"s":"y","q":"除了明示的除外責任，保險合約還受到若干非書面的限制，這種限制是基於普通法的法律原則，一些違反社會標準的合約不應該被執行，這稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"公共政策","e":""},{"z":"道德標準責任","e":""},{"z":"特定除外責任","e":""},{"z":"通用除外責任","e":""}],"a":0,"x":"公共政策是指有時，法院不容計作某些事情，理由是它們有違公共政策。在保險方面而言，這意味著社會(透過法官的判決)傳達了一個訊息，表明在某些情況下，應該撇開特定保險的合約方的共同意圖而不為他們執行該合約或當中某些條文。"},{"id":"Y2174","ch":2,"ref":"2.3.5(d)","t":0,"s":"y","q":"以下哪項有關「公共政策」概念的陳述是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"它是指只對政府風險提供保障","e":""},{"z":"在指明的情況下有關的保險不應有效","e":""},{"z":"在指明的情況下，社會表明保險不應對該情況提供保障","e":""},{"z":"以上所有各項","e":""}],"a":0,"x":"公共政策是指有時，法院不容許作某些事情，理由是它們有違公共政策。在保險方面而言，這意味著社會(透過法官的判決)傳達了一個訊息，表明在某些情況下，應該撇開特定保險的合約方的共同意圖而不為他們執行該合約或當中某些條文。"},{"id":"Y2175","ch":2,"ref":"2.4(d)","t":0,"s":"y","q":"以下哪項是有關「失效」保單的正確描述？","qi":[],"qe":"","qei":[],"o":[{"z":"沒有續保的保單","e":""},{"z":"由保險人取消的保單","e":""},{"z":"由被保險人取消的保單","e":""},{"z":"已由新單取代的舊保單","e":""}],"a":0,"x":"如果保險人不向被保險人提醒續保日期漸近，被保險人也沒有採取任何行動，那麼保單就會在期滿時失效。"},{"id":"Y2182","ch":2,"ref":"2.4.2","t":0,"s":"y","q":"於通常取消條款下：","qi":[],"qe":"","qei":[],"o":[{"z":"保險人有權取消保單","e":""},{"z":"很多情況下，被保險人有權取消保單","e":""},{"z":"如保單被取消，可退還部份保費","e":""},{"z":"以上各項皆正確","e":""}],"a":3,"x":"所有各項陳述都是正確的，"},{"id":"Y2184","ch":2,"ref":"2.4.2","t":0,"s":"y","q":"以下哪項有關取消一份一般保險合約的陳述是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"法律賦予雙方取消的權利","e":""},{"z":"無人有自動權利去取消任何合約","e":""},{"z":"總是給予保險人取消的權利","e":""},{"z":"總是給予雙方取消的權力，只要作出十四天通知便可取消","e":""}],"a":1,"x":"沒有人自動有權取消(或註銷)包括保險合約在內的任何合約。在某些情況下，法律容許或要求中止某個合約。在其他情況下，除非合約條款明確地允許單方面於期滿前取消合約，否則須經合約意雙方同意方可。"},{"id":"Y2185","ch":2,"ref":"2.4.2","t":0,"s":"y","q":"以下哪項有關一般保險保單的取消條件是正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"不能使用於強制性保險中","e":""},{"z":"總是賦予雙方取消的權力","e":""},{"z":"是不必要的，因為取消的權力存在於普通法中","e":""},{"z":"若保險人取消保單，通常按比例退還保費","e":""}],"a":3,"x":"取消條款(如存在的話) 總是允許保險人中止保險合約，但必須以規定方式通知被保險人(比如 7天前以掛號郵件方式，送交被保險人的最後為人所知的地址)，並按比例退保費。"},{"id":"Y2186","ch":2,"ref":"","t":0,"s":"y","q":"客人買了一份保單，在保障生效後 90 日保費後取消，保費為每年$20,000。如果有取消條款並且按比例退款，保險公司應該要退回多保費給客人？","qi":[],"qe":"","qei":[],"o":[{"z":"$1506.85","e":""},{"z":"$4931.51","e":""},{"z":"$15068.49","e":""},{"z":"$49315.10","e":""}],"a":2,"x":"每年保費為 $20000 已經過了 90 日因此已經使用的保費是 $20000*90/365=$4931.51 由於已經交了保費$20000 而使用了 $4931.51，因此該退還的保費為 $15068.49。參考章節2.42"},{"id":"Y2188","ch":2,"ref":"2.4.2","t":0,"s":"y","q":"一份以標準條款簽發的人身意外保險，取消是：","qi":[],"qe":"","qei":[],"o":[{"z":"違法的","e":""},{"z":"法律禁止的","e":""},{"z":"保單條款禁止的","e":""},{"z":"可能的","e":""}],"a":3,"x":"在實務中，大多數一般保險單都設有取消條款(或取消條件)。保險人和被保險人均具有取消權。"},{"id":"Y2189","ch":2,"ref":"2.4.2(b)","t":0,"s":"y","q":"短期保費退款通常適用於：","qi":[],"qe":"","qei":[],"o":[{"z":"保單失效","e":""},{"z":"保險人取消合約","e":""},{"z":"被保險人取消合約","e":""},{"z":"保險人清盤","e":""}],"a":2,"x":"取消條款通常也允許被保險人取消保險合約，所須手續是發出立即生效或比如 7天的取消通知書，所得退款或是短期保費退款，或是比例保費退款，視乎保單措辭而定。"},{"id":"Y2191","ch":2,"ref":"","t":0,"s":"y","q":"在一般保險保單中，「時間起賠額］一般是指:","qi":[],"qe":"","qei":[],"o":[{"z":"需要在指定的期限內支付保費","e":""},{"z":"保險人需要在指定的期限內结清索償","e":""},{"z":"在指定的期限內不得提出索償","e":""},{"z":"殘疾、營業中斷需在超過指定的期限之後，才可獲得賠償","e":""}],"a":3,"x":"參考章節: 2.3.3(c)"},{"id":"Y2192","ch":2,"ref":"","t":0,"s":"y","q":"以下哪項有關暫保單的描述是正確的?","qi":[],"qe":"","qei":[],"o":[{"z":"確認保險已存在","e":""},{"z":"另需要簽發一張保單","e":""},{"z":"可以設有取消保單的條款","e":""},{"z":"上述所有各項","e":""}],"a":3,"x":"參考章節: 2.2.3(a)"},{"id":"Y2193","ch":2,"ref":"","t":0,"s":"y","q":"幾乎所有一般保險的投保書均包含一項聲明，內容是所提供的資料將成為要訂立合約的基礎。這項一般稱為「合約基礎條款」","qi":[],"qe":"","qei":[],"o":[{"z":"通常被視為一項的保險保證","e":""},{"z":"確認事實的存在","e":""},{"z":"導致相關合約有效性","e":""},{"z":"上述所有各項","e":""}],"a":3,"x":"參考章節: 2.2.2"},{"id":"Y2194","ch":2,"ref":"","t":0,"s":"y","q":"以下哪項對於取消條款的描述是正確的?(i) 事實上。很多一般保險保單都設有取消條款","qi":[],"qe":"","qei":[],"o":[{"z":"i,ii.iii","e":""},{"z":"i,ii.iv","e":""},{"z":"i,iii","e":""},{"z":"ii,iii.iv","e":""}],"a":1,"x":"參考章節: 2.4.2"},{"id":"Y2195","ch":2,"ref":"","t":0,"s":"y","q":"何時需要填寫申請表?","qi":[],"qe":"","qei":[],"o":[{"z":"索償結清時","e":""},{"z":"報告損失時","e":""},{"z":"敲定保單條款後","e":""},{"z":"投保申請時","e":""}],"a":3,"x":"參考章節: 2.1(a)"},{"id":"Y2196","ch":2,"ref":"","t":0,"s":"y","q":"以下哪項關於暫保單是正確的?","qi":[],"qe":"","qei":[],"o":[{"z":"是一份永久的文件，而非保單","e":""},{"z":"是保險人用作內部的記錄","e":""},{"z":"是確認保險已存在的證明","e":""},{"z":"為了權力機構而發出的強制性證明","e":""}],"a":2,"x":"參考章節: 2.2.3(a)"},{"id":"Y2197","ch":2,"ref":"","t":0,"s":"y","q":"以下哪項有關保險憑證是正確的 ?","qi":[],"qe":"","qei":[],"o":[{"z":"它是暫時性的，會被保單取代","e":""},{"z":"它詳細列明保障的資料","e":""},{"z":"它是強制性保險的證明","e":""},{"z":"上述所有各項","e":""}],"a":2,"x":"參考章節: 2.2.3(c)"},{"id":"Y2198","ch":2,"ref":"","t":0,"s":"y","q":"以下哪計劃在支付無法從相關僱主或保險人哪裏得到應有的因工傷亡補償和損害賠償的受傷僱員本人或身故僱員的家人?","qi":[],"qe":"","qei":[],"o":[{"z":"僱員傷亡彌償計劃","e":""},{"z":"僱員傷亡計劃","e":""},{"z":"僱員補償計劃","e":""},{"z":"僱員補償援助計劃","e":""}],"a":3,"x":"參考章節: 2.2.5(b)"},{"id":"Y2199","ch":2,"ref":"","t":0,"s":"y","q":"以下哪項關於一份保險保單是不正確的描述?","qi":[],"qe":"","qei":[],"o":[{"z":"保單是保險合約存在的證據","e":""},{"z":"技術上，就算沒有保單，合約仍然存在","e":""},{"z":"保單一經簽發，便取代了暫保單","e":""},{"z":"另一名稱為「暫保單」","e":""}],"a":3,"x":"參考章節: 2.2.3(b)"},{"id":"Y2200","ch":2,"ref":"","t":0,"s":"y","q":"保單的措詞是不受規管的，然而，在標準的保單中，幾乎業界的保險人也會採用，尤其在財產保險保單。以下哪些會被採用?","qi":[],"qe":"","qei":[],"o":[{"z":"核武器材料","e":""},{"z":"輻射風險","e":""},{"z":"戰爭","e":""},{"z":"上述各項","e":""}],"a":3,"x":"參考章節: 2.3.5(c)"},{"id":"Y3009","ch":3,"ref":"3.1.1","t":0,"s":"y","q":"以下哪項是有效保險索償準則？","qi":[],"qe":"","qei":[],"o":[{"z":"一項損失的發生必須是由一項受保危險導致的","e":""},{"z":"有關保單必須是有效的","e":""},{"z":"受保人一方不得有欺詐行為","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"所有各項都是對有效索償的要求，"},{"id":"Y3011","ch":3,"ref":"3.1.1","t":0,"s":"y","q":"一個有效的索償要符合下列哪項的要求？","qi":[],"qe":"","qei":[],"o":[{"z":"個別保險人","e":""},{"z":"保險業","e":""},{"z":"政府","e":""},{"z":"以下各項皆是","e":""}],"a":3,"x":"需要滿足所有要求，"},{"id":"Y3016","ch":3,"ref":"3.1.3(f)","t":0,"s":"y","q":"下列哪項或哪些保單條件有別於普通法的觀點？","qi":[],"qe":"","qei":[],"o":[{"z":"代位權","e":""},{"z":"分擔","e":""},{"z":"比例分攤","e":""},{"z":"以上各項皆是","e":""}],"a":3,"x":"所有各項都有別於普通法的觀點，"},{"id":"Y3018","ch":3,"ref":"3.1.3(c)","t":0,"s":"y","q":"若被保險人延誤報告可能發生的索償，這是違反保單條款的，但有一種索償是可能凌駕於保險人就這個理由而拒絶索償，這是：","qi":[],"qe":"","qei":[],"o":[{"z":"人身意外保險","e":""},{"z":"關於被保險人財產的保險","e":""},{"z":"關於強制性保險保障的範圍","e":""},{"z":"以上所有各項","e":""}],"a":2,"x":"在強制性業務類別中，延遅報告意外事故不能讓保險人拒絶賠付有效的第三者索償。"},{"id":"Y3020","ch":3,"ref":"3.1.4","t":0,"s":"y","q":"當有索償發生，以下哪項屬於受保人應負上的責任？","qi":[],"qe":"","qei":[],"o":[{"z":"保存受損害財物","e":""},{"z":"提供索償的數額","e":""},{"z":"披露任何其他保險","e":""},{"z":"以上各項皆正確","e":""}],"a":3,"x":"保單對被保險人出險後的責任所作的要求包求：(a) 對索償或保險金要求的有效性提出合理證明(包括索償或要求的金額) (b) 保存受損財物(c) 披露任何其他保險"},{"id":"Y3021","ch":3,"ref":"3.1.5(d)","t":0,"s":"y","q":"下列哪項有關的索償開支需要被保險人支付？","qi":[],"qe":"","qei":[],"o":[{"z":"喪失能力(個人意外) 索償的醫療報告","e":""},{"z":"僱員補償業務有關的報告","e":""},{"z":"驗屍報告","e":""},{"z":"以上所有各項","e":""}],"a":0,"x":"提出喪失能力(人身意外) 的保險金要求，須出具醫療報告，所需費用由被保險人負責。"},{"id":"Y3024","ch":3,"ref":"3.1.5","t":0,"s":"y","q":"關於索償金額的證明文件，以下哪項陳述是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"是被保險人的責任","e":""},{"z":"有關的費用是由被保險人支付的","e":""},{"z":"對於任何類型的索償，保險人會堅持取得證明文件","e":""},{"z":"收據對於商業損失來說是有力的證明","e":""}],"a":2,"x":"證明文件有多種形式。提供證明文件可能是被保險人的責任，也可能是保險人的責任(包括支付所需費用)。要求出具收據以證明商業上的損失屬於普遍和合理的做法。"},{"id":"Y3031","ch":3,"ref":"3.1.6(d)","t":0,"s":"y","q":"有些保險涉及提名理賠代理人，以下哪一種是有關保險？","qi":[],"qe":"","qei":[],"o":[{"z":"汽車保險","e":""},{"z":"水險貨物保險","e":""},{"z":"人身意外保險","e":""},{"z":"僱員補償保險","e":""}],"a":1,"x":"理賠代理人是指保險人在海上貨物保單或保險憑證上，指名獲授權商號在該保險人沒有設置辦事處的地區，為其處理賠案。"},{"id":"Y3034","ch":3,"ref":"3.1.6(a)&(b)","t":0,"s":"y","q":"處理水險索償的檢驗人，與火險索償中的理賠師比較時：","qi":[],"qe":"","qei":[],"o":[{"z":"檢驗人往往是於初期由被保險人委任","e":""},{"z":"理賠師是由被保險人委任","e":""},{"z":"檢驗人的委任費用都由保險人支付","e":""},{"z":"保險人無需支付檢驗人的費用","e":""}],"a":0,"x":"水險的檢驗人與非水險的理賠師之間的最大區別在於後者通常由保險人聘請，而水險的檢驗人是由被保險人聘請的，並且檢驗費用至少是先由被保險人支付的。"},{"id":"Y3035","ch":3,"ref":"3.1.6(b)(ii)","t":0,"s":"y","q":"聘用於水險貨物索償的檢驗人，與聘用於火險索償的理賠人比較時：","qi":[],"qe":"","qei":[],"o":[{"z":"檢驗人起初由保險人委任","e":""},{"z":"水險的檢驗人必須由被保險人委任","e":""},{"z":"無論任何時間保險人都不需要向檢驗人支付費用","e":""},{"z":"理賠人由被保險人委任和支付費用","e":""}],"a":1,"x":"水險的檢驗人是由被保險人聘請的，並且檢驗費用至少是先由被保險人支付的。"},{"id":"Y3036","ch":3,"ref":"3.1.6(f)","t":0,"s":"y","q":"以下哪項有關海損理算師的陳述是不真實的？","qi":[],"qe":"","qei":[],"o":[{"z":"他們專門從事共同海損的理賠","e":""},{"z":"必須計算共同海損的開支後，才需要他們協助","e":""},{"z":"他們需要認識各個不同國家的海事法律知識","e":""},{"z":"共同海損理賠所涉及的處埋時間一般需要數年的時間","e":""}],"a":1,"x":"海損理算師出現於水險的理賠中。更確切地說，他們專門處理損共同海損的賠案。為共同海損進行理算工作時，深入的法律知識包括國際海事法及各國本身的法律可能是關鍵的因素。為共同海損收款和分攤，一般需時數年，而非幾個星期或幾個月。"},{"id":"Y3037","ch":3,"ref":"3.1.6(b)","t":0,"s":"y","q":"以下哪項有關理賠師的描述是不正確的？","qi":[],"qe":"","qei":[],"o":[{"z":"他們是由保險人騁請的","e":""},{"z":"他們的職責是就賠償作出建議","e":""},{"z":"雖然由保險人騁請，他們郤是獨立的專家","e":""},{"z":"他們的費用由香港保險業協會規管","e":""}],"a":3,"x":"理賠師的費用及報酬可按表計算，視乎同意賠償的金額而定，另作商議也行。"},{"id":"Y3040","ch":3,"ref":"3.2.1(a)","t":0,"s":"y","q":"財產保險中，根據保單條款，誰可選撐以現金或以其他方法結清索償？","qi":[],"qe":"","qei":[],"o":[{"z":"保險人","e":""},{"z":"被保險人","e":""},{"z":"仲裁人和公斷人","e":""},{"z":"保險中介人","e":""}],"a":0,"x":"在財產保險(必然是彌償保險)的保單措詞中，是容許現金以外的結清方式的，但選擇權歸保險人。"},{"id":"Y3041","ch":3,"ref":"3.2.1(a)","t":0,"s":"y","q":"以下哪項是以現金支付唯一的結清方法？","qi":[],"qe":"","qei":[],"o":[{"z":"汽車損毀","e":""},{"z":"個人意外","e":""},{"z":"財物損失","e":""},{"z":"以上各項皆是","e":""}],"a":1,"x":"某些情況下現金支付是唯一的方式(例如向被保險人提供人身意外保險利益)。"},{"id":"Y3044","ch":3,"ref":"3.2.1","t":0,"s":"y","q":"以下哪項適合向被保險人提供權益非損害的結清方式？","qi":[],"qe":"","qei":[],"o":[{"z":"支付現金","e":""},{"z":"直接支付維修費用","e":""},{"z":"更換","e":""},{"z":"恢復原狀","e":""}],"a":0,"x":"直到目前為止，支付現金(總是使用支票或透過銀行轉賬)是一種最為普遍的結清索償或保險要求方式。事實上，某些情況下這是唯一的方式(例如向被保險人提供人身意外保險利益)。"},{"id":"Y3048","ch":3,"ref":"3.2.1","t":0,"s":"y","q":"若一份由保險人承擔彌償保險，結清時可以有不同的方法。這做法適合以下哪項或哪些保險？","qi":[],"qe":"","qei":[],"o":[{"z":"火災保險","e":""},{"z":"盜竊保險","e":""},{"z":"汽車保險(本身的損毀)","e":""},{"z":"以上各項","e":""}],"a":3,"x":"在沒有具體保單條款的情況下，採用除金錢以外的方式進行結清必需雙方同意。然而，在財產保險(必然是彌償保險) 的保單措詞中，是容許現金以外的結清方式的，但選擇權歸保險人。"},{"id":"Y3050","ch":3,"ref":"3.2.2","t":0,"s":"y","q":"有一種解決糾紛的方法，當中涉及法庭聽證和仲裁等極為正式的程序，稱為：","qi":[],"qe":"","qei":[],"o":[{"z":"訴訟","e":""},{"z":"糾紛","e":""},{"z":"仲裁","e":""},{"z":"談判","e":""}],"a":0,"x":"有一種解決糾紛的方法，當中涉及法庭聽證和仲裁等極為正式的程序，稱為訴訟。"},{"id":"Y3052","ch":3,"ref":"3.2.2","t":0,"s":"y","q":"以下哪項並不是仲裁的法律特點？","qi":[],"qe":"","qei":[],"o":[{"z":"它的形式及程序比訴訟簡單","e":""},{"z":"它通常只適用於索償金額多少","e":""},{"z":"它對第三者沒有約束力","e":""},{"z":"它對於是否應承擔責任也適用","e":""}],"a":3,"x":"仲裁條款通常只適用於涉及保險人應付金額的糾紛，並非有沒有責任這種問題。"},{"id":"Y3053","ch":3,"ref":"3.2.2","t":0,"s":"y","q":"以下哪項有關仲裁的陳述是正確的？","qi":["仲裁往往比移師法庭簡單","仲裁只能判定有關的金額","對第三者沒有約束力","所有有關保險索償的責任都只能靠仲裁判"],"qe":"","qei":[],"o":[{"z":"只有(i)、(ii)","e":""},{"z":"只有(iii)、(iv)","e":""},{"z":"只有(i)、(ii)、(iii)","e":""},{"z":"(i)、(ii)、(iii)、(iv)","e":""}],"a":2,"x":"仲裁比起訴訟不那麼正式，其只能判定有關的金額，且對第三者沒有約束力。"},{"id":"Y3054","ch":3,"ref":"3.2.2","t":0,"s":"y","q":"為了解決糾紛，下列哪項不是仲裁條件的特點？","qi":[],"qe":"","qei":[],"o":[{"z":"對第三者沒有約束力","e":""},{"z":"涉及保險人應付金額糾紛","e":""},{"z":"案件不在法庭進行聽證","e":""},{"z":"一般發生在責任保單","e":""}],"a":3,"x":"仲裁對第三者沒有約束力，一般涉及保險人應付金額糾紛。雖然仲裁以正式的方式進行，然而案件不在法庭進行聽證。仲裁條件一般不會發生在責任保單。"},{"id":"Y3062","ch":3,"ref":"3.2.2(a)","t":0,"s":"y","q":"在一般保險中，並不是所有保險都適用於仲裁條款。以下哪項保險將適用於仲裁條款？","qi":[],"qe":"","qei":[],"o":[{"z":"火險","e":""},{"z":"產品責任保險","e":""},{"z":"人身意外保險","e":""},{"z":"以上各項皆適用於仲裁條款","e":""}],"a":0,"x":"仲裁條款不可能出現在責任保單(索償人通常是第三者) 和人身意外保單中。"},{"id":"Y3072","ch":3,"ref":"","t":0,"s":"y","q":"以下哪項有關仲裁條款屬於正確的描述?","qi":["任何由該保單產生的爭議，必須經過仲裁","仲裁必須進行正式的聽證","必須經由符合法律資格的人來代表當事人各方或決定有關事項"],"qe":"","qei":[],"o":[{"z":"i","e":""},{"z":"i.ii","e":""},{"z":"i,iii","e":""},{"z":"ii,iii","e":""}],"a":0,"x":"參考章節: 3.2.2a"},{"id":"Y3073","ch":3,"ref":"","t":0,"s":"y","q":"以下是有效索償的結清方法，除了:","qi":[],"qe":"","qei":[],"o":[{"z":"更換","e":""},{"z":"恢復原狀","e":""},{"z":"直接支付維修費用","e":""},{"z":"通融索償賠付","e":""}],"a":3,"x":"參考章節: 3.2.1"},{"id":"Y3074","ch":3,"ref":"","t":0,"s":"y","q":"以下哪三項有關仲裁是正確的?","qi":["第三者不受仲裁約束","某些類别可以與數額有關","所有仲裁必須委任一位公斷人","技術上，訴訟可以質疑仲裁的決定"],"qe":"","qei":[],"o":[{"z":"(i),(ii).(iii)","e":""},{"z":"(i),(ii),(iv)","e":""},{"z":"(i),(iii).(iv)","e":""},{"z":"(ii),(iii),(iv)","e":""}],"a":1,"x":"參考章節: 3.2.2a"},{"id":"Y3075","ch":3,"ref":"","t":0,"s":"y","q":"以下哪項有關替代性爭議解決方式條件(ADR)的描述是正確的?","qi":["所有經過調解但未能解決的爭議必須通過仲裁解決","有些保單會摒棄「仲裁條件」而載有一項名為「替代性爭議解決方式條件」","是由調解員協助爭議各方達成各方接受．而非由調解員施加的和解協議的靈活過程"],"qe":"","qei":[],"o":[{"z":"只有(i)","e":""},{"z":"(i),(ii),(iv)","e":""},{"z":"(ii),(iii)","e":""},{"z":"(i),(ii),(iii)卷二一般保險模擬試題","e":""}],"a":3,"x":"參考章節: 3.2.2b"},{"id":"Y4003","ch":4,"ref":"4.1.1(a)","t":0,"s":"y","q":"在客戶服務的角度中，「持續性」的意思通常是：","qi":[],"qe":"","qei":[],"o":[{"z":"盈利性","e":""},{"z":"員工離職","e":""},{"z":"留住生意","e":""},{"z":"保險中介人的支援","e":""}],"a":2,"x":"在客戶服務的角度中，「持續性」的意思通常是留住生意。"},{"id":"Y4008","ch":4,"ref":"4.2","t":0,"s":"y","q":"下列哪些 / 哪項最能形容保險公司的的服務方針(宣告原則)？","qi":[],"qe":"","qei":[],"o":[{"z":"越來越多公司用書面形式來明確表示公司的原則及業務方針","e":""},{"z":"很多香港公司已經公開並印製服務方針，這種做法將越來越普遍","e":""},{"z":"公司在設計宣告原則時，當然都有自己的表達方法","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"越來越多的公司認識到，書面說明公司的原則及經營手法，實際上具有非常重要的作用。很多香港公司已經製作了這些公開的宣告。幾乎可以肯定，這種做法將越來越普遍。每家公司在設計這些文件時，當然都有自己的表達風格和內容。"},{"id":"Y4009","ch":4,"ref":"4.2","t":0,"s":"y","q":"一種對於保險人意願及服務標準的公開宣言，該聲明較可能包括：","qi":[],"qe":"","qei":[],"o":[{"z":"一項對素質及服務承諾的保證","e":""},{"z":"一項不會拒絶任何索償的保證","e":""},{"z":"一種稱為市場提供最優惠保費的保證","e":""},{"z":"涉及商業操守和實務方法的特定資訊","e":""}],"a":0,"x":"很多香港公司已經製作了這些公開的宣告。這些都是為保險中介人及保單持有人而設立的，內容相當可能包括對素質及服務所承擔的義務。"},{"id":"Y4010","ch":4,"ref":"4.3","t":0,"s":"y","q":"保險人的宣告通常包括一些對被保險人和保險中介人的提醒。這些提醒可能包括：","qi":[],"qe":"","qei":[],"o":[{"z":"按時繳納保費的需要","e":""},{"z":"披露資料的最高誠信要求","e":""},{"z":"保險代理人受到實務守則的約束","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"政策的公開聲明相當可能提醒被保險人和保險中介人被要求履行的義務，其中包括：(1)披露的要求：最高誠信責任；(2) 支付保費：按持支付保費的義務，以及(對保險中介人而言)任何允許的信貨安排；(3) 實務守則：保險代理人受到實務守則的約束。"},{"id":"Y4011","ch":4,"ref":"4.3","t":0,"s":"y","q":"對於不同的保險人來說，一套具有代表性的予以宣告的服務標準相當可能包括以下哪項或哪些？","qi":[],"qe":"","qei":[],"o":[{"z":"辦別顧客的需要","e":""},{"z":"一種儘快提供文件的承諾","e":""},{"z":"一種對所提供資料保密的保證","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"一套具有代表性的予以宣告的服務標準相當可能包括所有各項，"},{"id":"Y4014","ch":4,"ref":"4.3.1","t":0,"s":"y","q":"「透明度」是客戶服務的重要標準。這是指：","qi":[],"qe":"","qei":[],"o":[{"z":"誠實地填寫政府表格","e":""},{"z":"易於明白的保單條文","e":""},{"z":"與客戶交易缺乏保密","e":""},{"z":"保險人的操守及處事方式都公開交代","e":""}],"a":3,"x":"「透明度」是現代社會中一個很重要的詞，其意思是指操守及做法都應公開交代，並且不論什麼時候都要符合法律及道德的規範。"},{"id":"Y4018","ch":4,"ref":"4.4(g)","t":0,"s":"y","q":"根據《保險業條例》的相關條文而設定的《保險業(持牌保險經紀公司的財務及其他要求) 規則》涉及：","qi":["資本及淨資產","專業彌償保險","客戶帳戶","備存妥善的簿冊及帳目"],"qe":"","qei":[],"o":[{"z":"只有(i)","e":""},{"z":"(i)、(ii)","e":""},{"z":"(i)、(ii)、(iv)","e":""},{"z":"(i)、(ii)、(iii)、(iv)","e":""}],"a":3,"x":"根據《保險業條例》的相關條文而設定的《《保險業(持牌保險經紀公司的財務及其他要求) 規則》涉及所有各項。(i) 資本及淨資產(ii) 專業彌償保險(iii) 客戶帳戶(iv) 備存妥善的簿冊及帳目(v)會計披露"},{"id":"Y4020","ch":4,"ref":"4.4(c)","t":0,"s":"y","q":"以下哪項不屬於由保險業聯會制定的《承保商專業守則》所處理的事宜？","qi":[],"qe":"","qei":[],"o":[{"z":"償付能力規定","e":""},{"z":"保險代理人的管理","e":""},{"z":"索償","e":""},{"z":"提供建議及銷售慣例","e":""}],"a":0,"x":"償付能力的規定是《保險業條例》(第 41 章) 對保險公司作出的嚴格要求。"},{"id":"Y4024","ch":4,"ref":"4.4(c)","t":0,"s":"y","q":"《承保商專業守則》包括優良保險慣例的部份。這部份處理以下哪類的事情？","qi":[],"qe":"","qei":[],"o":[{"z":"提供建議及銷售慣例","e":""},{"z":"索償","e":""},{"z":"保險代理人的管理","e":""},{"z":"以上所有各項","e":""}],"a":3,"x":"守則為保險人就多個範疇提供標準，這包括：● 提供建議及銷售慣列 ● 索償 ● 保險代理人的管理 ●僱員管理 ● 保險人違規行為 ● 查詢、投訴及糾紛"},{"id":"Y4025","ch":4,"ref":"4.4","t":0,"s":"y","q":"以下哪些人會對保險人的顧客服務進行監察？","qi":["行業組織","保單持有人及公眾","保險業監管機構","保險人本身(內部監察)"],"qe":"","qei":[],"o":[{"z":"(i)、(ii)","e":""},{"z":"(i)、(ii)、(iii)","e":""},{"z":"(ii)、(iii)、(iv)","e":""},{"z":"(i)、(ii)、(iii)、(iv)","e":""}],"a":3,"x":"在個別公司的政策陳述中所表達出的承諾都由內部審計人員監察。這裏不是說公司在此事項上有絶對的控制，否則便會過於主觀及備受批評。履行公司承諾，或任何由行業組織或保險業監管機構施加的責任的情況，實際上或潛在地受以下各方的監察：(a) 保單持有人及公眾；(b) 行業組織；(c)保險業監管機構。"},{"id":"Y4027","ch":4,"ref":"4.4(f)","t":0,"s":"y","q":"《持牌保險代理人操守守則》是保監局根據以下哪項或哪些條文來核准？","qi":[],"qe":"","qei":[],"o":[{"z":"保險代理的最限度規定","e":""},{"z":"《承保商專業守則》","e":""},{"z":"《保險業條例》","e":""},{"z":"以上各項","e":""}],"a":2,"x":"《持牌保險代理人操守守則》是保監局根據《保險業條例》的相關條文而制定。"},{ };

const BYID = {};
POOL.forEach(q => { BYID[q.id] = q; });
const N_LATEST = POOL.filter(q => q.t === 1).length;
const N_OLD = POOL.length - N_LATEST;

/* ====== 練習記錄（做過、做錯的題）====== */
function loadH() {
  try {
    const raw = localStorage.getItem(HKEY);
    if (raw) {
      const h = JSON.parse(raw);
      if (h && typeof h === 'object') return { seen: h.seen || {}, exams: Array.isArray(h.exams) ? h.exams : [], prefs: h.prefs || {} };
    }
  } catch (e) { /* 瀏覽器不允許儲存時照常運作 */ }
  return { seen: {}, exams: [], prefs: {} };
}
let H = loadH();
H.prefs.scope = H.prefs.scope === 'all' ? 'all' : 'latest';
H.prefs.en = !!H.prefs.en;
function saveH() { try { localStorage.setItem(HKEY, JSON.stringify(H)); } catch (e) { /* ignore */ } }

const inScope = q => H.prefs.scope === 'all' || q.t === 1;
const scopePool = () => POOL.filter(inScope);
const wasWrong = q => { const s = H.seen[q.id]; return !!s && s[2] === 0; };
const wrongPool = () => scopePool().filter(wasWrong);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 抽題：新試卷按 23/17/5/5 比重，優先抽未做過的題，其次是曾經做錯的題；錯題重練只抽曾經做錯的題 */
function drawPaper(mode) {
  let picks = [];
  if (mode === 'wrong') {
    picks = shuffle(wrongPool()).slice(0, EXAM_TOTAL);
  } else {
    const sp = scopePool();
    [1, 2, 3, 4].forEach(c => {
      const g = [[], [], []];
      sp.filter(q => q.ch === c).forEach(q => {
        const s = H.seen[q.id];
        g[!s ? 0 : (s[2] === 0 ? 1 : 2)].push(q);
      });
      picks = picks.concat(shuffle([].concat(shuffle(g[0]), shuffle(g[1]), shuffle(g[2])).slice(0, CH[c].n)));
    });
  }
  picks.sort((a, b) => a.ch - b.ch);
  return picks.map(q => q.id);
}

/* ====== 作答狀態 ====== */
const blank = () => ({
  phase: 'idle', mode: 'new', paper: [], answers: [], flags: [],
  pos: 0, startedAt: 0, deadline: 0, limitMs: 0, submittedAt: 0, auto: false
});

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.paper) || !Array.isArray(s.answers)) return null;
    if (['idle', 'exam', 'done'].indexOf(s.phase) < 0) return null;
    if (s.phase !== 'idle') {
      if (!s.paper.length || s.answers.length !== s.paper.length) return null;
      if (!s.paper.every(id => BYID[id])) return null;
    }
    if (!Array.isArray(s.flags) || s.flags.length !== s.paper.length) s.flags = Array(s.paper.length).fill(false);
    if (!(s.pos >= 0 && s.pos < Math.max(1, s.paper.length))) s.pos = 0;
    if (!s.limitMs) s.limitMs = EXAM_MIN * 60 * 1000;
    return s;
  } catch (e) { return null; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

let S = load() || blank();
let QUESTIONS = [], TOTAL = 0, PASS = 0;
function applyPaper() {
  QUESTIONS = S.paper.map(id => BYID[id]).filter(Boolean);
  TOTAL = QUESTIONS.length;
  PASS = Math.ceil(TOTAL * 0.7);
  QUESTIONS.forEach(q => { q._ch = q.ch; q._head = '第 ' + q.ch + ' 章 ' + CH[q.ch].name; });
}
applyPaper();

const ui = { screen: S.phase === 'done' ? 'result' : 'start', filter: 'all', sheetOpen: false, stampAnim: false, warned: false };

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const answeredCount = () => S.answers.filter(a => a !== null).length;
const isCorrect = i => S.answers[i] === QUESTIONS[i].a;
const allIdx = () => QUESTIONS.map((_, i) => i);
const wrongList = () => allIdx().filter(i => !isCorrect(i));
const chIdx = c => allIdx().filter(i => QUESTIONS[i]._ch === c);
const pad = n => String(n).padStart(2, '0');
const fmt = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return pad(Math.floor(t / 60)) + ':' + pad(t % 60); };
const fmtLong = ms => { const t = Math.max(0, Math.round(ms / 1000)); return Math.floor(t / 60) + ' 分 ' + (t % 60) + ' 秒'; };
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const enOn = () => !!H.prefs.en;

function announce(msg) {
  const el = $('#live');
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 40);
}

/* ====== 畫面 ====== */
function render() {
  renderTop();
  const view = $('#view');
  if (ui.screen === 'start') view.innerHTML = startHTML();
  else if (ui.screen === 'result') view.innerHTML = resultHTML();
  else view.innerHTML = examHTML();
  if (!ui.sheetOpen) { const s = $('#scrim'); if (s) s.remove(); }
  updateProgress();
  syncTimer();
}

function langBtn() {
  return `<button type="button" class="btn quiet" data-act="lang-toggle" aria-pressed="${enOn()}" aria-label="顯示英文對照">EN</button>`;
}

function renderTop() {
  let right = '';
  if (ui.screen === 'exam') {
    right = `<span class="stat" id="stat">已答 ${answeredCount()} / ${TOTAL}</span>
      ${langBtn()}
      <span class="timer" id="timer" role="timer" aria-label="剩餘時間">剩餘 ${fmt(S.deadline - Date.now())}</span>
      <button type="button" class="btn primary" data-act="submit">提交試卷</button>`;
  } else if (ui.screen === 'review') {
    const wn = wrongList().length;
    right = `<div class="seg" role="group" aria-label="回顧範圍">
        <button type="button" data-act="filter" data-f="all" aria-pressed="${ui.filter === 'all'}">全部</button>
        <button type="button" data-act="filter" data-f="wrong" aria-pressed="${ui.filter === 'wrong'}" ${wn ? '' : 'disabled'}>錯題 ${wn}</button>
      </div>
      ${langBtn()}
      <button type="button" class="btn" data-act="to-result">成績</button>`;
  }
  $('#top').innerHTML = `<div class="topbar-in"><div class="brand">IIQE 卷二<small>一般保險模擬試卷</small></div>${right}</div>`;
}

function updateProgress() {
  let pct = 0, label = '作答進度';
  if (ui.screen === 'exam') pct = TOTAL ? answeredCount() / TOTAL * 100 : 0;
  else if (ui.screen === 'review') { pct = (S.pos + 1) / TOTAL * 100; label = '回顧位置'; }
  else if (ui.screen === 'result') pct = 100;
  $('#bar').style.width = pct + '%';
  const p = $('#progress');
  p.setAttribute('aria-valuenow', String(Math.round(pct)));
  p.setAttribute('aria-label', label);
}

function startHTML() {
  const inProgress = S.phase === 'exam' && TOTAL > 0;
  const remain = S.deadline - Date.now();
  const sp = scopePool();
  const seenAll = sp.filter(q => H.seen[q.id]).length;
  const wn = wrongPool().length;
  const rows = [1, 2, 3, 4].map(c => {
    const inCh = sp.filter(q => q.ch === c);
    const seen = inCh.filter(q => H.seen[q.id]).length;
    return `<tr><td>第 ${c} 章</td><td>${CH[c].name}</td><td class="num">${CH[c].w}</td><td class="num">${CH[c].n} 題</td><td class="num">${seen} / ${inCh.length}</td></tr>`;
  }).join('');
  const recent = H.exams.slice(-5).map(e => `${e.score}/${e.total}`).join('、');
  let actions;
  if (inProgress) {
    actions = `<button type="button" class="btn primary" data-act="resume">${remain > 0 ? '繼續作答' : '提交並查看成績'}</button>
      <span class="hint">已答 ${answeredCount()} 題，${remain > 0 ? '剩餘時間 ' + fmt(remain) : '作答時間已屆滿'}</span>
      <span class="grow"></span>
      <button type="button" class="btn quiet" data-act="restart">放棄並重新開始</button>`;
  } else {
    actions = `<button type="button" class="btn primary" data-act="start" data-mode="new">開始新試卷</button>
      <button type="button" class="btn" data-act="start" data-mode="wrong" ${wn ? '' : 'disabled'}>錯題重練（${wn} 題）</button>
      <span class="grow"></span>
      ${recent ? `<span class="hint">最近成績：${recent}</span>` : ''}`;
  }
  const scopeNote = H.prefs.scope === 'all'
    ? `<p class="notice"><b>已加入 2023 年舊版題</b>這 ${N_OLD} 題只見於 2023 年 9 月模擬題，未見於 2025 年題庫。兩個版本重複的題目中，有部分答案不同，所以舊版題的答案請以研習資料手冊為準。</p>`
    : '';
  return `<section class="doc" aria-labelledby="doc-title">
    <h1 class="doc-title" id="doc-title">一般保險考試（卷二）模擬試卷</h1>
    <p class="doc-sub">保險中介人資格考試模擬練習。題目取自 2025 年 4 月總模擬題庫（附註解）及 2025 年 3、4、5 月每月精選試題，已去除重複；每題附官方註解及手冊章節。</p>
    <dl class="schedule">
      <div><dt>題目</dt><dd>${EXAM_TOTAL} 題單項選擇題，每次按各章比重從題庫抽題，優先抽未做過的題</dd></div>
      <div><dt>時限</dt><dd>${EXAM_MIN} 分鐘，時間屆滿系統自動提交</dd></div>
      <div><dt>合格標準</dt><dd>答對 ${Math.ceil(EXAM_TOTAL * 0.7)} 題或以上（70%）</dd></div>
      <div><dt>題庫範圍</dt><dd><div class="seg" role="group" aria-label="題庫範圍">
        <button type="button" data-act="scope" data-v="latest" aria-pressed="${H.prefs.scope === 'latest'}">2025 最新題 ${N_LATEST}</button>
        <button type="button" data-act="scope" data-v="all" aria-pressed="${H.prefs.scope === 'all'}">加入 2023 舊題 ${POOL.length}</button>
      </div><span class="hint scope-hint">已練 ${seenAll} / ${sp.length} 題</span></dd></div>
      <div><dt>顯示語言</dt><dd><div class="seg" role="group" aria-label="顯示語言">
        <button type="button" data-act="lang" data-v="zh" aria-pressed="${!enOn()}">中文</button>
        <button type="button" data-act="lang" data-v="en" aria-pressed="${enOn()}">中英對照</button>
      </div></dd></div>
      <div><dt>章節比重</dt><dd><table class="weights"><thead><tr><th scope="col">章次</th><th scope="col">內容</th><th scope="col" class="num">比重</th><th scope="col" class="num">每卷題數</th><th scope="col" class="num">已練 / 題庫</th></tr></thead><tbody>${rows}</tbody></table></dd></div>
    </dl>
    ${scopeNote}
    <div class="actions">${actions}</div>
    <p class="fine">本卷為溫習用模擬題，並非官方試題，正式考試題目以考試機構為準。保費徵款以 2023 年 11 月 13 日起的安排為準：香港汽車保險局向汽車保單收取汽車保費的 3%（手冊 2.2.5(a)）。作答進度及錯題記錄儲存在此瀏覽器，重新整理頁面後可繼續。鍵盤操作：按 A–D 或 1–4 選答，按 ← → 切換題目。</p>
  </section>`;
}

function navList() {
  return (ui.screen === 'review' && ui.filter === 'wrong') ? wrongList() : allIdx();
}

function examHTML() {
  const review = ui.screen === 'review';
  const i = S.pos, q = QUESTIONS[i], a = S.answers[i];
  const items = (q.qi || []).map((t, k) =>
    `<li><span class="n">(${ROM[k]})</span><span>${esc(t)}${q.qei && q.qei[k] ? enLine(q.qei[k]) : ''}</span></li>`).join('');
  const stemEn = (enOn() && q.qe) ? `<p class="stem-en">${esc(q.qe)}</p>` : '';

  const opts = q.o.map((o, k) => {
    const body = `<span><span class="sr-only">選項 ${L[k]}：</span>${esc(o.z)}${enLine(o.e)}</span>`;
    if (!review) {
      return `<button type="button" class="opt" data-act="pick" data-k="${k}" aria-pressed="${a === k}">
        <span class="bubble" aria-hidden="true">${L[k]}</span>${body}</button>`;
    }
    let cls = 'opt r', tag = '';
    if (k === q.a) { cls += ' ok'; tag = a === k ? '你答對了' : '正確答案'; }
    else if (a === k) { cls += ' bad'; tag = '你的答案'; }
    return `<div class="${cls}"><span class="bubble" aria-hidden="true">${L[k]}</span>${body}${tag ? `<span class="tag">${tag}</span>` : ''}</div>`;
  }).join('');

  let expl = '';
  if (review) {
    const verdict = a === null
      ? `<p class="verdict none">未作答，正確答案是 ${L[q.a]}</p>`
      : (a === q.a ? `<p class="verdict ok">答對了，答案是 ${L[q.a]}</p>`
                   : `<p class="verdict bad">答錯了：你選了 ${L[a]}，正確答案是 ${L[q.a]}</p>`);
    const srcs = q.s.split('').map(c => SRC_NAME[c]).filter(Boolean).join('、');
    const caution = q.t === 0
      ? `<p class="caution">此題只見於 2023 年 9 月模擬題，未見於 2025 年題庫。兩個版本重複的題目中有部分答案不同，請以研習資料手冊為準。</p>` : '';
    expl = `<section class="exp" aria-label="解析">${verdict}<h3>解析</h3><p class="body">${esc(q.x)}</p>${caution}<p class="ref"><b>出處</b><span>${q.ref ? '手冊 ' + esc(q.ref) + '；' : ''}${esc(srcs)}</span></p></section>`;
  }

  const list = navList();
  const idx = list.indexOf(i);
  const hasPrev = idx > 0, hasNext = idx >= 0 && idx < list.length - 1;
  const nextBtn = (!review && !hasNext)
    ? `<button type="button" class="btn primary" data-act="submit">提交試卷</button>`
    : `<button type="button" class="btn${review ? '' : ' primary'}" data-act="next" ${hasNext ? '' : 'disabled'}>下一題</button>`;
  const posText = (review && ui.filter === 'wrong') ? `錯題 ${idx + 1} / ${list.length}` : `第 ${i + 1} / ${TOTAL} 題`;
  const flag = review ? '' : `<button type="button" class="flag" data-act="flag" aria-pressed="${S.flags[i]}">${S.flags[i] ? '已標記' : '標記此題'}</button>`;

  return `<div class="layout">
    <article class="sheet" aria-labelledby="qno">
      <div class="q-head">
        <div class="q-id">
          <h2 class="q-no" id="qno" tabindex="-1">第 ${i + 1} 題<span>/ ${TOTAL}</span></h2>
          <p class="q-meta"><span>${esc(q._head)}</span>${review && q.ref ? `<span class="topic">手冊 ${esc(q.ref)}</span>` : ''}</p>
        </div>
        ${flag}
      </div>
      <p class="stem">${esc(q.q)}</p>
      ${stemEn}
      ${items ? `<ol class="stmts">${items}</ol>` : ''}
      <div class="opts" role="group" aria-label="選項">${opts}</div>
      ${expl}
      <nav class="pager" aria-label="題目導覽">
        <button type="button" class="btn" data-act="prev" ${hasPrev ? '' : 'disabled'}>上一題</button>
        <span class="grow"></span>
        <span class="pos">${posText}</span>
        <button type="button" class="btn sheet-btn" data-act="sheet" aria-expanded="${ui.sheetOpen}" aria-controls="omr">答題卡</button>
        <span class="grow"></span>
        ${nextBtn}
      </nav>
    </article>
    ${omrHTML()}
  </div>`;
}

function omrHTML() {
  const review = ui.screen === 'review';
  const groups = [1, 2, 3, 4].map(c => {
    const idxs = chIdx(c);
    if (!idxs.length) return '';
    const cells = idxs.map(i => {
      let cls = 'cell', st;
      if (review) {
        const s = S.answers[i] === null ? 'skip' : (isCorrect(i) ? 'ok' : 'bad');
        cls += ' ' + s;
        if (ui.filter === 'wrong' && isCorrect(i)) cls += ' dim';
        st = s === 'skip' ? '未作答' : (s === 'ok' ? '答對' : '答錯');
      } else {
        if (S.answers[i] !== null) cls += ' done';
        if (S.flags[i]) cls += ' flagged';
        st = (S.answers[i] !== null ? '已作答' : '未作答') + (S.flags[i] ? '，已標記' : '');
      }
      if (i === S.pos) cls += ' cur';
      return `<button type="button" class="${cls}" data-act="goto" data-i="${i}" aria-label="第 ${i + 1} 題，${st}"${i === S.pos ? ' aria-current="true"' : ''}>${i + 1}</button>`;
    }).join('');
    return `<div class="omr-group"><div class="omr-label"><span>第 ${c} 章 ${CH[c].name}</span><span>第 ${idxs[0] + 1}–${idxs[idxs.length - 1] + 1} 題</span></div><div class="omr-grid">${cells}</div></div>`;
  }).join('');
  const legend = review
    ? `<span><i class="ok"></i>答對</span><span><i class="bad"></i>答錯</span><span><i class="skip"></i>未作答</span>`
    : `<span><i class="done"></i>已作答</span><span><i></i>未作答</span><span><i class="fl"></i>已標記</span>`;
  const count = review ? `答對 ${TOTAL - wrongList().length} / ${TOTAL}` : `已答 ${answeredCount()} / ${TOTAL}`;
  return `<aside class="omr${ui.sheetOpen ? ' open' : ''}" id="omr" aria-label="答題卡">
    <div class="omr-head">答題卡<span>${count}</span><button type="button" class="omr-close" data-act="sheet-close">關閉</button></div>
    <div class="omr-body">${groups}<div class="legend">${legend}</div></div>
  </aside>`;
}

function resultHTML() {
  const correct = allIdx().filter(isCorrect).length;
  const pass = correct >= PASS;
  const pct = TOTAL ? Math.round(correct / TOTAL * 100) : 0;
  const unanswered = S.answers.filter(x => x === null).length;
  const end = S.submittedAt || Date.now();
  const used = Math.min(S.limitMs, Math.max(0, end - S.startedAt));
  const d = new Date(end);
  const dateStr = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  const rows = [1, 2, 3, 4].map(c => {
    const idxs = chIdx(c);
    if (!idxs.length) return '';
    const ok = idxs.filter(isCorrect).length;
    const p = Math.round(ok / idxs.length * 100);
    return `<tr><th scope="row">第 ${c} 章 ${CH[c].name}<small>考試比重 ${CH[c].w}</small></th><td class="num">${ok} / ${idxs.length}</td><td class="barcell"><span class="bar"><i style="width:${p}%"></i></span></td><td class="num">${p}%</td></tr>`;
  }).join('');
  const wn = TOTAL - correct;
  const wp = wrongPool().length;
  const sp = scopePool();
  const seenAll = sp.filter(q => H.seen[q.id]).length;
  const modeNote = S.mode === 'wrong' ? '（錯題重練）' : '';
  return `<section class="doc" aria-labelledby="res-title">
    <div class="result-top">
      <div class="stamp ${pass ? 'pass' : 'fail'}${ui.stampAnim && !reduceMotion() ? ' animate' : ''}" aria-hidden="true"><span class="s-main">${pass ? '合格' : '不合格'}</span><span class="s-date">${dateStr}</span></div>
      <div>
        <h1 class="res-title" id="res-title" tabindex="-1">${pass ? '成績達到合格水平' : '成績未達合格水平'}${modeNote}</h1>
        <p class="score">${correct}<small>/ ${TOTAL}</small></p>
        <p class="score-line">正確率 ${pct}%，合格線為 ${PASS} 題（70%）${unanswered ? `；未作答 ${unanswered} 題` : ''}。用時 ${fmtLong(used)}。</p>
        ${S.auto ? '<p class="note">作答時間已屆滿，系統已自動提交試卷。</p>' : ''}
      </div>
    </div>
    <table class="breakdown"><caption>各章表現</caption>
      <thead><tr><th scope="col">章節</th><th scope="col" class="num">答對</th><th scope="col"><span class="sr-only">比例</span></th><th scope="col" class="num">正確率</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="actions">
      <button type="button" class="btn primary" data-act="review-wrong" ${wn ? '' : 'disabled'}>回顧錯題（${wn}）</button>
      <button type="button" class="btn" data-act="review-all">回顧全部 ${TOTAL} 題</button>
      <span class="grow"></span>
      <button type="button" class="btn quiet" data-act="retake">返回首頁</button>
    </div>
    <p class="fine">回顧模式以綠色標示正確答案、紅色標示你答錯的選項，並展開每題的官方註解及出處。題庫進度：已練 ${seenAll} / ${sp.length} 題，錯題本共 ${wp} 題，可在首頁按「錯題重練」再做。</p>
  </section>`;
}

/* ====== 操作 ====== */
function focusQuestion() {
  const h = $('#qno');
  if (h) h.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
}

function startExam(mode) {
  const ids = drawPaper(mode);
  if (!ids.length) return;
  S = blank();
  S.mode = mode;
  S.paper = ids;
  S.answers = Array(ids.length).fill(null);
  S.flags = Array(ids.length).fill(false);
  S.phase = 'exam';
  S.startedAt = Date.now();
  S.limitMs = Math.round(ids.length * EXAM_MIN / EXAM_TOTAL * 60 * 1000);
  S.deadline = S.startedAt + S.limitMs;
  applyPaper();
  ui.screen = 'exam'; ui.filter = 'all'; ui.sheetOpen = false; ui.warned = false;
  save(); render(); focusQuestion();
}

function resumeExam() {
  if (Date.now() >= S.deadline) { submit(true); return; }
  ui.screen = 'exam'; ui.sheetOpen = false;
  render(); focusQuestion();
}

function pick(k) {
  if (ui.screen !== 'exam' || S.phase !== 'exam') return;
  S.answers[S.pos] = k;
  save(); render();
  announce(`第 ${S.pos + 1} 題已選 ${L[k]}`);
  const b = $(`.opt[data-k="${k}"]`);
  if (b) b.focus({ preventScroll: true });
}

function step(d) {
  const list = navList();
  const idx = list.indexOf(S.pos);
  const n = idx + d;
  if (idx < 0 || n < 0 || n >= list.length) return;
  S.pos = list[n];
  save(); render(); focusQuestion();
}

function gotoQ(i) {
  if (ui.screen === 'review' && ui.filter === 'wrong' && isCorrect(i)) ui.filter = 'all';
  S.pos = i;
  ui.sheetOpen = false;
  save(); render(); focusQuestion();
}

function setSheet(open) {
  ui.sheetOpen = open;
  const omr = $('#omr');
  if (!omr) return;
  omr.classList.toggle('open', open);
  let scrim = $('#scrim');
  if (open && !scrim) {
    scrim = document.createElement('div');
    scrim.id = 'scrim'; scrim.className = 'scrim'; scrim.setAttribute('data-act', 'sheet-close');
    document.body.appendChild(scrim);
  }
  if (!open && scrim) scrim.remove();
  const btn = $('[data-act="sheet"]');
  if (btn) btn.setAttribute('aria-expanded', String(open));
  if (open) { const c = $('.cell.cur'); if (c) setTimeout(() => c.focus({ preventScroll: true }), 60); }
  else if (btn) btn.focus({ preventScroll: true });
}

function setFilter(f) {
  if (f === 'wrong') {
    const w = wrongList();
    if (!w.length) return;
    ui.filter = 'wrong';
    if (isCorrect(S.pos)) S.pos = w[0];
  } else {
    ui.filter = 'all';
  }
  save(); render(); focusQuestion();
}

function askSubmit() {
  const n = answeredCount(), un = TOTAL - n, fl = S.flags.filter(Boolean).length;
  let body = `已作答 ${n} / ${TOTAL} 題。`;
  if (un) body += `尚有 ${un} 題未作答，提交後當作答錯。`;
  if (fl) body += `另有 ${fl} 題已標記待覆查。`;
  body += '提交後不能再修改答案。';
  confirmBox({ title: '提交試卷？', body, ok: '確認提交', cancel: '繼續作答' })
    .then(yes => { if (yes) submit(false); });
}

function recordResult() {
  QUESTIONS.forEach((q, i) => {
    const s = H.seen[q.id] || [0, 0, 1];
    if (S.answers[i] === q.a) { s[0]++; s[2] = 1; } else { s[1]++; s[2] = 0; }
    H.seen[q.id] = s;
  });
  H.exams.push({ t: S.submittedAt, score: allIdx().filter(isCorrect).length, total: TOTAL, mode: S.mode });
  if (H.exams.length > 100) H.exams = H.exams.slice(-100);
  saveH();
}

function submit(auto) {
  if (S.phase !== 'exam') return;
  closeModal();
  S.phase = 'done';
  S.submittedAt = Math.min(Date.now(), S.deadline);
  S.auto = !!auto;
  recordResult();
  ui.screen = 'result'; ui.sheetOpen = false; ui.stampAnim = true;
  save(); render();
  ui.stampAnim = false;
  const h = $('#res-title');
  if (h) h.focus({ preventScroll: true });
  window.scrollTo(0, 0);
  if (auto) announce('作答時間已屆滿，系統已自動提交試卷');
}

function syncTimer() {
  if (ui.screen === 'exam' && S.phase === 'exam') {
    if (!timerId) timerId = setInterval(tick, 1000);
    tick();
  } else if (timerId) {
    clearInterval(timerId); timerId = null;
  }
}

function tick() {
  const left = S.deadline - Date.now();
  if (left <= 0) { submit(true); return; }
  const el = $('#timer');
  if (el) {
    el.textContent = '剩餘 ' + fmt(left);
    el.classList.toggle('low', left <= 5 * 60 * 1000);
  }
  if (left <= 5 * 60 * 1000 && !ui.warned) { ui.warned = true; announce('剩餘時間不足 5 分鐘'); }
}

/* ====== 對話框 ====== */
function confirmBox(o) {
  closeModal();
  const root = $('#modal-root');
  const prev = document.activeElement;
  root.innerHTML = `<div class="modal-scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" aria-describedby="m-body">
    <h2 id="m-title">${esc(o.title)}</h2><p id="m-body">${esc(o.body)}</p>
    <div class="actions"><button type="button" class="btn" data-m="no">${esc(o.cancel)}</button><button type="button" class="btn primary" data-m="yes">${esc(o.ok)}</button></div>
  </div></div>`;
  return new Promise(resolve => {
    modalResolve = v => {
      root.innerHTML = ''; root.onclick = null; modalResolve = null;
      if (prev && prev.focus && document.contains(prev)) prev.focus({ preventScroll: true });
      resolve(v);
    };
    root.onclick = e => {
      const b = e.target.closest('[data-m]');
      if (b) { modalResolve(b.getAttribute('data-m') === 'yes'); return; }
      if (e.target.classList.contains('modal-scrim')) modalResolve(false);
    };
    const first = $('[data-m="no"]', root);
    if (first) first.focus();
  });
}
function closeModal() { if (modalResolve) modalResolve(false); }

/* ====== 事件 ====== */
document.addEventListener('click', e => {
  if (e.target.closest('#modal-root')) return;
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const act = t.getAttribute('data-act');
  switch (act) {
    case 'start': startExam(t.getAttribute('data-mode') === 'wrong' ? 'wrong' : 'new'); break;
    case 'resume': resumeExam(); break;
    case 'scope':
      H.prefs.scope = t.getAttribute('data-v') === 'all' ? 'all' : 'latest';
      saveH(); render();
      break;
    case 'lang':
      H.prefs.en = t.getAttribute('data-v') === 'en';
      saveH(); render();
      break;
    case 'lang-toggle':
      H.prefs.en = !H.prefs.en;
      saveH(); render();
      { const b = $('[data-act="lang-toggle"]'); if (b) b.focus({ preventScroll: true }); }
      break;
    case 'restart':
      confirmBox({ title: '放棄目前作答？', body: '已作答的答案及計時會被清除，並立即開始一份新的試卷。', ok: '重新開始', cancel: '取消' })
        .then(yes => { if (yes) startExam(S.mode === 'wrong' ? 'wrong' : 'new'); });
      break;
    case 'pick': pick(+t.getAttribute('data-k')); break;
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'goto': gotoQ(+t.getAttribute('data-i')); break;
    case 'flag':
      S.flags[S.pos] = !S.flags[S.pos];
      save(); render();
      announce(S.flags[S.pos] ? '已標記此題' : '已取消標記');
      { const f = $('.flag'); if (f) f.focus({ preventScroll: true }); }
      break;
    case 'sheet': setSheet(!ui.sheetOpen); break;
    case 'sheet-close': setSheet(false); break;
    case 'submit': askSubmit(); break;
    case 'filter': setFilter(t.getAttribute('data-f')); break;
    case 'to-result':
      ui.screen = 'result'; ui.sheetOpen = false; render();
      { const h = $('#res-title'); if (h) h.focus({ preventScroll: true }); }
      window.scrollTo(0, 0);
      break;
    case 'review-all':
      ui.screen = 'review'; ui.filter = 'all'; S.pos = 0;
      save(); render(); focusQuestion();
      break;
    case 'review-wrong': {
      const w = wrongList();
      if (!w.length) return;
      ui.screen = 'review'; ui.filter = 'wrong'; S.pos = w[0];
      save(); render(); focusQuestion();
      break;
    }
    case 'retake':
      confirmBox({ title: '返回首頁？', body: '本次試卷的答案與解析回顧會被清除。成績及錯題記錄已保存，可在首頁用「錯題重練」再做。', ok: '返回首頁', cancel: '取消' })
        .then(yes => { if (yes) { S = blank(); applyPaper(); save(); ui.screen = 'start'; render(); window.scrollTo(0, 0); } });
      break;
  }
});

document.addEventListener('keydown', e => {
  if (modalResolve) {
    if (e.key === 'Escape') { e.preventDefault(); modalResolve(false); }
    else if (e.key === 'Tab') {
      const bs = Array.from(document.querySelectorAll('#modal-root button'));
      const cur = bs.indexOf(document.activeElement);
      e.preventDefault();
      bs[(cur + (e.shiftKey ? -1 : 1) + bs.length) % bs.length].focus();
    }
    return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (ui.screen !== 'exam' && ui.screen !== 'review') return;
  if (e.key === 'Escape' && ui.sheetOpen) { e.preventDefault(); setSheet(false); return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); return; }
  if (ui.screen === 'exam' && e.key && e.key.length === 1) {
    const k = 'abcd'.indexOf(e.key.toLowerCase());
    const n = '1234'.indexOf(e.key);
    const idx = k >= 0 ? k : n;
    if (idx >= 0) { e.preventDefault(); pick(idx); }
  }
});

render();
})();
</script>
</body>
</html>
