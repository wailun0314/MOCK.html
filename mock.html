rty insurance cover on a/an?","qei":[],"o":[{"z":"全險","e":"All risks basis"},{"z":"約定價值","e":"Agreed values basis"},{"z":"指明危險","e":"Specified perils basis"},{"z":"火災及盜竊","e":"Fire and theft basis"}],"a":0,"x":"保單傾向於提供「全險」保險保障，在同一張保單下提供實物損害和營業中斷保障，通常在一份文件內提供公衆責任、產品責任和僱員補償等三種保障。"},{"id":"B119","ch":1,"ref":"1.3.4(c)","t":1,"s":"by","q":"以下哪項不是向大型機構所提供的「傘括」類型組合保障的特點？","qi":[],"qe":"Which of the following is not a feature of Combined \"\"Umbrella\"\" type cover for large organizations?","qei":[],"o":[{"z":"只提供財產及責任的保障","e":"Provides only cover for property and liability"},{"z":"可按被保險人的需要而個別草擬","e":"Can be designed individually to the requirements of specific insured"},{"z":"提供財產保障以全險為根據","e":"Provides cover for property on an \"\"all risks\"\" basis"},{"z":"包括大部份保險類別(財產、責任等)","e":"Includes most insurance categories (property, liability, etc.)"}],"a":0,"x":"這類保障可以包括任何類型的保障，包括財產、經濟權益及責任風險。"},{"id":"B120","ch":1,"ref":"1.3.4(b)","t":1,"s":"by","q":"典型商業保險組合保單提供的責任保險組合保單，保障較可能包括：","qi":[],"qe":"The cover of a combined liability policy of typical commercial combined policies is likely to include:","qei":[],"o":[{"z":"汽車、公眾責任及產品責任","e":"motor vehicle, public liability and products liability"},{"z":"公眾責任、產品責任及經濟權益","e":"Public liability, products liability and pecuniary"},{"z":"公眾責任、產品責任及僱員補償(法定)責任","e":"Public liability, products liability and employees' compensation (legislated) liability"},{"z":"專業責任、經濟權益責任及財產責任","e":"Professional liability, pecuniary liability and property liability"}],"a":2,"x":"這類保單通常在一份文件內提供公衆責任、產品責任和僱員補償等三種保障。個別客戶也可能需要董事及高級管理人員責任及／或專業責任保險保障。"},{"id":"B121","ch":1,"ref":"1.4.1(a)","t":1,"s":"b","q":"某一中式酒樓發生火災，火勢蔓延至樓上的單位，結果，林先生的單位嚴重受損，該單位是有火險單保障的。為甚麼你認為林先生的損失不獲保單賠償？","qi":[],"qe":"A fire which start in the Chinese restaurant spreads to the flat above. As a result, Mr Lam's flat which has been insured under the fire insurance is badly damaged. Why do you think Mr Lam's loss will be irrecoverable under the policy?","qei":[],"o":[{"z":"林先生的損失可獲保單賠償","e":"Mr. Lam's loss can be recoverable under the policy"},{"z":"首保住處不首先起火","e":"The fire does not start on the insured premises"},{"z":"沒有發生保單所指的“火”","e":"There is no \"\"fire\"\" within thee meaning of the policy"},{"z":"只要受保住處訂定義被包括該中式酒樓，林先生便可獲得賠償","e":"Mr Lam's loss will be recoverable only if the insured premises has defined as including the Chinese restaurant"}],"a":0,"x":"火災無須在受保處所燃燒，因此，在鄰近物業燃燒並符合以上定義的火災所產生的熱量、煙或水進而對受保財產造成的損害，也可構成有效的火災索償。"},{"id":"B122","ch":1,"ref":"1.4.1(a)","t":1,"s":"b","q":"在火險保單當中，爆炸引致的損失是：","qi":[],"qe":"In fire insurance policy, loss caused by explosion is:","qei":[],"o":[{"z":"所有爆炸的損失是屬於基本保單所保障的","e":"All losses caused by explosion are basically covered by all policies"},{"z":"必定屬於除外責任","e":"must be exclusion"},{"z":"某些情況下爆炸引致的損失是受保的(例如：家用氣體爆炸)","e":"Under some circumstances the loss caused by explosion is covered (e.g. explosion of gas used for domestic purpose)"},{"z":"所有爆炸的損失要得到保障，必須額外繳付保費","e":"Extra premiums must be paid in order to cover loss caused by explosion"}],"a":2,"x":"雖然在標準火險保單中，爆炸是一項除外的危險，但有關的除外責任條款載明不適用於作家居用途的氣體（或鍋爐）的爆炸這項受保危險，所導致的損害。"},{"id":"B123","ch":1,"ref":"1.4.1(a)","t":1,"s":"b3y","q":"以下哪項不屬於火險保單中的附加危險？","qi":[],"qe":"Which of the following is not an extra peril of fire insurance policy?","qei":[],"o":[{"z":"熱帶氣旋","e":"Cyclone"},{"z":"地震","e":"Earthquake"},{"z":"閃電","e":"Lightning"},{"z":"暴亂","e":"Riot"}],"a":2,"x":"閃電：不管火災是否隨後發生，是保障範圍內。"},{"id":"B124","ch":1,"ref":"1.4.1(a)","t":1,"s":"b4","q":"根據本港商業火險保單，保障範圍包括以下哪項？","qi":["因火災直接對財產造成毀壞","並未產生火災的閃電毀壞","因消防員嘗試用水撲滅火警而造成的毀壞","在有關場所內，因意外火警產生的濃煙，對存貨造成毀壞"],"qe":"According to the commercial fire insurance policy of Hong Kong, the scope of cover includes which of the following?","qei":["Property damage directly caused by fire","Damage caused by lightning which is not followed by fire","Damage caused by the fire brigade trying to fight the fire with water","Damage of inventory in the related premise caused by the smoke of an accidental fire"],"o":[{"z":"i, ii","e":""},{"z":"i, ii, iii","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, ii, iii, iv","e":""}],"a":3,"x":"火災、閃電、因救火所導致損失及濃煙影響也是保障範圍內。"},{"id":"B125","ch":1,"ref":"1.4.1(a)(i)","t":1,"s":"by","q":"在商業保單中，火災的定義為：","qi":[],"qe":"In commercial policies, the definition of fire is:","qei":[],"o":[{"z":"只限於發生在受保建築物中的火災","e":"Limited to the fire within the insured premises"},{"z":"不局限於受保建築物中的火災","e":"Not limited to the fire within the insured premises"},{"z":"不包括由其他人故意引起的火災","e":"Exclude fire intentionally caused by others"},{"z":"只限於由受保人引起的火災","e":"Limited to fire caused by the insured"}],"a":1,"x":"火災無須在受保處所燃燒，因此，在鄰近物業燃燒並符合以上定義的火災所產生的熱量、煙或水進而對受保財產造成的損害，也可構成有效的火災索償。"},{"id":"B126","ch":1,"ref":"1.4.1(a)(i)","t":1,"s":"by","q":"「火災」的定義是：","qi":[],"qe":"\"\"Fire\"\" is defined as:","qei":[],"o":[{"z":"一些不應起火但起火的物件","e":"Ignition of something that should not be on fire but are on fire"},{"z":"實際的燃燒","e":"Actual ignition"},{"z":"非由被保險人故意引起或安排","e":"Not deliberately caused or arranged by the insured"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"火災、無須在受保處所燃燒及不是由被保險人故意引起或安排的都是保障範圍內。"},{"id":"B127","ch":1,"ref":"1.4.1(a)(i)","t":1,"s":"by","q":"以下哪項屬於火災保單中的保障項目？","qi":[],"qe":"Which of the following is under the cover of fire insurance policies?","qei":[],"o":[{"z":"消防員用水救火造成的損失","e":"Loss caused by fire brigade using water to fight the fire"},{"z":"閃電引致的非火災損失","e":"Non-fire loss caused by lightning"},{"z":"閃電引致的火災","e":"Fire caused by lightning"},{"z":"以上各項都是","e":"All of the above"}],"a":3,"x":"火災、閃電、因救火所導致損失及濃煙影響也是保障範圍內。"},{"id":"B128","ch":1,"ref":"1.4.1(a)(i)(3)","t":1,"s":"by","q":"以下那項情況為火險的基本保障範圍？","qi":[],"qe":"Which of the following is a basic cover of fire insurance?","qei":[],"o":[{"z":"於烘麵包時燒焦麵包","e":"The bread is burned during baking"},{"z":"火災後因消防人員救火時造成的財物損毀","e":"Property damage caused by fire brigade fighting a fire"},{"z":"戰爭中所做成的火災","e":"Fire caused by a war"},{"z":"因自己故意放火做成的火災","e":"Fire that is deliberately arranged"}],"a":1,"x":"因救火所導致損失也是保障範圍內。"},{"id":"B129","ch":1,"ref":"1.4.1(a)(ii)","t":1,"s":"b3y","q":"以下哪項對閃電發生所引致的火警的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing fire caused by lightning?","qei":[],"o":[{"z":"是除外責任","e":"Is an exclusion"},{"z":"不是除外責任","e":"Not an exclusion"},{"z":"是一種特殊危險，但可以除外危險作附加保障","e":"Is a special peril, but can be added as extra cover"},{"z":"是一個基本風險，包括在保單的保障範圍內","e":"Is a fundamental risk and covered in the policy"}],"a":1,"x":"閃電引起的火災是保障範圍內。"},{"id":"B130","ch":1,"ref":"1.4.1(a)(iii)","t":1,"s":"by","q":"由火引起的水、熱力及煙所造成的損毀，以下哪一項在一般的火險單中是會得到保障？","qi":[],"qe":"The damage caused by water, heat and smoke of a fire will be covered by general fire insurance policy in which of the following?","qei":[],"o":[{"z":"若火災是由建築物當中引起的","e":"If the fire is caused by the building"},{"z":"若所有損毀與第三者無關","e":"If all damage is not related to third party"},{"z":"若火警發生的近因是火災","e":"If the proximate cause if fire"},{"z":"若火災與第三者損失有關","e":"If the fire is related to third party loss"}],"a":2,"x":"如果火災（如上文所界定的）是近因，那麽「火災」損害便包括由煙、熱力，以及撲救火災時用的水引致的損害。由消防隊或其他人在撲滅火災的過程中合理地造成的損害，也在保障範圍之內。"},{"id":"B131","ch":1,"ref":"1.4.1(a)(iii)","t":1,"s":"b","q":"根據基本火災保單，下列哪一項是正確的？","qi":[],"qe":"According to basic fire insurance policy, which of the following is correct?","qei":[],"o":[{"z":"只有由火災引起的爆炸是可保的","e":"Explosion caused by fire only is insurable"},{"z":"沒有由火災引起的爆炸是可保的","e":"Explosion not caused by fire is insurable"},{"z":"由家用氣體產生的爆炸，是除外責任不適用的","e":"Explosion of gas used for domestic purposes is not applicable to exclusions"},{"z":"只有家用氣體產生的爆炸屬除外責任","e":"Only explosion of gas used for domestic purposes is an exclusion"}],"a":2,"x":"雖然在標準火險保單中，爆炸是一項除外的危險，但有關的除外責任條款載明不適用於作家居用途的氣體（或鍋爐）的爆炸這項受保危險，所導致的損害。"},{"id":"B132","ch":1,"ref":"1.4.1(a)(iii)","t":1,"s":"by","q":"在一般基本的商業火險保單，以下哪項對爆炸危險的說明是不正確的？","qi":[],"qe":"For general commercial fire insurance policies, which of the following is incorrect about the peril of explosion?","qei":[],"o":[{"z":"包括在除外危險","e":"Included in excluded peril"},{"z":"家居氣體爆炸是得到保障的","e":"Explosion of gas used for domestic purposes is covered"},{"z":"就算繳交額外保費，要得到所述之保障是不可能的","e":"It is impossible to be covered even paying extra premiums"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"雖然在標準火險保單中，爆炸是一項除外的危險，但有關的除外責任條款載明不適用於作家居用途的氣體（或鍋爐）的爆炸這項受保危險，所導致的損害。"},{"id":"B133","ch":1,"ref":"1.4.1(a)(iv)","t":1,"s":"by","q":"以下哪項不屬於附加於本港簽發的商業火險單中「附加危險」的替代用詞?","qi":[],"qe":"Which of the following is not an alternative term for \"\"extra perils\"\" added in the commercial fire insurance policies issued in Hong Kong?","qei":[],"o":[{"z":"擴展危險","e":"Extended perils"},{"z":"類似危險","e":"Allied perils"},{"z":"特殊危險","e":"Special perils"},{"z":"補充危險","e":"Supplementary perils"}],"a":3,"x":"附加危險：也稱為特殊危險、類似危險或擴展危險。"},{"id":"B134","ch":1,"ref":"1.4.1(a)(iii)","t":1,"s":"b4y","q":"因爆炸所引起的火災損失，所進行賠償的項目為：","qi":[],"qe":"The compensation item for loss in an explosion caused by fire is:","qei":[],"o":[{"z":"不會接受賠償","e":"Will not be compensated"},{"z":"全部接受賠償","e":"Will be all compensated"},{"z":"家庭氣體燃料爆炸所造成的損失","e":"Loss caused by explosion of gas used for domestic purposes"},{"z":"所有因爆炸導致的損失，但不包括因爆炸而造成的火災所導致的損失","e":"All loss caused by explosion, but excludes loss in a fire caused by explosion"}],"a":2,"x":"雖然在標準火險保單中，爆炸是一項除外的危險，但有關的除外責任條款載明不適用於作家居用途的氣體（或鍋爐）的爆炸這項受保危險，所導致的損害。"},{"id":"B135","ch":1,"ref":"1.4.1(a)(iv)","t":1,"s":"b3","q":"商業火險中，可以繳付額外保費而擴展成為標準保障的危險稱為：","qi":[],"qe":"In commercial fire insurance, perils that can be extended as standard cover by paying extra premiums are:","qei":[],"o":[{"z":"附加危險","e":"Extra perils"},{"z":"特殊危險","e":"Special perils"},{"z":"擴展危險","e":"Extended perils"},{"z":"上述任何名稱","e":"Any of the above"}],"a":3,"x":"附加危險：也稱為特殊危險、類似危險或擴展危險。"},{"id":"B136","ch":1,"ref":"1.4.1(b)(ii)","t":1,"s":"b","q":"火險保單中，自負額適用於：","qi":[],"qe":"In fire insurance policies, excesses are applicable to:","qei":[],"o":[{"z":"火災引致之損失","e":"Loss caused by fire"},{"z":"由閃電做成火災損失","e":"Loss in fire caused by lightning"},{"z":"由閃電做成的非火災損失","e":"Non-fire loss caused by lightning"},{"z":"由附加危險引致之損失","e":"Loss caused by extra perils"}],"a":3,"x":"自負額：用於基本保障（即火災、閃電和「狹義的」爆炸）中的自負額並不多見，然而，某些附加危險的保障設有標準的自負額。"},{"id":"B137","ch":1,"ref":"1.4.1(b)(i)","t":1,"s":"by","q":"一般火險保單大多數按比例分攤的方法賠償,意思是:","qi":[],"qe":"Most fire insurance policies compensate on a pro rata average basis, which means:","qei":[],"o":[{"z":"當損失出現於不足額保障時,被保險人得不到足額賠償","e":"When loss occurs in the case of under-insurance, the insured will not receive full compensation"},{"z":"當損失出現於不足額保障時,保單便屬無效","e":"When loss occurs in the case of under-insurance, the policy is void"},{"z":"財產價值是按市場價值來釐定","e":"Property value is calculated based on market value"},{"z":"保單費用是按市面上的平均數來釐定","e":"Premium is calculated based on market average"}],"a":0,"x":"比例分攤條件：財產保險通常要求全額投保；在理賠時會對不足額保險的情況作出懲罰。"},{"id":"B138","ch":1,"ref":"1.4.1(c)","t":1,"s":"by","q":"火險的保費是根據每一百元收0.1元的保費，若保額是五百萬，保費應為？","qi":[],"qe":"The premium of fire insurance is based on HK$0.1 per HK$100. If the sum insured is HK$5 million, the premium should be:","qei":[],"o":[{"z":"五十元","e":"HK$50"},{"z":"五百元","e":"HK$500"},{"z":"五千元","e":"HK$5,000"},{"z":"五萬元","e":"HK$50,000"}],"a":2,"x":"$100/$0.1 = 1000倍$5,000,000/1000倍 = $5000"},{"id":"B139","ch":1,"ref":"1.4.1a(c)","t":1,"s":"by","q":"以下哪項是火險保單的計算根據？","qi":[],"qe":"Which of the following is a basis for the calculation of fire insurance policy?","qei":[],"o":[{"z":"被保險人所付出的工資","e":"Wage paid by the insured"},{"z":"生意的營業額","e":"Operating revenue of the business"},{"z":"保障的時間","e":"Period of cover"},{"z":"保障物件的價值及保障時間因素計算附加費","e":"Value of insured item with the period of cover for extra premium"}],"a":3,"x":"須按各自的相對風險對財產進行分類，然後再根據個別的特點（比如受保建築物的高度、偏僻或就近程度及救火設施），適當地提高或降低保費。"},{"id":"B140","ch":1,"ref":"1.4.1(d)(iv)","t":1,"s":"b45y","q":"以下哪項不是商業火險的常見的標的物？","qi":[],"qe":"Which of the following is not a subject matter of commercial insurance?","qei":[],"o":[{"z":"建築物","e":"Buildings"},{"z":"營業存貨","e":"Stock in trade"},{"z":"辦公室家具","e":"Office furniture"},{"z":"機器","e":"Machinery"}],"a":2,"x":"建築物、營業存貨及機器為常見的受保財產。"},{"id":"B615","ch":1,"ref":"1.4.1(a)","t":1,"s":"b","q":"以下哪項是營業中斷保險所承保的:","qi":[],"qe":"Which of the following is covered by business interruption insurance?","qei":[],"o":[{"z":"淨利潤","e":"Net profit"},{"z":"毛利潤","e":"Gross profit"},{"z":"建築物外牆之損毀","e":"Damage of outer wall of the building"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"營業中斷保險因受保危險而導致的毛利潤（按保單定義）損失。"},{"id":"B142","ch":1,"ref":"1.4.1a","t":1,"s":"b3","q":"以下哪項是火災營業中斷保險可以提供補償的範圍？","qi":[],"qe":"Which of the following is covered by fire business interruption insurance?","qei":[],"o":[{"z":"毛利潤(按保單的定義)","e":"Gross profit (as defined in the policy)"},{"z":"工資(有時包括毛利的計算)","e":"Wages (may include the calculation of gross profit)"},{"z":"由受保危險引致的必要附加費用","e":"Additional expenses incurred as a result of the insured peril"},{"z":"以上各項都是","e":"All of the above"}],"a":3,"x":"因受保危險而導致的毛利潤（按保單定義）損失、因受保危險而導致的必要和合理的附加費用及營業中斷期間支付的工資為保險範圍內。"},{"id":"B143","ch":1,"ref":"1.4.1a","t":1,"s":"by","q":"以下哪項不是火災營業中斷保險的保障範圍？","qi":[],"qe":"Which of the following is not covered by fire business interruption insurance?","qei":[],"o":[{"z":"由受保危險引起的毛利損失","e":"Loss of gross profit caused by insured peril"},{"z":"在營業中斷期間支付的工資","e":"Wages paid during an interruption period"},{"z":"因火災引致的財產損毀","e":"Damage of property caused by fire"},{"z":"由受保危險引致的附加開支","e":"Additional expenses incurred by an insured peril"}],"a":2,"x":"火災營業中斷保險則給他就火災等的另類後遺影響（如利潤損失、額外的費用等）提供補償。"},{"id":"B144","ch":1,"ref":"1.4.1a","t":1,"s":"b","q":"選擇以下那句是正確:","qi":[],"qe":"Choose the correct sentence below:","qei":[],"o":[{"z":"附加危險是非火災的風險，但習慣加在火險單上","e":"Additional hazards are risks other than fire, but are customarily added to fire insurance policies"},{"z":"「全險」保險保障每一種損失","e":"\"All risks\" insurance covers every kind of loss"},{"z":"汽車保險局是一個中央基金，去賠償所有交通意外的傷者","e":"The Automobile Insurance Bureau is a central fund that compensates all victims of traffic accidents."},{"z":"僱員補償條例令僱主要為僱員所有受傷負責","e":"Employees' Compensation Ordinance makes employers liable for all injuries suffered by employees"}],"a":0,"x":"附加危險難以說是與火災、閃電和「狹義的」爆炸這些基本危險相似，但傳統上可多付保費從而附加投保。"},{"id":"B145","ch":1,"ref":"1.4.1a(a)","t":1,"s":"b","q":"以下哪項屬於火災營業中斷保險的描述是正確的？","qi":["有效的索償必須提供財產損毀保證","是屬於一種權益保險","會對於所有收入提供保障","必須向同一保險人購買火險才獲保障"],"qe":"Which of the following is correct in describing fire business interruption insurance?","qei":["Must produce property damage warranty for effective claim","It is a pecuniary insurance","Will provide cover for all incomes","Must purchase fire insurance from the same insurer to be covered"],"o":[{"z":"i, ii","e":""},{"z":"i, iii","e":""},{"z":"ii, iii","e":""},{"z":"iii, iv","e":""}],"a":0,"x":"這是一種經濟權益保險，它與火險有別但卻又密切相關。火險就有形財產的損失或損害向被保險人提供彌償，火災營業中斷保險則給他就火災等的另類後遺影響（如利潤損失）提供補償。當然，營業中斷保險是可以連同其他種類的實物損害保障（比如海上保險保障）購買的。"},{"id":"B146","ch":1,"ref":"1.4.1a","t":1,"s":"b4","q":"在火災營業中斷保單索償中，就火災營業中斷保單中，必須有另一張保單保證，此保單為:","qi":[],"qe":"In a fire business interruption policy claim, there must be another policy covering the fire business interruption policy, which is:","qei":[],"o":[{"z":"火災損毀保證","e":"Fire Damage Guarantee"},{"z":"實物損害保障","e":"Physical damage coverage"},{"z":"財產損失保單保證","e":"Property Damage Policy Guarantee"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"火災營業中斷保單中須證明實物損害保障了同一位保單持有人的權益。"},{"id":"B147","ch":1,"ref":"1.4.1a(b)(i)","t":1,"s":"by","q":"典型的營業中斷保單規定引致營業中斷的財產損害，必須有另一保單予以賠償。這項保單條文一般稱為:","qi":[],"qe":"A typical business interruption policy provides that the property damage which has caused the business interruption must be covered by a valid claim under another policy. This policy provision is usually known as the:","qei":[],"o":[{"z":"火災損害保證","e":"Fire damage warranty"},{"z":"實物損害附帶條件","e":"Material damage proviso"},{"z":"財產損害保險要求","e":"Property damage insurance requirement"},{"z":"強制財產保險條件","e":"Compulsory property insurance condition"}],"a":1,"x":"典型的實物損害附帶條件規定，如果沒有實物損害保險保障了同一位保單持有人的利益，或相關的實物損害保險人既不承認責任亦不賠付引致營業中斷的實物損害的話，營業中斷保單就不會作出賠償。"},{"id":"B148","ch":1,"ref":"1.4.1a(c)","t":1,"s":"by","q":"營業中斷保險的保費是根據承保的時間加上甚麼來計算的？","qi":[],"qe":"The calculation of premium for business interruption insurance is based on insured period plus what else?","qei":[],"o":[{"z":"建築物的價值","e":"Value of buildings"},{"z":"火險單中的保費率","e":"Premium rate of fire insurance policy"},{"z":"建築物室內物件的價值","e":"Value of indoor contents of the building"},{"z":"租金的價值","e":"Rental value"}],"a":1,"x":"計算這種保險的保費是複雜的，首先以火險中建築物室內物件的保險費率作為基本費率，然後再根據保障的相關時間因素來計算附加費。"},{"id":"B149","ch":1,"ref":"1.4.1a(c)","t":1,"s":"by","q":"影響營業中斷保險的保費計算是受著中斷期間的時段及：","qi":[],"qe":"The factors affecting the calculation of premium for business interruption insurance are the interruption period and:","qei":[],"o":[{"z":"火險對建築物徵收的保費率","e":"Premium rate of fire insurance for buildings"},{"z":"火險中替建築物其室內物件的保險費率","e":"Premium rate of fire insurance for buildings' contents"},{"z":"毛利損失的保障額","e":"Sum insured for loss of gross profit"},{"z":"中段期間所支付的工資額","e":"Wages paid during an interruption period"}],"a":1,"x":"計算這種保險的保費是複雜的，首先以火險中建築物室內物件的保險費率作為基本費率，然後再根據保障的相關時間因素來計算附加費。"},{"id":"B150","ch":1,"ref":"1.4.1a(d)(i)","t":1,"s":"b","q":"營業中斷保險是為「利潤」作出保障，它亦稱為：","qi":[],"qe":"Business interruption insurance provides cover for \"\"profit\"\", it is also called:","qei":[],"o":[{"z":"中斷賠償","e":"Interruption compensation"},{"z":"損失利潤保障","e":"Profit loss protection"},{"z":"後果損失保險","e":"Consequential loss insurance"},{"z":"中斷期間","e":"Interruption period"}],"a":2,"x":"「營業中斷保險」是該險種最為趨時的名稱，但是有時也稱為「後果損失保險」或「利潤損失保險」。"},{"id":"B151","ch":1,"ref":"1.4.1a(d)(i)","t":1,"s":"by","q":"一種經濟權益保單，起初是以“利潤保單”來形容及後稱為：","qi":[],"qe":"A pecuniary insurance was first described as \"\"profit insurance\"\", and was later on called:","qei":[],"o":[{"z":"利潤損失保險","e":"Loss of profits insurance"},{"z":"後果損失保險","e":"Consequential loss insurance"},{"z":"營業中斷保險","e":"Business interruption insurance"},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"「營業中斷保險」是該險種最為趨時的名稱，但是有時也稱為「後果損失保險」或「利潤損失保險」。"},{"id":"B152","ch":1,"ref":"1.4.1a(d)(ii)","t":1,"s":"by","q":"火災營業中斷保險保單條款中，如受保危險發生後，可得到保障一段時間，這段時間稱為：","qi":[],"qe":"Under the terms of fire business interruption insurance, if the insured peril happens, there will be a period under cover which is called:","qei":[],"o":[{"z":"事件後保險期間","e":"After event insurance period"},{"z":"保單日期","e":"Policy date"},{"z":"保障期間","e":"Protection period"},{"z":"中斷期間","e":"Interruption period"}],"a":3,"x":"營業中斷保險而言，損失分散在接着受保意外事故的發生的一段時間內，必須為明確保單責任而給「中斷期間」（或彌償期間）設置期限。"},{"id":"B153","ch":1,"ref":"1.4.2","t":1,"s":"by","q":"大部份財產保險有為特定危險所造成之損失提供保障。此外，還有哪一類常見之保障？","qi":[],"qe":"Most property insurance will cover loss caused by specified perils. On top of that, what is another common cover?","qei":[],"o":[{"z":"全險","e":"All risks"},{"z":"指定危險","e":"Specified perils"},{"z":"單一危險","e":"Single peril"},{"z":"非指定危險","e":"Non-specified perils"}],"a":0,"x":"財產保障其中常見的為「全險」保障。"},{"id":"B154","ch":1,"ref":"1.4.2","t":1,"s":"b5y","q":"按照「全險」保險單，以下哪項是會得到賠償？","qi":[],"qe":"According to all risks insurance, which of the following will be covered?","qei":[],"o":[{"z":"意外火災引起的損失","e":"Loss caused by accidental fire"},{"z":"意外中遺失的一件珠寶","e":"Accidental loss of a piece of jewellery"},{"z":"被保險人被賊人用槍指嚇而被偷竊的手錶","e":"Theft of a watch of the insured under the threat of an armed robber"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"「全險」的意思是所有損失或損害均屬保障範圍内，具體豁免保障者則除外。一旦被保險人證明了受保財產的意外損失或損害後，保險人若要拒賠，便有法律責任證明某項除外責任是適用的。"},{"id":"B155","ch":1,"ref":"1.4.2","t":1,"s":"b3y","q":"有些財產保險都用「全險」的形式作保障，「全險」是指：","qi":[],"qe":"Some property insurance will use all risks for cover. All risks means:","qei":[],"o":[{"z":"沒有任何除外責任","e":"There is no exclusion"},{"z":"任何想像到的危險都可得到保障","e":"Any perils that can be imagined will be covered"},{"z":"除非屬於特定除外，否則所有損失或損壞都可得到保障","e":"All loss or damage is covered unless specifically excluded"},{"z":"在指定名單上的危險才可得到保障，其他則屬除外","e":"Only specified perils will be covered, others are exclusions"}],"a":2,"x":"「全險」的意思是所有損失或損害均屬保障範圍内，具體豁免保障者則除外。一旦被保險人證明了受保財產的意外損失或損害後，保險人若要拒賠，便有法律責任證明某項除外責任是適用的。"},{"id":"B156","ch":1,"ref":"1.4.2(b)","t":1,"s":"b","q":"「全險」保險通常是以引號來表達是因為:","qi":[],"qe":"\"All risks\" insurance is usually expressed in quotation marks because:","qei":[],"o":[{"z":"它是可以提供最全面的財產保障","e":"It provides the most comprehensive property protection"},{"z":"仍然有一些風險不能保障","e":"There are still some risks that cannot be guaranteed"},{"z":"是最新的財產保險","e":"Is the latest property insurance"},{"z":"它沒有指示投保哪一種財產","e":"It does not indicate which property to insure"}],"a":1,"x":"「全險」的意思是所有損失或損害均屬保障範圍内，具體豁免保障者則除外。一旦被保險人證明了受保財產的意外損失或損害後，保險人若要拒賠，便有法律責任證明某項除外責任是適用的。"},{"id":"B157","ch":1,"ref":"1.4.2(b)","t":1,"s":"b","q":"就「全險」保單而言，比例分攤是：","qi":[],"qe":"For all risks policies, average is:","qei":[],"o":[{"z":"從不適用","e":"Never applicable"},{"z":"總是適用","e":"Always applicable"},{"z":"通常適用於分開描述的項目上","e":"Usually applicable to items separately described"},{"z":"通常不適用於分開描述的項目上","e":"Usually not applicable to items separately described"}],"a":3,"x":"如果保障範圍包括了不指明物件，那麽有關保障就相當可能適用比例分攤條款。"},{"id":"B158","ch":1,"ref":"1.4.2(b)","t":1,"s":"b","q":"以下哪項不屬於「全險」保障的一般除外責任？","qi":[],"qe":"Which of the following is not an exclusion of \"\"all risks\"\" insurance?","qei":[],"o":[{"z":"損耗","e":"Wear and tear"},{"z":"折舊","e":"Depreciation"},{"z":"被保人的粗心大意所引致的損失","e":"Loss due to carelessness of the insured"},{"z":"基於逐漸運作而引起的損失（例如：生鏽）","e":"Loss due to gradual operations (e.g. rusting)"}],"a":2,"x":"「全險」的意思是所有損失或損害均屬保障範圍内，具體豁免保障者則除外。"},{"id":"B159","ch":1,"ref":"1.4.2(b)","t":1,"s":"by","q":"比例分攤在「全險」的保單當中是：","qi":[],"qe":"Average in \"\"all risks\"\" policies is:","qei":[],"o":[{"z":"經常適用","e":"Always applicable"},{"z":"經常適用於指明的物件","e":"Always applicable to specified items"},{"z":"經常適用於未有指明的物件","e":"Always applicable to unspecified items"},{"z":"完全不適用","e":"Not applicable at all"}],"a":2,"x":"如果保障範圍包括了不指明物件，那麽有關保障就相當可能適用比例分攤條款。"},{"id":"B160","ch":1,"ref":"1.4.2(c)","t":1,"s":"by","q":"「全險」的保費一般是根據兩方面而釐訂。其一是保額，另一方面則是：","qi":[],"qe":"The premium of \"\"all risks\"\" insurance is based on two factors, one is the sum insured, the other is:","qei":[],"o":[{"z":"被保人的性別","e":"Gender of the insured"},{"z":"被保人的居住地區","e":"Geographical area of residence of the insured"},{"z":"受保障的地區範圍","e":"Geographical area of cover"},{"z":"被保人的年齡","e":"Age of the insured"}],"a":2,"x":"保費必然是根據保額的一定比率來計算的。同時，受保障的地區範圍不同，保險費率便會有所不同（全球保障的保費自然是最高的）。"},{"id":"B161","ch":1,"ref":"1.4.2(d)(ii)","t":1,"s":"b4","q":"「全險」保障中為貴重物品提供「約定價值」保障是指：","qi":[],"qe":"\"\"Agreed values\"\" cover to insure high-value items of \"\"all risks\"\" insurance is:","qei":[],"o":[{"z":"就各項損失的支付金額均在事前議定","e":"Amount payable to all losses is agreed beforehand"},{"z":"全損索償金額均在事前議定","e":"Sum insured payable for total losses is agreed beforehand"},{"z":"部份損失索償金額均在事前議定","e":"Sum insured payable to part of the losses is agreed beforehand"},{"z":"對每項及各項的索償，保額與最低支付金額相同","e":"For every item and claim, the sum insured and the minimum payable amount is the same"}],"a":1,"x":"以「全險」方式承保貴重物品這個本來意圖仍然重要。給貴重物品承保「全保」，通常採用約定價值保障，而相關保額或約定價值相當可能是依據獨立而專業的估值來釐訂的。"},{"id":"B162","ch":1,"ref":"1.4.2(d)(ii)","t":1,"s":"by","q":"下列哪項或哪些對全險保單中的「約定價值」條款的評論是正確的？","qi":[],"qe":"Which of the following is correct in describing the terms of \"\"agreed values\"\" for all risks insurance?","qei":[],"o":[{"z":"它一般涉及貴重物品〈如古董花瓶〉","e":"It generally involves high-value items (e.g. antique vase)"},{"z":"全損時按保額賠付","e":"Sum insured payable for total losses"},{"z":"於保單開始時一般涉及專業估值","e":"Usually involves professional valuation before the policy is in effect"},{"z":"上述所有各項","e":"All of the above"}],"a":3,"x":"以「全險」方式承保貴重物品這個本來意圖仍然重要。給貴重物品承保「全保」，通常採用約定價值保障，而相關保額或約定價值相當可能是依據獨立而專業的估值來釐訂的。"},{"id":"B163","ch":1,"ref":"1.4.3(a)","t":1,"s":"by","q":"由竊匪引致的損毀於商業盜竊保險中是屬於：","qi":[],"qe":"The damage caused by theft of commercial theft insurance belongs to:","qei":[],"o":[{"z":"基本的除外責任","e":"Basic exclusion"},{"z":"保單中的保障範圍(涉及火災的損毀則除外)","e":"The scope of cover (damage by fire is excluded)"},{"z":"所有這類的損毀都自動成為保障範圍","e":"All such damages will automatically under cover"},{"z":"若額外附加保費，便成為可保的風險","e":"Will become insurable peril if paying extra premium"}],"a":1,"x":"商業盜竊保險承保由盜竊或企圖盜竊導致的損失或損害。"},{"id":"B164","ch":1,"ref":"1.4.3(b)","t":1,"s":"by","q":"以下哪項會受到基本盜竊保險的保障？","qi":[],"qe":"Which of the following will be covered in basic theft insurance?","qei":[],"o":[{"z":"串同職員盜竊的款項","e":"Money stolen with collusion of staff"},{"z":"賊人由沒有鎖上及已開啟的門入內盜竊的損失","e":"Loss caused by theft of burglar breaking into an unlocked and opened door"},{"z":"意圖毀滅証據而放火所導致的損毀","e":"Damage caused by arson intended to destroy evidence"},{"z":"以上所有各項都不是","e":"None of the above"}],"a":3,"x":"保單通常有保由於盜賊以強行及暴力方式進入（或離開）受保處所而引致的損害。"},{"id":"B165","ch":1,"ref":"1.4.3(a)","t":1,"s":"by","q":"大多數的盜竊保險只限於商業風險的保障，其保障範圍包括：","qi":[],"qe":"Most theft insurance is limited to cover commercial risks, the scope of cover includes:","qei":[],"o":[{"z":"因盜賊引起的損毀","e":"Damage caused by theft"},{"z":"以強行及暴力的方式進入或離開有關物業","e":"Forcible and violent entry to and exit from the insured premises"},{"z":"因盜竊而產生的實際損失","e":"Actual loss caused by theft"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"商業盜竊保險承保由盜竊或企圖盜竊導致的損失或損害。"},{"id":"B166","ch":1,"ref":"1.4.3(a)","t":1,"s":"b","q":"大多數盜竊保險的保障範圍屬於：","qi":[],"qe":"The cover for most theft insurance belongs to:","qei":[],"o":[{"z":"個人的風險","e":"Personal risks"},{"z":"第三者的傷害","e":"Third party damage"},{"z":"商業風險的保障","e":"Cover for commercial risks"},{"z":"家庭的保障","e":"Cover for family"}],"a":2,"x":"獨立存在的盜竊保單主要只用於商業風險。"},{"id":"B167","ch":1,"ref":"1.4.3(a)","t":1,"s":"by","q":"在本港簽發「商業盜竊保險單」，會提供以下哪項保障？","qi":[],"qe":"\"\"Commercial theft insurance policies\"\" issued in Hong Kong will provide which of the following cover?","qei":[],"o":[{"z":"因盜竊而造成火災損毀","e":"Damage in fire caused by theft"},{"z":"因盜竊而造成非火災損毀","e":"Damage in non-fire incident caused by theft"},{"z":"向因盜竊而造成傷害的職員提供個人意外權益","e":"Personal accident benefit for staff being hurt in a theft"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"商業盜竊保險承保由盜竊或企圖盜竊導致的損失或損害。竊賊縱火以毀滅盜竊證據這種事情間中會發生，但是，在盜竊保單中，由火災引起的損害屬於除外責任的範圍。"},{"id":"B168","ch":1,"ref":"1.4.3(a)&(b)","t":1,"s":"b3","q":"商業盜竊險涉及下列哪項或哪些？","qi":[],"qe":"Commercial theft insurance involves which of the following?","qei":[],"o":[{"z":"它屬於全險類別","e":"It belongs to \"\"all risks\"\" insurance category"},{"z":"匪徒於盜竊後縱火所引致的損失屬除外責任","e":"It is an exclusion for loss caused by arson after a theft"},{"z":"它要求是強行及暴力方式進入或離開受保處所","e":"It requires forcible and violent entry to or exit from the insured premises"},{"z":"上述所有各項均符合","e":"All of the above"}],"a":3,"x":"商業盜竊保險是「全險」的一類，承保由盜竊或企圖盜竊導致的損失或損害。竊賊縱火以毀滅盜竊證據這種事情間中會發生，但是，在盜竊保單中，由火災引起的損害屬於除外責任的範圍。"},{"id":"B169","ch":1,"ref":"1.4.3(b)","t":1,"s":"b4","q":"以下哪項對於盜竊保險的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing theft insurance?","qei":[],"o":[{"z":"盜竊必須以強行及暴力的方式進行或離開","e":"The theft must be done by forcible or violent entry to or exit from the premises"},{"z":"向盜賊引起被保險人財產的損毀提供保障","e":"Provides cover for property damage of the insured caused by theft"},{"z":"向由火災引起的損毀是受到保障的","e":"Damage caused by fire is covered"},{"z":"這業務的原來名稱為「入屋犯法」","e":"The business was called \"\"burglary\"\" insurance"}],"a":2,"x":"商業盜竊保險承保由盜竊或企圖盜竊導致的損失或損害。竊賊縱火以毀滅盜竊證據這種事情間中會發生，但是，在盜竊保單中，由火災引起的損害屬於除外責任的範圍。"},{"id":"B170","ch":1,"ref":"1.4.3(d)(iv)","t":1,"s":"b","q":"本港盜竊保險早期的名稱為：","qi":[],"qe":"The early title for theft insurance in Hong Kong was called:","qei":[],"o":[{"z":"盜竊保障","e":"Theft protection"},{"z":"入屋盜竊保險","e":"Burglary insurance"},{"z":"刑事盜用","e":"Criminal theft"},{"z":"忠誠保障保險","e":"Fidelity protection insurance"}],"a":1,"x":"這類業務的原來名稱是入屋盜竊保險，香港可能還有保險人仍然使用這個名稱。"},{"id":"B171","ch":1,"ref":"1.4.4(a)","t":1,"s":"b","q":"以下哪項屬於玻璃保險的描述？","qi":[],"qe":"Which of the following is a description of glass insurance?","qei":[],"o":[{"z":"它以「全險」方式提供保障","e":"It provides cover on the basis of \"\"all risks\"\""},{"z":"通常以維修方法處理","e":"Usually handled by repairing"},{"z":"玻璃破裂屬於除外責任","e":"Breakage of glass is an exclusion"},{"z":"以上各項皆是","e":"All of the above"}],"a":0,"x":"玻璃保險提供「全險」保險保障，範圍不僅包括被保固定玻璃的碎裂，還包括暫時用圍板擋住被保處所所需的任何費用。"},{"id":"B172","ch":1,"ref":"1.4.4.(a)","t":1,"s":"b35y","q":"一般「玻璃保險單」中，提供以下哪項保障？","qi":[],"qe":"Generally \"\"glass insurance policies\"\" provide which of the following covers?","qei":[],"o":[{"z":"因火災對受保玻璃的損毀","e":"Damage of the glass insured caused by fire"},{"z":"對受影響的物業進行圍板工程","e":"Boarding-up of the building being affected"},{"z":"因被破裂玻璃弄傷的職員提供「個人意外權益」","e":"Provide \"\"personal accident benefit\"\" for staff being hurt by broken glass"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"玻璃保險提供「全險」保險保障，範圍不僅包括被保固定玻璃的碎裂，還包括暫時用圍板擋住被保處所所需的任何費用。"},{"id":"B173","ch":1,"ref":"1.4.4(b)","t":1,"s":"by","q":"以下哪項會於玻璃保險中得到保障？","qi":[],"qe":"Which of the following will be covered by glass insurance?","qei":[],"o":[{"z":"與戰爭有關的損毀","e":"Damage related to war"},{"z":"由火災引起的損毀","e":"Damage related to fire"},{"z":"由一輛車子翻起的石子引致玻璃碎裂","e":"Breakage of glass as hit by pebbles caused from a running vehicle"},{"z":"由一名小偷打碎玻璃後遭盜竊的存貨","e":"Theft of inventory by a burglar after breaking the glass"}],"a":2,"x":"玻璃保險提供「全險」保險保障，範圍不僅包括被保固定玻璃的碎裂，還包括暫時用圍板擋住被保處所所需的任何費用。"},{"id":"B174","ch":1,"ref":"1.4.4(b)","t":1,"s":"by","q":"以下哪項不屬於玻璃保險的除外責任？","qi":[],"qe":"Which of the following is not an exclusion of glass insurance?","qei":[],"o":[{"z":"火災","e":"Fire"},{"z":"核子","e":"Nuclear war"},{"z":"受到汽車撞擊","e":"Hit by a vehicle"},{"z":"以上各項","e":"All of the above"}],"a":2,"x":"火災可由火險保單承保的風險，例如火災、風暴、地震等都被豁免承保。戰爭、核風險、恐怖主義等同屬除外責任。"},{"id":"B175","ch":1,"ref":"1.4.4(b)","t":1,"s":"b4y","q":"以下哪項引致玻璃碎裂的事項，是在基本的玻璃保單中不受到保障？","qi":[],"qe":"Which of the following incidents that caused breakage of glass will not be covered in a basic glass insurance policy?","qei":[],"o":[{"z":"消防員尋找救火通道時弄破的玻璃","e":"Glass broken by firemen when searching for the fire escape"},{"z":"遭汽車撞擊而被破壞的玻璃","e":"Damage of glass as hit by a vehicle"},{"z":"醉酒球迷擲汽水罐而破碎的玻璃","e":"Breakage of glass by the soda cans thrown by drunken football fans"},{"z":"投保人不小心弄碎的玻璃","e":"Breakage of glass by carelessness of the insured"}],"a":0,"x":"火災可由火險保單承保的風險，例如火災、風暴、地震等都被豁免承保。"},{"id":"B176","ch":1,"ref":"1.4.4(b)","t":1,"s":"b","q":"玻璃保險(Glass insurance) 在以下哪種情況下不受保障:","qi":[],"qe":"Glass insurance is not covered under which of the following circumstances:","qei":[],"o":[{"z":"被汽車撞毀","e":"hit by car"},{"z":"意外地被碎石引致碎裂","e":"Accidentally broken by gravel"},{"z":"被搬運中的貨物撞毀","e":"Crash by cargo being transported"},{"z":"消防員尋找救火通道時弄破的玻璃","e":"Glass broken by firefighters looking for fire escape"}],"a":3,"x":"消防員尋找救火通道時弄破的玻璃可由火險保單承保的風險。"},{"id":"B177","ch":1,"ref":"1.4.4(d)(iii)","t":1,"s":"b3y","q":"玻璃保險另外一個名稱：","qi":[],"qe":"The alternative title for glass insurance is:","qei":[],"o":[{"z":"平板玻璃保險","e":"Plate glass insurance"},{"z":"易碎物件保險","e":"Fragile item insurance"},{"z":"不動產保險","e":"Fixed asset insurance"},{"z":"公眾責任保險","e":"Public liability insurance"}],"a":0,"x":"這類業務原來稱為平板玻璃保險，香港可能還有保險人至今仍在使用這個名稱。"},{"id":"B178","ch":1,"ref":"1.4.5(a)","t":1,"s":"b","q":"以下哪項是金錢保險的保障範圍？","qi":[],"qe":"Which of the following scope is coverd in the money insurance?","qei":[],"o":[{"z":"因職員盜竊引致的損失","e":"Loss caused by theft committed by staff"},{"z":"職員運送金錢往銀行途中遭遇械劫","e":"Armed robbery when staff transporting the money to bank in transit"},{"z":"下班後將大量金錢存放於夾萬以外的地方","e":"Putting a large sum of money outside the safe after business hours"},{"z":"金錢存放於代理人家中達數星期之久","e":"Money placed in the agent's house for several weeks"}],"a":1,"x":"承保對象仍然以現金運送為主，也相當可能包括其他地點（指明職員的住所、被保險人的業務處所等）的金錢。"},{"id":"B179","ch":1,"ref":"1.4.5(a)","t":1,"s":"by","q":"金錢保單保障有效於：","qi":[],"qe":"The cover for money insurance is effective for:","qei":[],"o":[{"z":"火災中損失的金錢","e":"Loss of money in a fire"},{"z":"運送途中遭盜竊損失的金錢","e":"Loss of money by theft when in transit"},{"z":"準備存入銀行前意外損失的金錢","e":"Accidental loss of money before depositing to the bank"},{"z":"以上全部各項","e":"All of the above"}],"a":1,"x":"承保對象仍然以現金運送為主，也相當可能包括其他地點（指明職員的住所、被保險人的業務處所等）的金錢。"},{"id":"B180","ch":1,"ref":"1.4.5(a)","t":1,"s":"b","q":"以下哪項不屬於「金錢保險」保障範圍的特點？","qi":[],"qe":"Which of the following is not a feature of cover for \"\"money insurance\"\"?","qei":[],"o":[{"z":"保障以「全險」的形式為基礎","e":"The cover is on an \"\"all risks\"\" basis"},{"z":"由職員盜竊，行為引致的金錢損失不受保障","e":"Loss of money by theft committed by staff is not covered"},{"z":"金錢的含義只限於法定貨幣，如「鈔票及硬幣」","e":"The definition of money is limited to legal tender, such as \"\"notes and coins\"\""},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"保單中的含義比其為法定貨幣的含義更為廣泛，連支票、銀行本票及其他形式的金融文件都包括在内。"},{"id":"B181","ch":1,"ref":"1.4.5(a)(ii)","t":1,"s":"b4y","q":"以下哪項關於金錢保險屬正確的？","qi":[],"qe":"Which of the following is correct about money insurance?","qei":[],"o":[{"z":"保障包括金錢以外的其他標的物，例如支票、匯票等","e":"It covers subject matters beyond money, such as cheques, bank drafts, etc."},{"z":"只承保火災","e":"It covers fire only"},{"z":"所有保單自動承保職員住處","e":"All policies automatically cover the homes of staff"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"保單中的含義比其為法定貨幣的含義更為廣泛，連支票、銀行本票及其他形式的金融文件都包括在内。"},{"id":"B182","ch":1,"ref":"1.4.5(c)","t":1,"s":"by","q":"以下哪項是計算金錢保險保單的保費根據？","qi":[],"qe":"Which of the following is a basis for calculating the premium of money insurance policies?","qei":[],"o":[{"z":"通常是有固定保額","e":"Usually has a fixed sum insured"},{"z":"以被保險人全年攜帶的最大金額","e":"Based on the largest amount of money in the year carried by the insured"},{"z":"以被保險人存放於夾萬內的最高金額","e":"Based on the largest amount of money kept in the safe by the insured"},{"z":"通常是根據被保險人全年於銀行內往來的金額","e":"Usually based on the annual carryings of money of the insured to and from the bank"}],"a":3,"x":"保費以全年進出銀行的金額的估計總數的一個比率作為標準，因此，須支付臨時保費，到取得實際金額後再作全年的調整。"},{"id":"B183","ch":1,"ref":"1.4.5(d)(ii)","t":1,"s":"by","q":"金錢保障保險擴展後的保障包括以下哪項？","qi":[],"qe":"The cover of extended money insurance includes which of the following?","qei":[],"o":[{"z":"被賊人打劫失去的財物","e":"Loss of property by robbery"},{"z":"受僱僱員在被劫時受傷","e":"Injuries caused to staff by thieves"},{"z":"接收偽鈔的損失","e":"Loss caused by accepting counterfeit money"},{"z":"運送現金時做成的損失","e":"Loss when transporting cash in transit"}],"a":1,"x":"金錢保單中附加人身意外保險保障以承保職員因遭盜賊襲擊而受傷，是頗為普遍的做法。"},{"id":"B184","ch":1,"ref":"1.4.6(a)","t":1,"s":"b345y","q":"以下哪項不是忠實保證保險的陳述：","qi":[],"qe":"Which of the following is not a description of fidelity guarantee insurance:","qei":[],"o":[{"z":"必定嚴格規定與錢有關","e":"Must be strictly related to money"},{"z":"通常職員一般的錯誤及疏忽是不保的","e":"General errors and omissions of staff are not covered"},{"z":"保障可以為不記名/總括","e":"It can be blanket cover"},{"z":"以上各項皆是","e":"All of the above"}],"a":0,"x":"忠實保證保險屬於經濟權益保險，承保僱主因任何人在受其僱用的期間進行任何欺詐、盜竊或不誠實等行為而導致的金錢或財產損失。保單承保職員的不誠實行為，因此一般性的錯誤和疏忽是不保的。"},{"id":"B185","ch":1,"ref":"1.4.6(b)(ii)","t":1,"s":"by","q":"受忠實保證保障的一名僱員偷竊，僱主後來取回失去的金錢，亦沒有通知保險人，其後，同一名僱員再次偷去大筆金錢，被保險人向保險公司申請索償，此索償：","qi":[],"qe":"A staff under the cover of fidelity guarantee insurance commits theft, the employer gets back the money stolen and does not report to the insurer. Afterwards, the same staff steals another large sum of money and the insured makes a claim to the insurance company. The claim:","qei":[],"o":[{"z":"全數可以獲得正常賠償","e":"Will be fully compensated as normal"},{"z":"全數不會獲得賠償","e":"Will not be compensated"},{"z":"可以獲得索償，但視乎是否已繳交額外保費","e":"Can be compensated depending on whether additional premium has been paid"},{"z":"可以獲得「通融」賠償","e":"Can receive \"\"ex gratia\"\" compensation"}],"a":1,"x":"保單規定被保險人必須在知悉或懷疑員工有不誠實行為後的比如 7天內，以書面形式向保險人報告，保險人會暫時中止就該員工給與的保險保障，直至情況令其滿意為止。另外，保單或會規定於上述發現之後，自動並立即停止就該名員工提供保證。"},{"id":"B186","ch":1,"ref":"1.4.6(a)(ii)","t":1,"s":"by","q":"忠實保證保障以下那項人士？","qi":[],"qe":"Fidelity guarantee insurance covers which of the following people?","qei":[],"o":[{"z":"一名記名之人士","e":"An individually named person"},{"z":"一系列記名人士","e":"A group of named people"},{"z":"以不記名/總括形式登記的所有員工","e":"All staff under blanket cover"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"個人保障、組合保障及不記名/總括保障均為保障的方式。"},{"id":"B187","ch":1,"ref":"1.4.6(d)(ii)","t":1,"s":"by","q":"以下哪項對忠實保險的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing fidelity guarantee insurance?","qei":[],"o":[{"z":"只對挪用公款作出賠償","e":"Only compensates for embezzlement"},{"z":"對於由經擔保的職員作出的不誠實行為需作出申報","e":"Must report the dishonest behaviour of the guaranteed staff"},{"z":"核查及監察制度同樣屬於極為重要","e":"System of check and supervision is very important"},{"z":"對沒有履行責任的員工，保證人有追償權","e":"The guarantor has the right of recovery to staff who does not fulfill his duties"}],"a":0,"x":"忠實保證保險承保僱主因任何人在受其僱用的期間進行任何欺詐、盜竊或不誠實等行為而導致的金錢或財產損失。不誠實的僱員在法律上必須向保證人（在這裏是指保險人），就其因該名僱員的過失而作出的支付，負責作出償付。核查及監督制度這是重要的核保考慮。未經保險人的書面同意之前，已經核准的制度不能更改。"},{"id":"B188","ch":1,"ref":"1.4.7(d)(ii)","t":1,"s":"by","q":"「保證」須就一項反擔保作保障，意思是保險人：","qi":[],"qe":"\"\"Bonds\"\" provides cover for a counter guarantee, which means the insurer:","qei":[],"o":[{"z":"需交額外保費作保障","e":"Must pay extra premium for the cover"},{"z":"購買再保險","e":"Purchase reinsurance"},{"z":"可為得到進一步資料，向資詢人查問","e":"Question the reference to get further information"},{"z":"在「保證」的事項上，須經保證人的董事局核實","e":"On the item of \"\"bond\"\", must be verified by the director of the person guaranteed"}],"a":3,"x":"擔保人通常要求被保證人的董事、其母公司的董事、或其他他接受的人向他提供個人反擔保，以保障他賠付後的追償機會。"},{"id":"B189","ch":1,"ref":"1.4.7(b)","t":1,"s":"by","q":"以下哪項對於保證保險的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing bond insurance?","qei":[],"o":[{"z":"它必須以書面形式發出","e":"It must be issued in writing"},{"z":"必須加上印章及簽署","e":"It must be under seal and signed"},{"z":"保證的索償程序非常複雜","e":"Claim procedure for bonds is very complicated"},{"z":"保險人有權追討已償付的金額","e":"Insurer acquires rights of recovery for the compensation paid"}],"a":2,"x":"保證書上並未提及索償程序複雜"},{"id":"B190","ch":1,"ref":"1.4.7(b)","t":1,"s":"by","q":"以下哪句子能正確地形容處理履約保證索償的情況?","qi":[],"qe":"Which of the following can correctly describe the claim of a performance bond?","qei":[],"o":[{"z":"比處理其它一般保險索償更為複雜","e":"Its handling is more complicated than other general insurance claim"},{"z":"比處理其它一般保險索償容易","e":"Its handling is easier than other general insurance claim"},{"z":"必須由法庭裁決","e":"Must be ruled by the court of law"},{"z":"以上全部都不是","e":"None of the above"}],"a":1,"x":"保證人如未能履行其對權利人的責任，權利人可以向擔保人索取補償，索償上不需與一般保險上了解近因及除外責任等。"},{"id":"B191","ch":1,"ref":"1.4.7(b)","t":1,"s":"b","q":"在忠實保證或保證，「反擔保」是指一個協議去保障","qi":[],"qe":": In a fidelity bond or guarantee, a \"counter-guarantee\" refers to an agreement to guarantee:","qei":[],"o":[{"z":"擔保人","e":"Surety"},{"z":"委託人","e":"The owner"},{"z":"經保證的人","e":"Personal warranties"},{"z":"委託人和經保證的人","e":"The owner and personal warranties"}],"a":0,"x":"擔保人通常要求被保證人的董事、其母公司的董事、或其他他接受的人向他提供個人反擔保，以保障他賠付後的追償機會。"},{"id":"B192","ch":1,"ref":"1.4.7(d)(ii)","t":1,"s":"b3y","q":"反擔保是指：","qi":[],"qe":"Counter guarantees are:","qei":[],"o":[{"z":"額外保費","e":"Additional premium"},{"z":"風險的再評估","e":"Risk re-assessment"},{"z":"獨立諮詢代言人的保費率","e":"Premium rate for independent reference spokesperson"},{"z":"抵押性的保障，由承建商董事作個人擔保的保障","e":"Mortgaged cover by the personal guarantee of the director of contractor"}],"a":3,"x":"保證書是個涉及三方(即被保證人)、權利人和擔保人(或保證人)的書面協議，據此，擔保人以被保證人支付一筆費用為代價，就被保證人的責任——可以是法定責任、合約責任等，向權利人提供財務保證。"},{"id":"B193","ch":1,"ref":"1.4.7","t":1,"s":"b","q":"保證是一個協議:","qi":[],"qe":"Warranties is an agreement:","qei":[],"o":[{"z":"有兩方參與","e":"With two participants"},{"z":"有三方參與","e":"With three participants"},{"z":"單方面擔保保險公司執行","e":"Unilateral guarantee insurance company execution"},{"z":"以上全部都不是","e":"None of the above"}],"a":1,"x":"保證書是個涉及三方(即被保證人)、權利人和擔保人(或保證人)的書面協議，據此，擔保人以被保證人支付一筆費用為代價，就被保證人的責任——可以是法定責任、合約責任等，向權利人提供財務保證。"},{"id":"B194","ch":1,"ref":"1.5.1(a)","t":1,"s":"by","q":"鍋爐保險提供兩項保障，包括爆炸及：","qi":[],"qe":"Boiler explosion insurance provides two types of cover, including explosion and:","qei":[],"o":[{"z":"鍋爐倒塌","e":"Boiler collapse"},{"z":"部份或全部鍋爐被盜","e":"Theft of boiler in part or as a whole"},{"z":"鍋爐被人惡意損毀","e":"Intentional damage to the boiler"},{"z":"影響受保建築物及鍋爐的火災","e":"Fire affecting the building and boiler insured"}],"a":0,"x":"鍋爐爆炸保險承保鍋爐或壓力容器「在正常運作過程中」爆炸（屬物理性質而非化學性質的）或倒塌所帶來的損失。"},{"id":"B195","ch":1,"ref":"1.5.1(a)","t":1,"s":"by","q":"以下哪項對鍋爐爆炸保險的陳述並不正確？","qi":[],"qe":"Which of the following is incorrect in describing boiler explosion insurance?","qei":[],"o":[{"z":"賠償對第三者財產造成的損害","e":"Compensates for the damage of third party property"},{"z":"只保障被保險人的財產損失","e":"Only covers damage of the insured's property"},{"z":"保障被保險及第三者的財產損失","e":"Covers the loss of property for the insured and third party"},{"z":"鍋爐爆炸造成損失是發生在正常工作時間","e":"Loss caused by the boiler explosion happens during ordinary working"}],"a":1,"x":"鍋爐爆炸保險可採用獨立的保單、或擴大範圍的機器損壞保單或火險單承保。"},{"id":"B196","ch":1,"ref":"1.5.1(a)","t":1,"s":"by","q":"以下哪項是鍋爐爆炸中的可保事項？","qi":[],"qe":"Which of the following is covered by boiler explosion insurance?","qei":[],"o":[{"z":"鍋爐倒塌的後果損失","e":"Consequential loss of collapse of boiler"},{"z":"酒店的鍋爐被偷去","e":"Boiler of a hotel is stolen"},{"z":"鍋爐火災引致第三者受傷","e":"Third party injury caused by the fire of boiler"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"就第三者財產損失、死亡或身體受傷承擔的法律責任，以及訟費及開支為鍋爐爆炸保險的保障範圍。"},{"id":"B197","ch":1,"ref":"1.5.1(a)","t":1,"s":"b","q":"鍋爐爆炸保單的基本保障：","qi":[],"qe":"The basic cover of boiler explosion insurance policy:","qei":[],"o":[{"z":"包括財產損毀及法律責任索償","e":"Includes damage of property and legal liability claims"},{"z":"針對鍋爐爆炸或倒塌帶來的損失","e":"Specifically deals with the consequence of explosion or collapse of boiler"},{"z":"涉及在正常工作過程中對鍋爐造成的損毀","e":"Involves the damage caused by boiler whilst in the course of ordinary working"},{"z":"與上述各項說明相符","e":"Fits with all of the above"}],"a":3,"x":"鍋爐爆炸保險承保鍋爐或壓力容器「在正常運作過程中」爆炸（屬物理性質而非化學性質的）或倒塌所帶來的損失，同時就第三者財產損失、死亡或身體受傷承擔的法律責任，以及訟費及開支為鍋爐爆炸保險的保障範圍。"},{"id":"B198","ch":1,"ref":"1.5.1(a)(iii)","t":1,"s":"by","q":"「鍋爐爆炸保險」較可能提供以下哪項保障？","qi":[],"qe":"Boiler explosion insurance is likely to cover which of the following?","qei":[],"o":[{"z":"僅對第三者財產的損毀","e":"Only damage to the third party property"},{"z":"僅對第三者的受傷的責任","e":"Only liability for the injury of third party"},{"z":"財產責任而已","e":"Property liability only"},{"z":"財產及十足的第三者責任","e":"Property and full third party liability"}],"a":3,"x":"鍋爐爆炸保險承保鍋爐或壓力容器「在正常運作過程中」爆炸（屬物理性質而非化學性質的）或倒塌所帶來的損失，同時就第三者財產損失、死亡或身體受傷承擔的法律責任，以及訟費及開支為鍋爐爆炸保險的保障範圍。"},{"id":"B199","ch":1,"ref":"1.5.1(b)","t":1,"s":"b5y","q":"以下哪項是鍋爐爆炸保險的除外責任?","qi":[],"qe":"Which of the following is an exclusion of boiler explosion insurance?","qei":[],"o":[{"z":"戰爭或有關事項引起的損失","e":"Loss caused by war or related incidents"},{"z":"被保險人故意疏忽所引起的損失","e":"Loss caused by wilful neglect by the insured"},{"z":"在火險保單中受保的風險","e":"Risks insured in a fire insurance policy"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"除外責任為:通常由其他保單承保的風險：例如火災和附加危險。「標準」的除外責任：例如戰爭、核風險及恐怖主義。不適當的保障：例如被保險人的故意作為和故意忽略，及損耗等。"},{"id":"B200","ch":1,"ref":"1.5.2(a)","t":1,"s":"b","q":"機器損壞保險保單，是為受保之物件的「不可預見和突如其來」的物質損失或損害提供保障，以下哪項屬於該類保障：","qi":[],"qe":"Machinery breakdown insurance provides cover for \"\"unforeseen and sudden\"\" physical loss of or damage to insured items. Which of the following belongs to such cover:","qei":[],"o":[{"z":"責任保險","e":"Liability insurance"},{"z":"權益保險","e":"Pecuniary insurance"},{"z":"財產保險","e":"Property insurance"},{"z":"後果損失的保險","e":"Consequential loss insurance"}],"a":2,"x":"機器損壞保險為1財產保險。"},{"id":"B201","ch":1,"ref":"1.5.2(a)","t":1,"s":"b4y","q":"機器損壞保險中，為受保機器的實質損失或毀壞提供保險，以下哪類是所保的？","qi":[],"qe":"Machinery breakdown insurance provides cover for physical loss of or damage to insured machinery. Which of the following is covered?","qei":[],"o":[{"z":"由意外引起","e":"Caused by accident"},{"z":"不可預見及突如其來","e":"Unforeseen and sudden"},{"z":"被保險人造成的毀壞","e":"Damage caused by the insured"},{"z":"不被任何其他公司保的","e":"Not covered by any other companies"}],"a":1,"x":"機器損壞保單則就已經安裝完畢並處於運作或靜止狀態的受保裝置、機器、設備、電腦等遭受「不可預見和突如其來」的物理損失或損害提供「全險」保險保障。"},{"id":"B202","ch":1,"ref":"1.5.2(b)","t":1,"s":"by","q":"機器損壞的除外責任是：","qi":[],"qe":"An exclusion of machinery breakdown insurance is:","qei":[],"o":[{"z":"在戰爭或有關事件中損失","e":"Loss caused by war or related incidents"},{"z":"低於免賠額以下的損失","e":"Loss below deductible"},{"z":"機器損壞所導致的後果損失","e":"Consequential loss arising from machinery breakdown"},{"z":"以上全部各項","e":"All of the above"}],"a":3,"x":"以上三項均為除外責任例子。"},{"id":"B203","ch":1,"ref":"1.5.2","t":1,"s":"b","q":"機器損壞保險包括:","qi":[],"qe":"Machinery Breakdown Insurance cover:","qei":[],"o":[{"z":"受保機器損毀","e":"Damage to insured machinery"},{"z":"後果損失，因機械故障而出現","e":"Consequential losses, occurring due to mechanical failure"},{"z":"地震導致受保機器損毀","e":"Insured machinery is damaged due to an earthquake"},{"z":"因電力導致火災而將受保機器損毀","e":"Damage to insured machinery due to fire caused by electricity"}],"a":0,"x":"因機器故障而導致其他的損失是除外責任，並不是保障受保機器的保險範圍。"},{"id":"B204","ch":1,"ref":"1.5.2(b)","t":1,"s":"b","q":"在通常的機器損壞保險保單中，以下哪一項不是除外責任？","qi":[],"qe":"Which of the following is not an exclusion of general machinery breakdown insurance policies?","qei":[],"o":[{"z":"戰爭和相關風險","e":"War and related risks"},{"z":"受保機器自身的損壞","e":"Breakdown of the insured machinery itself"},{"z":"保單中的免賠額","e":"Policy deductible"},{"z":"由機器損壞而引致的後果損失","e":"Consequential loss arising from machinery breakdown"}],"a":1,"x":"機器狀況因正常使用而惡化及早已存在的缺陷是除外責任。"},{"id":"B205","ch":1,"ref":"1.5.3(a)(i)","t":1,"s":"by","q":"建築全險的第一部份以「全險」提供財產保障，第二部份則：","qi":[],"qe":"The section I of contractors' all risks insurance provides property insurance on an \"\"all risks\"\" basis, and the section II:","qei":[],"o":[{"z":"對公眾責任提供保障","e":"Provides public liability insurance"},{"z":"不設任何免賠額","e":"Has no deductible"},{"z":"提供經濟權益的保障","e":"Provides pecuniary insurance"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"第二部分：承保對因建築工程導致第三者受傷或財產損失所負的法律責任。"},{"id":"B206","ch":1,"ref":"1.5.3(a)","t":1,"s":"b","q":"一般以本港提供的建築全險通常包括：","qi":[],"qe":"Usually the contractors' all risks insurance provided in Hong Kong includes:","qei":[],"o":[{"z":"財產及責任保險的組合","e":"A combination of property and liability insurance"},{"z":"財產保險而已","e":"Property insurance only"},{"z":"責任保險而已","e":"Liability insurance only"},{"z":"經濟權益保險","e":"Pecuniary insurance"}],"a":0,"x":"建築全險包括財產及法律責任保障。"},{"id":"B207","ch":1,"ref":"1.5.3(a)","t":1,"s":"b","q":"建築「全險」保險一般包括兩個部分組成:","qi":["建築工人的勞工保險","承建商作出保證保險","指明工程的財產","工程引致第三者傷亡或財產損毀"],"qe":"Construction \"all risks\" insurance generally consists of two parts:","qei":["Labor insurance for construction workers","Contractor provides warranty insurance","Property specifying the project","The project causes casualties or property damage to third parties\""],"o":[{"z":"i & ii","e":""},{"z":"i & iii","e":""},{"z":"ii & iii","e":""},{"z":"iii & iv","e":""}],"a":3,"x":"建築全險包括財產及法律責任保障。"},{"id":"B208","ch":1,"ref":"1.5.3(a)","t":1,"s":"b4","q":"「建築全險保單」中的第一部份，會提供以下哪項保障？","qi":[],"qe":"The section I of \"\"contractors' all risks insurance\"\" will provide which of the following?","qei":[],"o":[{"z":"因颱風對正在進行的工程損毀","e":"Damage of project in progress caused by typhoon"},{"z":"因錯誤設計而導致損毀","e":"Damage caused by faulty design"},{"z":"實際點算後的失竊","e":"Theft after taking an inventory"},{"z":"以上所有各項","e":"All of the above"}],"a":0,"x":"第一部分：就指明的財產以「全險」方式提供財產保險。"},{"id":"B209","ch":1,"ref":"1.5.3(a)","t":1,"s":"by","q":"一般建築全險有兩部份，它們分別是:","qi":[],"qe":"There are two sections in contractors' all risks insurance, which are:","qei":[],"o":[{"z":"第一部份是提供財產保險,第二部份是提供責任保險","e":"Section I provides property insurance, section II provides liability insurance"},{"z":"第一部份是提供責任保險,第二部份是提供經濟權益保險","e":"Section I provides liability insurance, section II provides pecuniary insurance"},{"z":"第一部份是提供強制性保險,第二部份是提供自願性保險","e":"Section I provides mandatory insurance, section II provides voluntary insurance"},{"z":"第一部份是提供財產保險,第二部份是提供損害賠償","e":"Section I provides property insurance, section II provides damage insurance"}],"a":0,"x":"建築全險包括財產及法律責任保障。"},{"id":"B210","ch":1,"ref":"1.5.3(a)","t":1,"s":"b","q":"甚麼險種是保障一個承辦商當遇到它的僱員意外弄傷他人?","qi":[],"qe":"What insurance covers a contractor if one of its employees accidentally injures someone else?","qei":[],"o":[{"z":"建築責任","e":"Construction liability"},{"z":"建築保障","e":"Contractor insurance"},{"z":"物主、業主及租客的責任","e":"Liabilities of Owners, Landlords and Tenants"},{"z":"物主、業主的責任","e":"Liabilities of Owners, Landlords"}],"a":1,"x":"建築工程「全險」保險承保對因建築工程導致第三者受傷或財產損失所負的法律責任。"},{"id":"B211","ch":1,"ref":"1.5.3(a)","t":1,"s":"b","q":"一般建築全險有兩部份，第二部份是:","qi":[],"qe":"Generally, comprehensive construction insurance has two parts. The second part is:","qei":[],"o":[{"z":"第二部份是提供責任保險","e":"The second part is to provide liability insurance"},{"z":"第二部份是提供經濟權益保險","e":"The second part is to provide economic rights insurance"},{"z":"第二部份是提供自願性保險","e":"The second part is to provide voluntary insurance"},{"z":"第二部份是提供財產保險","e":"The second part is to provide property insurance"}],"a":0,"x":"建築全險包括財產及法律責任保障。"},{"id":"B212","ch":1,"ref":"1.5.3(b)(ii)","t":1,"s":"b5","q":"某承建商於距離中銀大廈數米外之建築地盤動工，並購有建築全險保障，以下哪項並不屬於該保險的保障範圍，但可加費用另購的項目？","qi":[],"qe":"A contractor with contractors' all risks insurance works on a site few metres away from the Bank of China Tower. Which of the following is not covered by the insurance but can be added for extra premium?","qei":[],"o":[{"z":"對其他建築物造成的減弱或除去支撐的法律責任","e":"Legal liability in respect of weakening or removal of support to other buildings"},{"z":"爆炸","e":"Explosion"},{"z":"對減弱或除去支撐所引致的“自我損害”","e":"\"\"Self-destruction\"\" caused by weakening or removal of support"},{"z":"對減弱或除去支撐所引致的“自我損害”之法律責任","e":"Legal liability of \"\"self-destruction\"\" caused by weakening or removal of support"}],"a":0,"x":"可以額外支付保費購買批單來承保由豁免承保就屬於被保險人的財產(例如保單第一部分所承保的工程)的損失或損害承擔的法律責任，及多種危險，包括減弱或消除支撐力"},{"id":"B213","ch":1,"ref":"1.5.3(b)(iii)","t":1,"s":"by","q":"以下哪項對於建築全險的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing contractors' all risks insurance?","qei":[],"o":[{"z":"減弱其他建築物支撐力是屬於除外責任，但可以付出額外保費，使之附加於保單上","e":"Weakening the support to other buildings is an exclusion, but can be added to the policy for extra premium"},{"z":"第一部份的保障以「全險」形式作為保障，包括錯誤設計","e":"The section I is on an \"\"all risks\"\" basis, including faulty design"},{"z":"第一部份或第二部份都設有免賠額","e":"Section I or section II have deductibles"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"第一部分：就指明的財產以「全險」方式提供財產保險。受保財產相當可能包括合約工程和任何由委託人供應的物料，附加承保建築用的裝置、設備和機械也行。清除殘損物的費用也可包括在內。"},{"id":"B214","ch":1,"ref":"1.5.3(b)","t":1,"s":"by","q":"以下哪項較有可能是全險建築保險的除外責任？","qi":[],"qe":"Which of the following is likely to be an exclusion of contractors' all risks insurance?","qei":[],"o":[{"z":"在保單的責任部分下設定一個免賠額","e":"Set up a deductible under the liability section of the policy"},{"z":"由於減弱支撐所造成的第三者責任","e":"Third party liability in respect of weakening of support"},{"z":"於實際點算時才發現的損失","e":"Loss discovered when taking inventory"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"免賠額、減弱支撐及盤點時才發現的損失均屬除外責任。"},{"id":"B215","ch":1,"ref":"1.5.3(b)","t":1,"s":"by","q":"對其他建築物造成的支撐減弱通常：","qi":[],"qe":"Weakening of support to other buildings usually is:","qei":[],"o":[{"z":"已經包括在建築全險中的責任保障部份","e":"Already included in the liability insurance section of contractors' all risks insurance"},{"z":"已經包括在建築全險中的財產保險保障部份","e":"Already included in the property insurance section of contractors' all risks insurance"},{"z":"在損失金額較免賠額為大時，已經包括在建築全險中","e":"Already included in the contractors' all risk insurance when the loss amount is greater than the deductible"},{"z":"是建築全險的除外責任","e":"Is an exclusion of contractors' all risks insurance"}],"a":3,"x":"減弱支撐屬除外責任。"},{"id":"B216","ch":1,"ref":"1.5.3(b)","t":1,"s":"b3y","q":"以下哪項不屬於建築全險的保障範圍？","qi":[],"qe":"Which of the following is not covered in contractors' all risks insurance?","qei":[],"o":[{"z":"因水災引致建築物料損失或毀壞","e":"Loss or damage of construction materials caused by flooding"},{"z":"因火災引致建築物料損失或毀壞","e":"Loss or damage of construction materials caused by fire"},{"z":"實際點算時才發現之損失","e":"Loss discovered when taking an inventory"},{"z":"因颱風引致的損毀","e":"Damage caused by typhoon"}],"a":2,"x":"盤點時才發現的損失屬除外責任。"},{"id":"B217","ch":1,"ref":"1.5.3(a)(ii)","t":1,"s":"by","q":"在建築全險第二部份保障中所提供保障範圍可能是：","qi":[],"qe":"The cover of section II for contractors' all risks insurance is:","qei":[],"o":[{"z":"對其他建築物造成的減弱支撐力","e":"Weakening of support to other buildings"},{"z":"對第三者造成的財產上損失","e":"Loss of property for third party"},{"z":"由第一部分保障所引致的責任","e":"Liability caused by the cover in section I"},{"z":"以上各項都是","e":"All of the above"}],"a":1,"x":"第二部分：承保對因建築工程導致第三者受傷或財產損失所負的法律責任。"},{"id":"B218","ch":1,"ref":"1.5.3(b)(i)","t":1,"s":"by","q":"建築全險對以下哪項索償不會作出賠償？","qi":[],"qe":"Contractors' all risks insurance will not compensate for which of the following?","qei":[],"o":[{"z":"委託人供應的物料","e":"Materials supplied by the principal"},{"z":"實際點算時才發現的損失","e":"Losses only discovered on taking an inventory"},{"z":"第三者的財產損毀","e":"Damage of property to third party"},{"z":"清理殘損物的開支","e":"Expense in clearing debris"}],"a":1,"x":"盤點時才發現的損失屬除外責任。"},{"id":"B219","ch":1,"ref":"1.6","t":1,"s":"by","q":"以下哪項不屬於強制性責任保險？","qi":[],"qe":"Which of the following is not a mandatory liability insurance?","qei":[],"o":[{"z":"汽車第三者保險","e":"Third party motor insurance"},{"z":"公眾責任保險","e":"Public liability insurance"},{"z":"僱主補償保險","e":"Employee's compensation insurance"},{"z":"以上各項皆不屬於強制性責任保險","e":"None of the above is mandatory liability insurance"}],"a":1,"x":"公眾責任保險並不是法律上強制性保險。"},{"id":"B220","ch":1,"ref":"1.6","t":1,"s":"by","q":"以下哪兩項是責任保險的保障範圍:","qi":["由蓄意的暴力所引起的責任","普通法下的責任(並非蓄意)","法定要求的責任","根據保險條款而自願承擔的責任"],"qe":"Which two of the following are covered in liability insurance:","qei":["Liability arising from intentional violence","Liability under Common Law (not intentional)","Liability from statute","Liability undertaken voluntarily according to insurance terms"],"o":[{"z":"i , ii","e":""},{"z":"i , iii","e":""},{"z":"ii , iii","e":""},{"z":"iii, iv","e":""}],"a":2,"x":"各別保障所保的法律責任可能因法規（即由立法機關制定的法律）及/或普通法（通常因疏忽）而產生。法律責任也可以在合約下產生，然而，合約附加的責任，即藉協議承擔的法侓責任，通常屬於責任保險保障的除外責任。"},{"id":"B221","ch":1,"ref":"1.6","t":1,"s":"b3y","q":"合約下產生的責任，在責任保險中：","qi":[],"qe":"In liability insurance, liability assumed under a contract:","qei":[],"o":[{"z":"法律要求下必須執行","e":"Must be executed as required by law"},{"z":"是特定除外","e":"Is a specific exclusion"},{"z":"保險人必須執行","e":"Must be executed by insurer"},{"z":"被保險人必須執行","e":"Must be executed by the insured"}],"a":1,"x":"合約附加的責任，即藉協議承擔的法侓責任，通常屬於責任保險保障的除外責任。"},{"id":"B222","ch":1,"ref":"1.6","t":1,"s":"b","q":"責任保險可能從法定要求(條例的條款)及普通法規(疏忽)下及合約下(協議下)產生，下列那項是可保的？","qi":[],"qe":"Liability insurance may arise from Statute (law made by the legislature) and Common Law (negligence) and Contract (agreement). Which of the following is covered?","qei":[],"o":[{"z":"法定要求而已","e":"Statutory requirement only"},{"z":"普通法而已","e":"Common Law only"},{"z":"法定及普通法而已","e":"Statutory requirement and Common Law only"},{"z":"法定、普通法及合約下的責任","e":"Liabilities arise from Statute, Common Law and Contract"}],"a":2,"x":"各別保障所保的法律責任可能因法規（即由立法機關制定的法律）及/或普通法（通常因疏忽）而產生。"},{"id":"B223","ch":1,"ref":"1.6","t":1,"s":"b","q":"以下哪項不屬於責任保險的保障範圍？","qi":[],"qe":"Which of the following is not covered by liability insurance?","qei":[],"o":[{"z":"觸犯條例而引起的責任","e":"Liability arising from an offence in law"},{"z":"因疏忽引致的責任","e":"Liability arising from negligence"},{"z":"不遵行協議內容引起的責任","e":"Liability arising from non-compliance of contractual content"},{"z":"以上所有各項","e":"All of the above"}],"a":2,"x":"不遵行協議內容而產生的法律責任是除外責任。"},{"id":"B224","ch":1,"ref":"1.6","t":1,"s":"by","q":"以下哪項不是長期責任業務？","qi":[],"qe":"Which of the following is not a long-tail business?","qei":[],"o":[{"z":"產品責任","e":"Products liability"},{"z":"怠忽職守","e":"Negligence of one's duties"},{"z":"公眾責任","e":"Public liability"},{"z":"火險","e":"Fire insurance"}],"a":3,"x":"火險不是責任保險。"},{"id":"B225","ch":1,"ref":"1.6","t":1,"s":"b","q":"責任保險一般計算方式是:","qi":[],"qe":"The general calculation method for liability insurance coverage is:","qei":[],"o":[{"z":"工資","e":"Wages"},{"z":"銷售額","e":"Turnover"},{"z":"支付臨時保費","e":"A provisional premium is paid"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"以上皆是責任保險保險一般計算方式。"},{"id":"B226","ch":1,"ref":"1.6.(a)","t":1,"s":"b4y","q":"責任保險是屬於長期責任業務的意思是指：","qi":[],"qe":"Liability insurances are long-tail businesses, which means:","qei":[],"o":[{"z":"索償從出現至開始，會跨越一個頗長的時間","e":"Claims may arise and develop over a long period of time"},{"z":"索償必須於保單生效期內呈報","e":"Claims must be reported during the period of policy in effect"},{"z":"每項索償需要一段頗長的時間給付","e":"Each claim takes a long time to get paid"},{"z":"索償的結果會影響全年的盈利","e":"Claim result will affect the yearly profit"}],"a":0,"x":"所有的責任保險所保的法律責任均屬長期待決責任，意思是索償可能遲遲才出現，並且經歷一段很長的發展期(延至保單到期後的數年也是可能的)。"},{"id":"B227","ch":1,"ref":"1.6(b)","t":1,"s":"by","q":"在「索償申報」保單中，","qi":[],"qe":"In \"\"claims-made\"\" policies,","qei":[],"o":[{"z":"意外發生日期屬關鍵因素","e":"The date when the accident happens is a key factor"},{"z":"提出索償的時間屬關鍵因素","e":"The time that a claim is made is the key factor"},{"z":"保單屆滿前必須完成所有索償的給付","e":"All claim payments must be completed before the policy expires"},{"z":"在受到法庭行約束下的保單才可獲得保障","e":"Only policies under the restriction of the court are covered"}],"a":1,"x":"不論何時受傷或財產受損，第三者就此而提出的任何索償必須於該保單生效期間或任何延長申報期之內提出，而延長申告期是一段緊接着保單不續約或保單註銷的有限時期。"},{"id":"B228","ch":1,"ref":"1.6(b)","t":1,"s":"b","q":"根據責任保險中的「索償申報」保單保障的含義，以下哪項出現後索償才會容許?","qi":[],"qe":"According to the meaning of \"“Claims-made\" in liability insurance policy protection, which of the following will occur before a claim is allowed?","qei":[],"o":[{"z":"事故發生在保單年度出現","e":"The accident occurred during the policy year"},{"z":"索償在保單開始前經已提出","e":"The claim was made before the policy commenced"},{"z":"索償於保單期限內給付","e":"Claims will be paid within the policy term"},{"z":"申報索償的時間、屬於保單保障的期間、或其後一段指定的期限","e":"The time of filing a claim, the period covered by the policy, or a specified period thereafter"}],"a":3,"x":"不論何時受傷或財產受損，第三者就此而提出的任何索償必須於該保單生效期間或任何延長申報期之內提出，而延長申告期是一段緊接着保單不續約或保單註銷的有限時期。"},{"id":"B229","ch":1,"ref":"1.6.1","t":1,"s":"b5y","q":"以下哪三項對僱員補償條例的描述是正確的？","qi":["在普通法下，僱員是受到保障的","此保障包括承保商的僱員","在僱員補償條例中的責任是受到保障的","保費以百分比或千分比徵費，並以僱主全年付出工資計算"],"qe":"Which 3 of the following are correct in describing Employees' Compensation Ordinance?","qei":["Employees are covered under Common Law","The cover includes employees of the underwriter","The liability under Employees' Compensation Ordinance is covered","Premium is a rate per cent or per mille applied to the annual payroll of the employer"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"i, iii, iv","e":""},{"z":"ii, iii, iv","e":""}],"a":2,"x":"承保商的僱員不包括在內。"},{"id":"B230","ch":1,"ref":"1.6.1","t":1,"s":"b","q":"以下哪項屬於本港發出的僱員補償計劃內的保障？","qi":[],"qe":"Which of the following belongs to the cover of employees' compensation plan issued in Hong Kong?","qei":[],"o":[{"z":"對第三者的合約附加責任","e":"Contractual liability to the third party"},{"z":"被保險承建商對本身僱員的法律責任","e":"Legal liability of the insured's contractor to its employees"},{"z":"不屬於本港僱員補償計劃內所指的「僱員」","e":"Does not belong to the \"\"employees\"\" as specified in the employees' compensation plan of Hong Kong"},{"z":"以上所有各項","e":"All of the above"}],"a":1,"x":"被保險承建商對本身僱員的法律責任並不包括在計劃內。"},{"id":"B231","ch":1,"ref":"1.6.1(a)","t":1,"s":"by","q":"以下哪一項屬於僱主責任保險的保障範圍？","qi":[],"qe":"Which of the following is covered in employers' liability insurance?","qei":[],"o":[{"z":"合約上的責任","e":"Liability arising from contract"},{"z":"僱主的錯失引起的責任","e":"Liability arising from employers' mistakes"},{"z":"承建商的員工","e":"Employees of the contractors"},{"z":"非僱員引起的責任","e":"Liability not caused by employees"}],"a":1,"x":"這種僱主責任並非在該條例下產生，它與侵權法下（主要因為疏忽）的法律責任有關。"},{"id":"B232","ch":1,"ref":"1.6.1(a)","t":1,"s":"b","q":"以下哪項對於僱員補償條例的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing Employees' Compensation Ordinance?","qei":[],"o":[{"z":"通常只適用於受傷或死亡","e":"Usually applies to injury or death only"},{"z":"賠償金額通常比違反普通法少","e":"Compensation amount is usually less than an offence in Common Law"},{"z":"必須証明僱主的疏忽","e":"Must prove the negligence of employers"},{"z":"必須於工作期間引致受傷或死亡","e":"Must be injury or death caused during the course of work"}],"a":2,"x":"《僱員補償條例》下的法律責任：這是加諸於僱主身上的法定責任。如果僱員在受僱期間因工遭遇意外事故以致受傷或死亡，那麽，僱主必須向僱員或其受養人支付規定的補償金額，而有關金額可能在個別個案中比實際的損失還要低。"},{"id":"B233","ch":1,"ref":"1.6.1(a)","t":1,"s":"b","q":"在港簽發的「責任保險」中「第三者」是指","qi":[],"qe":"\"\"Third party\"\" in \"\"liability insurance\"\" issued in Hong Kong means:","qei":[],"o":[{"z":"被保險人的僱員","e":"Employees of the insured"},{"z":"被保險人的非僱員","e":"Non-employees of the insured"},{"z":"被保險人的家庭成員","e":"Family members of the insured"},{"z":"與任何索償無關的人","e":"Persons not related to any claim"}],"a":1,"x":"「第三者」是指被保險人的非僱員。"},{"id":"B234","ch":1,"ref":"1.6.1(a)","t":1,"s":"by","q":"僱主責任保險通常是保障：","qi":[],"qe":"Employers' liability insurance usually covers:","qei":[],"o":[{"z":"僱主對僱員的法律責任","e":"The legal liability of employers to employees"},{"z":"僱主對非僱員的法律責任","e":"The legal liability of employers to non-employees"},{"z":"僱主對其家庭成員的法律責任","e":"The legal liability of employers to their family members"},{"z":"僱主對自己的法律責任","e":"The legal liability of employers to themselves"}],"a":0,"x":"僱員補償保單承保僱主對僱員應承擔的法律責任。"},{"id":"B235","ch":1,"ref":"1.6.1(a)","t":1,"s":"b","q":"僱員補償條例，僱員的補償是:","qi":[],"qe":"Under the Employees’ Compensation Ordinance, employees’ compensation is:","qei":[],"o":[{"z":"僱員補償法例下的權益而已","e":"Only rights under employees’ compensation legislation"},{"z":"被保險人的妻子及家庭成員而已","e":"Only the insured’s wife and family members"},{"z":"香港法律下適用的責任","e":"Applicable liability under Hong Kong law"},{"z":"被保人因失責但並非法定所必須負上的責任","e":"Liability that the insured must bear due to breach of duty but not legally required"}],"a":3,"x":"僱員補償保單承保僱主對僱員應承擔的法律責任。"},{"id":"B236","ch":1,"ref":"1.6.1(a)(i)","t":1,"s":"by","q":"根據《僱員補償條例》，僱員要得到賠償，以下哪項描述是正確的？","qi":[],"qe":"According to \"\"Employees' Compensation Ordinance\"\", which of the following is correct for employees to receive compensation?","qei":[],"o":[{"z":"僱員必須證明僱主的疏忽或錯失","e":"Employees must prove employers' negligence or mistakes"},{"z":"僱員毋須證明僱主的疏忽或錯失","e":"There is no need for employees to prove employers' negligence or mistakes"},{"z":"僱主必須證明僱員並無疏忽","e":"Employers must prove employees are not negligent"},{"z":"僱主及僱員必須證明雙方並無疏忽","e":"Employers and employees must prove both parties are not negligent"}],"a":1,"x":"《僱員補償條例》下的法律責任：這是加諸於僱主身上的法定責任。如果僱員在受僱期間因工遭遇意外事故以致受傷或死亡，那麽，僱主必須向僱員或其受養人支付規定的補償金額。相對應「有過失法律責任」，這種法律責任是「嚴格法律責任」，即不論僱主一方是否疏忽，也要負責給予補償。"},{"id":"B237","ch":1,"ref":"1.6.1(a)(i)","t":1,"s":"b4y","q":"以下哪項屬於《僱員補償條例》的適用範圍？","qi":[],"qe":"Which of the following is applicable according to \"\"Employees' Compensation Ordinance\"\"?","qei":[],"o":[{"z":"因僱主疏忽而引致的損失，須負責補償","e":"Loss caused by negligence of employers must be compensated"},{"z":"不是僱主疏忽而引致的損失，須負責補償","e":"Loss not caused by negligence of employers must be compensated"},{"z":"不論是否僱主疏忽而引致的損失，須負責補償","e":"Loss no matter caused by negligence of employers or not must be compensated"},{"z":"不論是否因工受傷，須負責補償","e":"No matter the injury arises from work or not, it must be compensated"}],"a":2,"x":"《僱員補償條例》下的法律責任：這是加諸於僱主身上的法定責任。如果僱員在受僱期間因工遭遇意外事故以致受傷或死亡，那麽，僱主必須向僱員或其受養人支付規定的補償金額。相對應「有過失法律責任」，這種法律責任是「嚴格法律責任」，即不論僱主一方是否疏忽，也要負責給予補償。"},{"id":"B238","ch":1,"ref":"1.6.1(a)(ii)","t":1,"s":"b","q":"在港簽發的僱員補償保單保障在《僱員補償條例》下的法律責任及「普通法」的責任，「普通法的責任」意味著：","qi":[],"qe":"The employees' compensation policy issued in Hong Kong covers statutory liability and liability incurred in \"\"common law\"\". \"\"Liability incurred in common law\"\" means:","qei":[],"o":[{"z":"不屬於嚴重的受傷情況","e":"Circumstances not belong to serious injury"},{"z":"受保僱員引致的第三者受傷賠償","e":"Compensation for third party injury caused by the insured's employees"},{"z":"基於過失的法律責任","e":"Legal liability based on negligence"},{"z":"屬於較低金額的索償","e":"Belongs to claims with less amount"}],"a":2,"x":"「普通法」責任：這種僱主責任並非在該條例下產生，它與侵權法下（主要因為疏忽）的法律責任有關。"},{"id":"B239","ch":1,"ref":"1.6.1(a)(ii)","t":1,"s":"b5y","q":"根據普通法(即僱主的錯失)，而非《僱員補償條例》下的責任補償：","qi":[],"qe":"The liability compensation according to Common Law (i.e. negligence of employers) and not Employees' Compensation Ordinance:","qei":[],"o":[{"z":"賠償金額通常會比較高","e":"Amount of compensation is usually higher"},{"z":"賠償金額通常會比較低","e":"Amount of compensation is usually lower"},{"z":"賠償金額相約","e":"Amount of compensation is about the same"},{"z":"屬於僱主的刑事責任","e":"Belongs to criminal liability of employers"}],"a":0,"x":"《僱員補償條例》下的法律責任：這是加諸於僱主身上的法定責任。如果僱員在受僱期間因工遭遇意外事故以致受傷或死亡，那麽，僱主必須向僱員或其受養人支付規定的補償金額，而有關金額可能在個別個案中比實際的損失還要低。"},{"id":"B240","ch":1,"ref":"1.6.1(b)","t":1,"s":"b","q":"以下哪項或哪些為僱員補償保險的除外責任？","qi":[],"qe":"Which of the following is an exclusion of employees' compensation insurance?","qei":[],"o":[{"z":"通過協議承擔的法律責任","e":"Legal liability assumed under an agreement"},{"z":"被保險人對其承建商的僱員責任","e":"Liability of the insured to the employees of the insured's contractors"},{"z":"不是香港〈僱員補償條例〉下的僱員","e":"Employees not under Hong Kong's \"\"Employees' Compensation Ordinance\"\""},{"z":"以上各項皆是","e":"All of the above"}],"a":3,"x":"除外責任:(i) 合約附加的責任；(ii)對被保險人的承建商的僱員承擔的法律責任；(iii)死傷者不屬於《僱員補償條例》所指的僱員；(iv)「標準的」除外責任，例如戰爭、核風險及恐怖主義。"},{"id":"B241","ch":1,"ref":"1.6.1(c)","t":1,"s":"by","q":"僱員補償保單的保費計算較可能基於","qi":[],"qe":"The premium calculation of employees' compensation policy is likely based on","qei":[],"o":[{"z":"被保險人發出的全年工資","e":"Annual payroll of the insured"},{"z":"被保險人擁有的物業價值","e":"Property value owned by the insured"},{"z":"該保單提供的責任限制","e":"Limitation of liability provided by the policy"},{"z":"可能向僱員支付的最高權益","e":"Maximum benefit to be paid to the employees"}],"a":0,"x":"首次保費屬於臨時性質，實際金額則根據最終工資數字而作出調整。"},{"id":"B242","ch":1,"ref":"1.6.1(c)","t":1,"s":"b3y","q":"僱員補償保險的保費：","qi":[],"qe":"Premium of employees' compensation insurance:","qei":[],"o":[{"z":"永不以可調整方法作根據","e":"Is never based on adjustment"},{"z":"有時以可調整方法作根據","e":"Is sometimes based on adjustment"},{"z":"一直以可調整方法作根據","e":"Is always based on adjustment"},{"z":"只以個別被保險人而作出調整","e":"Can only be adjusted according to individual insured"}],"a":2,"x":"首次保費屬於臨時性質，實際金額則根據最終工資數字而作出調整。"},{"id":"B244","ch":1,"ref":"1.6.2","t":1,"s":"by","q":"以下哪項對產品責任保險的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing products liability insurance?","qei":[],"o":[{"z":"主要是保障「有問題」的產品","e":"Mainly cover \"\"defective\"\" products"},{"z":"有些高索償意識地區被稱為「危險的」市場","e":"Some countries are claims-conscious which are called \"\"dangerous\"\" markets"},{"z":"設有同一年度的賠償總限額","e":"Has aggregate limit for claims in the same year"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"產品責任保單承保就由所售賣、供應或維修的貨品，或所提供的服務等引起，及在由被保險人擁有或佔用的處所以外的地方發生的傷害或損害，承擔的法律責任。世界上有些地區是出名的申索意識高的地區，尤其是美國和北美洲地區，所以，向這些市場供應產品會帶來較高的風險，產品責任保障也就會較昂貴或較難購得。"},{"id":"B245","ch":1,"ref":"1.6.2","t":1,"s":"by","q":"一項消費品(例如:電風扇)因生產過程出錯而成為有問題產品，購物者因觸電而對生產商提出索償，那麼涉及的保險是：","qi":[],"qe":"A consumer product (e.g. electric fan) becomes a defective product due to a mistake in the production process, and consumers makes claims to the manufacturer as they get electric shock. The insurance involved will be:","qei":[],"o":[{"z":"錯誤及疏忽保障","e":"Fault and negligence insurance"},{"z":"公眾責任","e":"Public liability"},{"z":"產品責任","e":"Products liability"},{"z":"專業責任","e":"Professional liability"}],"a":2,"x":"產品責任保單承保就由所售賣、供應或維修的貨品，或所提供的服務等引起，及在由被保險人擁有或佔用的處所以外的地方發生的傷害或損害，承擔的法律責任。"},{"id":"B246","ch":1,"ref":"1.6.2","t":1,"s":"by","q":"以下哪項對於產品責任的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing products liability insurance?","qei":[],"o":[{"z":"主要保障「有問題」的產品","e":"Mainly cover \"\"defective\"\" products"},{"z":"它的保障範圍與公眾責任完全相同","e":"Its scope of cover is exactly the same as public liability"},{"z":"通常設有同一年度的索償限額","e":"Usually has aggregate limit for claims in the same year"},{"z":"有些北美地區稱為高危市場","e":"Some North American countries are called dangerous markets"}],"a":1,"x":"產品責任保單承保就由所售賣、供應或維修的貨品，或所提供的服務等引起，及在由被保險人擁有或佔用的處所以外的地方發生的傷害或損害，承擔的法律責任。類似法律責任如在被保險人的處所引起，應該由公眾責任保單承保，同時此保單設有年度的索償限額。"},{"id":"B247","ch":1,"ref":"1.6.2","t":1,"s":"b3y","q":"產品責任的保障包括：","qi":["產品本身有問題","與公眾責任保障範圍一樣","通常是「索償申報」保單","某些市場屬於高度風險市場"],"qe":"The cover of products liability insurance includes:","qei":["Problems of the products themselves","Same as public liability insurance","Usually are \"\"claims-made\"\" policies","Some markets are high risk markets"],"o":[{"z":"i, ii, iii","e":""},{"z":"i, ii, iv","e":""},{"z":"ii, iii, iv","e":""},{"z":"i, iii, iv","e":""}],"a":3,"x":"產品責任保單承保就由所售賣、供應或維修的貨品，或所提供的服務等引起，及在由被保險人擁有或佔用的處所以外的地方發生的傷害或損害，承擔的法律責任。世界上有些地區是出名的申索意識高的地區，尤其是美國和北美洲地區，所以，向這些市場供應產品會帶來較高的風險，產品責任保障也就會較昂貴或較難購得。最後，此保單是屬於「索償申報」保單的一種。"},{"id":"B248","ch":1,"ref":"1.6.2(a)","t":1,"s":"by","q":"為製造業或工業團體設立的責任保險組合，較有可能提供：","qi":[],"qe":"The liability insurance combination for manufacturers or industrial organizations is likely to provide:","qei":[],"o":[{"z":"公眾責任保障而已","e":"Public liability insurance only"},{"z":"產品責任保障而已","e":"Products liability insurance only"},{"z":"專業責任保障而已","e":"Professional liability insurance only"},{"z":"以上所有或大部份保障","e":"All or most of the above insurance"}],"a":1,"x":"產品責任保障保障有關行業所所售賣、供應或維修的貨品，或所提供的服務等引起，及在由被保險人擁有或佔用的處所以外的地方發生的傷害或損害，承擔的法律責任。"},{"id":"B249","ch":1,"ref":"1.6.2(c)(ii)","t":1,"s":"b","q":"以下哪情況不受保於產品責任保單？","qi":[],"qe":"Which of the following is not covered in products liability policies?","qei":[],"o":[{"z":"一名兒童因有問題的玩具而受傷害","e":"A children is hurt by a defective toy"},{"z":"產品在設計上出現危險性的錯誤","e":"Dangerous faulty design of a product"},{"z":"殺蟲劑在製造過程中出錯而摧毀農作物","e":"Crops destroyed by insecticide which has gone wrong in the production process"},{"z":"一批醫療用品在製造的過程中出現錯誤","e":"A certain medical equipment which have gone wrong in the production process"}],"a":1,"x":"由貨品的設計、規劃、程式或規格引起的法律責任屬除外責任。"},{"id":"B250","ch":1,"ref":"1.6.3","t":1,"s":"by","q":"以下哪項對於專業彌償保險的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing professional indemnity insurance?","qei":[],"o":[{"z":"較常以索償申報的方式簽發","e":"Usually issued on a claims-made basis"},{"z":"它可能以「醫療事故責任保險」出現","e":"It can appear as \"\"medical malpractice insurance\"\""},{"z":"主要保障專業行為及疏忽出現的錯誤","e":"Mainly protects against mistakes in professional acts and omissions"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"專業彌償保險單一般承保被保險人就其「錯誤」作為或不作為導致第三者傷亡、遭受財產損失或損害、或遭受財務損失（視乎受保活動或專業而定）而承擔的法律責任，但第三者的申索必須在保單期限内首次提出。專業彌償保險相當可能以「索償申報」方式提供保險保障。醫生的專業彌償保險單為醫療事故責任保險。"},{"id":"B251","ch":1,"ref":"1.6.3","t":1,"s":"b","q":"一位律師未能及時採取行動以致其當事人因此承受極大的財務損害，該事件可由該律師屬下那一項保險作出賠償","qi":[],"qe":"A lawyer does not take immediate action and causes his client suffer enormous financial loss. The incident can be compensated by which of the following insurance of the lawyer?","qei":[],"o":[{"z":"產品責任保險；","e":"Products liability insurance"},{"z":"公眾責任保險；","e":"Public liability insurance"},{"z":"後果責任保險；","e":"Consequential liability insurance"},{"z":"專業彌償保險","e":"Professional indemnity insurance"}],"a":3,"x":"專業彌償保單為「專業」人士提供保障，例如律師、醫生（醫療事故責任保險）、會計師、建築師、基金經理、受托人等，因此，這種保障是承保專業作為及不作為中的失誤，其中包括提供不適當的意見。"},{"id":"B252","ch":1,"ref":"1.6.3註/Note","t":1,"s":"by","q":"打算在本港從事保險經紀業務，必須購買以下哪項保險？","qi":[],"qe":"People intend to conduct insurance broker business in Hong Kong must purchase which of the following insurance?","qei":[],"o":[{"z":"專業彌償保險","e":"Professional indemnity insurance"},{"z":"怠忽職守","e":"Negligence"},{"z":"僱員補償保險","e":"Employees' compensation insurance"},{"z":"公眾責任保險","e":"Public liability insurance"}],"a":0,"x":"香港的保險經紀，在獲授權開業前，必先取得專業彌償保障，以加強保護自己的客戶。"},{"id":"B253","ch":1,"ref":"1.6.3註/Note","t":1,"s":"by","q":"以下何者較可能得到專業彌償保險的保障？","qi":[],"qe":"Which of the following is more likely to be covered by professional indemnity insurance?","qei":[],"o":[{"z":"銀行經理","e":"Bank managers"},{"z":"職業足球員","e":"Professional footballers"},{"z":"保險代理","e":"Insurance agents"},{"z":"保險經紀","e":"Insurance brokers"}],"a":3,"x":"香港的保險經紀，在獲授權開業前，必先取得專業彌償保障，以加強保護自己的客戶。"},{"id":"B254","ch":1,"ref":"1.6.5(c)","t":1,"s":"b","q":"以下哪項對「公眾責任保險」保費釐定的描述是不正確的？","qi":[],"qe":"Which of the following is incorrect in describing the premium basis of public liability insurance?","qei":[],"o":[{"z":"保費是可以調整的","e":"Premiums are adjustable"},{"z":"保費是不可以調整的","e":"Premiums are not adjustable"},{"z":"工資及銷售額可以是保費的根據","e":"Wages and turnover can be premium basis"},{"z":"通常要求在期後才付保費","e":"Usually premiums are required to be paid after the period"}],"a":3,"x":"傳統上這種保單的保費是可以調整的，目的是反映保單有效期内商業活動的實際總量。但在香港，收取不可調整保費也越來越常見了，即保險人接受以預期的工資／銷售額視為當年的最終數值，因此就不必補交或退回保費了。"},{"id":"B255","ch":1,"ref":"1.6.5","t":1,"s":"b","q":"以下哪項對於公眾責任保障的描述是不正確？","qi":[],"qe":"Which of the following is incorrect in describing public liability insurance?","qei":[],"o":[{"z":"保費一般是暫繳的，而且可以調整的","e":"Premium is usually provisional and adjustable"},{"z":"主要保障對象是公眾及僱員","e":"Main targets to be covered are the public and employees"},{"z":"保障範圍是不包括僱員","e":"The scope of cover excludes employees"},{"z":"提供實際索償的損失及訴訟費用","e":"Provides cover for actual loss of claim and legal expenses"}],"a":1,"x":"這類保險是承保被保險人因在保單年度內發生的意外事故而須向第三者承擔的法律責任。"},{"id":"B256","ch":1,"ref":"1.6.5","t":1,"s":"b5y","q":"公眾責任保險是：","qi":[],"qe":"Public liability insurance is:","qei":[],"o":[{"z":"保障對於公眾成員的法律責任","e":"Cover legal liability arising from public members"},{"z":"會保障由汽車意外引致的責任","e":"Will cover liability arising from motor accidents"},{"z":"保障公眾成員所引致的損失毀壞","e":"Cover loss and damage arising from public members"},{"z":"保障員工的法律責任","e":"Cover legal liability arising from employees"}],"a":0,"x":"這類保險是承保被保險人因在保單年度內發生的意外事故而須向第三者承擔的法律責任。"},{"id":"B257","ch":1,"ref":"1.6.5(a)","t":1,"s":"by","q":"以下哪項對於公眾責任保險的描述是正確的？","qi":[],"qe":"Which of the following is correct in describing public liability insurance?","qei":[],"o":[{"z":"它的索償可能於較後時間提出","e":"Its claim can be raised in a later time"},{"z":"它保障受傷及財產損毀的索償","e":"It covers claims arising from injury and property damage"},{"z":"它保障有關索償訴訟的費用","e":"It covers legal expenses of related claims"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"這類保險是承保被保險人因在保單年度內發生的意外事故而須向第三者承擔的法律責任。同時也承保法律開支，即因替被保險人辯護或堅持拒絕有關索償而引致的法律開支，及申索成功的第三者的法律開支。這種意外事故可能於較後時間才引起索償（有時在數年以後），只要被保險人符合了作出通知的保單規定，這種索償仍然是受保的。"},{"id":"B258","ch":1,"ref":"1.6.5(a)","t":1,"s":"b3y","q":"公眾責任保險的概念是指：","qi":[],"qe":"The concept of public liability insurance is:","qei":[],"o":[{"z":"提供僱員受傷的保障","e":"Providing cover for employees' injury"},{"z":"提供僱員的財產損毀保障","e":"Providing cover for property damage of employees"},{"z":"提供僱員受傷及財產損毀保障","e":"Providing cover for employees' injury and property damage"},{"z":"提供非僱員受傷或財產損毀的保障","e":"Providing cover for non-employees' injury and property damage"}],"a":3,"x":"這類保險是承保被保險人因在保單年度內發生的意外事故而須向第三者承擔的法律責任。"},{"id":"B259","ch":1,"ref":"1.6.5(b)","t":1,"s":"b5","q":"以下哪項屬於公眾責任保險的除外責任？","qi":[],"qe":"Which of the following is an exclusion of public liability insurance?","qei":[],"o":[{"z":"在特定地區範圍以外發生的意外","e":"Accidents happen outside the specified geographical area"},{"z":"其他保單也提供較適合的責任風險的保障","e":"Other policies may provide more appropriate cover on liability risks"},{"z":"合約上的責任","e":"Contractual liability"},{"z":"以上所有各項","e":"All of the above"}],"a":3,"x":"除外責任:i在指明地區範圍以外發生的意外事故不受保。ii 其他保單也可以承保責任風險。iii 合約附加的責任。iv 「標準的」除外責任，例如戰爭及核風險等。"},{"id":"B260","ch":1,"ref":"1.6.5(b)","t":1,"s":"b3y","q":"以下哪三項屬於在本港公眾責任保險保單中的除外責任？","qi":["合約上附加的責任","在受保地區範圍以外發生的","較適合由其他保單保障的責任(如: 汽車)","第三者意外責任"],"qe":"Which 3 of the following are exclusions of public liability insurance policies issued I Hong Kong?","qei":["Contractual liability","Happens outside the insured geographical area","More appropriate for other policies to cover the liability (e.g. motor vehicle)","Third party accident liability"],"o":[{"z":"i , ii , iii","e":""},{"z":"i , ii , iv","e":""},{"z":"i , iii , iv","e":""},{"z":"ii , iii , iv","e":""}],"a":0,"x":"除外責任:i在指明地區範圍以外發生的意外事故不受保。ii 其他保單也可以承保責任風險。iii 合約附加的責任。iv 「標準的」除外責任，例如戰爭及核風險等。"},{"id":"B261","ch":1,"ref":"1.6.5(b)","t":1,"s":"by","q":"以下哪項較不可能是公眾責任保單的除外責任?","qi":[],"qe":"Which of the following is unlikely to be an exclusion of public liability policies?","qei":[],"o":[{"z":"在特定範圍以外所引起的責任","e":"Liability caused from outside the specified area"},{"z":"其他保單(例如:汽車) ，較適合提供保障的責任","e":"Other policies (e.g. motor vehicle) are more appropriate to provide the cover"},{"z":"因被保險人或其職員疏忽所引起的責任","e":"Liability caused by the negligence of the insured or its employees"},{"z":"保險人根據合約安排承擔的責任","e":"Liability assumed under the contractual arrangement according to the insurer"}],"a":2,"x":"除外責任:i在指明地區範圍以外發生的意外事故不受保。ii 其他保單也可以承保責任風險。iii 合約附加的責任。iv 「標準的」除外責任，例如戰爭及核風險等。"},{"id":"B262","ch":1,"ref":"1.6.5(c)","t":1,"s":"by","q":"公眾責任保險保費可根據每年工資釐定而可以是經常調整的，可調整的意思是：","qi":[],"qe":"The premium of public liability insurance can be based on the annual wages and adjustable. Adjustable means:","qei":[],"o":[{"z":"如沒有索償，可退還保費","e":"Premiums can be refunded if there is no claim"},{"z":"如該年工資高於預期，須支付額外保費","e":"If the wages are more than expected in that year, extra premiums are required to pay"},{"z":"如工資高於預期，則加下年之保費","e":"If the wages are more than expected, premiums will be increased next year"},{"z":"以上各項皆正確","e":"All of the above are correct"}],"a":1,"x":"保費的釐定是基於某些可變動的因素的話，例如工資及銷售額，保費可以規定為可調整保費。所以，起保時須支付臨時保費；當知道了最後確切的數字時，再將保費調整至正確金額。"},{"id":"B263","ch":1,"ref":"1.6.5(c)","t":1,"s":"by","q":"下列哪一項對於公眾責任保險保費的描述是不正確的？","qi":[],"qe":"Which of the followings is incorrect in describing the premiums of public liability insurance?","qei":[],"o":[{"z":"保費是可以調整的","e":"Premiums can be adjustable"},{"z":"保費是根據被保險人所支付的每年工資而釐定","e":"Premium is based on the annual wages paid by the insured"},{"z":"保險費率是根據被保險人的行業及職業來釐定","e":"The rate of premium is based on the industry and occupation of the insured"},{"z":"保費只需在保險期內支付","e":"Premiums are paid only within the insured period"}],"a":3,"x":"在香港，收取不可調整保費也越來越常見了，即保險人接受以預期的工資／銷售額視為當年的最終數值，因此就不必補交或退回保費了。"},{"id":"B264","ch":1,"ref":"1.6.5(c)","t":1,"s":"b","q":"以下那項有關公眾責任保險保費描述並不正確？","qi":[],"qe":"Which of the followings is incorrect in describing the premiums of public liability insurance?","qei":[],"o":[{"z":"屬於可調整的","e":"Can be adjustable"},{"z":"有時是不可調整的","e":"Sometimes cannot be adjustable"},{"z":"所有類型保險的保費率是標準的","e":"The premium rate for all categories of insurance is standard"},{"z":"視乎全年工資及營業額而調整","e":"Depends on annual wages and turnover to adjust"}],"a":2,"x":"保費的釐定是基於某些可變動的因素的話，例如工資及銷售額，保費可以規定為可調整保費。所以，起保時須支付臨時保費；當知道了最後確切的數字時，再將保費調整至正確金額。"},{"id":"B265","ch":1,"ref":"1.6.5(d)","t":1,"s":"b","q":"某快餐店買了兩份公眾責任保險保單，一份保2021年，另一份保2022年。於2022年收到顧客在2021年於其處所受傷索償，到底哪份保單會作出賠付，原因何在？","qi":[],"qe":"A fast food restaurant has bought two public liabilities policies, one of the year of 2005 and other for 2006. It receives in the year 2006 a claim from customers for injuries sustained on the premise in 2005. Which of these two policies does the claim concern and why?","qei":[],"o":[{"z":"可能是第一張保單，原因是公眾責任保單通常以“索償發生”方式發出","e":"Most probably the first policy because the public liabilities policies usually are issued on claim occurring basis"},{"z":"肯定是第二張保單，原因是第一張保單已屬無效","e":"Definitely the second policy because the first policy is no longer valid"},{"z":"可能是第二張保單，原因是公眾責任保單通常以“索償申報”方式發出","e":"Most probably the second policy because the public liabilities policies usually are issued on claim made basis"},{"z":"肯定是第一張保單，原因是公眾責任保單通常以“索償發生”方式發出","e":"Definitely the first policy because the public liabilities policies must be issued on claim occurring basis"}],"a":0,"x":"公眾責任險通常是用「索償發生」方式提供保險保障的，「索償申報」方式則不常用。"},{"id":"B266","ch":1,"ref":"1.7","t":1,"s":"by","q":"水險單中指明免賠額為損失的5%，若船體價值為一佰萬，當船隻出現全部損失時，賠償額為：","qi":[],"qe":"A marine insurance policy specifies the deductible as 5% of the loss. If the value of hull is HK$1 million, when total loss occurs to the ship, the amount of compensation is:","qei":[],"o":[{"z":"25萬","e":"HK$250,000"},{"z":"75萬","e":"HK$750,000"},{"z":"95萬","e":"HK$950,000"},{"z":"100萬","e":"HK$1 million"}],"a":3,"x":"全損時將會計算總損失金額賠償。"},{"id":"B267","ch":1,"ref":"1.7","t":1,"s":"b","q":"水險中，部分損失主要分成單獨海損及:","qi":[],"qe":"In marine insurance, some losses are mainly divided into separate average and:","qei":[],"o":[{"z":"全損","e":"Total Loss"},{"z":"共同救助","e":"General Salvage"},{"z":"共同海損","e":"General Average"},{"z":"救助海損","e":"Salvage Average"}],"a":2,"x":"在水險中有兩種部分損失:單獨海損及共同海損。"},{"id":"B268","ch":1,"ref":"1.7(a)","t"
